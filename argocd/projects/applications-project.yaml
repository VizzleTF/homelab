apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
spec:
  sourceRepos:
    - '*'
  # Apps stay out of platform namespaces: a bad upstream chart cannot
  # overwrite them. victoria-metrics is allowed (cnpg, crowdsec-scraper ship
  # VM objects there). A new infra namespace goes here; scripts/audit-docs.py
  # fails CI when one is missing.
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
    - {namespace: '!default', server: '*'}
    - {namespace: '!kube-*', server: '*'}
    - {namespace: '!argocd', server: '*'}
    - {namespace: '!backup-drill', server: '*'}
    - {namespace: '!cert-manager', server: '*'}
    - {namespace: '!cilium-secrets', server: '*'}
    - {namespace: '!cloudflared', server: '*'}
    - {namespace: '!cnpg-system', server: '*'}
    - {namespace: '!external-dns*', server: '*'}
    - {namespace: '!external-secrets-system', server: '*'}
    - {namespace: '!keda', server: '*'}
    - {namespace: '!kubelet-csr-approver', server: '*'}
    - {namespace: '!kyverno', server: '*'}
    - {namespace: '!local-path-provisioner', server: '*'}
    - {namespace: '!longhorn-system', server: '*'}
    - {namespace: '!openbao', server: '*'}
    - {namespace: '!reloader', server: '*'}
    - {namespace: '!renovate', server: '*'}
    - {namespace: '!robusta', server: '*'}
    - {namespace: '!smartctl-exporter', server: '*'}
    - {namespace: '!snapshot-controller', server: '*'}
    - {namespace: '!snmp-exporter', server: '*'}
    - {namespace: '!spegel', server: '*'}
    - {namespace: '!system-upgrade', server: '*'}
    - {namespace: '!tfstate-mirror', server: '*'}
    - {namespace: '!victoria-logs', server: '*'}
    - {namespace: '!volsync-system', server: '*'}
    - {namespace: '!wazuh-operator', server: '*'}
  # Only what apps render today; a chart that adds CRDs, webhooks or
  # PVs/StorageClasses fails sync instead of landing silently.
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  # Warn about objects in app namespaces that no Application tracks. Ignored:
  # what operators and StatefulSets create without an ownerReference.
  orphanedResources:
    warn: true
    ignore:
      - kind: ConfigMap
        name: cnpg-default-monitoring
      - kind: ConfigMap
        name: "wazuh-*"
      - kind: PersistentVolumeClaim
        name: indexer-data-wazuh-indexer-0
      - kind: PersistentVolumeClaim
        name: wazuh-data-queue-wazuh-manager-master-0
      - kind: PersistentVolumeClaim
        name: wazuh-data-wazuh-manager-master-0
      - kind: PersistentVolumeClaim
        name: database-storage-obsidian-livesync-couchdb-0
