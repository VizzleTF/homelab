# Weekly restore drill.
#
# A backup nobody has ever restored from is an assumption, not a backup. Once a
# week the CronJob takes one app from the rotation, restores its volume from the
# restic repository into a separate namespace, checks the content for real and
# cleans up after itself. The target switches after every full round, so the
# off-site repository is checked as often as the on-prem one.
#
# The result goes out two ways:
#   - metrics in VictoriaMetrics (history + the RestoreDrillStale alert)
#   - an alert to Alertmanager -> Robusta -> Telegram, on success and on failure
#     (success has severity=info and no endsAt: Alertmanager closes it after resolve_timeout)
homelab-common:
  # Default-deny ingress. No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true

  limitRange:
    enabled: true
    defaultRequests:
      cpu: 20m
      memory: 64Mi

  externalSecrets:
    # Repository passwords and keys of both targets are the ones VolSync uses.
    # No secrets are copied from other namespaces: the drill builds
    # RESTIC_REPOSITORY itself from the app name.
    - name: drill-restic
      vaultPath: shared/restic-garage
      data:
        - secretKey: pw_garage
          property: password
      templateData:
        PW_GARAGE: "{{ .pw_garage }}"
    - name: drill-restic-ovh
      vaultPath: shared/restic-ovh
      data:
        - secretKey: pw_ovh
          property: password
      templateData:
        PW_OVH: "{{ .pw_ovh }}"
    - name: drill-s3-garage
      vaultPath: shared/s3-restic-apps
      data:
        - secretKey: ak
          property: ACCESS_KEY_ID
        - secretKey: sk
          property: ACCESS_SECRET_KEY
      templateData:
        GARAGE_AK: "{{ .ak }}"
        GARAGE_SK: "{{ .sk }}"
    - name: drill-s3-ovh
      vaultPath: shared/s3-ovh
      data:
        - secretKey: ak
          property: ACCESS_KEY_ID
        - secretKey: sk
          property: ACCESS_SECRET_KEY
      templateData:
        OVH_AK: "{{ .ak }}"
        OVH_SK: "{{ .sk }}"

  rbac:
    - serviceAccount:
        name: backup-drill
        create: true
      clusterRole:
        name: backup-drill
        # Broad rights by necessity: the drill creates and deletes its own
        # drill-* namespaces, and RBAC cannot be limited by a name prefix.
        # The trade-off: no rights to modify other workloads, so
        # deployments/statefulsets/daemonsets are not in the list.
        rules:
          - apiGroups: [""]
            resources: ["namespaces"]
            # patch: to set volsync.backube/privileged-movers on its own
            # drill namespace.
            verbs: ["get", "list", "create", "delete", "patch"]
          - apiGroups: [""]
            resources: ["persistentvolumeclaims", "secrets", "pods", "pods/log"]
            verbs: ["get", "list", "create", "delete"]
          - apiGroups: ["volsync.backube"]
            resources: ["replicationdestinations"]
            verbs: ["get", "list", "create", "delete"]
          # rotation = ReplicationSources labelled homelab.dr/drill
          - apiGroups: ["volsync.backube"]
            resources: ["replicationsources"]
            verbs: ["list"]

  workloads:
    - name: restore-drill           # -> CronJob backup-drill-restore-drill
      type: cronjob
      # Sundays 09:00 UTC: after the nightly backup window and the weekly off-site run.
      schedule: "0 9 * * 0"
      # Deliberate departures from the chart CronJob defaults: one attempt per
      # week (a failure is reported, not retried), up to an hour per run, and
      # three successful runs kept for their logs.
      spec:
        startingDeadlineSeconds: 3600
        successfulJobsHistoryLimit: 3
      job:
        backoffLimit: 0
        activeDeadlineSeconds: 3600
      pod:
        restartPolicy: Never
        serviceAccountName: backup-drill
        automountServiceAccountToken: true   # the script drives kubectl with this SA
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: drill
          image:
            repository: alpine/k8s
            tag: "1.37.1"
          command: ["/bin/sh", "-c"]
          env:
            - name: VM_URL
              value: http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc:8428
            - name: AM_URL
              value: http://vmalertmanager-victoria-metrics-k8s-stack.victoria-metrics.svc:9093
            - name: DRILL_SIZE
              value: 20Gi
            - name: DRILL_TIMEOUT
              value: "2400"
            # Images of the helper pods the script starts with `kubectl run`.
            # Tag only: the marker regex takes the first digit on the next line,
            # which in "keinos/sqlite3:<tag>" would be the 3 of the name.
            - name: ALPINE_TAG
              # renovate: datasource=docker depName=alpine
              value: "3.24.2"
            - name: SQLITE_TAG
              # renovate: datasource=docker depName=keinos/sqlite3
              value: "3.54.1"
          envFrom:
            - secretRef:
                name: drill-restic
            - secretRef:
                name: drill-restic-ovh
            - secretRef:
                name: drill-s3-garage
            - secretRef:
                name: drill-s3-ovh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          args:
            - |
              set -eu

              # Rotation: one app per week; the target switches after every full round.
              # Week parity alone does not work: with an even COUNT it pins every app to
              # one target forever. Result: each volume is checked every COUNT weeks, on
              # each target every 2*COUNT weeks.
              # Weeks count from epoch, not ISO: the ISO week number resets in January.
              # The list is every VolSync volume with homelab-common `drill` on (label
              # homelab.dr/drill=<name>), so adding or removing a volsync entry updates it.
              VOLS=$(kubectl get replicationsources -A -l homelab.dr/drill -o jsonpath='{range .items[*]}{.metadata.labels.homelab\.dr/drill}{"\n"}{end}' | sort -u)
              [ -n "$VOLS" ] || { echo "no ReplicationSource labelled homelab.dr/drill"; exit 1; }
              APPS="$VOLS forgejo-ops"   # forgejo-ops is the ops-node dump, not VolSync
              set -- $APPS
              COUNT=$#
              WEEK=$(( $(date -u +%s) / 604800 ))
              IDX=$(( WEEK % COUNT ))
              i=0
              for a in $APPS; do [ $i -eq $IDX ] && APP="$a" && break; i=$((i+1)); done
              if [ $(( WEEK / COUNT % 2 )) -eq 0 ]; then TARGET=garage; else TARGET=ovh; fi

              case "$TARGET" in
                garage) REPO_URL="s3:https://s3.example.com/restic-apps/$APP"; AK="$GARAGE_AK"; SK="$GARAGE_SK"; PW="$PW_GARAGE" ;;
                ovh)    REPO_URL="s3:https://s3.de.io.cloud.ovh.net/vaka-homelab/restic-apps/$APP"; AK="$OVH_AK"; SK="$OVH_SK"; PW="$PW_OVH" ;;
              esac

              NS="drill-$APP"
              START=$(date -u +%s)
              echo "=== restore drill: app=$APP target=$TARGET ns=$NS ==="

              cleanup() { kubectl delete ns "$NS" --wait=false >/dev/null 2>&1 || true; }

              report() {
                ok="$1"; detail="$2"
                now=$(date -u +%s); dur=$((now - START))
                # History in VictoriaMetrics; RestoreDrillStale alerts on it as well.
                printf 'homelab_restore_drill_success{app="%s",target="%s"} %s\nhomelab_restore_drill_timestamp{app="%s",target="%s"} %s\nhomelab_restore_drill_duration_seconds{app="%s",target="%s"} %s\n' \
                  "$APP" "$TARGET" "$ok" "$APP" "$TARGET" "$now" "$APP" "$TARGET" "$dur" \
                  | curl -sf -X POST --data-binary @- "$VM_URL/api/v1/import/prometheus" || echo "WARN: metric push failed"

                # Notify along the same route as regular alerts: Alertmanager -> Robusta
                # -> Telegram. Success goes out with severity=info.
                # endsAt is left out on purpose: BusyBox date cannot do relative values
                # ("-d '+10 minutes'" silently falls back to "now" and the alert arrives
                # already resolved; caught on the very first run). Without endsAt
                # Alertmanager closes the alert after resolve_timeout, and a failure is
                # also held by the RestoreDrillFailed rule on the metric.
                if [ "$ok" = "1" ]; then
                  name=RestoreDrillSucceeded; sev=info
                else
                  name=RestoreDrillFailed; sev=critical
                fi
                cat <<JSON | curl -sf -X POST -H 'Content-Type: application/json' --data-binary @- "$AM_URL/api/v2/alerts" >/dev/null || echo "WARN: alert push failed"
              [{
                "labels": {"alertname":"$name","severity":"$sev","app":"$APP","target":"$TARGET","source":"backup-drill"},
                "annotations": {"summary":"Restore drill $APP from $TARGET: $detail","description":"Восстановление тома $APP из репозитория $TARGET заняло ${dur}s. $detail"}
              }]
              JSON
                echo "reported: ok=$ok $detail"
              }

              trap 'cleanup' EXIT

              kubectl create ns "$NS" >/dev/null 2>&1 || true

              # forgejo-ops is not a PVC snapshot: the ops node ships a tar.zst made by
              # `forgejo dump`, so there is nothing for VolSync to restore. Verify the
              # archive itself — it must exist, be plausibly large, and actually contain
              # the database and the repositories. A dump that restic accepted but that
              # unpacks to nothing would otherwise pass unnoticed.
              if [ "$APP" = "forgejo-ops" ]; then
                kubectl -n "$NS" create secret generic drill-restic                             --from-literal=RESTIC_REPOSITORY="$REPO_URL"                             --from-literal=RESTIC_PASSWORD="$PW"                             --from-literal=AWS_ACCESS_KEY_ID="$AK"                             --from-literal=AWS_SECRET_ACCESS_KEY="$SK" >/dev/null

                kubectl -n "$NS" run verify-dump --restart=Never --image="alpine:$ALPINE_TAG"                             --overrides='{"spec":{"securityContext":{"runAsUser":0,"runAsGroup":0},"containers":[{"name":"verify-dump","image":"alpine:'"$ALPINE_TAG"'","command":["sh","-c","set -e; apk add --no-cache restic zstd tar >/dev/null; restic restore latest --target /restore; f=$(find /restore -name \"forgejo-dump-*.tar.zst\" | head -1); [ -n \"$f\" ] || { echo NO_DUMP; exit 1; }; sz=$(stat -c%s \"$f\"); echo SIZE=$sz; [ \"$sz\" -gt 104857600 ] || { echo TOO_SMALL; exit 1; }; tar --zstd -tf \"$f\" > /tmp/l; grep -q -e forgejo-db.sql -e gitea-db.sql /tmp/l || { echo NO_DB; exit 1; }; grep -q \"^repos/\" /tmp/l || { echo NO_REPOS; exit 1; }; echo ENTRIES=$(wc -l < /tmp/l); echo VERIFY_OK"],"envFrom":[{"secretRef":{"name":"drill-restic"}}],"volumeMounts":[{"name":"r","mountPath":"/restore"}]}],"volumes":[{"name":"r","emptyDir":{"sizeLimit":"8Gi"}}],"restartPolicy":"Never"}}' >/dev/null

                DDEADLINE=$(( $(date -u +%s) + 1200 ))
                while :; do
                  phase=$(kubectl -n "$NS" get pod verify-dump -o jsonpath='{.status.phase}' 2>/dev/null || true)
                  [ "$phase" = "Succeeded" ] && break
                  [ "$phase" = "Failed" ] && { report 0 "dump verification failed: $(kubectl -n "$NS" logs verify-dump 2>&1 | tail -3 | tr '\n' ' ')"; exit 1; }
                  [ "$(date -u +%s)" -gt "$DDEADLINE" ] && { report 0 "dump verification timed out"; exit 1; }
                  sleep 15
                done

                SUMMARY=$(kubectl -n "$NS" logs verify-dump 2>&1 | grep -E "SIZE=|ENTRIES=|VERIFY_OK" | tr '\n' ' ')
                echo "$SUMMARY"
                report 1 "$SUMMARY"
                exit 0
              fi
              # A restore gives files back their original owners, and chown to a foreign
              # uid needs CAP_CHOWN, which a regular mover lacks (VolSync sets
              # drop: [ALL]). Privileged movers are enabled by a namespace annotation:
              # the official VolSync mechanism, confined to our throwaway drill namespace.
              kubectl annotate ns "$NS" volsync.backube/privileged-movers=true --overwrite >/dev/null
              kubectl -n "$NS" create secret generic drill-restic \
                --from-literal=RESTIC_REPOSITORY="$REPO_URL" \
                --from-literal=RESTIC_PASSWORD="$PW" \
                --from-literal=AWS_ACCESS_KEY_ID="$AK" \
                --from-literal=AWS_SECRET_ACCESS_KEY="$SK" >/dev/null

              cat <<YAML | kubectl apply -f - >/dev/null
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata: {name: drill-data, namespace: $NS}
              spec:
                accessModes: [ReadWriteOnce]
                # Class with reclaimPolicy Delete and one replica: the volume lives for
                # minutes and goes away with the namespace. With plain longhorn (Retain)
                # every run would leave an orphaned PV: three days of that piled up 100
                # of them holding 993Gi of reserved scheduling.
                storageClassName: longhorn-volsync-clone
                resources: {requests: {storage: ${DRILL_SIZE:-20Gi}}}
              ---
              apiVersion: volsync.backube/v1alpha1
              kind: ReplicationDestination
              metadata: {name: drill, namespace: $NS}
              spec:
                trigger: {manual: drill-$START}
                restic:
                  repository: drill-restic
                  destinationPVC: drill-data
                  copyMethod: Direct
                  cacheStorageClassName: local-path
                  cacheCapacity: 4Gi
                  cacheAccessModes: [ReadWriteOnce]
                  # The mover must restore the original file owners, and only root can
                  # lchown to a foreign uid. An unprivileged mover fails with "operation
                  # not permitted" on any volume whose owner differs from its own uid
                  # (caught on opencloud-data).
                  moverSecurityContext:
                    runAsUser: 0
                    runAsGroup: 0
                    fsGroup: 0
              YAML

              echo "waiting for restore..."
              DEADLINE=$(( $(date -u +%s) + ${DRILL_TIMEOUT:-2400} ))
              while [ -z "$(kubectl -n "$NS" get replicationdestination drill -o jsonpath='{.status.lastSyncTime}' 2>/dev/null)" ]; do
                [ "$(date -u +%s)" -gt "$DEADLINE" ] && { report 0 "timeout: restore did not finish"; exit 1; }
                sleep 20
              done
              echo "restore finished at $(kubectl -n "$NS" get replicationdestination drill -o jsonpath='{.status.lastSyncTime}')"

              # The verify pod runs as root: app volumes often have drwxrwx--- directories
              # owned by someone else, and an unprivileged find does not descend into them;
              # it would count FILES=0 on a fully restored volume (it did on opencloud-data).
              # Real check: the files are there, and if it is SQLite, the database opens
              # and passes integrity_check. An empty volume is a failure: that is exactly
              # how the netbird backup silently looked until 2026-09-10.
              kubectl -n "$NS" run verify --restart=Never --image="keinos/sqlite3:$SQLITE_TAG" \
                --overrides='{"spec":{"securityContext":{"runAsUser":0,"runAsGroup":0},"containers":[{"name":"verify","image":"keinos/sqlite3:'"$SQLITE_TAG"'","command":["sh","-c","set -e; files=$(find /data -type f -not -path \"*/lost+found/*\" | wc -l); bytes=$(du -sb /data | cut -f1); echo FILES=$files; echo BYTES=$bytes; [ \"$files\" -gt 0 ] || { echo EMPTY; exit 1; }; db=$(find /data -maxdepth 2 -name \"*.sqlite3\" -o -maxdepth 2 -name \"*.db\" | head -1); if [ -n \"$db\" ]; then echo DB=$db; res=$(sqlite3 \"file:$db?mode=ro\" \"PRAGMA integrity_check;\"); echo INTEGRITY=$res; [ \"$res\" = ok ] || exit 1; fi; echo VERIFY_OK"],"volumeMounts":[{"name":"d","mountPath":"/data"}]}],"volumes":[{"name":"d","persistentVolumeClaim":{"claimName":"drill-data"}}],"restartPolicy":"Never"}}' >/dev/null

              VDEADLINE=$(( $(date -u +%s) + 600 ))
              while :; do
                phase=$(kubectl -n "$NS" get pod verify -o jsonpath='{.status.phase}' 2>/dev/null || true)
                [ "$phase" = "Succeeded" ] && break
                [ "$phase" = "Failed" ] && { report 0 "verification failed: $(kubectl -n "$NS" logs verify 2>&1 | tail -3 | tr '\n' ' ')"; exit 1; }
                [ "$(date -u +%s)" -gt "$VDEADLINE" ] && { report 0 "verification timed out"; exit 1; }
                sleep 10
              done

              SUMMARY=$(kubectl -n "$NS" logs verify 2>&1 | tr '\n' ' ')
              echo "$SUMMARY"
              report 1 "$SUMMARY"
