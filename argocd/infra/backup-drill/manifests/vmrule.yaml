# Alerts around the weekly restore drill.
#
# Success or failure itself reaches Telegram straight from the CronJob (an
# alert to Alertmanager -> Robusta). This is the second line: it catches the
# case where the drill stopped running at all and so sends nothing.
#
# IMPORTANT, the shape of the expressions: the metrics are pushed once a week
# via /api/v1/import/prometheus, and an instant query only sees a point inside
# the lookbehind window (5 minutes). Hence max_over_time/last_over_time with a
# 30-day window everywhere: without it `homelab_restore_drill_success == 0`
# would never fire, and `absent(...)` would fire a day after every run.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: backup-drill
  namespace: victoria-metrics
spec:
  groups:
    - name: backup-drill
      rules:
        # A failure is held by the metric, not by one push alert: the CronJob
        # message goes out once and closes after resolve_timeout, while this
        # alert stays until the volume restores successfully.
        - alert: RestoreDrillFailed
          expr: last_over_time(homelab_restore_drill_success[30d]) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Проверка восстановления {{ $labels.app }} из {{ $labels.target }} провалилась"
            description: |
              Том не восстановился или восстановился пустым. Это значит, что
              копия в {{ $labels.target }} непригодна — не «джоба упала».
              kubectl -n backup-drill logs job/<последний>
              kubectl get replicationsource -A | grep {{ $labels.app }}

        - alert: RestoreDrillStale
          # One volume of the rotation per weekly run, so a given volume is
          # checked only once per full round: look at the freshest run of any
          # volume, not at each one separately.
          expr: time() - max(max_over_time(homelab_restore_drill_timestamp[30d])) > 16 * 24 * 3600
          labels:
            severity: critical
          annotations:
            summary: "Проверка восстановления не запускалась больше двух недель"
            description: |
              Последний успешный restore drill старше 16 дней — расписание
              сломано, CronJob suspend'нут или задание не доходит до отчёта.
              Бэкапы снова стали предположением.
              kubectl -n backup-drill get cronjob,job
              kubectl -n backup-drill logs job/<последний>

        - alert: RestoreDrillNeverRan
          expr: absent(max_over_time(homelab_restore_drill_timestamp[30d])) == 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Нет ни одной метрики restore drill"
            description: |
              В VictoriaMetrics нет homelab_restore_drill_timestamp: либо drill
              ещё ни разу не отработал, либо не может опубликовать метрику.
              Проверить: kubectl -n backup-drill get job
