# Алерты вокруг еженедельной проверки восстановления.
#
# Сам факт успеха/провала прилетает в Telegram сразу из CronJob (алерт в
# Alertmanager -> Robusta). Здесь — вторая линия: она ловит случай, когда
# drill вообще перестал запускаться и потому ничего не присылает.
#
# ВАЖНО про форму выражений: метрики пушатся раз в неделю через
# /api/v1/import/prometheus, а мгновенный запрос видит точку только внутри
# lookbehind-окна (5 минут). Поэтому везде max_over_time/last_over_time с
# окном в 30 дней — без него `homelab_restore_drill_success == 0` не сработал
# бы никогда, а `absent(...)` фаерил бы через сутки после каждого прогона.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: backup-drill
  namespace: victoria-metrics
spec:
  groups:
    - name: backup-drill
      rules:
        # Провал держится метрикой, а не одним push-алертом: сообщение из
        # CronJob уедет один раз и закроется по resolve_timeout, а этот алерт
        # будет висеть, пока том не восстановится успешно.
        - alert: RestoreDrillFailed
          expr: last_over_time(homelab_restore_drill_success[30d]) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Проверка восстановления {{ $labels.app }} из {{ $labels.target }} провалилась"
            description: |
              Том не восстановился или восстановился пустым. Это значит, что
              копия в {{ $labels.target }} непригодна — не «джоба упала».
              kubectl -n backup-drill logs job/<последний>
              kubectl get replicationsource -A | grep {{ $labels.app }}

        - alert: RestoreDrillStale
          # Ротация из 10 приложений, прогон раз в неделю: конкретный том
          # проверяется примерно раз в 10 недель, поэтому смотрим на самый
          # свежий прогон вообще, а не на каждый по отдельности.
          expr: time() - max(max_over_time(homelab_restore_drill_timestamp[30d])) > 16 * 24 * 3600
          labels:
            severity: critical
          annotations:
            summary: "Проверка восстановления не запускалась больше двух недель"
            description: |
              Последний успешный restore drill старше 16 дней — расписание
              сломано, CronJob suspend'нут или задание не доходит до отчёта.
              Бэкапы снова стали предположением.
              kubectl -n backup-drill get cronjob,job
              kubectl -n backup-drill logs job/<последний>

        - alert: RestoreDrillNeverRan
          expr: absent(max_over_time(homelab_restore_drill_timestamp[30d])) == 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Нет ни одной метрики restore drill"
            description: |
              В VictoriaMetrics нет homelab_restore_drill_timestamp: либо drill
              ещё ни разу не отработал, либо не может опубликовать метрику.
              Проверить: kubectl -n backup-drill get job
