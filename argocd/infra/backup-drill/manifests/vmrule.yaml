# Metrics are pushed once a week and an instant query sees only 5 minutes back:
# keep the [30d] *_over_time wrappers, or `== 0` never fires and absent() fires daily.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: backup-drill
  namespace: victoria-metrics
spec:
  groups:
    - name: backup-drill
      rules:
        # Holds the failure until a successful restore; the CronJob's push alert expires
        - alert: RestoreDrillFailed
          expr: last_over_time(homelab_restore_drill_success[30d]) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Проверка восстановления {{ $labels.app }} из {{ $labels.target }} провалилась"
            description: |
              Том не восстановился или восстановился пустым. Это значит, что
              копия в {{ $labels.target }} непригодна — не «джоба упала».
              kubectl -n backup-drill logs job/<последний>
              kubectl get replicationsource -A | grep {{ $labels.app }}

        - alert: RestoreDrillStale
          # Freshest run of any volume: each volume is checked once per round.
          # drill="core" runs weekly and would hide a stopped volume drill.
          expr: time() - max(max_over_time(homelab_restore_drill_timestamp{drill!="core"}[30d])) > 16 * 24 * 3600
          labels:
            severity: critical
          annotations:
            summary: "Проверка восстановления не запускалась больше двух недель"
            description: |
              Последний успешный restore drill старше 16 дней — расписание
              сломано, CronJob suspend'нут или задание не доходит до отчёта.
              Бэкапы снова стали предположением.
              kubectl -n backup-drill get cronjob,job
              kubectl -n backup-drill logs job/<последний>

        # Per app: openbao and etcd run weekly, each CNPG cluster every other week.
        - alert: RestoreDrillCoreStale
          expr: time() - max by (app) (max_over_time(homelab_restore_drill_timestamp{drill="core"}[30d])) > 16 * 24 * 3600
          labels:
            severity: critical
          annotations:
            summary: "Проверка восстановления {{ $labels.app }} не запускалась больше двух недель"
            description: |
              restore-drill-core не дошёл до отчёта по {{ $labels.app }}: CronJob
              suspend'нут, падает до проверки или не может опубликовать метрику.
              kubectl -n backup-drill get cronjob,job
              kubectl -n backup-drill logs job/<последний restore-drill-core>

        - alert: RestoreDrillNeverRan
          expr: absent(max_over_time(homelab_restore_drill_timestamp[30d])) == 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Нет ни одной метрики restore drill"
            description: |
              В VictoriaMetrics нет homelab_restore_drill_timestamp: либо drill
              ещё ни разу не отработал, либо не может опубликовать метрику.
              Проверить: kubectl -n backup-drill get job
