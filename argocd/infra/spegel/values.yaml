# Talos registry hosts dir. Needs discard_unpacked_layers=false on nodes
# (terraform_talos/modules/talos/patches/common.yaml.tftpl).
spegel:
  containerdRegistryConfigPath: /etc/cri/conf.d/hosts

# No zone labels: hints only emit recurring TopologyAwareHintsDisabled warnings.
service:
  registry:
    topologyAwareHintsEnabled: false

# No LimitRange in ns spegel; the chart sets only a memory limit.
resources:
  requests:
    cpu: 25m
  limits:
    cpu: 500m
    memory: 256Mi

homelab-common:
  # No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true
    allow:
      # containerd on every node mirrors through NodePort 30020; a backend on
      # another node sees the node IP (remote-node).
      - entities: [remote-node]
        ports: [5000]
