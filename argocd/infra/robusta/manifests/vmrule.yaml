apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: robusta
  namespace: victoria-metrics
spec:
  groups:
    - name: robusta
      rules:
        - alert: RobustaRunnerDown
          expr: absent(up{job=~".*robusta-runner.*"}) == 1 or up{job=~".*robusta-runner.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Robusta Runner недоступен — алерты не доставляются"
            description: |
              Robusta Runner не отвечает 5 минут. VMAlertmanager продолжает слать webhook-и,
              но обрабатывать их некому: Runner — единственный receiver, telegram-fallback
              снят. До восстановления не доставляется ничего, включая этот алерт —
              он виден только в UI Alertmanager / VMAlert.

        # Без PlaybookErrors / DiscoveryErrors: ложные срабатывания на transient'ах
        # (Alert Cleanup.md #29).
