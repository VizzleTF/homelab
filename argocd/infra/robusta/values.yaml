# Robusta — the single alert hub (enrichment, K8s-native triggers, change tracking).
# Chart robusta/robusta, version in config.yaml. Namespace: robusta.

clusterName: "homelab"

# No SaaS, no bundled kube-prometheus-stack, no HolmesGPT. HolmesGPT's
# AutoInvestigateAlerts sent a separate message on top of every alert
# (holmes_chat creates its own finding); the goal is one message per alert.
enablePlatformPlaybooks: false
enableHolmesGPT: false
enablePrometheusStack: false

grafanaRenderer:
  enableContainer: false

# Offline mode: empty account_id, no SaaS. signing_key is required even
# offline and comes from the ExternalSecret through env.
# Robusta substitutes {{ env.VAR }} (Jinja), NOT $(VAR) (the Kubernetes form).
globalConfig:
  signing_key: "{{ env.SIGNING_KEY }}"
  account_id: ""
  check_prometheus_flags: false
  prometheus_url: "http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc.cluster.local:8428"
  grafana_url: "https://grafana.example.com"

runner:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1024Mi
  log_level: INFO
  sendAdditionalTelemetry: false
  # Read-only root FS; the chart mounts the writable volumes itself.
  hardenedFs: true
  # Extends the runner's RBAC to the CNPG Cluster CRD, so "CNPG cluster
  # degraded" alerts get the cluster spec/status. The chart only knows the
  # keys StrimziPodSet, CNPGCluster, ExecutionContext.
  customCRD:
    - "CNPGCluster"
  serviceMonitor:
    path: /metrics
  additional_env_vars:
    - name: SIGNING_KEY
      valueFrom:
        secretKeyRef:
          name: robusta-telegram
          key: signing_key
    - name: TG_BOT_TOKEN
      valueFrom:
        secretKeyRef:
          name: robusta-telegram
          key: bot_token
    # chat_id is a literal number below: Robusta wants an int and validates
    # before env substitution, so {{ env.VAR }} does not work there. A chat_id
    # is useless without the bot token.

kubewatch:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi
  config:
    resource:
      pod: true
      deployment: true
      daemonset: true
      statefulset: true
      job: true
      node: true
      event: true
      ingress: true
      # Noisy kinds off.
      configmap: false
      secret: false
      serviceaccount: false
      namespace: false

# Telegram sinks: alerts (default) + changes (WorkloadChangeTracking). One bot,
# one chat_id. `default: false` on changes, otherwise it would also get a copy
# of every alert (duplicate in Telegram).
sinksConfig:
  - telegram_sink:
      name: telegram_alerts
      bot_token: "{{ env.TG_BOT_TOKEN }}"
      chat_id: 0000000000
      send_files: true
      # DEBUG is the severity of k8s warning events and other "something
      # happened" findings. VictoriaMetrics alerts arrive as INFO/LOW/HIGH and
      # pass the filter.
      scope:
        exclude:
          - severity: DEBUG
  - telegram_sink:
      name: telegram_changes
      bot_token: "{{ env.TG_BOT_TOKEN }}"
      chat_id: 0000000000
      send_files: false
      default: false

# Custom playbooks: auto-remediation and change tracking. Built-in playbooks
# (KubePodCrashLooping, KubeNodeNotReady, ...) work as shipped. Old Jobs are
# cleaned by Kubernetes (.spec.ttlSecondsAfterFinished), not by Robusta.
customPlaybooks:

  # 1. Auto-delete Evicted pods.
  - name: "DeleteEvictedPods"
    triggers:
      - on_pod_evicted: {}
    actions:
      - delete_pod: {}
      - create_finding:
          aggregation_key: "AutoDeleteEvicted"
          title: "Auto-deleted evicted pod $name"
    sinks: [telegram_alerts]

  # 2. Rollout restart on repeated OOMKills. The built-in PodOOMKill sends
  # the OOM message (logs + memory graph); this one ONLY restarts, without
  # create_finding, so there is no second message. The restart itself shows
  # up in telegram_changes via WorkloadChangeTracking. rate_limit matches the
  # built-in (3600s).
  - name: "RestartOnMemoryLeak"
    triggers:
      - on_pod_oom_killed:
          rate_limit: 3600
    actions:
      - rollout_restart: {}

  # 3. Change tracking: Deployment/DS/SS/Ingress to the changes sink.
  - name: "WorkloadChangeTracking"
    triggers:
      - on_kubernetes_resource_operation:
          resources: ["deployment", "daemonset", "statefulset", "ingress"]
    actions:
      - resource_babysitter: {}
    sinks: [telegram_changes]

  # 4. No K8s Warning Events report (off since 2026-09-11): it sent every
  # Warning event as its own DEBUG message, and the exclude list never kept
  # up. VMRules with `for:` (KubePodNotReady, KubeContainerWaiting,
  # KubePodCrashLooping, LonghornVolumeDegraded/Faulted) cover the same ground
  # on state rather than events, and they resolve. The telegram_alerts sink
  # also excludes severity DEBUG for the chart's built-in playbooks.

  # 5. Job failure with enrichment (info + events + pod logs).
  - name: "JobFailureEnrichment"
    triggers:
      - on_job_failure: {}
    actions:
      - create_finding:
          aggregation_key: "JobFailure"
          title: "Job $name in namespace $namespace failed"
      - job_info_enricher: {}
      - job_events_enricher: {}
      - job_pod_enricher: {}
    sinks: [telegram_alerts]

  # 6. Hourly cleanup of finished Robusta job pods (hours_back=1). KRR/Popeye
  # scheduled scans are off (disabledPlaybooks below): 2-4 pods per run and
  # nothing useful in Telegram.
  - name: "CleanupRobustaPods"
    triggers:
      - on_schedule:
          cron_schedule_repeat:
            cron_expression: "0 */1 * * *"
    actions:
      - cleanup_robusta_pods:
          hours_back: 1

# The chart's scheduled built-in playbooks send to robusta_ui_sink (absent
# here) and only leave completed jobs behind.
disabledPlaybooks:
  - WeeklyKRRScan
  - RobustaMaintenance

# robusta-telegram: bot_token + signing_key for the Telegram sinks (chat_id is
# a literal int above).
homelab-common:
  # Default-deny ingress; only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]

  externalSecrets:
    - name: robusta-telegram
      vaultPath: robusta/telegram
      data:
        - secretKey: bot_token
          property: bot_token
        - secretKey: signing_key
          property: signing_key
