clusterName: "homelab"

# HolmesGPT sends a second message per alert.
enableHolmesGPT: false  # pinned: one message per alert

# Offline mode still requires signing_key. Robusta substitutes {{ env.VAR }}
# (Jinja), NOT $(VAR).
globalConfig:
  signing_key: "{{ env.SIGNING_KEY }}"
  check_prometheus_flags: false
  prometheus_url: "http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc.cluster.local:8428"
  grafana_url: "https://grafana.example.com"

runner:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1024Mi
  hardenedFs: true
  # RBAC for CNPG alert enrichment; the chart accepts only StrimziPodSet,
  # CNPGCluster, ExecutionContext.
  customCRD:
    - "CNPGCluster"
  additional_env_vars:
    - name: SIGNING_KEY
      valueFrom:
        secretKeyRef:
          name: robusta-telegram
          key: signing_key
    - name: TG_BOT_TOKEN
      valueFrom:
        secretKeyRef:
          name: robusta-telegram
          key: bot_token
    # chat_id stays a literal: it is validated as int before env substitution.

kubewatch:
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  config:
    resource:
      configmap: false
      serviceaccount: false
      namespace: false

# `default: false` on telegram_changes, else it duplicates every alert.
sinksConfig:
  - telegram_sink:
      name: telegram_alerts
      bot_token: "{{ env.TG_BOT_TOKEN }}"
      chat_id: 0000000000
      send_files: true
      # DEBUG = k8s warning events; VM alerts arrive as INFO/LOW/HIGH.
      scope:
        exclude:
          - severity: DEBUG
  - telegram_sink:
      name: telegram_changes
      bot_token: "{{ env.TG_BOT_TOKEN }}"
      chat_id: 0000000000
      send_files: false
      default: false

customPlaybooks:

  - name: "DeleteEvictedPods"
    triggers:
      - on_pod_evicted: {}
    actions:
      - delete_pod: {}
      - create_finding:
          aggregation_key: "AutoDeleteEvicted"
          title: "Auto-deleted evicted pod $name"
    sinks: [telegram_alerts]

  # No create_finding: the built-in PodOOMKill already sends the message.
  - name: "RestartOnMemoryLeak"
    triggers:
      - on_pod_oom_killed:
          rate_limit: 3600
    actions:
      - rollout_restart: {}

  - name: "WorkloadChangeTracking"
    triggers:
      - on_kubernetes_resource_operation:
          resources: ["deployment", "daemonset", "statefulset", "ingress"]
    actions:
      - resource_babysitter: {}
    sinks: [telegram_changes]

  # No K8s Warning Events playbook: one message per event, the exclude list
  # never kept up. State VMRules with `for:` cover it and resolve.

  - name: "JobFailureEnrichment"
    triggers:
      - on_job_failure: {}
    actions:
      - create_finding:
          aggregation_key: "JobFailure"
          title: "Job $name in namespace $namespace failed"
      - job_info_enricher: {}
      - job_events_enricher: {}
      - job_pod_enricher: {}
    sinks: [telegram_alerts]

  - name: "CleanupRobustaPods"
    triggers:
      - on_schedule:
          cron_schedule_repeat:
            cron_expression: "0 */1 * * *"
    actions:
      - cleanup_robusta_pods:
          hours_back: 1

# They send to robusta_ui_sink (absent here) and only leave completed jobs.
disabledPlaybooks:
  - WeeklyKRRScan
  - RobustaMaintenance

homelab-common:
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]

  externalSecrets:
    # bot_token from shared/telegram needs the `telegram` grant.
    - name: robusta-telegram
      vaultPath: robusta/app
      data:
        - secretKey: bot_token
          vaultPath: shared/telegram
          property: bot_token
        - secretKey: signing_key
          property: signing_key
