providerRegex: "^talos-"
providerIpPrefixes:
  - 10.11.11.0/24
bypassDnsResolution: true

replicas: 1
leaderElection: false

# Live usage ~11Mi.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

homelab-common:
  # No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true
