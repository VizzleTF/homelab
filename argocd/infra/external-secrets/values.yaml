# External Secrets Operator Helm Values
# https://github.com/external-secrets/external-secrets

installCRDs: true
replicaCount: 2

# Обе реплики садились на talos-worker-01: все три control-plane ноды несут
# tuppr-taint `tuppr.home-operations.com/outdated:PreferNoSchedule` (кластер
# заморожен на Talos v1.13.7), и без жёсткого правила scheduler уводит всё на
# единственную нечистую ноду. Падение worker-01 уносило ESO целиком, а с ним
# синк всех секретов. Namespace в exclude-списке descheduler, так что
# evict-лупа тут не было — только дыра в HA.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets
            app.kubernetes.io/instance: external-secrets

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

extraEnv:
  - name: GOMEMLIMIT
    value: "110MiB"

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

serviceMonitor:
  enabled: true

webhook:
  create: true
  port: 9443
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: "110MiB"

certController:
  create: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: "110MiB"