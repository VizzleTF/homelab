# External Secrets Operator Helm Values
# https://github.com/external-secrets/external-secrets

installCRDs: true
replicaCount: 2

# Writes on the SATA SSDs etcd shares (2026-10): ~70 SecretStores were
# validated every 5 min — each a login + revoke in OpenBao raft and a
# "store validated" Event PATCH in etcd. Validate hourly, reuse tokens (cached
# tokens are never revoked, which batch tokens from
# scripts/openbao-eso-access.sh require).
storeRequeueInterval: 1h
vault:
  enableTokenCache: true

# Required anti-affinity: with a soft rule both replicas once landed on
# talos-worker-01, and losing that node took ESO, and every secret sync, down.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets
            app.kubernetes.io/instance: external-secrets

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

extraEnv:
  - name: GOMEMLIMIT
    value: "110MiB"

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

serviceMonitor:
  enabled: true

webhook:
  create: true
  port: 9443
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: "110MiB"

certController:
  create: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: "110MiB"
homelab-common:
  # Default-deny ingress. The webhook is called by kube-apiserver (allowed
  # entity); ESO only makes outbound calls (OpenBao, API server).
  networkPolicy:
    enabled: true
