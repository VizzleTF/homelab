replicaCount: 2

# Cuts etcd/raft writes (~70 stores validated every 5 min, 2026-10). Token cache
# is required: batch tokens (scripts/openbao-eso-access.sh) cannot be revoked.
storeRequeueInterval: 1h
vault:
  enableTokenCache: true

# Soft rule put both replicas on one node; losing it stopped all secret syncs.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets
            app.kubernetes.io/instance: external-secrets

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

extraEnv:
  - name: GOMEMLIMIT
    value: "110MiB"

securityContext:
  runAsUser: 65534

webhook:
  port: 9443
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: "110MiB"

certController:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: "110MiB"
homelab-common:
  # Webhook callers (kube-apiserver) are allowed by default; ESO itself is outbound-only.
  networkPolicy:
    enabled: true
