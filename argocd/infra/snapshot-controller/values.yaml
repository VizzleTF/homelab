# Snapshot CRDs Longhorn does not bundle; VolSync (wave -3) needs them first.

controller:
  revisionHistoryLimit: 2
  args:
    # Lease renewals are etcd writes (default every 2 s); 15 s retry (2026-10).
    leaderElectionLeaseDuration: 60s
    leaderElectionRenewDeadline: 40s
    leaderElectionRetryPeriod: 15s
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

homelab-common:
  # No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true
