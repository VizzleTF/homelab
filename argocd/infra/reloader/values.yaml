# Opt-in via workload annotation (homelab-common `workloads` add it; upstream charts set it).
# Not annotatable — restart by hand after secret rotation: couchdb (obsidian-livesync),
# trek, robusta-runner, wazuh-manager-master/worker StatefulSets.

reloader:
  # Without both, Secret changes made while reloader was down or before it
  # first saw the Secret (e.g. a new OIDC secret) never roll the workload.
  syncAfterRestart: true
  reloadOnCreate: true
  deployment:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

homelab-common:
  # No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true
