apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cilium
  namespace: victoria-metrics
spec:
  groups:
    - name: cilium
      rules:
        - alert: CiliumMetricsDown
          expr: absent(cilium_version) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Метрики cilium-agent не собираются"
            description: "VMPodScrape victoria-metrics/cilium-agent не отдаёт данных 30 минут — дропы и состояние датаплейна снова не видны."

        # Seen once: a stale host iSCSI session of an old Longhorn instance-manager.
        - alert: CiliumStaleIPDrops
          expr: sum by (pod) (rate(cilium_drop_count_total{reason="Stale or unroutable IP"}[15m])) > 0.2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }}: трафик в несуществующий IP ({{ $value | humanize }}/s)"
            description: |
              Что-то на ноде упорно ходит в IP, которого больше нет. Частый случай —
              зомби-сессия iSCSI старого instance-manager Longhorn:
              kubectl -n longhorn-system exec <longhorn-manager на ноде> -c longhorn-manager -- \
                nsenter --mount=/host/proc/1/ns/mnt --net=/host/proc/1/ns/net -- iscsiadm -m session

        # "restoring" excluded: on 1.20.4 it stays 1 after an agent restart though
        # all endpoints are ready (2026-10-24).
        - alert: CiliumEndpointsNotReady
          expr: sum by (pod) (cilium_endpoint_state{endpoint_state!~"ready|restoring"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }}: {{ $value }} endpoint(s) Cilium не ready 30 минут"

        # Sustained denies under default-deny = a client missing from an allow-list.
        - alert: CiliumPolicyDenied
          expr: sum by (pod) (rate(cilium_drop_count_total{reason="Policy denied"}[10m])) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }}: трафик режется сетевой политикой ({{ $value | humanize }}/s)"
            description: |
              Кого режут:
              kubectl -n kube-system exec {{ $labels.pod }} -c cilium-agent -- hubble observe --verdict DROPPED --since 15m -o compact
              Если это легитимный клиент — добавить его ns в networkPolicy.allow приложения.
