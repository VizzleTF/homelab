---
# eBGP to OpenWrt announcing LoadBalancer IPs from homelab-pool (10.11.10.0/24).
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: homelab-bgp
  annotations:
    # cilium-operator registers the BGP CRDs at runtime, after the chart syncs.
    argocd.argoproj.io/sync-wave: "5"
spec:
  # Every node peers with OpenWrt (ECMP).
  nodeSelector: {}
  bgpInstances:
    - name: openwrt
      localASN: 65010
      peers:
        - name: openwrt-router
          peerASN: 65000
          peerAddress: 10.11.11.1
          peerConfigRef:
            name: openwrt-peer
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: openwrt-peer
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  # No MD5 password: OpenWrt 25.12 kernel lacks CONFIG_TCP_MD5SIG (BIRD: "Kernel
  # does not support TCP MD5 signatures").
  # GR keeps routes through an agent restart; on a node panic a stale route
  # black-holes 1/4 of ECMP flows for restartTimeSeconds (default 120 s too long).
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 30
  timers:
    connectRetryTimeSeconds: 12
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: lb-pool
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: lb-pool-advert
  labels:
    advertise: lb-pool
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - {key: somekey, operator: NotIn, values: [neverusethis]}
      attributes:
        communities:
          standard: ["65010:100"]
