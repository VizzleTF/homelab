# Agent working set hit 470-490Mi of a 512Mi limit (2026-09); OOM kills the datapath.
resources:
  requests:
    memory: 384Mi
    cpu: 96m
  limits:
    memory: 768Mi
    cpu: 400m

# Agent GOMEMLIMIT is chart-injected from limits.memory; adding it via extraEnv
# fails SSA with "duplicate entries for key".

envoy:
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 256Mi
      cpu: 200m

operator:
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 256Mi
      cpu: 250m
  extraEnv:
    - name: GOMEMLIMIT
      value: "220MiB"
  # Lease renewals are etcd writes (default every 2 s); slowed to cut disk writes (2026-10).
  extraArgs:
    - --leader-election-lease-duration=60s
    - --leader-election-renew-deadline=40s
    - --leader-election-retry-period=15s

ipam:
  mode: kubernetes

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
  # Default true since 1.20. Set false for the removed cloudflared; the gateway
  # Services use externalTrafficPolicy Cluster, so flipping it alone may still
  # give the SNAT'd node IP — check the client IP in a backend log first.
  useRemoteAddress: false

# All nodes share one L2 (10.11.11.x).
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "10.244.0.0/16"

encryption:
  enabled: true
  type: wireguard

bpf:
  masquerade: true

# Agent metrics :9962, scraped by manifests/vmpodscrape.yaml (CiliumStaleIPDrops
# depends on them, 2026-09-24).
prometheus:
  enabled: true

# No relay: `hubble observe` inside cilium-agent (CiliumPolicyDenied runbook) works without it.
hubble:
  relay:
    enabled: false  # pinned: deliberate, keep off if the default flips
  ui:
    enabled: false  # pinned: deliberate, keep off if the default flips

# KubePrism local API endpoint.
k8sServiceHost: localhost
k8sServicePort: 7445

kubeProxyReplacement: true

# Explicit: live cilium-config had bpf-lb-sock: false despite kubeProxyReplacement.
socketLB:
  enabled: true

# Needs BPF masquerade and kernel >=5.18; applies only after agent pod restart.
bandwidthManager:
  enabled: true
  bbr: true

# Peering CRs: manifests/cilium-bgp.yaml.
bgpControlPlane:
  enabled: true
