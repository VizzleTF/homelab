chart: cilium
repoURL: https://helm.cilium.io/
targetRevision: "1.20.3"
namespace: kube-system
wave: "-5"
extraManifests: true
# tls.auto.method=helm generates a new CA and hubble certs on every render (2026-01).
ignoreDiff: |
  - group: ""
    kind: Secret
    name: cilium-ca
    jqPathExpressions:
      - .data
  - group: ""
    kind: Secret
    name: hubble-server-certs
    jqPathExpressions:
      - .data
