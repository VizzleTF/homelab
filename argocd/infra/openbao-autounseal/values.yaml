# Chart defaults (3/3 shares, Secrets openbao-keys / openbao-root-token) are relied on.

settings:
  # Chart default is https://, but OpenBao serves plain HTTP on :8200.
  openbao_url: "http://openbao.openbao:8200"

resources:
  limits:
    # Throttled 70% of periods at 100m.
    cpu: 250m
  requests:
    cpu: 15m
    memory: 100Mi
