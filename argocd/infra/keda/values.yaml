# KEDA core operator + metrics-apiserver + admission webhooks, chart defaults
# (one replica each, 100m/100Mi requests).

homelab-common:
  # Default-deny ingress for the whole namespace (also covers the sibling app
  # sharing it); only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]
