# Requests sized to real use (1-9m / 13-53Mi) instead of the chart's 100m/100Mi.

resources:
  operator:
    requests:
      cpu: 10m
      memory: 64Mi
  metricServer:
    requests:
      cpu: 10m
      memory: 64Mi
  webhooks:
    requests:
      cpu: 10m
      memory: 32Mi

operator:
  revisionHistoryLimit: 2
metricsServer:
  revisionHistoryLimit: 2
webhooks:
  revisionHistoryLimit: 2

homelab-common:
  # Covers keda-add-ons-http too (same namespace). No scrape there, so no victoria-metrics allow.
  networkPolicy:
    enabled: true
