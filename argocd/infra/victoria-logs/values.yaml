# Grafana dashboard 22759 expects the Vector schema.

fullnameOverride: victoria-logs

server:
  retentionPeriod: "7d"
  # Must trip before VolumeAlmostFull during a log storm.
  retentionDiskSpaceUsage: "9GiB"

  # 5s flushes became ~28 GB/day of small fsyncs on the control-plane SSDs
  # etcd shares (2026-10). 1m flush (Vector re-sends after a crash) and the pod
  # kept off control-plane nodes.
  extraArgs:
    inmemoryDataFlushInterval: 1m
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  persistentVolume:
    storageClassName: longhorn

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

  env:
    - name: GOMEMLIMIT
      value: "860MiB"

vector:
  enabled: true

  # Checkpoints rewrite every second (~1.4 GB/day per node, no knob): /run is
  # tmpfs on Talos, lost only on reboot when log files start fresh anyway.
  persistence:
    hostPath:
      path: /run/vector

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # Startup burst re-reads /var/log/pods: OOM at 512Mi, 1018Mi seen at 1Gi (2026-09).
      memory: 1536Mi

  # The VM chart generates sinks.vlogs; only the diff lives here, and
  # customConfig never replaces the chart's sink.
  customConfig:
    sources:
      k8s:
        # Drops 70+ NFD labels per event; "" disables the field.
        node_annotation_fields:
          node_labels: ""
        pod_annotation_fields:
          pod_annotations: ""
        namespace_annotation_fields:
          namespace_labels: ""

      # kube-apiserver audit (CP nodes only). read_from: end is required, else every
      # pod restart floods the SIEM with a day of history.
      kube_audit:
        type: file
        include:
          - /var/log/audit/kube/kube-apiserver*.log
        read_from: end
        ignore_older_secs: 600
    transforms:
      filter_noise:
        type: filter
        inputs: [k8s]
        condition: |
          cn = to_string(.kubernetes.container_name) ?? ""
          m  = to_string(.message) ?? ""
          apiserver_noise = cn == "kube-apiserver" && (match(m, r'/(healthz|readyz|livez)') || match(m, r'trace\.go.*Trace'))
          etcd_noise = cn == "etcd" && match(m, r'read-only range request')
          ctrl_noise = cn == "kube-controller-manager" && match(m, r'Event occurred.*SuccessfulCreate')
          !(apiserver_noise || etcd_noise || ctrl_noise)
      parser:
        inputs: [filter_noise]

      # Full audit is ~100MB per couple of hours per CP node; the SIEM gets only these.
      kube_audit_security:
        type: filter
        inputs: [kube_audit]
        condition: |
          a = parse_json(.message) ?? {}
          res = to_string(get(a, ["objectRef", "resource"]) ?? "") ?? ""
          sub = to_string(get(a, ["objectRef", "subresource"]) ?? "") ?? ""
          verb = to_string(get(a, ["verb"]) ?? "") ?? ""
          stage = to_string(get(a, ["stage"]) ?? "") ?? ""
          sensitive = includes(["secrets", "roles", "rolebindings", "clusterroles", "clusterrolebindings", "serviceaccounts"], res)
          mutating = includes(["create", "update", "patch", "delete", "deletecollection"], verb)
          escalation = includes(["exec", "attach", "portforward"], sub)
          stage == "ResponseComplete" && ((sensitive && mutating) || escalation)

    sinks:
      # Fewer writes: ignored fields are ~half of every record. Keep other
      # pod_labels: the Explorer dashboard filters by app.kubernetes.io/name.
      vlogs:
        batch:
          timeout_secs: 10
        request:
          headers:
            VL-Ignore-Fields: kubernetes.pod_labels.pod-template-hash,kubernetes.pod_labels.controller-revision-hash,kubernetes.container_id,kubernetes.container_image_id,kubernetes.pod_ips,kubernetes.pod_uid,file,source_type
      # Talos can't send an audit webhook, so Wazuh gets syslog (LB IP, see [[wazuh]]).
      wazuh_syslog:
        type: socket
        inputs: [kube_audit_security]
        address: 10.11.10.140:514
        mode: udp
        encoding:
          codec: text

homelab-common:
  # VictoriaLogs has no auth (read + delete API) and holds the audit stream:
  # only Grafana and vmagent may connect.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]
        ports: [9428, 9090]
