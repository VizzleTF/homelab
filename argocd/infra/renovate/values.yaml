homelab-common:
  externalSecrets:
    - name: renovate-forgejo-token
      templateEngineVersion: v2
      vaultPath: renovate/forgejo-token
      data:
        - secretKey: token
          property: token
      templateData:
        RENOVATE_TOKEN: "{{ .token }}"
    - name: renovate-github-token
      templateEngineVersion: v2
      vaultPath: renovate/github-token
      data:
        - secretKey: token
          property: token
      templateData:
        GITHUB_COM_TOKEN: "{{ .token }}"
        # GITHUB_COM_TOKEN даёт hostRule ТОЛЬКО для matchHost=github.com (hostType=github)
        # — ghcr.io Renovate ходит анонимно. Анонимный GHCR-токен короткоживущий и
        # жёстко rate-limited, а ghcr.io/immich-app/immich-machine-learning имеет
        # ~186k тегов = 187 последовательных страниц tags/list на каждый lookup
        # (GHCR капает n на 1000 и сортирует oldest→newest, поэтому Renovate обязан
        # вычитать ВСЕ страницы). Walk отваливался посреди пагинации → getTags вернул
        # null → "Failed to look up docker package ...: no-result" в Dependency
        # Dashboard. Тот же PAT (scope read:packages) снимает лимит.
        # hostRules — тип array/object, env-переменная парсится JSON5; github.com-правило
        # из GITHUB_COM_TOKEN добавляется ПОСЛЕ и не затирается.
        RENOVATE_HOST_RULES: '[{"matchHost":"ghcr.io","hostType":"docker","username":"VizzleTF","password":"{{ .token }}"}]'
    - name: renovate-notify-telegram
      templateEngineVersion: v2
      # Shared bot with Robusta — same Vault path, same chat. Single Telegram bot
      # для всего homelab (alerts + renovate digest).
      vaultPath: robusta/telegram
      data:
        - secretKey: bot_token
          property: bot_token
        - secretKey: chat_id
          property: chat_id
      templateData:
        TELEGRAM_BOT_TOKEN: "{{ .bot_token }}"
        TELEGRAM_CHAT_ID: "{{ .chat_id }}"

  limitRange:
    enabled: true
    name: default-limits
    defaults:
      cpu: 1000m
      memory: 1Gi
    defaultRequests:
      cpu: 50m
      memory: 128Mi

cronjob:
  schedule: "0 6 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  ttlSecondsAfterFinished: 86400
  jobBackoffLimit: 2
  activeDeadlineSeconds: 3600

envFrom:
  - secretRef:
      name: renovate-forgejo-token
  - secretRef:
      name: renovate-github-token

env:
  LOG_LEVEL: info
  RENOVATE_PLATFORM: gitea
  RENOVATE_ENDPOINT: https://git.example.com/api/v1/
  RENOVATE_AUTODISCOVER: "false"
  RENOVATE_REPOSITORY_CACHE: "enabled"
  NODE_OPTIONS: "--max-old-space-size=1024"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    # Bumped 1536→2048Mi: first-attempt OOM observed during full repo scan
    # (Node.js heap 1024 + child processes for cargo/yarn/github-actions
    # extractors). Renovate runs ~10-15 min/day, +512Mi peak fits comfortably
    # on bare-metal CP nodes.
    memory: 2048Mi

serviceAccount:
  create: true
  name: renovate

renovate:
  persistence:
    cache:
      enabled: true
      # node-local scratch — renovate cache is fully rebuildable, so skip
      # Longhorn's 2x replica + network overhead. local-path PV is node-pinned
      # (WaitForFirstConsumer); the cronjob follows it via PV node affinity. If
      # the node dies the cache is lost and renovate rebuilds it. See
      # argocd/infra/local-path-provisioner.
      storageClass: local-path
      storageSize: 2Gi
  config: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "platform": "gitea",
      "endpoint": "https://git.example.com/api/v1/",
      "onboarding": false,
      "requireConfig": "required",
      "autodiscover": false,
      "repositories": [
        "vizzle/homelab"
      ],
      "gitAuthor": "Renovate Bot <renovate@example.com>"
    }
