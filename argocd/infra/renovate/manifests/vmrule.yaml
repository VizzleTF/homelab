apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: renovate
  namespace: victoria-metrics
spec:
  groups:
    - name: renovate
      rules:
        # No RenovateCronJobFailing: KubeJobFailed covers it.
        - alert: RenovateScanMissing
          # CronJob status, not Jobs: Jobs vanish after 24h (TTL) and
          # job_name=~"renovate-.*" also matches renovate-notify.
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="renovate", cronjob="renovate"} > 172800
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: No successful Renovate scan in the last 48h
            description: |
              Daily scan CronJob has not completed successfully for >48h.
              Likely causes: PAT expired, Vault/ESO sync broken, pod OOM.
