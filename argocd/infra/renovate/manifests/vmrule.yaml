apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: renovate
  namespace: victoria-metrics
spec:
  groups:
    - name: renovate
      rules:
        # RenovateCronJobFailing was dropped: upstream KubeJobFailed covers it.
        - alert: RenovateScanMissing
          # CronJob status, not Job objects: Jobs are deleted 24h after they finish
          # (ttlSecondsAfterFinished), and job_name=~"renovate-.*" also matched the
          # daily renovate-notify Jobs, so a dead scan never fired.
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="renovate", cronjob="renovate"} > 172800
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: No successful Renovate scan in the last 48h
            description: |
              Daily scan CronJob has not completed successfully for >48h.
              Likely causes: PAT expired, Vault/ESO sync broken, pod OOM.
