# Метрики пушатся раз в неделю, а instant-запрос видит точку только 5 минут —
# поэтому max_over_time[30d].
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: dr-pack
  namespace: victoria-metrics
spec:
  groups:
    - name: dr-pack
      rules:
        - alert: DrPackStale
          expr: time() - max(max_over_time(homelab_dr_pack_timestamp[30d])) > 9 * 24 * 3600
          labels:
            severity: critical
          annotations:
            summary: "Off-site DR-пакет старше 9 дней"
            description: |
              CronJob openbao/dr-pack-offsite не доходит до конца: Shamir-ключи,
              root-токен и пароли restic в S3 протухают вместе с ротацией
              секретов. Без свежего пакета кластер не поднять с нуля.
              kubectl -n openbao get cronjob,job
              kubectl -n openbao logs job/<последний> -c collect

        - alert: DrPackNeverRan
          expr: absent(max_over_time(homelab_dr_pack_timestamp[30d])) == 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Нет ни одной метрики off-site DR-пакета"
            description: |
              В VictoriaMetrics нет homelab_dr_pack_timestamp: либо пакет ещё
              ни разу не собрался, либо контейнер metrics не достучался до VM.
              kubectl -n openbao get job

        - alert: DrPackSuspiciouslySmall
          # Живой пакет ~90 KiB; меньше — raft-снапшот пустой.
          expr: max_over_time(homelab_dr_pack_bytes[30d]) < 20 * 1024
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Off-site DR-пакет подозрительно мал"
            description: |
              Последний пакет меньше 20 KiB — вероятно, raft-снапшот пустой или
              обрезан, и восстанавливать из него нечего.
              kubectl -n openbao logs job/<последний> -c collect
