# OpenBao - Apache 2.0 fork of HashiCorp Vault
# HA deployment with Raft storage, parallel to Vault during migration

homelab-common:
  veleroSchedules:
    - name: openbao-daily
      schedule: "5 2 * * *"
      template:
        # Only StatefulSet leader pod — на нём Raft snapshot.
        labelSelector: &openbao_lsel
          matchLabels:
            statefulset.kubernetes.io/pod-name: openbao-0
        csiSnapshotTimeout: 10m
        itemOperationTimeout: 30m0s
        hooks: &openbao_hooks
          resources:
            - name: raft-snapshot
              includedResources: [pods]
              labelSelector:
                matchLabels:
                  statefulset.kubernetes.io/pod-name: openbao-0
              pre:
                - exec:
                    container: openbao
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -e
                        export BAO_ADDR=http://127.0.0.1:8200
                        mkdir -p /openbao/data/.velero
                        JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                        export BAO_TOKEN=$(bao write -field=token auth/kubernetes/login role=openbao-snapshot jwt="$JWT")
                        bao operator raft snapshot save /openbao/data/.velero/raft.snap
                    onError: Fail
                    timeout: 5m
    # Independent off-site copy → OVH (BSL ovh-direct). Тир секреты: daily, 90d.
    # Raft snapshot hook + leader-only labelSelector через YAML alias.
    - name: openbao-offsite
      schedule: "30 3 * * *"
      template:
        labelSelector: *openbao_lsel
        csiSnapshotTimeout: 10m
        itemOperationTimeout: 30m0s
        storageLocation: ovh-direct
        ttl: "2160h0m0s"
        hooks: *openbao_hooks

  # Raft-снапшот в обе S3-цели напрямую (backup v2, см. docs/backup-v2.md).
  # Раньше снапшот снимал Velero pre-hook, а сам файл вывозился вместе с PVC
  # data-openbao-0 двумя Schedule'ами. Здесь всё в одном месте: bao пишет
  # снапшот в emptyDir, rclone раскладывает по garage и ovh.
  #
  # Снапшот самодостаточен — это полный слепок Raft-стора, восстанавливаемый
  # `bao operator raft snapshot restore` в пустой кластер. PVC бэкапить не нужно.
  # SA `openbao` — под ним же работает StatefulSet, поэтому k8s-auth роль
  # openbao-snapshot принимает его токен без дополнительных привязок.
  cronJobs:
    - name: openbao-raft-snapshot
      spec:
        schedule: "5 2 * * *"
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 600
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 1800
            template:
              spec:
                restartPolicy: OnFailure
                serviceAccountName: openbao
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  runAsGroup: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                initContainers:
                  - name: snapshot
                    # renovate: image=quay.io/openbao/openbao
                    image: quay.io/openbao/openbao:2.6.2
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        export BAO_ADDR=http://openbao.openbao.svc.cluster.local:8200
                        JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                        BAO_TOKEN=$(bao write -field=token auth/kubernetes/login                           role=openbao-snapshot jwt="$JWT")
                        export BAO_TOKEN
                        ts=$(date -u +%Y-%m-%dT%H%M)
                        bao operator raft snapshot save "/snap/raft-${ts}.snap"
                        ls -lh /snap/
                        test -s "/snap/raft-${ts}.snap"
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: snap
                        mountPath: /snap
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                containers:
                  - name: upload
                    # renovate: image=rclone/rclone
                    image: rclone/rclone:1.75
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -eu
                        for dst in garage:snapshots/openbao ovh:vaka-homelab/snapshots/openbao; do
                          echo "=== copy -> $dst"
                          rclone copy /snap "$dst" --verbose
                          echo "=== prune >90d in $dst"
                          rclone delete "$dst" --min-age 90d --verbose
                        done
                        rclone size garage:snapshots/openbao
                    envFrom:
                      - secretRef:
                          name: snapshots-rclone
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: snap
                        mountPath: /snap
                        readOnly: true
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                volumes:
                  - name: snap
                    emptyDir: {}

  externalSecrets:
    - name: openbao-approle-credentials
      vaultPath: vault/approle
      targetName: openbao-snapshot-agent-token
      deletionPolicy: Retain
      templateEngineVersion: v2
      data:
        - secretKey: role_id
          property: role_id
        - secretKey: secret_id
          property: secret_id
      templateData:
        role-id: "{{ .role_id }}"
        secret-id: "{{ .secret_id }}"

  httpRoutes:
    - name: openbao
      hostname: openbao
      gateway: internal
      service:
        name: openbao-active
        port: 8200

  rbac:
    - serviceAccount:
        name: openbao
        create: false
      clusterRole:
        name: openbao-server
        rules:
          - apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch"]

    - serviceAccount:
        name: openbao-auth
        create: true
        automountServiceAccountToken: true
      clusterRole:
        name: openbao-auth-delegator
        rules:
          - apiGroups: [""]
            resources: ["serviceaccounts/token"]
            verbs: ["create"]
          - apiGroups: [""]
            resources: ["serviceaccounts"]
            verbs: ["get"]
          - apiGroups: ["authentication.k8s.io"]
            resources: ["tokenreviews"]
            verbs: ["create"]
          - apiGroups: ["authorization.k8s.io"]
            resources: ["subjectaccessreviews"]
            verbs: ["create"]
      clusterRoleBinding:
        name: openbao-auth-delegator-openbao

  limitRange:
    enabled: true
    name: default-limits
    defaults:
      cpu: 250m
      memory: 256Mi
    defaultRequests:
      cpu: 50m
      memory: 64Mi

server:
  # RollingUpdate (chart default = OnDelete): auto-roll pods on image/chart bumps
  # без ручного delete. Reverse-ordinal по одному, ждёт Ready между подами —
  # autounseal расшиливает холодный pod (~30s) до readiness. active (openbao-0)
  # катится последним. См. memory reference-openbao-autounseal-broken-full-reboot.
  updateStrategyType: "RollingUpdate"

  resources:
    requests:
      memory: 250Mi
      cpu: 80m
    limits:
      memory: 540Mi
      cpu: 200m

  extraEnvironmentVars:
    GOMEMLIMIT: "460MiB"

  dataStorage:
    size: 2Gi
    storageClass: longhorn
    accessMode: ReadWriteMany
    annotations:
      helm.sh/resource-policy: keep

  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: longhorn
    accessMode: ReadWriteMany
    annotations:
      helm.sh/resource-policy: keep

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        disable_mlock = true

        cache {
          size = "32768"
        }

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "http://openbao-0.openbao-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://openbao-1.openbao-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://openbao-2.openbao-internal:8200"
          }
        }

        service_registration "kubernetes" {}

  securityContext:
    pod:
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - IPC_LOCK

injector:
  resources:
    requests:
      memory: 100Mi
      cpu: 15m
    limits:
      memory: 192Mi
      cpu: 100m

ui:
  enabled: true
