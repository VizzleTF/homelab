# OpenBao (MPL 2.0 fork of HashiCorp Vault): HA, Raft storage, KV v2 mount `home`.

homelab-common:
  # Default-deny ingress: own namespace (raft :8201, autounseal, snapshot and
  # DR-pack jobs), node/gateway traffic, and External Secrets on :8200.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [external-secrets-system]
        ports: [8200]

  # Raft snapshot straight to both S3 targets (backup v2, obsidian/113 Backups/Backup Overview.md):
  # bao writes the snapshot to an emptyDir, rclone copies it to garage and ovh.
  #
  # The snapshot is self-contained: a full copy of the Raft store that
  # `bao operator raft snapshot restore` loads into an empty cluster, so the
  # PVCs need no backup. SA `openbao` is the StatefulSet's own, so the k8s-auth
  # role openbao-snapshot accepts its token without extra bindings.
  workloads:
    - name: raft-snapshot           # -> CronJob openbao-raft-snapshot
      type: cronjob
      schedule: "5 2 * * *"
      job:
        activeDeadlineSeconds: 1800
      pod:
        serviceAccountName: openbao
        automountServiceAccountToken: true   # the snapshot step logs in with the SA token
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: snapshot
            image: quay.io/openbao/openbao:2.7.1
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                export BAO_ADDR=http://openbao.openbao.svc.cluster.local:8200
                JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                BAO_TOKEN=$(bao write -field=token auth/kubernetes/login                           role=openbao-snapshot jwt="$JWT")
                export BAO_TOKEN
                ts=$(date -u +%Y-%m-%dT%H%M)
                bao operator raft snapshot save "/snap/raft-${ts}.snap"
                ls -lh /snap/
                test -s "/snap/raft-${ts}.snap"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: snap
                mountPath: /snap
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
        volumes:
          - name: snap
            emptyDir: {}
      containers:
        - name: upload
          image:
            repository: rclone/rclone
            tag: "1.75.2"
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              for dst in garage:snapshots/openbao ovh:vaka-homelab/snapshots/openbao; do
                echo "=== copy -> $dst"
                rclone copy /snap "$dst" --verbose
                echo "=== prune >90d in $dst"
                rclone delete "$dst" --min-age 90d --verbose
              done
              rclone size garage:snapshots/openbao
          envFrom:
            - secretRef:
                name: snapshots-rclone
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snap
              mountPath: /snap
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

    # Weekly off-site copy of the DR pack (Shamir + raft snapshot + S3/CF creds)
    # to both S3 targets. The local scripts/dr-pack/build.sh still makes the
    # offline copy on the operator's machine; this CronJob covers "the pack on
    # the laptop is stale and the cluster is already gone".
    #
    # Encrypted with its own passphrase (OpenBao shared/dr-pack), NOT the
    # Vaultwarden master password: the pack sits in the same S3 as the backups,
    # and a leaked S3 key must not also open the password store.
    # Keep the passphrase in Vaultwarden as "10 - DR pack passphrase (off-site)".
    - name: dr-pack-offsite         # -> CronJob openbao-dr-pack-offsite
      type: cronjob
      schedule: "40 2 * * 0"
      job:
        activeDeadlineSeconds: 1800
      pod:
        serviceAccountName: openbao-dr-pack
        automountServiceAccountToken: true   # collect uses the SA token for kubectl and the OpenBao login
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          # Collect: kubectl+jq+curl only exist in alpine/k8s, gpg and
          # rclone live in other images, hence three steps.
          - name: collect
            image: alpine/k8s:1.37.1
            command: ["/bin/sh", "-c"]
            env:
              - name: HOME
                value: /work
            envFrom:
              - secretRef:
                  name: snapshots-rclone
              - secretRef:
                  name: dr-pack-restic-key
              - secretRef:
                  name: dr-pack-restic-pw
              - secretRef:
                  name: dr-pack-restic-pw-ovh
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: work
                mountPath: /work
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            args:
              - |
                set -eu
                work=/work/pack
                mkdir -p "$work"
                date -u +%Y-%m-%dT%H%M > /work/ts

                echo "=== 1/3 Shamir bundle + root token ==="
                kubectl -n openbao get secret openbao-keys -o json \
                  | jq '{unseal_keys_b64: [.data["key-0"], .data["key-1"], .data["key-2"]] | map(@base64d),
                         unseal_shares: 3, unseal_threshold: 3}' > "$work/00-shamir.json"
                root=$(kubectl -n openbao get secret openbao-root-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d \
                  || kubectl -n openbao get secret openbao-root-token -o jsonpath='{.data.root_token}' | base64 -d)
                jq --arg rt "$root" '. + {root_token: $rt}' "$work/00-shamir.json" > "$work/00-shamir.json.tmp"
                mv "$work/00-shamir.json.tmp" "$work/00-shamir.json"
                unset root

                echo "=== 2/3 raft snapshot ==="
                # HTTP API, not the bao CLI: this image lacks it, and a
                # fourth image for one command is not worth it.
                BAO_ADDR=http://openbao.openbao.svc.cluster.local:8200
                JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                login=$(printf '{"role":"openbao-snapshot","jwt":"%s"}' "$JWT")
                TOKEN=$(curl -sf -X POST "$BAO_ADDR/v1/auth/kubernetes/login" -d "$login" | jq -r .auth.client_token)
                [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "auth failed"; exit 1; }
                curl -sf -H "X-Vault-Token: $TOKEN" "$BAO_ADDR/v1/sys/storage/raft/snapshot" -o "$work/02-vault-raft-snapshot.snap"
                unset TOKEN login
                test -s "$work/02-vault-raft-snapshot.snap"

                echo "=== 3/3 bootstrap env ==="
                {
                  echo "# generated $(date -u -Iseconds) by dr-pack-offsite CronJob"
                  echo "RESTIC_PASSWORD_GARAGE=$PW_GARAGE"
                  echo "RESTIC_PASSWORD_OVH=$PW_OVH"
                  echo "GARAGE_RESTIC_ACCESS_KEY=$GARAGE_RESTIC_AK"
                  echo "GARAGE_RESTIC_SECRET=$GARAGE_RESTIC_SK"
                  echo "GARAGE_SNAPSHOTS_ACCESS_KEY=$RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID"
                  echo "GARAGE_SNAPSHOTS_SECRET=$RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY"
                  echo "OVH_S3_ACCESS_KEY=$RCLONE_CONFIG_OVH_ACCESS_KEY_ID"
                  echo "OVH_S3_SECRET_KEY=$RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY"
                  cf=$(kubectl -n cert-manager get secret cloudflare-api-token -o jsonpath='{.data.api-token}' 2>/dev/null | base64 -d || true)
                  echo "CF_API_TOKEN=${cf:-MISSING-cloudflare-token}"
                } > "$work/01-bootstrap.env"
                # Same format as scripts/dr-pack/build.sh: DR phases 01/04 read
                # exactly these variables, so the packs are interchangeable.
                {
                  echo "# Refreshed: $(date -u -Iseconds)"
                  echo "GATEWAY_EXTERNAL_IP=$(kubectl -n kube-system get gateway cilium-gateway -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                  echo "GATEWAY_INTERNAL_IP=$(kubectl -n kube-system get gateway cilium-gateway-internal -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                  echo "GATEWAY_TLS_IP=$(kubectl -n kube-system get gateway cilium-gateway-tls -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                } > "$work/03-cluster.env"
                kubectl get nodes -o wide > "$work/04-nodes.txt" 2>/dev/null || true
                echo "collected $(ls -1 "$work" | wc -l) files"
          - name: encrypt
            # The only image in the cluster with gpg: the CNPG postgres base.
            image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
            command: ["/bin/sh", "-c"]
            env:
              - name: HOME
                value: /work
              - name: GNUPGHOME
                value: /work/gnupg
            envFrom:
              - secretRef:
                  name: dr-pack-creds
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: work
                mountPath: /work
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            args:
              - |
                set -eu
                ts=$(cat /work/ts)
                mkdir -p "$GNUPGHOME"
                chmod 700 "$GNUPGHOME"
                tar -C /work/pack -czf /work/dr-pack.tar.gz .
                gpg --batch --yes --pinentry-mode loopback --passphrase "$DR_PACK_PASSPHRASE" --symmetric --cipher-algo AES256 --output "/work/dr-pack-${ts}.tar.gz.gpg" /work/dr-pack.tar.gz
                rm -rf /work/pack /work/dr-pack.tar.gz "$GNUPGHOME"
                stat -c '%s' "/work/dr-pack-${ts}.tar.gz.gpg" > /work/size
                echo "encrypted dr-pack-${ts}.tar.gz.gpg ($(cat /work/size) bytes)"
          - name: upload
            image: rclone/rclone:1.75.2
            command: ["/bin/sh", "-c"]
            env:
              - name: HOME
                value: /work
            envFrom:
              - secretRef:
                  name: snapshots-rclone
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: work
                mountPath: /work
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            args:
              - |
                set -eu
                ts=$(cat /work/ts)
                f="/work/dr-pack-${ts}.tar.gz.gpg"
                for dst in garage:snapshots/dr-pack ovh:vaka-homelab/snapshots/dr-pack; do
                  echo "--- upload -> $dst"
                  rclone copy "$f" "$dst" --verbose
                  # Keep the last 8 weekly copies.
                  n=$(rclone lsf "$dst" | wc -l)
                  if [ "$n" -gt 8 ]; then
                    rclone lsf "$dst" | sort | head -n $((n - 8)) | while IFS= read -r old; do
                      [ -n "$old" ] || continue
                      rclone deletefile "$dst/$old" && echo "pruned $old"
                    done
                  fi
                done
                rm -f "$f"
        volumes:
          - name: work
            emptyDir:
              medium: Memory
              sizeLimit: 512Mi
      containers:
        - name: metrics
          image:
            repository: curlimages/curl
            tag: "8.22.0"
          command: ["/bin/sh", "-c"]
          env:
            - name: VM_URL
              value: http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc:8428
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          args:
            - |
              set -eu
              ts=$(cat /work/ts)
              size=$(cat /work/size)
              printf 'homelab_dr_pack_timestamp %s\nhomelab_dr_pack_bytes %s\n' "$(date -u +%s)" "$size" > /work/metrics.txt
              curl -sf -X POST --data-binary @/work/metrics.txt "$VM_URL/api/v1/import/prometheus" || echo "WARN: metric push failed"
              echo "dr-pack ${ts} uploaded (${size} bytes)"

  externalSecrets:
    # rclone remotes for the raft-snapshot and dr-pack CronJobs: garage = bucket
    # `snapshots` (shared/s3-snapshots), ovh = `vaka-homelab` under snapshots/
    # (velero/s3-ovh, the OVH key that outlived Velero).
    - name: snapshots-rclone
      data:
        - secretKey: garage_ak
          vaultPath: shared/s3-snapshots
          property: ACCESS_KEY_ID
        - secretKey: garage_sk
          vaultPath: shared/s3-snapshots
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_ak
          vaultPath: velero/s3-ovh
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          vaultPath: velero/s3-ovh
          property: ACCESS_SECRET_KEY
      templateData:
        RCLONE_CONFIG_GARAGE_TYPE: "s3"
        RCLONE_CONFIG_GARAGE_PROVIDER: "Other"
        RCLONE_CONFIG_GARAGE_ENDPOINT: "https://s3.example.com"
        RCLONE_CONFIG_GARAGE_REGION: "garage"
        RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .garage_ak }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .garage_sk }}"
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"
    # Creds for the weekly off-site DR pack: the passphrase and the restic-apps
    # bucket key (it goes into 01-bootstrap.env inside the pack).
    - name: dr-pack-creds
      vaultPath: shared/dr-pack
      data:
        - secretKey: passphrase
          property: passphrase
      templateData:
        DR_PACK_PASSPHRASE: "{{ .passphrase }}"
    - name: dr-pack-restic-key
      vaultPath: shared/s3-restic-apps
      data:
        - secretKey: ak
          property: ACCESS_KEY_ID
        - secretKey: sk
          property: ACCESS_SECRET_KEY
      templateData:
        GARAGE_RESTIC_AK: "{{ .ak }}"
        GARAGE_RESTIC_SK: "{{ .sk }}"
    - name: dr-pack-restic-pw
      vaultPath: shared/restic-garage
      data:
        - secretKey: pw
          property: password
      templateData:
        PW_GARAGE: "{{ .pw }}"
    - name: dr-pack-restic-pw-ovh
      vaultPath: shared/restic-ovh
      data:
        - secretKey: pw
          property: password
      templateData:
        PW_OVH: "{{ .pw }}"

  httpRoutes:
    - name: openbao
      hostname: openbao
      gateway: internal
      service:
        name: openbao-active
        port: 8200

  rbac:
    # SA for the weekly off-site DR pack: exactly three Secrets by name, plus
    # nodes and Gateways for the topology snapshot. Writes and deletes nothing.
    - serviceAccount:
        name: openbao-dr-pack
        create: true
      clusterRole:
        name: openbao-dr-pack
        rules:
          - apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["openbao-keys", "openbao-root-token", "cloudflare-api-token"]
            verbs: ["get"]
          - apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get", "list"]
          - apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gateways"]
            verbs: ["get", "list"]

  limitRange:
    enabled: true
    defaults:
      cpu: 250m
      memory: 256Mi

server:
  # RollingUpdate (chart default = OnDelete): image/chart bumps roll the pods
  # without a manual delete. Reverse ordinal, one at a time, waiting for Ready:
  # autounseal unseals a cold pod (~30s) before readiness. The active pod
  # (openbao-0) rolls last.
  updateStrategyType: "RollingUpdate"

  # 200m limit throttled every pod (~25% of CFS periods) — the exec readiness
  # probe `bao status` then blew its 3s timeout, flapping the STS 3/3↔2/3 and the
  # ArgoCD app Progressing↔Healthy.
  resources:
    requests:
      memory: 250Mi
      cpu: 150m
    limits:
      memory: 540Mi
      cpu: 500m

  readinessProbe:
    timeoutSeconds: 5

  extraEnvironmentVars:
    GOMEMLIMIT: "460MiB"

  # RWO: raft already keeps three copies. RWX put every member's boltdb on
  # NFS via a share-manager pod, and all six share-managers sat on one node —
  # one node loss took down all three members at once. Migrated member by
  # member (remove-peer, recreate PVC, retry_join) on 2026-09-24.
  # local-path since 2026-10: Longhorn's two replicas on top of raft's three
  # meant six copies of every write on the SATA SSDs etcd shares. A lost node
  # now means a lost member: remove-peer, delete the PVC, let it rejoin.
  # volumeClaimTemplates are immutable — the STS is deleted with
  # --cascade=orphan before sync (docs/reduce-disk-writes.md).
  dataStorage:
    size: 2Gi
    storageClass: local-path
    annotations:
      helm.sh/resource-policy: keep

  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
    annotations:
      helm.sh/resource-policy: keep

  ha:
    enabled: true
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        disable_mlock = true

        cache {
          size = "32768"
        }

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "http://openbao-0.openbao-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://openbao-1.openbao-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://openbao-2.openbao-internal:8200"
          }
        }

        service_registration "kubernetes" {}

# Agent injector off: no pod carries vault.hashicorp.com/agent-inject — every
# secret comes through ESO. It only added a mutating webhook on all pods and
# an image (hashicorp/vault-k8s 1.7.2) with 3 critical CVEs.
injector:
  enabled: false

ui:
  enabled: true
