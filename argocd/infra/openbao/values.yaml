server:
  # Chart default OnDelete needs a manual pod delete per bump; autounseal
  # unseals each restarted pod before Ready.
  updateStrategyType: "RollingUpdate"

  # A 200m limit throttled the `bao status` readiness probe past its timeout
  # and flapped the STS.
  resources:
    requests:
      memory: 250Mi
      cpu: 150m
    limits:
      memory: 540Mi
      cpu: 500m

  readinessProbe:
    timeoutSeconds: 5

  extraEnvironmentVars:
    GOMEMLIMIT: "460MiB"

  # local-path RWO: raft already keeps three copies (RWX/Longhorn multiplied
  # writes on the SSDs etcd shares). Lost node = lost member: remove-peer,
  # delete the PVC, let it rejoin. volumeClaimTemplates are immutable: delete
  # the STS with --cascade=orphan before a sync that changes them.
  dataStorage:
    size: 2Gi
    storageClass: local-path
    annotations:
      helm.sh/resource-policy: keep

  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
    annotations:
      helm.sh/resource-policy: keep

  ha:
    enabled: true
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        disable_mlock = true

        cache {
          size = "32768"
        }

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "http://openbao-0.openbao-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://openbao-1.openbao-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://openbao-2.openbao-internal:8200"
          }
        }

        service_registration "kubernetes" {}

# Every secret comes through ESO; the injector only adds a mutating webhook on all pods.
injector:
  enabled: false

ui:
  enabled: true

homelab-common:
  # Own namespace (raft, autounseal, backup jobs) is allowed implicitly.
  networkPolicy:
    enabled: true
    # NAS (s3.example.com): raft snapshots and the DR pack.
    lanEgress: [10.11.12.237/32]
    allow:
      - namespaces: [external-secrets-system]
        ports: [8200]

  # The raft snapshot is the whole backup (PVCs need none); restore with
  # `bao operator raft snapshot restore`. SA `openbao` is already bound to
  # k8s-auth role openbao-snapshot.
  workloads:
    - name: raft-snapshot           # -> CronJob openbao-raft-snapshot
      type: cronjob
      schedule: "5 2 * * *"
      job:
        activeDeadlineSeconds: 1800
      pod:
        serviceAccountName: openbao
        automountServiceAccountToken: true   # the snapshot step logs in with the SA token
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: snapshot
            image: quay.io/openbao/openbao:2.7.2
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                export BAO_ADDR=http://openbao.openbao.svc.cluster.local:8200
                JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                BAO_TOKEN=$(bao write -field=token auth/kubernetes/login                           role=openbao-snapshot jwt="$JWT")
                export BAO_TOKEN
                ts=$(date -u +%Y-%m-%dT%H%M)
                bao operator raft snapshot save "/snap/raft-${ts}.snap"
                ls -lh /snap/
                test -s "/snap/raft-${ts}.snap"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: snap
                mountPath: /snap
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
        volumes:
          - name: snap
            emptyDir: {}
      containers:
        - name: upload
          image:
            repository: rclone/rclone
            tag: "1.75.2"
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              for dst in garage:snapshots/openbao ovhcrypt:snapshots/openbao; do
                echo "=== copy -> $dst"
                rclone copy /snap "$dst" --verbose
                echo "=== prune >90d in $dst"
                rclone delete "$dst" --min-age 90d --verbose
              done
              rclone size garage:snapshots/openbao
          envFrom:
            - secretRef:
                name: snapshots-rclone
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snap
              mountPath: /snap
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

    # Off-site DR pack (Shamir + raft snapshot + S3/CF creds); offline twin is
    # scripts/dr-pack/build.sh. Own passphrase (shared/dr-pack), never the
    # Vaultwarden master: a leaked S3 key must not open the password store.
    # Passphrase copy: Vaultwarden "10 - DR pack passphrase (off-site)".
    - name: dr-pack-offsite         # -> CronJob openbao-dr-pack-offsite
      type: cronjob
      schedule: "40 2 * * 0"
      job:
        activeDeadlineSeconds: 1800
      pod:
        serviceAccountName: openbao-dr-pack
        automountServiceAccountToken: true   # collect uses the SA token for kubectl and the OpenBao login
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          # Three steps: no single image has kubectl+jq+curl, gpg and rclone.
          - name: collect
            image: alpine/k8s:1.37.1
            command: ["/bin/sh", "-c"]
            env:
              - name: HOME
                value: /work
            envFrom:
              - secretRef:
                  name: snapshots-rclone
              - secretRef:
                  name: dr-pack-restic-key
              - secretRef:
                  name: dr-pack-restic-pw
              - secretRef:
                  name: dr-pack-restic-pw-ovh
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: work
                mountPath: /work
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            args:
              - |
                set -eu
                work=/work/pack
                mkdir -p "$work"
                date -u +%Y-%m-%dT%H%M > /work/ts

                echo "=== 1/3 Shamir bundle + root token ==="
                kubectl -n openbao get secret openbao-keys -o json \
                  | jq '{unseal_keys_b64: [.data["key-0"], .data["key-1"], .data["key-2"]] | map(@base64d),
                         unseal_shares: 3, unseal_threshold: 3}' > "$work/00-shamir.json"
                root=$(kubectl -n openbao get secret openbao-root-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d \
                  || kubectl -n openbao get secret openbao-root-token -o jsonpath='{.data.root_token}' | base64 -d)
                jq --arg rt "$root" '. + {root_token: $rt}' "$work/00-shamir.json" > "$work/00-shamir.json.tmp"
                mv "$work/00-shamir.json.tmp" "$work/00-shamir.json"
                unset root

                echo "=== 2/3 raft snapshot ==="
                # HTTP API: this image has no bao CLI.
                BAO_ADDR=http://openbao.openbao.svc.cluster.local:8200
                JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                login=$(printf '{"role":"openbao-snapshot","jwt":"%s"}' "$JWT")
                TOKEN=$(curl -sf -X POST "$BAO_ADDR/v1/auth/kubernetes/login" -d "$login" | jq -r .auth.client_token)
                [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "auth failed"; exit 1; }
                curl -sf -H "X-Vault-Token: $TOKEN" "$BAO_ADDR/v1/sys/storage/raft/snapshot" -o "$work/02-vault-raft-snapshot.snap"
                unset TOKEN login
                test -s "$work/02-vault-raft-snapshot.snap"

                echo "=== 3/3 bootstrap env ==="
                {
                  echo "# generated $(date -u -Iseconds) by dr-pack-offsite CronJob"
                  echo "RESTIC_PASSWORD_GARAGE=$PW_GARAGE"
                  echo "RESTIC_PASSWORD_OVH=$PW_OVH"
                  echo "GARAGE_RESTIC_ACCESS_KEY=$GARAGE_RESTIC_AK"
                  echo "GARAGE_RESTIC_SECRET=$GARAGE_RESTIC_SK"
                  echo "GARAGE_SNAPSHOTS_ACCESS_KEY=$RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID"
                  echo "GARAGE_SNAPSHOTS_SECRET=$RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY"
                  echo "OVH_S3_ACCESS_KEY=$RCLONE_CONFIG_OVH_ACCESS_KEY_ID"
                  echo "OVH_S3_SECRET_KEY=$RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY"
                  echo "OVH_CRYPT_PASSWORD=$RCLONE_CONFIG_OVHCRYPT_PASSWORD"
                  echo "OVH_CRYPT_PASSWORD2=$RCLONE_CONFIG_OVHCRYPT_PASSWORD2"
                  cf=$(kubectl -n cert-manager get secret cloudflare-api-token -o jsonpath='{.data.api-token}' 2>/dev/null | base64 -d || true)
                  echo "CF_API_TOKEN=${cf:-MISSING-cloudflare-token}"
                  # Optional (phase 04 skips OpenWrt without it); host and login are in git.
                  ow=$(kubectl -n external-dns-openwrt get secret openwrt-credentials -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)
                  [ -z "$ow" ] || echo "OPENWRT_PASS=$ow"
                } > "$work/01-bootstrap.env"
                # Must match scripts/dr-pack/build.sh: DR phases 01/04 read these vars.
                {
                  echo "# Refreshed: $(date -u -Iseconds)"
                  echo "GATEWAY_EXTERNAL_IP=$(kubectl -n kube-system get gateway cilium-gateway -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                  echo "GATEWAY_INTERNAL_IP=$(kubectl -n kube-system get gateway cilium-gateway -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                  echo "GATEWAY_TLS_IP=$(kubectl -n kube-system get gateway cilium-gateway-tls -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                } > "$work/03-cluster.env"
                kubectl get nodes -o wide > "$work/04-nodes.txt" 2>/dev/null || true
                echo "collected $(ls -1 "$work" | wc -l) files"
          - name: encrypt
            # The only image in the cluster with gpg.
            image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
            command: ["/bin/sh", "-c"]
            env:
              - name: HOME
                value: /work
              - name: GNUPGHOME
                value: /work/gnupg
            envFrom:
              - secretRef:
                  name: dr-pack-creds
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: work
                mountPath: /work
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            args:
              - |
                set -eu
                ts=$(cat /work/ts)
                mkdir -p "$GNUPGHOME"
                chmod 700 "$GNUPGHOME"
                tar -C /work/pack -czf /work/dr-pack.tar.gz .
                gpg --batch --yes --pinentry-mode loopback --passphrase "$DR_PACK_PASSPHRASE" --symmetric --cipher-algo AES256 --output "/work/dr-pack-${ts}.tar.gz.gpg" /work/dr-pack.tar.gz
                rm -rf /work/pack /work/dr-pack.tar.gz "$GNUPGHOME"
                stat -c '%s' "/work/dr-pack-${ts}.tar.gz.gpg" > /work/size
                echo "encrypted dr-pack-${ts}.tar.gz.gpg ($(cat /work/size) bytes)"
          - name: upload
            image: rclone/rclone:1.75.2
            command: ["/bin/sh", "-c"]
            env:
              - name: HOME
                value: /work
            envFrom:
              - secretRef:
                  name: snapshots-rclone
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: work
                mountPath: /work
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
            args:
              - |
                set -eu
                ts=$(cat /work/ts)
                f="/work/dr-pack-${ts}.tar.gz.gpg"
                for dst in garage:snapshots/dr-pack ovh:offsite-homelab/snapshots/dr-pack; do
                  echo "--- upload -> $dst"
                  rclone copy "$f" "$dst" --verbose
                  n=$(rclone lsf "$dst" | wc -l)
                  if [ "$n" -gt 8 ]; then
                    rclone lsf "$dst" | sort | head -n $((n - 8)) | while IFS= read -r old; do
                      [ -n "$old" ] || continue
                      rclone deletefile "$dst/$old" && echo "pruned $old"
                    done
                  fi
                done
                rm -f "$f"
        volumes:
          - name: work
            emptyDir:
              medium: Memory
              sizeLimit: 512Mi
      containers:
        - name: metrics
          image:
            repository: curlimages/curl
            tag: "8.23.0"
          command: ["/bin/sh", "-c"]
          env:
            - name: VM_URL
              value: http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc:8428
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          args:
            - |
              set -eu
              ts=$(cat /work/ts)
              size=$(cat /work/size)
              printf 'homelab_dr_pack_timestamp %s\nhomelab_dr_pack_bytes %s\n' "$(date -u +%s)" "$size" > /work/metrics.txt
              curl -sf -X POST --data-binary @/work/metrics.txt "$VM_URL/api/v1/import/prometheus" || echo "WARN: metric push failed"
              echo "dr-pack ${ts} uploaded (${size} bytes)"

  externalSecrets:
    - name: snapshots-rclone
      data:
        - secretKey: garage_ak
          vaultPath: shared/s3-snapshots
          property: ACCESS_KEY_ID
        - secretKey: garage_sk
          vaultPath: shared/s3-snapshots
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_ak
          vaultPath: shared/s3-ovh
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          vaultPath: shared/s3-ovh
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_crypt_pw
          vaultPath: shared/ovh-crypt
          property: password
        - secretKey: ovh_crypt_pw2
          vaultPath: shared/ovh-crypt
          property: password2
      templateData:
        RCLONE_CONFIG_GARAGE_TYPE: "s3"
        RCLONE_CONFIG_GARAGE_PROVIDER: "Other"
        RCLONE_CONFIG_GARAGE_ENDPOINT: "https://s3.example.com"
        RCLONE_CONFIG_GARAGE_REGION: "garage"
        RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .garage_ak }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .garage_sk }}"
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"
        # Raft snapshots on OVH go through crypt (dr-pack is gpg already). Same
        # remote as tfstate-mirror and the ops node; passwords stored rclone-obscured.
        RCLONE_CONFIG_OVHCRYPT_TYPE: "crypt"
        RCLONE_CONFIG_OVHCRYPT_REMOTE: "ovh:offsite-homelab/crypt"
        RCLONE_CONFIG_OVHCRYPT_FILENAME_ENCRYPTION: "off"
        RCLONE_CONFIG_OVHCRYPT_DIRECTORY_NAME_ENCRYPTION: "false"
        RCLONE_CONFIG_OVHCRYPT_PASSWORD: "{{ .ovh_crypt_pw }}"
        RCLONE_CONFIG_OVHCRYPT_PASSWORD2: "{{ .ovh_crypt_pw2 }}"
    - name: dr-pack-creds
      vaultPath: shared/dr-pack
      data:
        - secretKey: passphrase
          property: passphrase
      templateData:
        DR_PACK_PASSPHRASE: "{{ .passphrase }}"
    - name: dr-pack-restic-key
      vaultPath: shared/s3-restic-apps
      data:
        - secretKey: ak
          property: ACCESS_KEY_ID
        - secretKey: sk
          property: ACCESS_SECRET_KEY
      templateData:
        GARAGE_RESTIC_AK: "{{ .ak }}"
        GARAGE_RESTIC_SK: "{{ .sk }}"
    - name: dr-pack-restic-pw
      vaultPath: shared/restic-garage
      data:
        - secretKey: pw
          property: password
      templateData:
        PW_GARAGE: "{{ .pw }}"
    - name: dr-pack-restic-pw-ovh
      vaultPath: shared/restic-ovh
      data:
        - secretKey: pw
          property: password
      templateData:
        PW_OVH: "{{ .pw }}"

  httpRoutes:
    - name: openbao
      hostname: openbao
      gateway: internal
      service:
        name: openbao-active
        port: 8200

  rbac:
    # Read-only on purpose: the pack needs only these Secrets.
    - serviceAccount:
        name: openbao-dr-pack
        create: true
      clusterRole:
        name: openbao-dr-pack
        rules:
          - apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["openbao-keys", "openbao-root-token", "cloudflare-api-token", "openwrt-credentials"]
            verbs: ["get"]
          - apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get", "list"]
          - apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gateways"]
            verbs: ["get", "list"]

  limitRange:
    enabled: true
    defaults:
      cpu: 250m
      memory: 256Mi
