# OpenBao - Apache 2.0 fork of HashiCorp Vault
# HA deployment with Raft storage, parallel to Vault during migration

homelab-common:

  # Raft-снапшот в обе S3-цели напрямую (backup v2, см. docs/backup-v2.md).
  # Раньше снапшот снимал Velero pre-hook, а сам файл вывозился вместе с PVC
  # data-openbao-0 двумя Schedule'ами. Здесь всё в одном месте: bao пишет
  # снапшот в emptyDir, rclone раскладывает по garage и ovh.
  #
  # Снапшот самодостаточен — это полный слепок Raft-стора, восстанавливаемый
  # `bao operator raft snapshot restore` в пустой кластер. PVC бэкапить не нужно.
  # SA `openbao` — под ним же работает StatefulSet, поэтому k8s-auth роль
  # openbao-snapshot принимает его токен без дополнительных привязок.
  cronJobs:
    - name: openbao-raft-snapshot
      spec:
        schedule: "5 2 * * *"
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 600
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 1800
            template:
              spec:
                restartPolicy: OnFailure
                serviceAccountName: openbao
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  runAsGroup: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                initContainers:
                  - name: snapshot
                    # renovate: image=quay.io/openbao/openbao
                    image: quay.io/openbao/openbao:2.6.2
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -eu
                        export BAO_ADDR=http://openbao.openbao.svc.cluster.local:8200
                        JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                        BAO_TOKEN=$(bao write -field=token auth/kubernetes/login                           role=openbao-snapshot jwt="$JWT")
                        export BAO_TOKEN
                        ts=$(date -u +%Y-%m-%dT%H%M)
                        bao operator raft snapshot save "/snap/raft-${ts}.snap"
                        ls -lh /snap/
                        test -s "/snap/raft-${ts}.snap"
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: snap
                        mountPath: /snap
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                containers:
                  - name: upload
                    # renovate: image=rclone/rclone
                    image: rclone/rclone:1.75
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -eu
                        for dst in garage:snapshots/openbao ovh:vaka-homelab/snapshots/openbao; do
                          echo "=== copy -> $dst"
                          rclone copy /snap "$dst" --verbose
                          echo "=== prune >90d in $dst"
                          rclone delete "$dst" --min-age 90d --verbose
                        done
                        rclone size garage:snapshots/openbao
                    envFrom:
                      - secretRef:
                          name: snapshots-rclone
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: snap
                        mountPath: /snap
                        readOnly: true
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                volumes:
                  - name: snap
                    emptyDir: {}

    # Недельная off-site копия DR-пакета (Shamir + raft snapshot + креды S3/CF)
    # в оба S3. Локальный scripts/dr-pack/build.sh никуда не девается — он
    # делает офлайн-копию на машине оператора; этот CronJob страхует случай
    # «пакет на ноутбуке протух, а кластера уже нет».
    #
    # Шифруется отдельной фразой (Vault shared/dr-pack), а НЕ мастер-паролем
    # Vaultwarden: пакет лежит в том же S3, что и бэкапы, и компрометация
    # S3-ключа не должна давать ещё и доступ к хранилищу паролей.
    # Фразу держать в Vaultwarden записью "10 - DR pack passphrase (off-site)".
    - name: dr-pack-offsite
      spec:
        schedule: "40 2 * * 0"
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 600
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            backoffLimit: 2
            activeDeadlineSeconds: 1800
            template:
              spec:
                restartPolicy: OnFailure
                serviceAccountName: openbao-dr-pack
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  fsGroup: 65532
                  seccompProfile:
                    type: RuntimeDefault
                initContainers:
                  # Сбор материала: kubectl+jq+curl есть только в alpine/k8s,
                  # gpg и rclone — в других образах, отсюда три шага.
                  - name: collect
                    # renovate: image=alpine/k8s
                    image: alpine/k8s:1.37.0
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/sh", "-c"]
                    env:
                      - name: HOME
                        value: /work
                    envFrom:
                      - secretRef:
                          name: snapshots-rclone
                      - secretRef:
                          name: dr-pack-restic-key
                      - secretRef:
                          name: dr-pack-restic-pw
                      - secretRef:
                          name: dr-pack-restic-pw-ovh
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: work
                        mountPath: /work
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: "1"
                        memory: 512Mi
                    args:
                      - |
                        set -eu
                        work=/work/pack
                        mkdir -p "$work"
                        date -u +%Y-%m-%dT%H%M > /work/ts

                        echo "=== 1/3 Shamir bundle + root token ==="
                        kubectl -n openbao get secret openbao-keys -o json \
                          | jq '{unseal_keys_b64: [.data["key-0"], .data["key-1"], .data["key-2"]] | map(@base64d),
                                 unseal_shares: 3, unseal_threshold: 3}' > "$work/00-shamir.json"
                        root=$(kubectl -n openbao get secret openbao-root-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d \
                          || kubectl -n openbao get secret openbao-root-token -o jsonpath='{.data.root_token}' | base64 -d)
                        jq --arg rt "$root" '. + {root_token: $rt}' "$work/00-shamir.json" > "$work/00-shamir.json.tmp"
                        mv "$work/00-shamir.json.tmp" "$work/00-shamir.json"
                        unset root

                        echo "=== 2/3 raft snapshot ==="
                        # HTTP API, а не bao CLI: в этом образе его нет,
                        # а тащить четвёртый образ ради одной команды незачем.
                        BAO_ADDR=http://openbao.openbao.svc.cluster.local:8200
                        JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                        login=$(printf '{"role":"openbao-snapshot","jwt":"%s"}' "$JWT")
                        TOKEN=$(curl -sf -X POST "$BAO_ADDR/v1/auth/kubernetes/login" -d "$login" | jq -r .auth.client_token)
                        [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "auth failed"; exit 1; }
                        curl -sf -H "X-Vault-Token: $TOKEN" "$BAO_ADDR/v1/sys/storage/raft/snapshot" -o "$work/02-vault-raft-snapshot.snap"
                        unset TOKEN login
                        test -s "$work/02-vault-raft-snapshot.snap"

                        echo "=== 3/3 bootstrap env ==="
                        {
                          echo "# generated $(date -u -Iseconds) by dr-pack-offsite CronJob"
                          echo "RESTIC_PASSWORD_GARAGE=$PW_GARAGE"
                          echo "RESTIC_PASSWORD_OVH=$PW_OVH"
                          echo "GARAGE_RESTIC_ACCESS_KEY=$GARAGE_RESTIC_AK"
                          echo "GARAGE_RESTIC_SECRET=$GARAGE_RESTIC_SK"
                          echo "GARAGE_SNAPSHOTS_ACCESS_KEY=$RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID"
                          echo "GARAGE_SNAPSHOTS_SECRET=$RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY"
                          echo "OVH_S3_ACCESS_KEY=$RCLONE_CONFIG_OVH_ACCESS_KEY_ID"
                          echo "OVH_S3_SECRET_KEY=$RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY"
                          cf=$(kubectl -n cert-manager get secret cloudflare-api-token -o jsonpath='{.data.api-token}' 2>/dev/null | base64 -d || true)
                          echo "CF_API_TOKEN=${cf:-MISSING-cloudflare-token}"
                        } > "$work/01-bootstrap.env"
                        # Тот же формат, что у scripts/dr-pack/build.sh — фазы 01/04 читают
                        # именно эти переменные, пакеты взаимозаменяемы.
                        {
                          echo "# Refreshed: $(date -u -Iseconds)"
                          echo "GATEWAY_EXTERNAL_IP=$(kubectl -n kube-system get gateway cilium-gateway -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                          echo "GATEWAY_INTERNAL_IP=$(kubectl -n kube-system get gateway cilium-gateway-internal -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                          echo "GATEWAY_TLS_IP=$(kubectl -n kube-system get gateway cilium-gateway-tls -o jsonpath='{.spec.addresses[0].value}' 2>/dev/null)"
                        } > "$work/03-cluster.env"
                        kubectl get nodes -o wide > "$work/04-nodes.txt" 2>/dev/null || true
                        echo "collected $(ls -1 "$work" | wc -l) files"
                  - name: encrypt
                    # Единственный образ в кластере с gpg — postgres-бейз от CNPG.
                    # renovate: image=ghcr.io/cloudnative-pg/postgresql
                    image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/sh", "-c"]
                    env:
                      - name: HOME
                        value: /work
                      - name: GNUPGHOME
                        value: /work/gnupg
                    envFrom:
                      - secretRef:
                          name: dr-pack-creds
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: work
                        mountPath: /work
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: "1"
                        memory: 512Mi
                    args:
                      - |
                        set -eu
                        ts=$(cat /work/ts)
                        mkdir -p "$GNUPGHOME"
                        chmod 700 "$GNUPGHOME"
                        tar -C /work/pack -czf /work/dr-pack.tar.gz .
                        gpg --batch --yes --pinentry-mode loopback --passphrase "$DR_PACK_PASSPHRASE" --symmetric --cipher-algo AES256 --output "/work/dr-pack-${ts}.tar.gz.gpg" /work/dr-pack.tar.gz
                        rm -rf /work/pack /work/dr-pack.tar.gz "$GNUPGHOME"
                        stat -c '%s' "/work/dr-pack-${ts}.tar.gz.gpg" > /work/size
                        echo "encrypted dr-pack-${ts}.tar.gz.gpg ($(cat /work/size) bytes)"
                  - name: upload
                    # renovate: image=rclone/rclone
                    image: rclone/rclone:1.75
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/sh", "-c"]
                    env:
                      - name: HOME
                        value: /work
                    envFrom:
                      - secretRef:
                          name: snapshots-rclone
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: work
                        mountPath: /work
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: "1"
                        memory: 512Mi
                    args:
                      - |
                        set -eu
                        ts=$(cat /work/ts)
                        f="/work/dr-pack-${ts}.tar.gz.gpg"
                        for dst in garage:snapshots/dr-pack ovh:vaka-homelab/snapshots/dr-pack; do
                          echo "--- upload -> $dst"
                          rclone copy "$f" "$dst" --verbose
                          # Держим 8 последних недельных копий.
                          n=$(rclone lsf "$dst" | wc -l)
                          if [ "$n" -gt 8 ]; then
                            rclone lsf "$dst" | sort | head -n $((n - 8)) | while IFS= read -r old; do
                              [ -n "$old" ] || continue
                              rclone deletefile "$dst/$old" && echo "pruned $old"
                            done
                          fi
                        done
                        rm -f "$f"
                containers:
                  - name: metrics
                    # renovate: image=curlimages/curl
                    image: curlimages/curl:8.22.0
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/sh", "-c"]
                    env:
                      - name: VM_URL
                        value: http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc:8428
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: work
                        mountPath: /work
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi
                    args:
                      - |
                        set -eu
                        ts=$(cat /work/ts)
                        size=$(cat /work/size)
                        printf 'homelab_dr_pack_timestamp %s\nhomelab_dr_pack_bytes %s\n' "$(date -u +%s)" "$size" > /work/metrics.txt
                        curl -sf -X POST --data-binary @/work/metrics.txt "$VM_URL/api/v1/import/prometheus" || echo "WARN: metric push failed"
                        echo "dr-pack ${ts} uploaded (${size} bytes)"

                volumes:
                  - name: work
                    emptyDir:
                      medium: Memory
                      sizeLimit: 512Mi

  externalSecrets:
    # Креды для недельного off-site DR-пакета: фраза шифрования и ключ бакета
    # restic-apps (он попадает в 01-bootstrap.env внутри пакета).
    - name: dr-pack-creds
      vaultPath: shared/dr-pack
      data:
        - secretKey: passphrase
          property: passphrase
      templateData:
        DR_PACK_PASSPHRASE: "{{ .passphrase }}"
    - name: dr-pack-restic-key
      vaultPath: shared/s3-restic-apps
      data:
        - secretKey: ak
          property: ACCESS_KEY_ID
        - secretKey: sk
          property: ACCESS_SECRET_KEY
      templateData:
        GARAGE_RESTIC_AK: "{{ .ak }}"
        GARAGE_RESTIC_SK: "{{ .sk }}"
    - name: dr-pack-restic-pw
      vaultPath: shared/restic-garage
      data:
        - secretKey: pw
          property: password
      templateData:
        PW_GARAGE: "{{ .pw }}"
    - name: dr-pack-restic-pw-ovh
      vaultPath: shared/restic-ovh
      data:
        - secretKey: pw
          property: password
      templateData:
        PW_OVH: "{{ .pw }}"
    - name: openbao-approle-credentials
      vaultPath: vault/approle
      targetName: openbao-snapshot-agent-token
      deletionPolicy: Retain
      templateEngineVersion: v2
      data:
        - secretKey: role_id
          property: role_id
        - secretKey: secret_id
          property: secret_id
      templateData:
        role-id: "{{ .role_id }}"
        secret-id: "{{ .secret_id }}"

  httpRoutes:
    - name: openbao
      hostname: openbao
      gateway: internal
      service:
        name: openbao-active
        port: 8200

  rbac:
    # SA для недельного off-site DR-пакета: ровно три секрета по именам,
    # ноды и Gateway'и для снимка топологии. Ничего не пишет и не удаляет.
    - serviceAccount:
        name: openbao-dr-pack
        create: true
      clusterRole:
        name: openbao-dr-pack
        rules:
          - apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["openbao-keys", "openbao-root-token", "cloudflare-api-token"]
            verbs: ["get"]
          - apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get", "list"]
          - apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gateways"]
            verbs: ["get", "list"]

    - serviceAccount:
        name: openbao
        create: false
      clusterRole:
        name: openbao-server
        rules:
          - apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch"]

    - serviceAccount:
        name: openbao-auth
        create: true
        automountServiceAccountToken: true
      clusterRole:
        name: openbao-auth-delegator
        rules:
          - apiGroups: [""]
            resources: ["serviceaccounts/token"]
            verbs: ["create"]
          - apiGroups: [""]
            resources: ["serviceaccounts"]
            verbs: ["get"]
          - apiGroups: ["authentication.k8s.io"]
            resources: ["tokenreviews"]
            verbs: ["create"]
          - apiGroups: ["authorization.k8s.io"]
            resources: ["subjectaccessreviews"]
            verbs: ["create"]
      clusterRoleBinding:
        name: openbao-auth-delegator-openbao

  limitRange:
    enabled: true
    name: default-limits
    defaults:
      cpu: 250m
      memory: 256Mi
    defaultRequests:
      cpu: 50m
      memory: 64Mi

server:
  # RollingUpdate (chart default = OnDelete): auto-roll pods on image/chart bumps
  # без ручного delete. Reverse-ordinal по одному, ждёт Ready между подами —
  # autounseal расшиливает холодный pod (~30s) до readiness. active (openbao-0)
  # катится последним. См. memory reference-openbao-autounseal-broken-full-reboot.
  updateStrategyType: "RollingUpdate"

  resources:
    requests:
      memory: 250Mi
      cpu: 80m
    limits:
      memory: 540Mi
      cpu: 200m

  extraEnvironmentVars:
    GOMEMLIMIT: "460MiB"

  dataStorage:
    size: 2Gi
    storageClass: longhorn
    accessMode: ReadWriteMany
    annotations:
      helm.sh/resource-policy: keep

  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: longhorn
    accessMode: ReadWriteMany
    annotations:
      helm.sh/resource-policy: keep

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        disable_mlock = true

        cache {
          size = "32768"
        }

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"

          retry_join {
            leader_api_addr = "http://openbao-0.openbao-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://openbao-1.openbao-internal:8200"
          }

          retry_join {
            leader_api_addr = "http://openbao-2.openbao-internal:8200"
          }
        }

        service_registration "kubernetes" {}

  securityContext:
    pod:
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - IPC_LOCK

injector:
  resources:
    requests:
      memory: 100Mi
      cpu: 15m
    limits:
      memory: 192Mi
      cpu: 100m

ui:
  enabled: true
