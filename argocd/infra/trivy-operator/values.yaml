# CVE visibility for everything running in the cluster.
#
# Renovate keeps chart and image versions moving, but that is not the same
# thing: it does not know whether the image running right now carries a
# critical CVE. With ~57 applications deployed, nothing looked at that at all.
#
# Reports land as CRDs (VulnerabilityReport per workload) and as metrics, so
# alerting can hang off them later without another UI to log into.

operator:
  # One scan at a time. The default is 10, and the scan jobs are what make this
  # operator infamous for memory spikes — on a cluster whose control-plane
  # nodes already sit near their CPU ceiling, parallel scans are a bad trade.
  scanJobsConcurrentLimit: 1
  scanJobTimeout: 10m

  # SBOM generation doubles the work and the stored objects, and nothing here
  # consumes an SBOM today.
  sbomGenerationEnabled: false

  # Per-finding metrics are the point: they let vmalert fire on new criticals.
  metricsFindingsEnabled: true

  # Cluster compliance (CIS/NSA/PSS) consumes node-collector output, which this
  # cluster cannot produce (see nodeCollector.excludeNodes below). All four
  # ClusterComplianceReports sat with an empty status the whole time, so this
  # only stops a scanner that never returned a result.
  clusterComplianceEnabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

trivy:
  # Only what can actually be acted on: unfixed CVEs are noise in a homelab —
  # there is no patch to apply, and they would drown the fixable ones.
  ignoreUnfixed: true
  severity: HIGH,CRITICAL
  timeout: "10m0s"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Scraping goes through VMServiceScrape (VictoriaMetrics operator), not the
# prometheus-operator ServiceMonitor CRD — that CRD is not installed here.
serviceMonitor:
  enabled: false

nodeCollector:
  # Node scanning is switched off by excluding every node, because it cannot
  # work on Talos at all. The collector mounts host paths — /etc/systemd,
  # /lib/systemd, /etc/kubernetes, /var/lib/{etcd,kubelet,kube-scheduler,
  # kube-controller-manager} — to read node configuration for the CIS checks.
  # Talos is immutable and has no systemd, so the job never starts:
  #
  #   failed to apply OCI options: failed to mkdir "/etc/systemd":
  #   mkdir /etc/systemd: read-only file system
  #
  # It retried per node and left pods in CreateContainerError, which is what
  # KubeContainerWaiting fired on. Disabling clusterCompliance alone did not
  # stop it: the jobs are labelled trivy-operator.resource.kind=Node and are
  # driven by the node side of the infra-assessment scanner, not by compliance.
  #
  # Excluding by kubernetes.io/os=linux covers all four nodes today and any node
  # added later — the whole cluster is Talos, so none of them can ever run it.
  # Pod-level InfraAssessmentReports are unaffected: they read control-plane pod
  # specs rather than the host, and keep being produced.
  excludeNodes: kubernetes.io/os=linux
