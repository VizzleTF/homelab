# Off-site copy of the Terraform state: Garage → OVH.
#
# Used to be a side CronJob of the velero component (ns velero) although it has
# nothing to do with Velero; moved into its own component when Velero was
# retired (obsidian/113 Backups/Backup Overview.md) so it would not leave with it.
#
# The Vault path `velero/s3-ovh` is kept as is: it is the OVH key that outlived
# Velero; renaming the path would need a matching change in cnpg and the
# snapshot CronJobs.
homelab-common:
  # Default-deny ingress; only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]

  externalSecrets:
    - name: tfstate-mirror-rclone-env
      data:
        - secretKey: garage_tfstate_ak
          vaultPath: terraform/s3-terraform-state
          property: ACCESS_KEY_ID
        - secretKey: garage_tfstate_sk
          vaultPath: terraform/s3-terraform-state
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_ak
          vaultPath: velero/s3-ovh
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          vaultPath: velero/s3-ovh
          property: ACCESS_SECRET_KEY
      templateData:
        RCLONE_CONFIG_GARAGE_TFSTATE_TYPE: "s3"
        RCLONE_CONFIG_GARAGE_TFSTATE_PROVIDER: "Other"
        RCLONE_CONFIG_GARAGE_TFSTATE_ENDPOINT: "https://s3.example.com"
        RCLONE_CONFIG_GARAGE_TFSTATE_REGION: "garage"
        RCLONE_CONFIG_GARAGE_TFSTATE_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_GARAGE_TFSTATE_ACCESS_KEY_ID: "{{ .garage_tfstate_ak }}"
        RCLONE_CONFIG_GARAGE_TFSTATE_SECRET_ACCESS_KEY: "{{ .garage_tfstate_sk }}"
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"

  workloads:
    # Daily off-site copy of the Garage bucket terraform-state → OVH
    # offsite-homelab/terraform-state. The state changes rarely (manual terraform
    # apply); the copy gives DR outside the Synology.
    #
    # rclone COPY, not sync: a source-side delete does not reach OVH. tfstate is
    # a single file overwritten in place, so protection from a corrupt overwrite
    # is VERSIONING on the OVH bucket offsite-homelab (enabled + noncurrent-expire
    # 30d, 2026-05-29). Garage has no versioning (PutBucketVersioning is
    # Unimplemented in Garage 2.x), so the source is unversioned, which is fine.
    - name: ovh-mirror
      fullnameOverride: tfstate-bucket-mirror-ovh  # live name, kept
      type: cronjob
      schedule: "0 8 * * *"                       # 08:00 UTC
      job:
        activeDeadlineSeconds: 600
      containers:
        - name: rclone
          image:
            repository: rclone/rclone
            tag: "1.75"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[$(date -u)] starting rclone copy garage_tfstate:terraform-state -> ovh:offsite-homelab/terraform-state/"
              rclone copy \
                --s3-acl=private \
                --transfers=2 \
                --checkers=4 \
                --stats=1m \
                --stats-one-line \
                garage_tfstate:terraform-state ovh:offsite-homelab/terraform-state/
              echo "[$(date -u)] copy complete"
          envFrom:
            - secretRef:
                name: tfstate-mirror-rclone-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
