homelab-common:
  # No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true
    # NAS (s3.example.com): tfstate bucket.
    lanEgress: [10.11.12.237/32]

  externalSecrets:
    - name: tfstate-mirror-rclone-env
      data:
        - secretKey: garage_tfstate_ak
          vaultPath: tfstate-mirror/s3-terraform-state
          property: ACCESS_KEY_ID
        - secretKey: garage_tfstate_sk
          vaultPath: tfstate-mirror/s3-terraform-state
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_ak
          vaultPath: shared/s3-ovh
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          vaultPath: shared/s3-ovh
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_crypt_pw
          vaultPath: shared/ovh-crypt
          property: password
        - secretKey: ovh_crypt_pw2
          vaultPath: shared/ovh-crypt
          property: password2
      templateData:
        RCLONE_CONFIG_GARAGE_TFSTATE_TYPE: "s3"
        RCLONE_CONFIG_GARAGE_TFSTATE_PROVIDER: "Other"
        RCLONE_CONFIG_GARAGE_TFSTATE_ENDPOINT: "https://s3.example.com"
        RCLONE_CONFIG_GARAGE_TFSTATE_REGION: "garage"
        RCLONE_CONFIG_GARAGE_TFSTATE_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_GARAGE_TFSTATE_ACCESS_KEY_ID: "{{ .garage_tfstate_ak }}"
        RCLONE_CONFIG_GARAGE_TFSTATE_SECRET_ACCESS_KEY: "{{ .garage_tfstate_sk }}"
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"
        # Off-site copies are encrypted; same remote as openbao and the ops node.
        # Passwords are stored rclone-obscured. Names stay plain (state keys only).
        RCLONE_CONFIG_OVHCRYPT_TYPE: "crypt"
        RCLONE_CONFIG_OVHCRYPT_REMOTE: "ovh:offsite-homelab/crypt"
        RCLONE_CONFIG_OVHCRYPT_FILENAME_ENCRYPTION: "off"
        RCLONE_CONFIG_OVHCRYPT_DIRECTORY_NAME_ENCRYPTION: "false"
        RCLONE_CONFIG_OVHCRYPT_PASSWORD: "{{ .ovh_crypt_pw }}"
        RCLONE_CONFIG_OVHCRYPT_PASSWORD2: "{{ .ovh_crypt_pw2 }}"

  workloads:
    # rclone copy, not sync: source deletes must not reach OVH. Corrupt
    # overwrites are covered by versioning on OVH bucket offsite-homelab (Garage has none).
    - name: ovh-mirror
      fullnameOverride: tfstate-bucket-mirror-ovh  # live name, kept
      type: cronjob
      schedule: "0 8 * * *"                       # 08:00 UTC
      job:
        activeDeadlineSeconds: 600
      containers:
        - name: rclone
          image:
            repository: rclone/rclone
            tag: "1.75.2"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[$(date -u)] starting rclone copy garage_tfstate:terraform-state -> ovhcrypt:terraform-state/"
              rclone copy \
                --s3-acl=private \
                --transfers=2 \
                --checkers=4 \
                --stats=1m \
                --stats-one-line \
                garage_tfstate:terraform-state ovhcrypt:terraform-state/
              echo "[$(date -u)] copy complete"
          envFrom:
            - secretRef:
                name: tfstate-mirror-rclone-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
