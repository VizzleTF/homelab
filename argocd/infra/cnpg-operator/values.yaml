resources:
  limits:
    cpu: 100m
    memory: 160Mi
  requests:
    cpu: 15m
    memory: 64Mi

additionalEnv:
  - name: GOMEMLIMIT
    value: "135MiB"

config:
  # Two shared clusters do not need the default 10.
  maxConcurrentReconciles: 5

serviceAccount:
  name: cnpg-manager

# Webhooks use failurePolicy Fail: an operator outage blocks every Cluster change,
# so two replicas on different nodes.
replicaCount: 2
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
            app.kubernetes.io/instance: cnpg-operator

homelab-common:
  # Covers cnpg-barman-plugin too (shared namespace). No VMServiceScrape here, so no victoria-metrics allow.
  networkPolicy:
    enabled: true
