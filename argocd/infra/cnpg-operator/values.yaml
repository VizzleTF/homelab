# CloudNativePG operator. Only non-default values.

resources:
  limits:
    cpu: 100m
    memory: 160Mi
  requests:
    cpu: 15m
    memory: 64Mi

additionalEnv:
  - name: GOMEMLIMIT
    value: "135MiB"

config:
  # Default 10; two shared clusters do not need more.
  maxConcurrentReconciles: 5

serviceAccount:
  name: cnpg-manager

# Two replicas for the webhooks (failurePolicy Fail blocks every Cluster
# change while the operator is down), on different nodes: without the
# anti-affinity both could land on one node and the second replica bought
# nothing.
replicaCount: 2
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
            app.kubernetes.io/instance: cnpg-operator

homelab-common:
  # Default-deny ingress for the whole namespace (also covers the sibling app
  # sharing it); only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]
