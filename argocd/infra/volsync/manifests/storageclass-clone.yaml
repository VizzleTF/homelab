# Временные клоны VolSync (`copyMethod: Snapshot`). Одна реплика: с двумя клон
# резервировал 2x места, opencloud-data не влез и ушёл в faulted (2026-09-11).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-volsync-clone
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  dataLocality: best-effort
