# The chart ships ClusterRole volsync-metrics-reader (nonResourceURL /metrics)
# without a binding; this grants it to vmagent for vmservicescrape.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volsync-metrics-reader-vmagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volsync-metrics-reader
subjects:
  - kind: ServiceAccount
    name: vmagent-victoria-metrics-k8s-stack
    namespace: victoria-metrics
