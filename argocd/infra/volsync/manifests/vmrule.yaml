# role="source" отсекает ReplicationDestination: они простаивают до ручного триггера.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: volsync
  namespace: victoria-metrics
spec:
  groups:
    - name: volsync
      rules:
        - alert: VolsyncControllerDown
          expr: absent(up{job=~".*volsync.*"}) == 1 or up{job=~".*volsync.*"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "VolSync scrape target down"
            description: |
              Метрики VolSync недоступны >30 минут — состояние бэкапов вслепую.
              kubectl -n volsync-system get pods
              kubectl -n volsync-system logs deploy/volsync

        - alert: VolsyncBackupOutOfSync
          expr: volsync_volume_out_of_sync{role="source"} == 1
          for: 3h
          labels:
            severity: critical
          annotations:
            summary: "VolSync {{ $labels.obj_namespace }}/{{ $labels.obj_name }} не укладывается в расписание"
            description: |
              Том не синхронизирован дольше собственного интервала — бэкап
              отстаёт или падает.
              kubectl -n {{ $labels.obj_namespace }} describe replicationsource {{ $labels.obj_name }}
              kubectl -n {{ $labels.obj_namespace }} logs -l volsync.backube/owned-by --tail=50

        - alert: VolsyncMissedIntervals
          expr: increase(volsync_missed_intervals_total{role="source"}[24h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "VolSync {{ $labels.obj_namespace }}/{{ $labels.obj_name }} пропустил интервал"
            description: |
              Прогон не начался вовремя (предыдущий ещё шёл или mover не стартовал).
              Единичный пропуск на крупном томе — норма, регулярные — повод поднять
              расписание или разнести слоты.

        # Не добавлять increase(volsync_sync_duration_seconds_count[36h]) == 0: счётчик
        # обнуляется при рестарте контроллера -> ложный critical (2026-09-10).
        # Staleness уже покрыт volsync_volume_out_of_sync.
        - alert: VolsyncSourcesMissing
          expr: absent(volsync_volume_out_of_sync{role="source"}) == 1
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "ReplicationSource'ы исчезли из метрик"
            description: |
              Ни одного источника VolSync в метриках >30 минут: либо снесены
              объекты, либо сломан скрейп. В обоих случаях бэкапов нет, а
              VolsyncBackupOutOfSync промолчит — ему не на чем сработать.
              kubectl get replicationsource -A
              kubectl -n victoria-metrics get vmservicescrape volsync
