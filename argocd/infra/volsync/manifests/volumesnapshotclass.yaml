# VolumeSnapshotClass for VolSync (`copyMethod: Snapshot`).
#
# deletionPolicy Delete: VolSync deletes its VolumeSnapshot after every run and
# expects the Longhorn snapshot to go with it; Retain would leave one snapshot
# per PVC per run.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn-volsync
driver: driver.longhorn.io
deletionPolicy: Delete
parameters:
  type: snap
