# VolSync metrics sit behind kube-rbac-proxy (Service volsync-metrics, port
# https/8443), so `insecureSkipVerify` alone is not enough: vmagent sends its SA
# token, authorized by clusterrolebinding-metrics-reader.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: volsync
  namespace: victoria-metrics
spec:
  namespaceSelector:
    matchNames:
      - volsync-system
  selector:
    matchLabels:
      app.kubernetes.io/name: volsync
      app.kubernetes.io/instance: volsync
  endpoints:
    - port: https
      path: /metrics
      scheme: https
      interval: 30s
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
