# VolSync — асинхронная репликация PV. Основа backup-схемы v2 (см. docs/backup-v2.md):
# на каждый PVC два ReplicationSource (restic → Garage, restic → OVH), а
# восстановление — ручной ReplicationDestination (scripts/dr/restore-app.sh).
#
# Wave -3: после csi-snapshotter (-4, ставит snapshot.storage.k8s.io CRD) и
# Longhorn, до приложений — их ReplicationSource'ы ссылаются на CRD VolSync.

# CRD (ReplicationSource/Destination) ставит сам чарт.
manageCRDs: true

replicaCount: 1

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  # kube-rbac-proxy перед /metrics. VMAgent ходит с SA-токеном — оставляем auth.
  disableAuth: false

homelab-common:
  limitRange:
    enabled: true
    defaultRequests:
      cpu: 20m
      memory: 64Mi
