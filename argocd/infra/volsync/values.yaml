# Backup v2: obsidian/113 Backups/Backup Overview.md; restore: scripts/dr/restore-app.sh.
# Wave -3: after snapshot-controller CRDs (-4), before apps that use ReplicationSources.

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  # kube-rbac-proxy in front of /metrics; vmagent scrapes with its SA token.
  disableAuth: false  # pinned: keep auth on if the default flips

homelab-common:
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]

  limitRange:
    enabled: true
    defaultRequests:
      cpu: 20m
      memory: 64Mi
