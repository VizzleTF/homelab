# VolSync: asynchronous PV replication. The base of backup scheme v2 (see obsidian/113 Backups/Backup Overview.md):
# every PVC gets two ReplicationSources (restic → Garage, restic → OVH), and a
# restore is a manual ReplicationDestination (scripts/dr/restore-app.sh).
#
# Wave -3: after csi-snapshotter (-4, installs the snapshot.storage.k8s.io CRDs) and
# Longhorn, before the apps, whose ReplicationSources reference the VolSync CRDs.

resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  # kube-rbac-proxy in front of /metrics; vmagent scrapes with its SA token.
  disableAuth: false  # pinned: keep auth on if the default flips

homelab-common:
  # Default-deny ingress; only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]

  limitRange:
    enabled: true
    defaultRequests:
      cpu: 20m
      memory: 64Mi
