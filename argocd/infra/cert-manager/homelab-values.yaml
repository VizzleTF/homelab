# Kept apart from values.yaml: the chart has a strict values schema.
homelab-common:
  # No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true

  externalSecrets:
    # Name/key fixed: ClusterIssuer, DR phase 03 and the dr-pack read cloudflare-api-token/api-token.
    - name: cloudflare-api-token
      vaultPath: external-dns/cloudflare
      data:
        - secretKey: api-token
          property: cloudflare_api_token

  certificates:
    - name: wildcard-tls
      namespace: kube-system
      secretName: wildcard-tls
      issuerRef:
        name: cloudflare-issuer
        kind: ClusterIssuer
      # Do not add internal.example back: its dead DNS-01 stalled renewal of every SAN
      # in this shared Certificate (decommissioned 2026-07-26).
      dnsNames:
        - "*.example.com"
        - "example.com"
        - "*.example.com"
        - "example.com"

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 128Mi
    defaultRequests:
      cpu: 10m
      memory: 32Mi
