# Только homelab-common (второй источник ApplicationSet). Не смешивать с cert-manager.yaml — у чарта jetstack строгая values schema.
homelab-common:
  certificates:
    - name: wildcard-tls
      namespace: kube-system
      secretName: wildcard-tls
      issuerRef:
        name: cloudflare-issuer
        kind: ClusterIssuer
      # internal.example SANs removed 2026-07-26: the domain sits on a registrar
      # verification hold (NS = ns1.verification-hold.suspended-domain.com), so
      # the DNS-01 challenge cannot resolve authoritative nameservers and the
      # whole cert stops renewing — including *.example.com, which every route
      # actually uses. Nothing in the cluster serves a internal.example hostname.
      # Re-add both entries once the domain is out of hold.
      dnsNames:
        - "*.example.com"
        - "example.com"

  limitRange:
    enabled: true
    name: default-limits
    defaults:
      cpu: 200m
      memory: 128Mi
    defaultRequests:
      cpu: 10m
      memory: 32Mi
