# homelab-common only (second source of the AppSet). Kept apart from values.yaml: the jetstack chart has a strict values schema.
homelab-common:
  # Default-deny ingress. No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true

  externalSecrets:
    # DNS-01 token for ClusterIssuer cloudflare-issuer, the same token as
    # external-dns (grant `cloudflare`). Name and key are fixed: the
    # ClusterIssuer, DR phase 03 and the dr-pack read cloudflare-api-token/api-token.
    - name: cloudflare-api-token
      vaultPath: external-dns/cloudflare
      data:
        - secretKey: api-token
          property: cloudflare_api_token

  certificates:
    - name: wildcard-tls
      namespace: kube-system
      secretName: wildcard-tls
      issuerRef:
        name: cloudflare-issuer
        kind: ClusterIssuer
      # example.com is the only domain. internal.example was decommissioned 2026-07-26:
      # it died on a registrar verification hold (NS =
      # ns1.verification-hold.suspended-domain.com), its DNS-01 challenge could
      # not resolve authoritative nameservers, and because all SANs share one
      # Certificate it stalled renewal of *.example.com too. Do not add it back.
      dnsNames:
        - "*.example.com"
        - "example.com"

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 128Mi
    defaultRequests:
      cpu: 10m
      memory: 32Mi
