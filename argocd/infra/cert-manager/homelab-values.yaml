# Только homelab-common (второй источник ApplicationSet). Не смешивать с cert-manager.yaml — у чарта jetstack строгая values schema.
homelab-common:
  certificates:
    - name: wildcard-tls
      namespace: kube-system
      secretName: wildcard-tls
      issuerRef:
        name: cloudflare-issuer
        kind: ClusterIssuer
      # example.com is the only domain. internal.example was decommissioned 2026-07-26:
      # it died on a registrar verification hold (NS =
      # ns1.verification-hold.suspended-domain.com), its DNS-01 challenge could
      # not resolve authoritative nameservers, and because all SANs share one
      # Certificate it stalled renewal of *.example.com too. Do not add it back.
      dnsNames:
        - "*.example.com"
        - "example.com"

  limitRange:
    enabled: true
    name: default-limits
    defaults:
      cpu: 200m
      memory: 128Mi
    defaultRequests:
      cpu: 10m
      memory: 32Mi
