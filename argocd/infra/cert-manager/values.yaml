# Chart keys only: homelab-common is in homelab-values.yaml (strict values.schema.json).
crds:
  enabled: true

resources:
  requests:
    memory: 32Mi
    cpu: 10m
  limits:
    memory: 128Mi
    cpu: 200m

extraEnv:
  - name: GOMEMLIMIT
    value: "110MiB"

webhook:
  resources:
    requests:
      memory: 16Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 100m

cainjector:
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 200m
  extraEnv:
    - name: GOMEMLIMIT
      value: "110MiB"
  # Nothing injects into CRDs/APIServices here; dropping those caches saves ~200 MiB RSS.
  extraArgs:
    - --enable-customresourcedefinitions-injectable=false
    - --enable-apiservices-injectable=false

startupapicheck:
  resources:
    requests:
      memory: 16Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 100m
