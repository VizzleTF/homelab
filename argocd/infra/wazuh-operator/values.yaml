# CRDs are templates (~2.7MB): keep ServerSideApply, client-side apply exceeds
# the 256KB last-applied annotation limit.

operator:
  resources:
    requests:
      cpu: 50m

homelab-common:
  # Default-deny ingress. Nothing outside the namespace calls the operator: the
  # chart has no webhooks and no VMServiceScrape reads its metrics.
  networkPolicy:
    enabled: true
