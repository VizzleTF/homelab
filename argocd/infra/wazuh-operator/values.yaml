# Wazuh operator (MaximeWewer) — reconciles the WazuhCluster CR deployed by
# argocd/apps/wazuh. CRDs ship as regular templates; wazuhclusters.yaml alone is
# ~2.7MB, so the AppSet's ServerSideApply=true is mandatory (client-side apply
# would blow the 256KB last-applied annotation limit).
operator:
  resources:
    requests:
      cpu: 50m

homelab-common:
  # Default-deny ingress; only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]
