# No prometheus-operator CRDs: scrape and alerts live in manifests/ as VM objects.

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    # Scrape bursts were throttled 56-77% of periods at 100m.
    cpu: 300m
    memory: 64Mi

homelab-common:
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]

# Chart RBAC only binds the removed PSP role unrestricted-psp.
rbac:
  create: false
