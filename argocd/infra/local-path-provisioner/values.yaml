# Rebuildable data only: PVs are pinned to one node and die with it.
# Talos rootfs is read-only; only /var is writable (wiped on `talosctl reset`).
nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /var/local-path-provisioner

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Default 1s timeout: /ready calls the API server, failed ~980x in 4 days on etcd spikes.
health:
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 5

homelab-common:
  # No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true
