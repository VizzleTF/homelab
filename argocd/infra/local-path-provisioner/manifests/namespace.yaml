# PodSecurity default is baseline; pods here need more (helper pods mount node hostPaths to create/delete PV dirs).
# Prune/Delete=false: deleting the app must never delete the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-provisioner
  labels:
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
