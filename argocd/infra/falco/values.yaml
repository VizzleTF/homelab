# Runtime detection for the cluster — the blind spot Wazuh cannot cover on Talos.
# Wazuh watches hosts through agents, but Talos takes no agent, so nothing sees
# what happens *inside* containers: a shell in a pod, a read of /etc/shadow, a
# process writing to a binary directory. Falco reads syscalls and does.
#
# Kubernetes audit events are NOT collected here — Vector already ships the
# interesting ones to Wazuh (argocd/infra/victoria-logs). Falco covers syscalls.

driver:
  # Explicit: the chart defaults to "auto", which probes for a kernel module
  # first. Talos ships a 6.18 kernel with BTF, so the modern eBPF probe needs
  # no driver build and no kernel headers — nothing to compile on an immutable OS.
  kind: modern_ebpf

# The chart's defaults (1 CPU / 1Gi per node) are sized for busy clusters; that
# would reserve 4Gi across the four nodes here. Falco with the modern probe sits
# around 200-300MB in practice.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

# Control-plane nodes run workloads here, so they need watching too.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

falco:
  # Structured output: the sidekick parses it, and it reads better in logs.
  json_output: true
  json_include_output_property: true

falcosidekick:
  enabled: true
  replicaCount: 1
  # The subchart (falco 9.2.0 = latest) defaults to 2.32.0, which carries
  # critical grpc/openssl CVEs fixed in later releases.
  image:
    # renovate: datasource=docker depName=falcosecurity/falcosidekick
    tag: "2.35.0"

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  config:
    # Findings travel the same path as every other alert in this cluster:
    # Alertmanager -> Robusta -> Telegram. No second notification channel.
    alertmanager:
      hostport: http://vmalertmanager-victoria-metrics-k8s-stack.victoria-metrics.svc:9093
      # VM's Alertmanager speaks the v2 API; the chart still defaults to v1.
      endpoint: /api/v2/alerts
      # Falco's own noise floor is "debug"/"informational"; anything below
      # notice is not worth waking anyone up for.
      minimumpriority: notice

    # Second copy of every event to Wazuh, for search and correlation next to
    # the host logs. Decoded by the falcosidekick WazuhDecoder and mapped to
    # levels <= 11 by the falco WazuhRule (argocd/apps/wazuh), so Wazuh never
    # re-notifies what Alertmanager already sent. ClusterIP, not the LB IP:
    # the source stays the pod IP, which the syslog allowed-ips cover.
    syslog:
      host: wazuh-manager-master.wazuh.svc
      port: "514"
      protocol: udp
      minimumpriority: notice

# Noise control.
#
# Three stock rules fire constantly on normal behaviour here. The first attempt
# at this excluded them by k8s.ns.name and silenced almost nothing: the two
# loudest sources carry no Kubernetes metadata at all, so every ns-based
# exception was dead code. What they actually are:
#
#   * cilium-cni  — containerd runs the CNI plugin for every pod sandbox. It is
#     a host process (container.id=runtime, no pod, no namespace), and Cilium
#     writes the binary into /opt/cni/bin at agent start, so it is genuinely
#     "not part of a base image". ~60 events per node per 30 min.
#   * CI job containers — the Forgejo runner spawns them through its dind
#     sidecar, so they are nested under dockerd and invisible to the CRI the
#     container plugin talks to. Enrichment works fine for ordinary pods (a
#     probe pod reports ns and image correctly); these simply are not pods.
#
# Exceptions therefore key on fields that exist for these events. Priorities
# are Critical, so raising falcosidekick's minimumpriority would not help.
customRules:
  homelab-noise.yaml: |-
    # Every pod with a service account talks to the API server — ArgoCD, Vector,
    # OpenBao, ESO, the lot. In a cluster this rule has no signal at all.
    - rule: Contact K8S API Server From Container
      enabled: false
      override:
        enabled: replace

    # Keep the rule — catching a container fetch-and-run a payload is one of the
    # more useful things Falco does — but drop the two benign sources.
    #
    # /workspace/<owner>/<repo> is the Forgejo Actions job workspace, so the cwd
    # test scopes the exception to CI containers. It is a deliberate blind spot:
    # a process that chdirs there is not reported. Narrowing it to this one
    # Forgejo org keeps the hole small, and if the org is ever renamed the noise
    # simply comes back rather than the exception silently widening.
    #
    # Package installs in CI jobs escape that test: dpkg maintainer scripts run
    # from elsewhere (update-ca-certificates runs `openssl rehash` in
    # /etc/ssl/certs), and the binaries apt just unpacked sit in the upper
    # layer. Such jobs are dind children with no Kubernetes metadata, so the
    # dpkg session is only excused when k8s.ns.name is absent — apt inside a
    # real pod is still reported.
    #
    # Cilium also runs cilium-sysctlfix from /opt/cni/bin at agent start, and
    # lampac downloads and runs TorrServer into its data dir by design.
    - rule: Drop and execute new binary in container
      condition: and not proc.exepath startswith /opt/cni/bin/
                 and not proc.cwd startswith /workspace/vizzle/
                 and not (proc.sname = dpkg and not k8s.ns.name exists)
                 and not (k8s.ns.name = lampac
                          and proc.exepath = /lampac/data/ts/TorrServer-linux)
      override:
        condition: append

    # Longhorn wires engine <-> replica processes over TCP by dup'ing sockets
    # onto their stdio: instance-manager on every replica rebuild or rebalance,
    # longhorn-manager when it runs the engine binary (backup cleanup-all-mounts).
    - rule: Redirect STDOUT/STDIN to Network Connection in Container
      condition: and not (k8s.ns.name = longhorn-system
                          and container.image.repository startswith docker.io/longhornio/)
      override:
        condition: append

    # CNPG replicas run restore_command through a shell whenever they fall back
    # from streaming to the WAL archive.
    - rule: Run shell untrusted
      condition: and not (proc.pname = postgres
                          and proc.cmdline startswith "sh -c /controller/manager wal-restore")
      override:
        condition: append

    # containerd inside the Forgejo runner's dind sidecar truncates job logs.
    - rule: Clear Log Activities
      condition: and not (k8s.ns.name = forgejo
                          and container.image.repository = docker.io/library/docker)
      override:
        condition: append

    # Cilium's agent creates packet sockets by design, and so does the dind
    # sidecar backing the Forgejo runner while it sets up job networking.
    - rule: Packet socket created in container
      condition: and not k8s.ns.name in (kube-system, forgejo)
      override:
        condition: append

homelab-common:
  # Default-deny ingress; only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]
