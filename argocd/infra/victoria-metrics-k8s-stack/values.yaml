argocdReleaseOverride: victoria-metrics-k8s-stack

victoria-metrics-operator:
  operator:
    # Operator v0.69+ CrashLoops without the prometheus-operator CRDs, which are not
    # installed; all monitoring resources are native VM objects.
    disable_prometheus_converter: true

  admissionWebhooks:
    certManager:
      enabled: true

defaultRules:
  rules:
    Watchdog: {enabled: false}
    InfoInhibitor: {enabled: false}
    # Single Alertmanager replica
    AlertmanagerClusterCrashlooping: {enabled: false}
    AlertmanagerClusterDown: {enabled: false}
    AlertmanagerClusterFailedToSendAlerts: {enabled: false}
    AlertmanagerConfigInconsistent: {enabled: false}
    AlertmanagerMembersInconsistent: {enabled: false}
    # KubeAPIDown is enough
    KubeAPIErrorBudgetBurn: {enabled: false}
    # Not used: KSM sharding, HPA, PDB, ResourceQuota
    KubeStateMetricsShardingMismatch: {enabled: false}
    KubeStateMetricsShardsMissing: {enabled: false}
    # Talos binds controller-manager/scheduler to 127.0.0.1 (unreachable from pods),
    # so there is no scrape job and these absent() rules fire critical forever.
    # Re-enable with the scrape jobs only if the Talos bind-address is patched.
    KubeControllerManagerDown: {enabled: false}
    KubeSchedulerDown: {enabled: false}
    KubeHpaMaxedOut: {enabled: false}
    KubeHpaReplicasMismatch: {enabled: false}
    KubePdbNotEnoughHealthyPods: {enabled: false}
    KubeCPUQuotaOvercommit: {enabled: false}
    KubeMemoryQuotaOvercommit: {enabled: false}
    KubeQuotaAlmostFull: {enabled: false}
    KubeQuotaExceeded: {enabled: false}
    KubeQuotaFullyUsed: {enabled: false}
    # Was flooded by the NFD worker; NFD is gone, re-enabling is a separate decision
    CPUThrottlingHigh: {enabled: false}
    # Noisy, not actionable
    KubeNodeEviction: {enabled: false}
    KubeletPodStartUpLatencyHigh: {enabled: false}
    KubeletTooManyPods: {enabled: false}
    # Talos has no bonding/RAID/systemd
    NodeBondingDegraded: {enabled: false}
    NodeCPUHighUsage: {enabled: false}
    NodeRAIDDegraded: {enabled: false}
    NodeRAIDDiskFailure: {enabled: false}
    NodeSystemdServiceCrashlooping: {enabled: false}
    NodeSystemdServiceFailed: {enabled: false}
    NodeTextFileCollectorScrapeError: {enabled: false}
    # Unused vmagent features
    RemoteWriteConnectionIsSaturated: {enabled: false}
    SeriesLimitDayReached: {enabled: false}
    SeriesLimitHourReached: {enabled: false}
    StreamAggrDedupFlushTimeout: {enabled: false}
    StreamAggrFlushTimeout: {enabled: false}
    RecordingRulesNoData: {enabled: false}

    # One event = one alert: obsidian/112 ArgoCD/Infrastructure/Alert Cleanup.md.
    # Cascades are muted by inhibit_rules; here go twins and non-actionable noise.

    # Overcommit is intentional
    KubeCPUOvercommit: {enabled: false}
    KubeMemoryOvercommit: {enabled: false}

    # Predictive twins of NodeFilesystemAlmostOutOfSpace/Files
    NodeFilesystemSpaceFillingUp: {enabled: false}
    NodeFilesystemFilesFillingUp: {enabled: false}

    # Duplicates of NodeMemoryHighUtilization
    NodeMemoryMajorPagesFaults: {enabled: false}
    NodeSystemSaturation: {enabled: false}

    # PVC inodes — rare on Longhorn ext4
    KubePersistentVolumeInodesFillingUp: {enabled: false}

    # Covered by KubeAPIDown
    KubeAggregatedAPIErrors: {enabled: false}
    KubeAPITerminatedRequests: {enabled: false}

    # Talos rotates kubelet certs
    KubeletClientCertificateRenewalErrors: {enabled: false}
    KubeletServerCertificateRenewalErrors: {enabled: false}
    KubeletServerCertificateExpiration: {enabled: false}
    KubeNodePressure: {enabled: false}
    KubeletPlegDurationHigh: {enabled: false}

    # KubeDeploymentRolloutStuck / KubeStatefulSetUpdateNotRolledOut cover these
    KubeDeploymentGenerationMismatch: {enabled: false}
    KubeStatefulSetGenerationMismatch: {enabled: false}
    KubeDaemonSetMisScheduled: {enabled: false}
    KubeDaemonSetNotScheduled: {enabled: false}

    # KubeJobFailed is the keeper
    KubeJobNotCompleted: {enabled: false}

    # Symptom of NodeClockNotSynchronising
    NodeClockSkewDetected: {enabled: false}

    # Cheap NICs, chronic counter bumps; NodeNetworkInterfaceFlapping stays
    NodeNetworkReceiveErrs: {enabled: false}
    NodeNetworkTransmitErrs: {enabled: false}

    # Never actionable here
    NodeFileDescriptorLimit: {enabled: false}
    NodeHighNumberConntrackEntriesUsed: {enabled: false}
    NodeDiskIOSaturation: {enabled: false}

    # Fires during every Talos upgrade
    KubeVersionMismatch: {enabled: false}

    # AlertmanagerFailedReload is the keeper
    AlertmanagerFailedToSendAlerts: {enabled: false}

    # VM is far under capacity; ServiceDown + TooManyRestarts stay
    ProcessNearFDLimits: {enabled: false}
    TooHighMemoryUsage: {enabled: false}
    TooHighCPUUsage: {enabled: false}
    TooHighGoroutineSchedulingLatency: {enabled: false}
    TooManyLogs: {enabled: false}
    ConcurrentInsertsHitTheLimit: {enabled: false}
    RowsRejectedOnIngestion: {enabled: false}
    TooHighQueryLoad: {enabled: false}

    # Cascade of PersistentQueueIsDroppingData (inhibit_rules)
    RejectedRemoteWriteDataBlocksAreDropped: {enabled: false}
    TooManyScrapeErrors: {enabled: false}
    TooManyWriteErrors: {enabled: false}
    TooManyRemoteWriteErrors: {enabled: false}
    PersistentQueueForWritesIsSaturated: {enabled: false}
    PersistentQueueForReadsIsSaturated: {enabled: false}
    PersistentQueueRunsOutOfSpaceIn12Hours: {enabled: false}
    PersistentQueueRunsOutOfSpaceIn4Hours: {enabled: false}

    # Trip on every vmsingle restart (2-3 min) during syncs; a lasting outage is
    # covered by ServiceDown (vm stack rules: up == 0 for vmsingle/vmalert jobs, 2m)
    # and TargetDown. A full vmsingle or vmalert outage halts evaluation itself,
    # so no in-cluster rule fires then (Watchdog is disabled).
    AlertingRulesError: {enabled: false}
    ConfigurationReloadFailure: {enabled: false}
    RemoteWriteDroppingData: {enabled: false}

    # DiskRunsOutOfSpaceIn3Days is the keeper
    DiskRunsOutOfSpace: {enabled: false}
    NodeBecomesReadonlyIn3Days: {enabled: false}
    # TooHighChurnRate is the keeper
    TooHighChurnRate24h: {enabled: false}
    TooHighSlowInsertsRate: {enabled: false}
    MetadataCacheUtilizationIsTooHigh: {enabled: false}
    RequestErrorsToAPI: {enabled: false}

    # vmalert cascade
    RemoteWriteErrors: {enabled: false}
    RemoteWriteQueueHighUsage: {enabled: false}
    TooManyMissedIterations: {enabled: false}
    AlertmanagerErrors: {enabled: false}
    RecordingRulesError: {enabled: false}

  # The etcd mixin follows kubeEtcd.enabled (false, see kubeEtcd); force it on
  sources:
    etcd:
      enabled: true

  groups:
    # Only ServiceDown matters for the operator
    vmoperator: {enabled: false}
    # Never disable etcd: slow fsync on the shared SATA SSDs caused every CP incident.
    # vmsingle is used, not vmcluster.
    vmcluster: {enabled: false}
    # Per-rule toggles above work on chart 0.95 (not on 0.90.x); recheck after bumps.
    # Every rule in this group is unwanted (overcommit, quotas, CPU throttling).
    kubernetes-resources: {enabled: false}
    # KubeAPIDown is enough
    kube-apiserver-slos: {enabled: false}
    # Only fed the SLO alerts and read histograms that kubeApiServer drops
    kube-apiserver-availability.rules: {enabled: false}
    kube-apiserver-burnrate.rules: {enabled: false}
    kube-apiserver-histogram.rules: {enabled: false}
    # No scrape job (Talos 127.0.0.1 bind, see defaultRules) → rules fire forever
    kubernetes-system-controller-manager: {enabled: false}
    kubernetes-system-scheduler: {enabled: false}

vmsingle:
  spec:
    retentionPeriod: "7d"
    storageMetadata:
      annotations:
        helm.sh/resource-policy: keep
    # At the default 2, vmalert silently skipped rules with
    # "-search.maxConcurrentRequests=2 concurrent requests are executed" (2026-09-24).
    extraArgs:
      search.maxConcurrentRequests: "8"
      search.maxQueueDuration: "30s"
      # Fewer disk merges than the 5s default; an unclean stop loses up to 30 s
      inmemoryDataFlushInterval: "30s"
    resources:
      requests:
        cpu: 250m
        memory: 1536Mi
      limits:
        cpu: 1000m
        memory: 3Gi
    extraEnvs:
      - name: GOMEMLIMIT
        value: "2600MiB"
    storage:
      resources:
        requests:
          storage: 30Gi
      # Disposable metrics; Longhorn's replica wrote ~50 GB/day to the SSDs etcd shares.
      # Changing the class recreates the PVC (data lost); a lost node = empty TSDB.
      storageClassName: local-path

vmalert:
  spec:
    replicaCount: 1
    notifier:
      url: "http://vmalertmanager-victoria-metrics-k8s-stack.victoria-metrics.svc:9093"
    # Heavy default groups take up to 49s; shorter intervals miss slots
    evaluationInterval: 1m
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

vmagent:
  spec:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
    extraEnvs:
      - name: GOMEMLIMIT
        value: "430MiB"
    extraArgs:
      # apiserver /metrics is ~17 MB, over the 16 MiB default
      promscrape.maxScrapeSize: "64MB"
      # One remote-write target; the default is GOMAXPROCS queues
      remoteWrite.queues: "1"
    # Cuts disk writes on the SSDs etcd shares; applies to scrapes without their own
    # interval (the bulk of samples). Safe: rules use >=1m windows.
    scrapeInterval: 60s

alertmanager:
  spec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    configSecret: alertmanager-config

grafana:
  plugins:
    - victoriametrics-metrics-datasource
    - victoriametrics-logs-datasource

  grafana.ini:
    server:
      root_url: "https://grafana.example.com"

    auth.generic_oauth:
      enabled: true
      name: Authentik
      # Authentik provider slug
      client_id: grafana
      client_secret: $__file{/etc/secrets/grafana-oidc/client-secret}
      scopes: openid profile email
      auth_url: https://authentik.example.com/application/o/authorize/
      token_url: https://authentik.example.com/application/o/token/
      api_url: https://authentik.example.com/application/o/userinfo/
      allow_sign_up: true
      # Group from the authentik blueprint 00-grafana-groups.yaml
      role_attribute_path: contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'

  admin:
    existingSecret: grafana-admin-secret

  extraSecretMounts:
    - name: grafana-oidc-secret
      secretName: grafana-oidc-secret
      defaultMode: 0440
      mountPath: /etc/secrets/grafana-oidc
      readOnly: true

  # Grafana reads these only at start; reloader rolls it on rotation
  annotations:
    secret.reloader.stakater.com/reload: grafana-admin-secret,grafana-oidc-secret

  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

  # Dashboards, datasources and users (OIDC sign-up) are all declarative
  persistence:
    enabled: false  # pinned: declarative Grafana, no PVC to back up

  sidecar:
    dashboards:
      # The default path would hide dashboards/grafana-com (gnetId dashboards below)
      folder: /tmp/dashboards
    datasources:
      # Saves a sidecar (~77 MiB); datasource changes apply on pod restart
      initDatasources: true
      # With the default WATCH the init container never exits; pod hangs in Init
      watchMethod: LIST
      # Grafana is not up yet; the reload POST would retry ~30 s and log an ERROR
      skipReload: true

  # Fetched from grafana.com on pod start (needs egress). Pin `revision`;
  # ${DS_PROMETHEUS}-style inputs are set via `datasource`.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: grafana-com
          orgId: 1
          folder: ""
          type: file
          disableDeletion: true
          options:
            path: /var/lib/grafana/dashboards/grafana-com
  dashboards:
    grafana-com:
      etcd:
        gnetId: 21473
        revision: 3
      # Data pushed by the VPS CrowdSec instances via crowdsec-scraper
      crowdsec-cti:
        gnetId: 21689
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: VictoriaMetrics

prometheus-node-exporter:
  resources:
    requests:
      cpu: 15m
      memory: 105Mi
    limits:
      # 200m throttled 27-48% of periods
      cpu: 500m
      memory: 105Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubelet:
  # The chart copies all node labels; over maxLabelsPerTimeseries=30 VMSingle
  # drops all cadvisor metrics. Keep only standard k8s labels.
  vmScrape:
    spec:
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_node_name]
          targetLabel: node
        - action: labelmap
          regex: __meta_kubernetes_node_label_(kubernetes_io_.+)
        # Deprecated but still used by some dashboards
        - action: labelmap
          regex: __meta_kubernetes_node_label_(beta_kubernetes_io_.+)
        - action: labelmap
          regex: __meta_kubernetes_node_label_(node_role_kubernetes_io_.+)
        - action: labelmap
          regex: __meta_kubernetes_node_label_(node_kubernetes_io_.+)
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - targetLabel: job
          replacement: kubelet

kubeApiServer:
  # Drops unread histograms (~49% of all series, 2026-09-24); the API server
  # dashboard's availability panels stay empty. Helm replaces lists, so the
  # chart's endpoint is repeated in full.
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          metricRelabelConfigs:
            - action: drop
              source_labels: [__name__]
              regex: "(apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_watch_events_sizes_bucket|etcd_request_duration_seconds_bucket|apiserver_watch_events_dispatch_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_storage_list_.*|apiserver_watch_list_.*|apiserver_watch_cache_.*)"

coreDns:
  vmScrape:
    enabled: true

# Talos binds both to 127.0.0.1, see defaultRules
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  vmScrape:
    enabled: false

# The chart hardcodes CP IPs; manifests/vmnodescrape-etcd.yaml discovers CP nodes
# by label instead.
kubeEtcd:
  enabled: false

homelab-common:
  networkPolicy:
    enabled: true
    allow:
      # PromQL queries and crowdsec-scraper remote write
      - namespaces: [openbao, backup-drill, robusta, crowdsec-scraper]
        ports: [8428]
      - namespaces: [backup-drill, wazuh, robusta]
        ports: [9093]

  httpRoutes:
    - name: grafana
      hostname: grafana
      gateway: internal
      service:
        name: victoria-metrics-k8s-stack-grafana
        port: 80

  externalSecrets:
    - name: grafana-admin-secret
      vaultPath: victoria-metrics/grafana
      data:
        - secretKey: admin_user
          property: admin_user
        - secretKey: admin_password
          property: admin_password
      templateData:
        admin-user: "{{ .admin_user }}"
        admin-password: "{{ .admin_password }}"

    - name: grafana-oidc-secret
      vaultPath: victoria-metrics/oidc
      data:
        - secretKey: client_secret
          property: client_secret
      templateData:
        client-secret: "{{ .client_secret }}"

    # Alerts about the Robusta delivery path itself must bypass it (telegram-direct)
    - name: alertmanager-config
      vaultPath: shared/telegram
      data:
        - secretKey: bot_token
          property: bot_token
      templateData:
        alertmanager.yaml: |
            global:
              resolve_timeout: 5m

            route:
              group_by: ['alertname', 'cluster', 'service']
              group_wait: 10s
              group_interval: 10s
              repeat_interval: 12h
              receiver: 'robusta'
              routes:
                - matchers:
                    - alertname=~"RobustaRunnerDown|AlertmanagerNotificationsFailing"
                  receiver: 'telegram-direct'

            # One event = one alert (obsidian/112 ArgoCD/Infrastructure/Alert Cleanup.md)
            inhibit_rules:
              # K8s node unreachable -> mute everything running on it
              - source_matchers:
                  - alertname="KubeNodeUnreachable"
                target_matchers:
                  - alertname=~"KubeNodeNotReady|KubeNodeReadinessFlapping|KubeletDown|KubePodNotReady|KubeContainerWaiting|KubePodCrashLooping|KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch|TargetDown|NodeMemoryHighUtilization"
                equal: ['node']

              # apiserver down -> cascade to its clients
              - source_matchers:
                  - alertname="KubeAPIDown"
                target_matchers:
                  - alertname=~"KubeAggregatedAPIDown|KubeClientErrors|KubeStateMetricsListErrors|KubeStateMetricsWatchErrors|TargetDown|KubeClientCertificateExpiration"

              # vmagent no longer delivers data -> secondary alerts stay quiet
              - source_matchers:
                  - alertname="PersistentQueueIsDroppingData"
                target_matchers:
                  - alertname=~"ScrapePoolHasNoTargets|TargetDown"

              - source_matchers:
                  - alertname="KubePodCrashLooping"
                target_matchers:
                  - alertname=~"KubePodNotReady|KubeContainerWaiting"
                equal: ['namespace', 'pod']

              - source_matchers:
                  - alertname=~"KubeDeploymentRolloutStuck|KubeStatefulSetUpdateNotRolledOut|KubeDaemonSetRolloutStuck"
                target_matchers:
                  - alertname=~"KubeDeploymentReplicasMismatch|KubeStatefulSetReplicasMismatch"
                equal: ['namespace']

              # VPS scraper lost the mesh -> every dependent check stays quiet
              - source_matchers:
                  - alertname="VpsScraperMeshDown"
                target_matchers:
                  - alertname=~"VpsHostDown|VpsCrowdsecDown|VpsTextfileScrapeError|RemnawavePanelMetricsAbsent|RemnawaveNodeDown|TargetDown"

              # The chart's TargetDown has no host label for VPS
              - source_matchers:
                  - alertname=~"VpsHostDown|RemnawavePanelMetricsAbsent"
                target_matchers:
                  - alertname="TargetDown"
                equal: ['cluster']

              - source_matchers:
                  - severity="critical"
                target_matchers:
                  - severity="warning"
                equal: ['alertname', 'namespace', 'instance']

            receivers:
              - name: 'robusta'
                webhook_configs:
                  - url: http://robusta-runner.robusta.svc.cluster.local/api/alerts
                    send_resolved: true
              - name: 'telegram-direct'
                telegram_configs:
                  - bot_token: '{{ .bot_token }}'
                    chat_id: 0000000000
                    send_resolved: true

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 256Mi
    defaultRequests:
      cpu: 20m
      memory: 64Mi
