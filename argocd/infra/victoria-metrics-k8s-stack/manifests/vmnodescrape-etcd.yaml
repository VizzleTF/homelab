# Port 2381 comes from the Talos controlplane patch (terraform_talos/modules/talos/patches/controlplane.yaml.tftpl).
# Label discovery, not static IPs: node replacement needs no edit here.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: etcd
  namespace: victoria-metrics
spec:
  port: "2381"
  scheme: http
  path: /metrics
  interval: 30s
  selector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  relabelConfigs:
    # Dashboards and alerts match job="etcd"
    - targetLabel: job
      replacement: etcd
    - sourceLabels: [__meta_kubernetes_node_name]
      targetLabel: instance
