apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: coverage-gaps
  namespace: victoria-metrics
spec:
  groups:
    - name: alert-delivery
      rules:
        # Routed to telegram-direct in values.yaml (alertmanager-config): Robusta may be what fails
        - alert: AlertmanagerNotificationsFailing
          expr: sum by (integration) (rate(alertmanager_notifications_failed_total[15m])) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager не может доставить уведомления ({{ $labels.integration }})"
            description: |
              Уведомления через {{ $labels.integration }} падают 15+ минут — алерты
              никуда не уходят. Проверить robusta-runner и логи vmalertmanager:
              kubectl -n victoria-metrics logs vmalertmanager-victoria-metrics-k8s-stack-0 -c alertmanager --tail=50

    - name: rule-health
      rules:
        # A broken rule (many-to-many, bad label join) errors on every 1m evaluation, ~15
        # per window; vmsingle restarts peaked at 10 held 15m (backtest 7d, 2026-10-30).
        # A vmsingle outage fails every rule at once: that is the Watchdog's job, not this one.
        - alert: VmalertRuleFailing
          expr: |
            sum by (group, alertname) (increase(vmalert_alerting_rules_errors_total[15m])) > 12
              unless on() count(sum by (group, alertname) (increase(vmalert_alerting_rules_errors_total[15m])) > 12) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Правило {{ $labels.group }}/{{ $labels.alertname }} не вычисляется"
            description: |
              vmalert получает ошибку на каждом прогоне этого правила — оно молчит,
              даже если условие выполнено. Текст ошибки:
              scripts/vm.sh rules errors
              kubectl -n victoria-metrics logs deploy/vmalert-victoria-metrics-k8s-stack -c vmalert --tail=100 | grep {{ $labels.alertname }}
    - name: cronjobs
      rules:
        # KubeJobFailed misses CronJobs that stop running; 8d = weekly schedule + margin
        - alert: CronJobLastRunNotSuccessful
          expr: (kube_cronjob_status_last_schedule_time - kube_cronjob_status_last_successful_time) > 2 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }}: последний запуск не завершился успешно"
            description: |
              Последний запуск по расписанию был больше двух часов назад позже
              последнего успешного — задача висит, падает или не стартует.
              kubectl -n {{ $labels.namespace }} get jobs --sort-by=.metadata.creationTimestamp | tail -3

        - alert: CronJobStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time) > 8 * 86400
            unless on (namespace, cronjob) kube_cronjob_spec_suspend == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }}: нет успешного запуска 8+ дней"
            description: |
              Самое редкое расписание в кластере — раз в неделю, так что 8 дней
              без успеха означают, что задача перестала запускаться.
