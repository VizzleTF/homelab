# Alerts for the ops node.
#
# The node holds the GitOps source of truth and runs every backup timer, so the
# failures worth waking up for are: it stopped reporting at all, a backup went
# stale, it is about to run out of disk for the next dump (~675 MB nightly), or
# a Forgejo webhook stopped delivering.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: ops-node
  namespace: victoria-metrics
spec:
  groups:
    - name: ops-node
      rules:
        - alert: OpsNodeDown
          # The node itself being unreachable is also covered by Gatus, which
          # keeps working when this stack does not. This one exists so the
          # condition shows up in the same place as every other alert.
          expr: up{job="ops-node"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Ops node is not scrapeable"
            description: "Метрики ноды ops не собираются 10 минут. На ней Forgejo (источник истины GitOps), бэкапы и watchdog."

        - alert: OpsBackupStale
          # 26h, not 24h: the dump runs at 01:30 and ships at 02:15, and a
          # tighter window would fire on every slow night.
          expr: time() - homelab_ops_backup_timestamp > 26 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Backup on the ops node is stale: {{ $labels.backup }}"
            description: "Задача {{ $labels.backup }} не отчитывалась более 26 часов. Бэкап, который тихо перестал делаться, выглядит как рабочий до дня восстановления."

        - alert: OpsBackupFailed
          expr: homelab_ops_backup_success == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Backup on the ops node failed: {{ $labels.backup }}"
            description: "Последний прогон {{ $labels.backup }} завершился с ошибкой. Подробности: journalctl -u {{ $labels.backup }} на 10.11.11.153."

        - alert: OpsNodeDiskFilling
          expr: |
            node_filesystem_avail_bytes{job="ops-node",mountpoint="/"} < 20 * 1024 * 1024 * 1024
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Ops node is running low on disk"
            description: "На / осталось меньше 20 ГБ. Ночной дамп Forgejo занимает ~675 МБ, локально хранятся двое суток."

        - alert: OpsNodeUnitFailed
          expr: node_systemd_unit_state{job="ops-node",state="failed"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Failed unit on the ops node: {{ $labels.name }}"
            description: "Юнит {{ $labels.name }} в состоянии failed."

        - alert: ForgejoWebhookFailing
          # Forgejo never retries and ArgoCD silently polls instead (10 min),
          # so nothing else notices. 30m = two runs of the 15-min exporter timer
          # (forgejo-webhook-status in nodes/ops/metrics.nix).
          expr: homelab_forgejo_webhook_last_status{job="ops-node"} == 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Forgejo webhook {{ $labels.hook_id }} to {{ $labels.host }} is failing"
            description: >-
              Последняя доставка вебхука {{ $labels.hook_id }} на {{ $labels.host }} упала,
              Forgejo её не повторяет, а ArgoCD синкает только по опросу (до 10 минут).
              Причина (JSON со status, headers и body ответа): ssh root@10.11.11.153 "sudo -u
              postgres psql -d git -At -c 'select left(response_content, 500) from hook_task
              where hook_id={{ $labels.hook_id }} order by id desc limit 1'". Status 0 и body
              'Delivery: …' = allow-list (webhook.ALLOWED_HOST_LIST), DNS, TLS или сеть; 400
              'Webhook processing failed' = HMAC (webhook.gogs.secret, OpenBao
              homelab/k8s/argocd/webhook) или битый payload; 503 = очередь ArgoCD полна. После
              фикса — Test delivery в настройках вебхука, алерт гаснет на следующем прогоне таймера.
