apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: ops-node
  namespace: victoria-metrics
spec:
  groups:
    - name: ops-node
      rules:
        - alert: OpsNodeDown
          # Gatus covers this too and survives this stack going down
          expr: up{job="ops-node"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Ops node is not scrapeable"
            description: "Метрики ноды ops не собираются 10 минут. На ней Forgejo (источник истины GitOps), бэкапы и watchdog."

        - alert: OpsBackupStale
          # 24h would fire on every slow night (dump 01:30, ship 02:15)
          expr: time() - homelab_ops_backup_timestamp > 26 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Backup on the ops node is stale: {{ $labels.backup }} -> {{ $labels.target }}"
            description: "Задача {{ $labels.backup }} не отчитывалась более 26 часов. Бэкап, который тихо перестал делаться, выглядит как рабочий до дня восстановления."

        - alert: OpsBackupFailed
          expr: homelab_ops_backup_success == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Backup on the ops node failed: {{ $labels.backup }} -> {{ $labels.target }}"
            description: "Последний прогон {{ $labels.backup }} завершился с ошибкой. Подробности: journalctl -u {{ $labels.backup }} на 10.11.11.153."

        - alert: OpsNodeDiskFilling
          expr: |
            node_filesystem_avail_bytes{job="ops-node",mountpoint="/"} < 20 * 1024 * 1024 * 1024
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Ops node is running low on disk"
            description: "На / осталось меньше 20 ГБ. Ночной дамп Forgejo занимает ~675 МБ, локально хранятся двое суток."

        - alert: OpsNodeUnitFailed
          expr: node_systemd_unit_state{job="ops-node",state="failed"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Failed unit on the ops node: {{ $labels.name }}"
            description: "Юнит {{ $labels.name }} в состоянии failed."

        - alert: OpsNodeNvmeDead
          # A dead controller leaves node_exporter running from page cache, so
          # OpsNodeDown never fires; only a burst of failed units hints at it.
          expr: node_nvme_info{job="ops-node",state!="live"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Ops node NVMe {{ $labels.device }} is {{ $labels.state }}"
            description: "Контроллер NVMe {{ $labels.device }} ({{ $labels.model }}) в состоянии {{ $labels.state }}: диск не читается, Forgejo и Postgres падают, SSH обрывает соединение. Лечится перезагрузкой по питанию; затем smartctl -a /dev/{{ $labels.device }}. Повторяется — менять диск."

        - alert: OpsCertExpiringSoon
          # Daily cert-expiry-metrics (nodes/ops/metrics.nix); talosconfig of etcd-snapshot.
          expr: homelab_cert_expiry_timestamp{job="ops-node"} - time() < 30 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Ops node: certificate {{ $labels.cert }} expires in under 30 days"
            description: "Перевыпустить: talosctl config new --roles os:etcd:backup (etcd-snapshot.nix), положить в /var/lib/secrets/talosconfig и OpenBao k8s/kube-system/talos-etcd-backup. Истёкший сертификат молча останавливает etcd-снапшоты."
        - alert: OpsCertMetricMissing
          expr: up{job="ops-node"} == 1 unless on(job) homelab_cert_expiry_timestamp{job="ops-node"}
          for: 26h
          labels:
            severity: warning
          annotations:
            summary: "Ops node: cert-expiry-metrics does not export"
            description: "ssh root@10.11.11.153 'systemctl status cert-expiry-metrics; journalctl -u cert-expiry-metrics -n 20'"
        - alert: ForgejoWebhookFailing
          # Forgejo never retries, ArgoCD silently falls back to polling.
          # 30m = two runs of forgejo-webhook-status (nodes/ops/metrics.nix).
          expr: homelab_forgejo_webhook_last_status{job="ops-node"} == 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Forgejo webhook {{ $labels.hook_id }} to {{ $labels.host }} is failing"
            description: >-
              Последняя доставка вебхука {{ $labels.hook_id }} на {{ $labels.host }} упала,
              Forgejo её не повторяет, а ArgoCD синкает только по опросу (до 10 минут).
              Причина (JSON со status, headers и body ответа): ssh root@10.11.11.153 "sudo -u
              postgres psql -d git -At -c 'select left(response_content, 500) from hook_task
              where hook_id={{ $labels.hook_id }} order by id desc limit 1'". Status 0 и body
              'Delivery: …' = allow-list (webhook.ALLOWED_HOST_LIST), DNS, TLS или сеть; 400
              'Webhook processing failed' = HMAC (webhook.gogs.secret, OpenBao
              homelab/k8s/argocd/webhook) или битый payload; 503 = очередь ArgoCD полна. После
              фикса — Test delivery в настройках вебхука, алерт гаснет на следующем прогоне таймера.
