apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: credential-expiry
  namespace: victoria-metrics
spec:
  groups:
    - name: credential-expiry
      rules:
        # Pushed daily by CronJobs (netbird/credential-expiry); an instant query sees a
        # pushed point for 5 minutes only, hence last_over_time[2d]. A deleted credential
        # drops out after 2 days.
        - alert: CredentialExpiringSoon
          expr: last_over_time(homelab_credential_expiry_timestamp[2d]) - time() < 30 * 86400
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.system }} {{ $labels.kind }} {{ $labels.name }} истекает через {{ $value | humanizeDuration }}"
            description: "Перевыпустить и положить в OpenBao. NetBird PAT: максимум 365 дней; claude-mcp → home/homelab/k8s/netbird-mcp/api, owner → home/homelab/k8s/netbird/api. Setup key k8s → netbird/peer (без него не перерегистрировать routing peers)."

        - alert: CredentialExpiringCritical
          expr: last_over_time(homelab_credential_expiry_timestamp[2d]) - time() < 7 * 86400
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.system }} {{ $labels.kind }} {{ $labels.name }} истекает через {{ $value | humanizeDuration }}"
            description: "Меньше недели до истечения. Перевыпустить сейчас, см. CredentialExpiringSoon."

        - alert: CredentialExpiryExportStale
          expr: time() - max by (system) (last_over_time(homelab_credential_expiry_last_run_timestamp[7d])) > 2 * 86400
          labels:
            severity: warning
          annotations:
            summary: "Сроки {{ $labels.system }} не выгружались 2+ дня"
            description: "CronJob экспорта сроков не доходит до конца, алерты об истечении слепы. kubectl -n netbird get cronjob,job; kubectl -n netbird logs job/<последний>"

        - alert: CredentialExpiryExportMissing
          expr: absent(last_over_time(homelab_credential_expiry_last_run_timestamp{system="netbird"}[7d]))
          for: 26h
          labels:
            severity: warning
          annotations:
            summary: "Нет метрик сроков NetBird"
            description: "CronJob netbird/credential-expiry ни разу не отработал за 7 дней. kubectl -n netbird get cronjob credential-expiry"
