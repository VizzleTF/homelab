# The etcd mixin rules use `for: 10m` and miss sub-minute fsync spikes, which still
# trigger elections and "leader election lost" restarts (silent on 2026-09-27).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: etcd-spikes
  namespace: victoria-metrics
spec:
  groups:
    - name: etcd-spikes
      rules:
        - alert: EtcdLeaderChangesFrequent
          # max, not sum: every member counts the same election.
          expr: max(increase(etcd_server_leader_changes_seen_total{job="etcd"}[1h])) >= 2
          labels:
            severity: warning
          annotations:
            summary: "etcd: {{ $value | humanize }} смен лидера за час"
            description: |
              Каждая смена лидера останавливает запись в API на секунды. Контроллеры
              с lease (Longhorn CSI, barman plugin, CNPG, KEDA, Kyverno) в этот
              момент теряют lease и перезапускаются. Причина обычно в спайке fsync:
              смотреть EtcdFsyncLatencySpike и дашборд etcd в Grafana.

        - alert: EtcdFsyncLatencySpike
          # Keeps a single-scrape spike visible for 15m
          expr: |
            max_over_time(
              histogram_quantile(0.99,
                sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[5m]))
              )[15m:1m]
            ) > 0.5
          labels:
            severity: warning
          annotations:
            summary: "etcd на {{ $labels.instance }}: WAL fsync p99 {{ $value | humanizeDuration }}"
            description: |
              Норма для etcd меньше 25ms, выше 0.5s leader heartbeat уже не
              успевает. Ищи, что в это время писало на системный диск ноды
              (снапшоты и rebuild Longhorn, бэкапы, образы):
              talosctl -n <ip> dashboard
