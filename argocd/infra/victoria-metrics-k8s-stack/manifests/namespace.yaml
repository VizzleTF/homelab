# PodSecurity default is baseline; pods here need more (node-exporter: hostNetwork, hostPID, hostPort, / hostPath).
# Prune/Delete=false: deleting the app must never delete the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: victoria-metrics
  labels:
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
