# The ops node is deliberately outside the cluster (obsidian 111 Memory/Ops Node).
# Also brings homelab_ops_backup_* (textfile collector) for vmrule-ops-node.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ops-node
  namespace: victoria-metrics
spec:
  jobName: ops-node
  targetEndpoints:
    - targets:
        - 10.11.11.153:9100
      scheme: http
      path: /metrics
      interval: 30s
      labels:
        job: ops-node
        instance: ops
