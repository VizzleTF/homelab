apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: vps-backup
  namespace: victoria-metrics
spec:
  groups:
    - name: vps-backup
      rules:
        # Textfile metrics of backups that run on the VPS fleet (vps/node-configs/bin),
        # scraped over the NetBird mesh by crowdsec-scraper. A dead scraper shows up as
        # TargetDown{cluster="vps"}, not here: the series then go absent, not stale.
        - alert: VpsBackupStale
          # Daily (vps-backup 01:45-02:45 UTC, netbird-backup 03:40 UTC); 26h like OpsBackupStale
          expr: time() - homelab_vps_backup_timestamp > 26 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "VPS backup is stale: {{ $labels.backup }} → {{ $labels.target }}"
            description: "{{ $labels.backup }} не доходил до {{ $labels.target }} более 26 часов. Для netbird-vps-fi это база всего mesh: без неё каждое устройство регистрируется заново."

        # Хост скрейпится, а метрик бэкапа нет: .prom удалён, не читается или бэкап не установлен.
        - alert: VpsBackupMissing
          expr: up{job="node"} == 1 unless on(host) homelab_vps_backup_timestamp
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "VPS {{ $labels.host }}: нет метрик бэкапа"
            description: "На {{ $labels.host }} нет ни одной серии homelab_vps_backup_*: vps-backup не установлен или его .prom не читается. ssh {{ $labels.host }} 'systemctl list-timers vps-backup; ls -l /var/lib/prometheus/node-exporter/'"

        - alert: VpsBackupFailed
          expr: homelab_vps_backup_success == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "VPS backup failed: {{ $labels.backup }} → {{ $labels.target }}"
            description: "Последний прогон {{ $labels.backup }} на {{ $labels.host }} не отгрузился в {{ $labels.target }}. Подробности: journalctl -u netbird-backup (backup=netbird-vps-fi) или -u vps-backup на {{ $labels.host }}."
