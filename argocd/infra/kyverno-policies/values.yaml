# Pod Security Standards as Kyverno policies.
#
# Separate component from the engine on purpose: the policies get edited far
# more often than Kyverno itself, and a bad policy should never require
# touching the controller's release.

# Baseline, not restricted: restricted would flag almost everything here
# (Longhorn, Cilium, Falco and the Wazuh operator all need privileges by
# design), and a report nobody can act on is noise.
podSecurityStandard: baseline

# Enforce (since 2026-09-24). The Audit reports showed violations only in the
# namespaces below, all privileged by design; every other namespace is clean,
# so from now on a new privileged/hostPath/hostNetwork workload there is
# rejected instead of just reported. To add a namespace, check its
# PolicyReports first.
validationFailureAction: Enforce

vpolExclude:
  excludeNamespaces:
    - kube-system              # cilium, talos static pods, csi
    - longhorn-system          # instance/share managers, engine images
    - falco                    # eBPF probes
    - netbird                  # WireGuard routing peers
    - crowdsec-scraper         # netbird peer
    - wazuh                    # operator pods + privileged VolSync mover
    - victoria-metrics         # node-exporter (hostPID/hostNetwork)
    - victoria-logs            # vector reads /var/log on the host
    - spegel                   # containerd socket
    - node-feature-discovery   # host /sys, /proc
    - smartctl-exporter        # raw disk access
    - forgejo                  # privileged dind runner
  matchConditions:
    # restore-drill creates drill-* namespaces with privileged VolSync movers.
    - name: skip-restore-drill-namespaces
      expression: "!has(request.namespace) || !request.namespace.startsWith('drill-')"

# Ignore, not the chart's default Fail. With Fail, a Kyverno outage turns into
# a cluster-wide admission outage — nothing new can be scheduled while the
# controller is down.
failurePolicy: Ignore

# Report on what is already running, not just on new admissions.
background: true
