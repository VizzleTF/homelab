provider:
  name: cloudflare

# CF_API_TOKEN is read only at start: reloader rolls the pod on token rotation.
deploymentAnnotations:
  secret.reloader.stakater.com/reload: external-dns-cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare
        key: api-token
  - name: GOMEMLIMIT
    value: "135MiB"

interval: 5m

extraArgs:
  - --cloudflare-proxied
  - --cloudflare-dns-records-per-page=5000

# Must match annotationFilter's annotation name: on a mismatch policy: sync
# deletes live CNAMEs (DNS outage 2026-09-12). Change both together.
annotationPrefix: external-dns.kubernetes.io/

annotationFilter: "external-dns.kubernetes.io/cloudflare-proxied in (true)"

sources:
  - gateway-httproute

policy: sync

txtOwnerId: homelab-cloudflare

domainFilters:
  - example.com
  - example.com

resources:
  limits:
    memory: 160Mi
    cpu: 100m
  requests:
    cpu: 15m
    memory: 64Mi

homelab-common:
  # Default-deny ingress. No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true

  externalSecrets:
    - name: cloudflare-api-token
      targetName: external-dns-cloudflare
      vaultPath: external-dns/cloudflare
      data:
        - secretKey: cloudflare_api_token
          property: cloudflare_api_token
      templateData:
        api-token: "{{ .cloudflare_api_token }}"

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 128Mi
    defaultRequests:
      cpu: 10m
      memory: 32Mi
