homelab-common:
  # Default-deny ingress. No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true

  externalSecrets:
    - name: cloudflare-api-token
      targetName: external-dns-cloudflare
      deletionPolicy: Retain
      templateEngineVersion: v2
      vaultPath: external-dns/cloudflare
      data:
        - secretKey: cloudflare_api_token
          property: cloudflare_api_token
      templateData:
        api-token: "{{ .cloudflare_api_token }}"

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 128Mi
    defaultRequests:
      cpu: 10m
      memory: 32Mi

provider:
  name: cloudflare

# CF_API_TOKEN is read only at start: reloader rolls the pod on token rotation.
deploymentAnnotations:
  secret.reloader.stakater.com/reload: external-dns-cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare
        key: api-token
  - name: GOMEMLIMIT
    value: "135MiB"

interval: 5m

extraArgs:
  - --cloudflare-proxied
  - --cloudflare-dns-records-per-page=5000

# The prefix is explicit although it equals the v0.22 default: it sits next to
# annotationFilter, which spells the annotation name in full, and the two must
# match. Change them only together: out of sync, external-dns stops seeing the
# target and substitutes the Gateway address, Cloudflare rejects that record,
# and policy: sync deletes the live CNAMEs (DNS went down this way 2026-09-12).
annotationPrefix: external-dns.kubernetes.io/

annotationFilter: "external-dns.kubernetes.io/cloudflare-proxied in (true)"

sources:
  - gateway-httproute

policy: sync

txtOwnerId: homelab-cloudflare

domainFilters:
  - example.com

resources:
  limits:
    memory: 160Mi
    cpu: 100m
  requests:
    cpu: 15m
    memory: 64Mi
