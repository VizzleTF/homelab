# Kyverno is the only pod-security gate: Talos PodSecurity defaults to privileged.
# Reports off: Enforce rejects at admission; reports cost ~55 etcd writes/min on
# the fsync-bound SSD. omitEvents: background scan emitted 1400+ duplicate Events.
features:
  admissionReports:
    enabled: false
  backgroundScan:
    enabled: false
  policyReports:
    enabled: false
  omitEvents:
    eventTypes:
      - PolicyApplied
      - PolicySkipped
      - PolicyViolation

# One replica is safe: policies use failurePolicy Ignore, so a restart only skips checks
# restrict-backup-drill-writes is Fail, but only for the backup-drill SA (native VAP).
# 15 s lease retry cuts etcd lease writes ~7x vs the 2 s default (2026-10).
admissionController:
  container:
    extraArgs:
      leaderElectionRetryPeriod: 15s
  replicas: 1

backgroundController:
  extraArgs:
    leaderElectionRetryPeriod: 15s
  replicas: 1
  resources:
    requests:
      cpu: 50m
    limits:
      memory: 256Mi

reportsController:
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

cleanupController:
  extraArgs:
    leaderElectionRetryPeriod: 15s
  replicas: 1
  resources:
    requests:
      cpu: 50m
    limits:
      # OOM at 128Mi: 12 restarts (2026-09).
      memory: 256Mi

homelab-common:
  # Covers kyverno-policies too (shared namespace). No VMServiceScrape here, so no victoria-metrics allow.
  networkPolicy:
    enabled: true
