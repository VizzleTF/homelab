# Policy engine for the cluster.
#
# PodSecurity admission is effectively off here: Talos defaults to `privileged`
# and no namespace carries enforcement labels, so any workload can ask for
# privileged, hostPath or hostNetwork and nothing objects. Kyverno makes that
# visible first (policies run in Audit — see argocd/infra/kyverno-policies)
# and gives a place to enforce later.

# No reports since 2026-10: the policies run in Enforce, so a violation is a
# rejected admission, not a report entry. Background scan plus admission and
# policy reports cost ~55 PolicyReport writes/min in etcd, which shares the
# SATA SSD whose fsync latency this cluster fights. Before that the background
# scan also re-emitted every violation as an Event (1400+ for the same
# privileged DaemonSets) — hence omitEvents below.
features:
  admissionReports:
    enabled: false
  backgroundScan:
    enabled: false
  policyReports:
    enabled: false
  omitEvents:
    eventTypes:
      - PolicyApplied
      - PolicySkipped
      - PolicyViolation

# Single replica per controller: this is a four-node homelab, and the policies
# run in Audit, so a brief controller restart costs reports, not admissions.
admissionController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      # Chart default caps at 128Mi, which is tight once policies and the
      # resource cache grow.
      memory: 384Mi

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

reportsController:
  # Nothing to aggregate with reports off (features above).
  enabled: false
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      # 113Mi max of 128Mi, 12 restarts (2026-09).
      memory: 256Mi

homelab-common:
  # Default-deny ingress for the whole namespace (also covers the sibling app
  # sharing it); only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]
