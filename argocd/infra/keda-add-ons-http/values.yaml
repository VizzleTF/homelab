# Chart default request is 250m CPU per component; real p95 is 2-9m.
operator:
  resources:
    requests:
      cpu: 20m
    limits:
      cpu: 500m

scaler:
  replicas: 1
  resources:
    requests:
      cpu: 20m
    limits:
      cpu: 500m

interceptor:
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 20m
    limits:
      cpu: 500m
  # Covers Lampac cold start (initialDelaySeconds=60).
  responseHeaderTimeout: "120s"
  readinessTimeout: "120s"

homelab-common:
  # keda-loading-proxy: HTTPRoute -> nginx -> interceptor -> app. A cold pod
  # makes nginx time out -> @loading page, whose JS long-polls the wake path.
  # Navigations must answer under 3s: Chrome HTTPS-Upgrades falls back to
  # http:// after 3s and shows an error.
  configMaps:
    - name: loading-proxy-config
      fullnameOverride: keda-loading-proxy-config
      data:
        nginx.conf: |
          worker_processes auto;
          error_log /dev/stderr warn;
          pid /tmp/nginx.pid;
          events {
            worker_connections 1024;
          }
          http {
            log_format main '$remote_addr "$request" $status us=$upstream_response_time host=$host';
            access_log /dev/stdout main;

            map $http_upgrade $connection_upgrade {
              default upgrade;
              ''      close;
            }

            # readOnlyRootFilesystem: temp paths must be under /tmp.
            client_body_temp_path /tmp/client_body;
            proxy_temp_path       /tmp/proxy;
            fastcgi_temp_path     /tmp/fastcgi;
            uwsgi_temp_path       /tmp/uwsgi;
            scgi_temp_path        /tmp/scgi;

            upstream keda_interceptor {
              server keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local:8080;
              keepalive 32;
            }

            server {
              listen 8080;
              server_name _;

              # / -> 418 -> @navigate -> 504 -> @loading is two error_page hops.
              recursive_error_pages on;

              location = /__health__ {
                access_log off;
                add_header Content-Type "text/plain" always;
                return 200 "ok\n";
              }

              # Long-poll from loading.html; rewritten to / so the app doesn't 404.
              location = /__loading_proxy_wake__ {
                rewrite ^ / break;
                proxy_pass http://keda_interceptor;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_read_timeout 180s;
              }

              # Short read timeout detects a cold start (interceptor sends no bytes
              # while holding). Not below 5s: warm Lampac answers some APIs in 1.5-2.5s.
              location / {
                error_page 418 = @navigate;
                if ($http_sec_fetch_mode = "navigate") {
                  return 418;
                }
                proxy_pass http://keda_interceptor;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
                proxy_request_buffering off;
                client_max_body_size 50m;
                proxy_connect_timeout 2s;
                proxy_read_timeout 5s;
                proxy_intercept_errors on;
                error_page 502 504 = @loading;
              }

              # Navigations: 2s, under Chrome's 3s HTTPS-Upgrades fallback
              # (proxy_read_timeout takes no variables, hence a separate location).
              location @navigate {
                proxy_pass http://keda_interceptor;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_buffering off;
                proxy_connect_timeout 2s;
                proxy_read_timeout 2s;
                proxy_intercept_errors on;
                error_page 502 504 = @loading;
              }

              location @loading {
                default_type "text/html; charset=utf-8";
                add_header Cache-Control "no-store" always;
                add_header X-Loading-Proxy "1" always;
                root /var/www;
                try_files /loading.html =500;
              }
            }
          }
        loading.html: |
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Запуск сервиса</title>
            <style>
              html,body{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f1419;color:#e6e6e6}
              .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:1rem;box-sizing:border-box}
              .spin{width:48px;height:48px;border:4px solid #2a3340;border-top-color:#7aa2f7;border-radius:50%;animation:s 1s linear infinite;margin-bottom:1.5rem}
              @keyframes s{to{transform:rotate(360deg)}}
              h1{font-size:1.25rem;font-weight:500;margin:0 0 .5rem}
              p{font-size:.95rem;color:#9aa5b1;margin:.25rem 0;max-width:32rem;line-height:1.4}
              .host{color:#7aa2f7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="spin"></div>
              <h1>Сервис запускается</h1>
              <p>Поднимаем <span class="host" id="h"></span>. Это занимает 30–90 секунд.</p>
              <p>Страница обновится автоматически.</p>
            </div>
            <script>
              document.getElementById("h").textContent = location.hostname;
              // Any status below 500 means the pod is reachable.
              fetch("/__loading_proxy_wake__", {cache: "no-store", redirect: "manual"})
                .then(function(r){
                  if (r.status === 0 || r.status >= 500) {
                    setTimeout(function(){ location.reload(); }, 5000);
                  } else {
                    location.reload();
                  }
                })
                .catch(function(){ setTimeout(function(){ location.reload(); }, 5000); });
              setTimeout(function(){ location.reload(); }, 30000);
            </script>
          </body>
          </html>

  workloads:
    - name: loading-proxy           # -> Deployment + Service keda-loading-proxy
      fullnameOverride: keda-loading-proxy
      legacySelector:
        # immutable selector of the Deployment created before 1.19
        app.kubernetes.io/name: keda-loading-proxy
      spec:
        replicas: 2
        strategy:
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          seccompProfile:
            type: RuntimeDefault
        # ScheduleAnyway once put both replicas on one node. matchLabelKeys keeps
        # old ReplicaSet pods out of the skew so the maxSurge:1 rollout isn't blocked.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            matchLabelKeys:
              - pod-template-hash
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: keda-loading-proxy
      containers:
        - name: nginx
          image:
            repository: nginx
            tag: "1.31.8-alpine"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /__health__
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /__health__
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      # subPath mounts never see ConfigMap updates; the chart's Reloader
      # annotation (derived from these volumes) rolls the pods instead.
      persistence:
        config:
          configMap:
            name: keda-loading-proxy-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        html:
          configMap:
            name: keda-loading-proxy-config
          mountPath: /var/www/loading.html
          subPath: loading.html
          readOnly: true
        tmp:
          emptyDir:
            sizeLimit: 16Mi
          mountPath: /tmp
        cache:
          emptyDir:
            sizeLimit: 32Mi
          mountPath: /var/cache/nginx
