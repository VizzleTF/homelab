---
# Lets HTTPRoutes in the lampac namespace use keda-loading-proxy (the nginx
# front door that shows a "service is starting" page during cold start) as a
# backendRef across namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: keda-interceptor-from-apps
  namespace: keda
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: lampac
  to:
    - group: ""
      kind: Service
      name: keda-loading-proxy
