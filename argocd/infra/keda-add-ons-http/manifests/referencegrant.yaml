---
# Lets lampac HTTPRoutes use keda-loading-proxy (cold-start page) as a cross-namespace backendRef.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: keda-interceptor-from-apps
  namespace: keda
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: lampac
  to:
    - group: ""
      kind: Service
      name: keda-loading-proxy
