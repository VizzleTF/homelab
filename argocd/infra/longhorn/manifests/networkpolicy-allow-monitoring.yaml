# The chart's `longhorn-manager` policy (networkPolicies.restrictInternalTraffic,
# not .enabled) admits 9500 only from its own namespace; without this allow the
# vmagent scrape times out. Any other cross-namespace 9500 client needs its own allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-monitoring
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: victoria-metrics
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 9500
