# Longhorn 1.12.1 added six NetworkPolicies gated by the new
# `networkPolicies.restrictInternalTraffic` (default true), NOT by
# `networkPolicies.enabled` (default false). So the 1.12.0 -> 1.12.1 upgrade
# silently turned isolation on: the `longhorn-manager` policy admits port 9500
# only from longhorn-manager / longhorn-ui / longhorn-csi-plugin pods of its own
# namespace. vmagent lives in `victoria-metrics`, so the /metrics scrape timed
# out, the VMRule fired TargetDown and the storage dashboards went blind.
#
# Isolation stays on (see values.yaml); this adds a narrow allow on top.
# NetworkPolicies are additive: a pod gets the union of every policy that
# selects it. Any other cross-namespace consumer of the 9500 API (support
# bundle, an external exporter) needs the same explicit allow, otherwise it
# times out just as silently.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-monitoring
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: victoria-metrics
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 9500
