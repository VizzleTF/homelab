# Empty on purpose (no S3 backup target). Longhorn auto-creates `default` and
# its webhook denies deletion: without this manifest ArgoCD prunes it on every
# sync and the app stays sync-failed.
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: ""
  credentialSecret: ""
  pollInterval: "0s"
