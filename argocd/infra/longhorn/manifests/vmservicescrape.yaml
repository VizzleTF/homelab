# Needed because disable_prometheus_converter ignores the chart's ServiceMonitor.
# Every manager exports all volumes: dedup with `max by (...)` in VMRule exprs.
# 60s + dropped histograms (~8.5k unused series): vmsingle shares the SSD with etcd.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: longhorn
  namespace: victoria-metrics
spec:
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      path: /metrics
      interval: 60s
      metricRelabelConfigs:
        - action: drop
          source_labels: [__name__]
          regex: "longhorn_(rest_client|workqueue)_.*_bucket"
