# Скрейп Longhorn manager metrics через VictoriaMetrics operator.
# Helm chart создаёт ServiceMonitor (prometheus-operator), но у нас
# `vm-operator.disable_prometheus_converter: true` — ServiceMonitor никем
# не подхватывается. Нужен явный VMServiceScrape (как у velero/tuppr).
#
# longhorn-backend Service (port `manager`/9500, /metrics) selects все 4
# longhorn-manager pod-а. Каждый manager отдаёт ГЛОБАЛЬНЫЙ view всех volumes →
# 4× дублей серий. Дедуп — в expr VMRule через `max by (...)`.
#
# 60s и drop гистограмм rest_client/workqueue (~8.5k серий, ни одно правило
# их не читает): запись vmsingle на SATA SSD рядом с etcd (2026-10).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: longhorn
  namespace: victoria-metrics
spec:
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      path: /metrics
      interval: 60s
      metricRelabelConfigs:
        - action: drop
          source_labels: [__name__]
          regex: "longhorn_(rest_client|workqueue)_.*_bucket"
