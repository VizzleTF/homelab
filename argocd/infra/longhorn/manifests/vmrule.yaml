# `max by (...)` — дедуп: каждый longhorn-manager отдаёт глобальный view.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: longhorn
  namespace: victoria-metrics
spec:
  groups:
    - name: longhorn
      rules:
        - alert: LonghornVolumeFaulted
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{state="faulted"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} faulted"
            description: |
              Volume {{ $labels.volume }} (pvc {{ $labels.pvc_namespace }}/{{ $labels.pvc }}) в состоянии faulted >5m — данные недоступны.
              kubectl -n longhorn-system get volumes.longhorn.io {{ $labels.volume }} -o yaml

        # 45m = replicaReplenishmentWaitInterval (1800s) + ребилд; короче —
        # алерт на каждый том при каждом rolling-upgrade Talos.
        - alert: LonghornVolumeDegraded
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{state="degraded"}) == 1
          for: 45m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} degraded >45m"
            description: |
              Volume {{ $labels.volume }} деградирован >45m — реплика не восстановилась и после окна replenishment.
              kubectl -n longhorn-system get volumes.longhorn.io {{ $labels.volume }} -o yaml

        - alert: LonghornNodeDown
          expr: longhorn_node_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node {{ $labels.node }} not ready >5m"
            description: |
              Longhorn manager на ноде {{ $labels.node }} не ready >5m — реплики на ней недоступны.
              kubectl -n longhorn-system get nodes.longhorn.io {{ $labels.node }} -o yaml

        # Эфемерные тома (VolSync-клоны, drill) должны жить в классе с Delete;
        # копятся Released — что-то снова создаёт их в Retain-классе.
        - alert: OrphanedReleasedPVs
          expr: count(kube_persistentvolume_status_phase{phase="Released"} == 1) > 10
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "В кластере {{ $value }} Released PV — утечка томов"
            description: |
              Released PV копятся: значит эфемерные тома создаются в классе с
              reclaimPolicy Retain. Найти виновника:
              kubectl get pv -o json | jq -r '.items[] | select(.status.phase=="Released")
                | "\(.spec.claimRef.namespace)/\(.spec.claimRef.name) \(.spec.storageClassName)"' | sort | uniq -c

        # KubePersistentVolumeFillingUp sees single PVCs, not the node disk
        # (which on control-plane nodes also holds etcd).
        - alert: LonghornNodeDiskFilling
          expr: max by (node) (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn: диск ноды {{ $labels.node }} занят на {{ $value | humanizePercentage }}"
            description: |
              Реплики всех томов ноды и (на control-plane) etcd на одном разделе.
              Разгрузить: удалить лишние снапшоты или перенести реплики на talos-worker-01.
