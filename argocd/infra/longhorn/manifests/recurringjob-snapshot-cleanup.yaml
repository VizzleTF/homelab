# Snapshots that VolSync's CSI deletes are only `markRemoved`; nothing purges
# them, so layers pile up (29 incl. 184 GiB on 2026-09-12). Never touches a live
# snapshot, so `retain: 0` is required. Group `default` = every volume.
# 05:00 UTC: after the nightly backups (00:10-03:36).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
  namespace: longhorn-system
spec:
  task: snapshot-cleanup
  cron: "0 5 * * *"
  groups:
    - default
  concurrency: 2
  retain: 0
