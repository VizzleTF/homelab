# Thin volumes keep deleted blocks until trimmed; without this the backing disk fills.
# Group `default` targets every volume on purpose (never NAME a custom group `default`).
# Sundays 04:00 UTC: clear of the nightly backups and renovate.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: trim
  namespace: longhorn-system
spec:
  task: filesystem-trim
  cron: "0 4 * * 0"
  groups:
    - default
  concurrency: 2
  retain: 0
