# longhorn-ui proxies the unauthenticated manager API and the chart leaves it
# open to every pod; only the Cilium gateway may reach it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-ui-gateway-only
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-ui
  ingress:
    - fromEntities:
        - ingress
        - host
