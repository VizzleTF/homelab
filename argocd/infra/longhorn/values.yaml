# networkPolicies.restrictInternalTraffic (default true) stays on; grant
# cross-namespace access per client (manifests/networkpolicy-allow-monitoring.yaml).
# Keep UI/API ClusterIP: manager API (9500) has no auth and can delete volumes.
persistence:
  # longhorn-manager owns SC `longhorn` via ConfigMap `longhorn-storageclass`
  # and overwrites any external manifest of it.
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain
defaultSettings:
  storageMinimalAvailablePercentage: "5"
  defaultReplicaCount: "2"
  # Talos UserVolumeConfig `longhorn` (terraform_talos/modules/talos/patches/common.yaml.tftpl);
  # kubelet no longer sees /var/lib/longhorn. Used only for a node's first disk.
  defaultDataPath: /var/mnt/longhorn
  # Volumes are thin: at 100% scheduling hit the limit long before disks filled
  # and a 50Gi VolSync clone no longer fit. storageMinimalAvailablePercentage
  # still guards against a full disk.
  storageOverProvisioningPercentage: "200"
  replicaAutoBalance: "best-effort"
  # PERCENT of node allocatable CPU (both engines, max 40), not millicores.
  # Too low ("0.1" = 4m) starves instance-manager → liveness kill → iSCSI
  # targets die → Postgres "EXT4-fs error ... Detected aborted journal".
  # One invalid key ("should be less than or equal to 40") makes Longhorn
  # drop the whole customized default block.
  guaranteedInstanceManagerCPU: '{"v1":"12","v2":"12"}'
  # fsfreeze makes CSI snapshots FS-consistent, not just crash-consistent.
  # v1 key only: a `v2` key on a v1-only setting ("mismatched data engines")
  # drops the whole customized default block.
  freezeFilesystemForSnapshot: '{"v1":"true"}'
  autoCleanupSystemGeneratedSnapshot: "true"
  # Longhorn shares the SSD with etcd; 3 parallel rebuilds starved etcd and
  # Talos dropped the control-plane static pods (cp-01, 2026-09-30).
  concurrentReplicaRebuildPerNodeLimit: "1"
  # Without auto engine upgrade a volume stays on the old engine image forever.
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  # Node reboots leave orphaned replica dirs nothing else cleans up
  # (39, ~0.4 TB after the 2026-09-19 Talos upgrade).
  orphanResourceAutoDeletion: "replica-data;instance"
  # tuppr drains: replicas stay on disk through the reboot and delta-sync after
  # (pairs with replicaReplenishmentWaitInterval). The default policy's PDB
  # blocks tuppr eviction; block-for-eviction* moves GBs on every upgrade.
  nodeDrainPolicy: "always-allow"
  # Seconds; covers a Talos power cycle + kubelet/cilium startup before a full rebuild.
  replicaReplenishmentWaitInterval: "1800"
  # Otherwise a dead node's pods stay Terminating and hold their RWO volumes.
  nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
  # CSI sidecars use 1-2m CPU; the 250m default request wastes CPU.
  systemManagedCSIComponentsResourceLimits: '{"csi-attacher":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-provisioner":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-resizer":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-snapshotter":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"longhorn-csi-plugin":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"node-driver-registrar":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}}}'

longhornManager:
  resources:
    requests:
      memory: 256Mi
      cpu: 35m
    limits:
      memory: 512Mi
      cpu: 250m

# Chart sets no resources (BestEffort).
longhornGlobalManager:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

homelab-common:
  # requests-only: default limits would cap instance-manager and engine-image.
  # `defaults: null` needs homelab-common >= 2.1.0.
  limitRange:
    enabled: true
    defaults: null
    defaultRequests:
      cpu: 10m
      memory: 32Mi
  httpRoutes:
    - name: longhorn
      hostname: longhorn
      gateway: internal
      service:
        name: longhorn-frontend
        port: 80
