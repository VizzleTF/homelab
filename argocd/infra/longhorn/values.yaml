homelab-common:
  httpRoutes:
    - name: longhorn
      hostname: longhorn
      gateway: internal
      service:
        name: longhorn-frontend
        port: 80

# `networkPolicies.restrictInternalTraffic` (default true since 1.12.1) stays
# on: Longhorn components stay isolated. Cross-namespace access is granted
# per client: manifests/netpol-allow-monitoring.yaml (vmagent -> 9500).
# UI/API stay ClusterIP: the manager API (9500) can delete volumes and has no
# auth, so it must not be announced over BGP. UI access goes through the
# internal HTTPRoute above.
metrics:
  serviceMonitor:
    enabled: false
persistence:
  # longhorn-manager owns the default SC `longhorn` through the ConfigMap
  # `longhorn-storageclass` (it overwrites any external manifest). Replica
  # auto-balance comes from the global setting below (best-effort), so no
  # extra StorageClass is needed for it.
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain
defaultSettings:
  storageMinimalAvailablePercentage: "5"
  defaultReplicaCount: "2"
  # Volumes are thin: at 100% the nodes hit the scheduling limit (421 of 474Gi
  # reserved) long before the disks filled (144Gi used), and a 50Gi VolSync
  # clone no longer fit. storageMinimalAvailablePercentage still guards
  # against a full disk.
  storageOverProvisioningPercentage: "200"
  replicaAutoBalance: "best-effort"
  # CPU reservation for instance-manager, as a PERCENTAGE of the node's
  # allocatable CPU — not millicores. "0.1" therefore meant 0.1%, i.e. 4m on a
  # 3600m node, not the 100m the old comment assumed. Instance-manager then lost
  # the CPU race against etcd/apiserver on the control-plane nodes, its
  # `nc localhost 8500-8503` liveness probe timed out, kubelet killed it, every
  # iSCSI target on the node died, and Postgres hit
  # `EXT4-fs error ... Detected aborted journal`.
  # 12 is the Longhorn default (~432m per control-plane node here). Despite the
  # 1.11 docs describing millicores for v2, 1.12.1 validates BOTH engines as a
  # percentage capped at 40 — "value 1250 for data engine v2 should be less than
  # or equal to 40" — and one invalid key makes Longhorn drop the whole
  # customized default block, same trap as disableRevisionCounter below.
  guaranteedInstanceManagerCPU: '{"v1":"12","v2":"12"}'
  # Revision counters off to cut load. v1 key only: since 1.12.1 Longhorn
  # rejects `v2` here ("mismatched data engines for setting Disable Revision
  # Counter"), which dropped the whole customized default block with a warning
  # on every reconcile. Same format as the chart default.
  disableRevisionCounter: '{"v1":"true"}'
  # fsfreeze while a snapshot is taken: without it a CSI snapshot is only
  # crash-consistent, and restoring SQLite or a DB equals starting after a
  # power cut. Freezing makes it FS-consistent for a sub-second I/O pause.
  # v1 key only, like disableRevisionCounter above.
  freezeFilesystemForSnapshot: '{"v1":"true"}'
  # Clean up system-generated snapshots automatically.
  autoCleanupSystemGeneratedSnapshot: "true"
  # One concurrent rebuild per node, not 3: Longhorn shares the SSD with etcd.
  # On 2026-09-30 three parallel rebuilds on cp-01 pushed sda write latency to
  # ~350 ms, etcd fell 25k entries behind and Talos removed the control-plane
  # static pods from the node.
  concurrentReplicaRebuildPerNodeLimit: "1"
  # Live-upgrade engines to the default engine image after a Longhorn upgrade,
  # one volume per node at a time — otherwise a volume can sit on the old
  # engine image (and keep its DaemonSet alive) forever.
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  # Node reboots/upgrades leave orphaned replica directories that nothing
  # cleans up (39 of them, ~0.4 TB scheduled, after the 2026-09-19 Talos
  # upgrade). Delete them after the default 300s grace period.
  orphanResourceAutoDeletion: "replica-data;instance"
  # Drain policy for automated node drains (tuppr Talos rolling upgrades).
  # `always-allow`: drains proceed without forced replica eviction; replicas
  # stay on the node's disk through the reboot and are reused afterwards
  # (delta sync, not a rebuild from scratch). Paired with
  # replicaReplenishmentWaitInterval=1800 below.
  #
  # Trade-off: if a node dies for good during a drain, its replicas are lost;
  # defaultReplicaCount=2 keeps a copy on another node.
  #
  # Alternatives:
  # - `block-if-contains-last-replica` (default): the PDB blocks tuppr eviction
  # - `block-for-eviction*`: Longhorn evicts replicas, gigabytes of network
  #   traffic on every rolling upgrade
  # Docs: https://longhorn.io/docs/1.10.0/references/settings/#node-drain-policy
  nodeDrainPolicy: "always-allow"
  # Grace period before rebuilding a returning node's replicas from scratch
  # (default 600s). 1800s covers a Talos power cycle, kubelet cold start and
  # cilium readiness.
  replicaReplenishmentWaitInterval: "1800"
  # CSI sidecar resources sized to real use (1-2m CPU each): requests 10m
  # instead of the 250m default for csi-attacher, csi-provisioner, csi-resizer,
  # csi-snapshotter, longhorn-csi-plugin, node-driver-registrar,
  # longhorn-liveness-probe.
  systemManagedCSIComponentsResourceLimits: '{"csi-attacher":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-provisioner":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-resizer":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"csi-snapshotter":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"longhorn-csi-plugin":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"node-driver-registrar":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}},"longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}}}'

longhornManager:
  resources:
    requests:
      memory: 256Mi
      cpu: 35m
    limits:
      memory: 512Mi
      cpu: 250m
