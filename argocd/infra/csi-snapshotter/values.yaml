# Kubernetes CSI external-snapshotter — ships the snapshot.storage.k8s.io/v1 CRDs
# (VolumeSnapshot, VolumeSnapshotContent, VolumeSnapshotClass) and the controller that
# reconciles them. Longhorn supports CSI snapshots but does NOT bundle these CRDs;
# they must be installed cluster-wide as a separate component.
#
# Required by VolSync (Snapshot copyMethod) and its longhorn-volsync VolumeSnapshotClass.
# Layer -4, next to Longhorn and below VolSync (-3).

installCRDs: true

controller:
  enabled: true
  replicaCount: 1
  args:
    leaderElection: true
    leaderElectionNamespace: "$(NAMESPACE)"
    # Lease renewals are etcd writes (default every 2 s); 15 s retry (2026-10).
    leaderElectionLeaseDuration: 60s
    leaderElectionRenewDeadline: 40s
    leaderElectionRetryPeriod: 15s
    httpEndpoint: ":8080"
    # CSIVolumeGroupSnapshot (beta); Longhorn supports group snapshots and the
    # gate only exposes the API. Disable if it churns logs.
    featureGates: CSIVolumeGroupSnapshot=true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

webhook:
  enabled: false   # the validating webhook is optional; the controller copes without it

homelab-common:
  # Default-deny ingress; only vmagent (victoria-metrics) scrapes from outside.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]
