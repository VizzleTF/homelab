# Kept apart from values.yaml: the chart has a strict values schema.
homelab-common:
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]

  externalSecrets:
    - name: openwrt-credentials
      vaultPath: external-dns-openwrt/luci
      data:
        - secretKey: password
          property: password

  limitRange:
    enabled: true
    defaults:
      cpu: 100m
      memory: 128Mi
    defaultRequests:
      cpu: 25m
      memory: 64Mi
