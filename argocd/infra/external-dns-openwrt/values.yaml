homelab-common:
  externalSecrets:
    - name: openwrt-credentials
      vaultPath: openwrt
      data:
        - secretKey: host
          property: host
        - secretKey: username
          property: username
        - secretKey: password
          property: password

  limitRange:
    enabled: true
    name: external-dns-openwrt-limits
    defaults:
      cpu: 100m
      memory: 128Mi
    defaultRequests:
      cpu: 25m
      memory: 64Mi

namespace: external-dns-openwrt

provider:
  name: webhook
  webhook:
    image:
      # Форк renanqts/external-dns-openwrt-webhook (апстрим заморожен: единственный
      # релиз v0.1.0 от 2025-02-27, апстрим сам документирует себя как upsert-only).
      # Форк чинит удаление/обновление, multi-target и reload dnsmasq.
      # Исходники: https://github.com/VizzleTF/external-dns-openwrt-next
      # renovate: datasource=docker depName=ghcr.io/vizzletf/external-dns-openwrt-next
      repository: ghcr.io/vizzletf/external-dns-openwrt-next
      tag: "v0.3.0"
      pullPolicy: IfNotPresent

    livenessProbe:
      httpGet:
        path: /ping
        port: 8888
      initialDelaySeconds: 10
      timeoutSeconds: 5

    readinessProbe:
      httpGet:
        path: /ping
        port: 8888
      initialDelaySeconds: 10
      timeoutSeconds: 5

    env:
      # `uci commit` пишет только /etc/config/dhcp — он не пересобирает
      # /var/etc/dnsmasq.conf.* и не сигналит демону, поэтому до этого коммита
      # новые записи не начинали резолвиться, пока dnsmasq не перезапустят
      # чем-то ещё (проверено: сгенерированный конфиг был на 6 дней новее
      # процесса dnsmasq). `dnsmasq` = `/etc/init.d/dnsmasq reload` через
      # rpc/sys — самый узкий вариант: не трогает ни другие сервисы, ни чужие
      # застейдженные uci-конфиги. Доступность rpc/sys для этого пользователя
      # проверена отдельно (login + sys.uptime → 200).
      #
      # НЕ менять на `uci-apply` без нужды: тот путь применяет ВСЕ pending
      # uci-конфиги, не только dhcp.
      - name: PROVIDER_OPENWRT_RELOADSTRATEGY
        value: "dnsmasq"

      # Владение записями. Провайдер дописывает `external_dns=homelab` в каждую
      # созданную uci-секцию и отдаёт external-dns ТОЛЬКО помеченные. Ручные
      # записи (pve1..pve4, s3.example.com) остаются невидимы — их нельзя ни
      # обновить, ни удалить. Это предусловие для policy: sync, который иначе
      # снёс бы их: registry=noop считает своим всё, что вернул провайдер, а
      # TXT-registry невозможен — в uci нет поддержки TXT.
      #
      # Маркер инертен: dhcp_domain_add читает только name/ip, dhcp_cname_add —
      # только cname/target, в сгенерированный конфиг dnsmasq опция не попадает.
      - name: PROVIDER_OPENWRT_OWNERSHIPID
        value: "homelab"
      # Адопция: если запрошенная запись уже есть на роутере без маркера,
      # провайдер помечает существующую секцию вместо создания дубликата. Так
      # мигрируют 10 уже существующих k8s-записей — без правок на роутере.
      - name: PROVIDER_OPENWRT_ADOPTEXISTING
        value: "true"
      - name: PROVIDER_OPENWRT_LUCIRPC_HOSTNAME
        valueFrom:
          secretKeyRef:
            name: openwrt-credentials
            key: host
      - name: PROVIDER_OPENWRT_LUCIRPC_AUTH_USERNAME
        valueFrom:
          secretKeyRef:
            name: openwrt-credentials
            key: username
      - name: PROVIDER_OPENWRT_LUCIRPC_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: openwrt-credentials
            key: password
      - name: PROVIDER_OPENWRT_LUCIRPC_SSL
        value: "false"
      - name: PROVIDER_OPENWRT_LUCIRPC_PORT
        value: "80"
      - name: LOG_LEVEL
        value: info
      - name: PROVIDER_OPENWRT_LUCIRPC_INSECURE_SKIP_VERIFY
        value: "true"

    resources:
      limits:
        cpu: 50m
        memory: 80Mi
      requests:
        cpu: 12m
        memory: 32Mi

    # The chart applies the top-level `securityContext` to the external-dns
    # container only, so the webhook sidecar tripped the namespace's
    # restricted PodSecurity warning on every rollout. Same settings here.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

annotationFilter: "external-dns.alpha.kubernetes.io/internal-dns in (true)"

sources:
  - gateway-httproute
  - gateway-tlsroute
  - service

# `upsert-only` (NOT `sync`): with registry=noop, ED treats every
# record in dnsmasq as fair game. policy=sync would then delete any
# manual `config domain` entry (PVE hosts, NAS Garage S3) on first
# reconcile. upsert-only restricts ED to create+update operations
# only — manual entries are left alone, IP changes to ED-managed
# hostnames still propagate.
policy: upsert-only

interval: 5m

# OpenWrt dnsmasq cannot store TXT records, so the default `txt` registry
# would create A records but never update/delete them: ED can't find its
# own owner-TXT marker, treats every existing record as "not mine" and
# silently skips reconciliation (logs say "All records are already up to
# date" while dnsmasq holds stale IPs). `noop` registry disables owner
# tracking — safe here because this ED instance is the sole writer to
# /etc/config/dhcp domain entries on the home router.
registry: noop

domainFilters:
  - example.com
  - local

env:
  - name: GOMEMLIMIT
    value: "68MiB"

resources:
  limits:
    cpu: 50m
    memory: 80Mi
  requests:
    cpu: 12m
    memory: 32Mi

serviceAccount:
  create: true
  name: external-dns-openwrt

rbac:
  create: true

podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
