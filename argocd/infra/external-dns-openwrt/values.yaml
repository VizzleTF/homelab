# Marks created uci sections `external_dns=homelab`; only marked ones are returned,
# so manual records (s3/git.example.com) survive policy: sync under registry=noop.
ownershipID: homelab

# rpcd login `external-dns` (ACL on `dhcp` only); password from homelab-values.yaml ExternalSecret.
router:
  hostname: 10.11.12.1
  port: 80
  tls: false
  existingSecret: openwrt-credentials

externalDNS:
  sources:
    - gateway-httproute
    - gateway-tlsroute
    - service
  domainFilters:
    - example.com
    - local
  # Chart policy is sync: safe ONLY with ownershipID; drop the marker -> switch to upsert-only.
  interval: 5m  # pinned: --events covers new records, the loop is the safety net
  logFormat: text  # pinned: matches the rest of the cluster's external-dns logs
  extraArgs:
    - --events
    # Prefix must match the filter's annotation name: on a mismatch policy: sync
    # deletes live CNAMEs (DNS outage 2026-09-12). Change both together.
    - --annotation-prefix=external-dns.kubernetes.io/
    - --annotation-filter=external-dns.kubernetes.io/internal-dns in (true)
  resources:
    limits:
      cpu: 50m
      memory: 80Mi
    requests:
      cpu: 12m
      memory: 32Mi

webhook:
  extraEnv:
    # Marks an existing unmarked record instead of creating a duplicate.
    - name: PROVIDER_OPENWRT_ADOPTEXISTING
      value: "true"
  resources:
    limits:
      cpu: 50m
      memory: 80Mi
    requests:
      cpu: 12m
      memory: 32Mi
