homelab-common:
  externalSecrets:
    - name: openwrt-credentials
      vaultPath: openwrt
      data:
        - secretKey: host
          property: host
        - secretKey: username
          property: username
        - secretKey: password
          property: password

  limitRange:
    enabled: true
    name: external-dns-openwrt-limits
    defaults:
      cpu: 100m
      memory: 128Mi
    defaultRequests:
      cpu: 25m
      memory: 64Mi

namespace: external-dns-openwrt

provider:
  name: webhook
  webhook:
    image:
      # Форк renanqts/external-dns-openwrt-webhook (апстрим заморожен: единственный
      # релиз v0.1.0 от 2025-02-27, апстрим сам документирует себя как upsert-only).
      # Форк чинит удаление/обновление, multi-target и reload dnsmasq.
      # Исходники: https://github.com/VizzleTF/external-dns-openwrt-next
      # renovate: datasource=docker depName=ghcr.io/vizzletf/external-dns-openwrt-next
      repository: ghcr.io/vizzletf/external-dns-openwrt-next
      tag: "v0.4.0"
      pullPolicy: IfNotPresent

    livenessProbe:
      httpGet:
        path: /ping
        port: 8888
      initialDelaySeconds: 10
      timeoutSeconds: 5

    readinessProbe:
      httpGet:
        path: /ping
        port: 8888
      initialDelaySeconds: 10
      timeoutSeconds: 5

    env:
      # `restart` = `/etc/init.d/dnsmasq restart` через rpc/sys.
      #
      # Почему не `reload`: dnsmasq работает под ujail, а reload_service() — это
      # `rc_procd start_service; procd_send_signal dnsmasq`, и сигнал уходит в
      # jail-обёртку, а не в демон. Проверено сквозным тестом 2026-07-29: запись
      # закоммичена, лежит в /tmp/hosts/dhcp.*, а dnsmasq (поднят неделей ранее)
      # отдаёт по ней NXDOMAIN, при этом соседнее имя из ТОГО ЖЕ файла
      # резолвится. Голого SIGHUP тоже мало: A-записи живут в hostfile, а CNAME —
      # это `--cname=` в /var/etc/dnsmasq.conf.*, который читается один раз при
      # старте. Оба типа применяет только restart.
      #
      # Цена: ~1 с без DNS/DHCP, срабатывает лишь когда записи реально менялись,
      # аренды переживают в /tmp/dhcp.leases.
      #
      # НЕ менять на `uci-apply` без нужды: тот путь применяет ВСЕ pending
      # uci-конфиги, не только dhcp.
      - name: PROVIDER_OPENWRT_RELOADSTRATEGY
        value: "restart"

      # Владение записями. Провайдер дописывает `external_dns=homelab` в каждую
      # созданную uci-секцию и отдаёт external-dns ТОЛЬКО помеченные. Ручные
      # записи (pve1..pve4, s3.example.com) остаются невидимы — их нельзя ни
      # обновить, ни удалить. Это предусловие для policy: sync, который иначе
      # снёс бы их: registry=noop считает своим всё, что вернул провайдер, а
      # TXT-registry невозможен — в uci нет поддержки TXT.
      #
      # Маркер инертен: dhcp_domain_add читает только name/ip, dhcp_cname_add —
      # только cname/target, в сгенерированный конфиг dnsmasq опция не попадает.
      - name: PROVIDER_OPENWRT_OWNERSHIPID
        value: "homelab"
      # Адопция: если запрошенная запись уже есть на роутере без маркера,
      # провайдер помечает существующую секцию вместо создания дубликата. Так
      # мигрируют 10 уже существующих k8s-записей — без правок на роутере.
      - name: PROVIDER_OPENWRT_ADOPTEXISTING
        value: "true"
      - name: PROVIDER_OPENWRT_LUCIRPC_HOSTNAME
        valueFrom:
          secretKeyRef:
            name: openwrt-credentials
            key: host
      - name: PROVIDER_OPENWRT_LUCIRPC_AUTH_USERNAME
        valueFrom:
          secretKeyRef:
            name: openwrt-credentials
            key: username
      - name: PROVIDER_OPENWRT_LUCIRPC_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: openwrt-credentials
            key: password
      - name: PROVIDER_OPENWRT_LUCIRPC_SSL
        value: "false"
      - name: PROVIDER_OPENWRT_LUCIRPC_PORT
        value: "80"
      - name: LOG_LEVEL
        value: info
      - name: PROVIDER_OPENWRT_LUCIRPC_INSECURE_SKIP_VERIFY
        value: "true"

    resources:
      limits:
        cpu: 50m
        memory: 80Mi
      requests:
        cpu: 12m
        memory: 32Mi

    # The chart applies the top-level `securityContext` to the external-dns
    # container only, so the webhook sidecar tripped the namespace's
    # restricted PodSecurity warning on every rollout. Same settings here.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

annotationFilter: "external-dns.alpha.kubernetes.io/internal-dns in (true)"

sources:
  - gateway-httproute
  - gateway-tlsroute
  - service

# `sync` — удалённый из k8s hostname убирает за собой запись на роутере.
#
# Раньше здесь стоял `upsert-only`, потому что при registry=noop ED считает
# своей КАЖДУЮ запись, вернувшуюся от провайдера, и sync снёс бы ручные
# `config domain` (PVE-хосты, Garage S3 на NAS). Это больше не так: провайдер
# помечает свои секции `external_dns=homelab` (PROVIDER_OPENWRT_OWNERSHIPID) и
# отдаёт ED только помеченные — ручные записи он физически не видит и удалить
# их не может.
#
# Предусловие проверено перед включением: на роутере 17 секций, маркер стоит
# ровно на 10 k8s-записях, у pve1..pve4 и s3.example.com его нет.
#
# ВАЖНО: sync безопасен ТОЛЬКО вместе с OWNERSHIPID. Если убрать маркер —
# сначала вернуть policy в upsert-only.
policy: sync

interval: 5m

# OpenWrt dnsmasq cannot store TXT records, so the default `txt` registry
# would create A records but never update/delete them: ED can't find its
# own owner-TXT marker, treats every existing record as "not mine" and
# silently skips reconciliation (logs say "All records are already up to
# date" while dnsmasq holds stale IPs). `noop` registry disables owner
# tracking — safe here because this ED instance is the sole writer to
# /etc/config/dhcp domain entries on the home router.
registry: noop

domainFilters:
  - example.com
  - local

env:
  - name: GOMEMLIMIT
    value: "68MiB"

resources:
  limits:
    cpu: 50m
    memory: 80Mi
  requests:
    cpu: 12m
    memory: 32Mi

serviceAccount:
  create: true
  name: external-dns-openwrt

rbac:
  create: true

podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
