# Lets the webhook sidecar (it runs under the chart's service account) write
# OpenWrtRecord objects in its own namespace only. homelab-common rbac renders
# ClusterRoles only, hence raw manifests.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-dns-openwrt-status
  namespace: external-dns-openwrt
rules:
  - apiGroups: [external-dns-openwrt.vizzletf.github.io]
    resources: [openwrtrecords]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-dns-openwrt-status
  namespace: external-dns-openwrt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-dns-openwrt-status
subjects:
  - kind: ServiceAccount
    name: external-dns-openwrt
    namespace: external-dns-openwrt
