tunnelSecrets:
  existingConfigJsonFileSecret:
    name: "cloudflared-secrets"
  # cert.pem is unused, but the chart mounts this name non-optionally: it must exist.
  existingPemFileSecret:
    name: "cloudflared-secrets"

tunnelConfig:
  name: "home"
  noAutoUpdate: false

ingress:
  - service: http://cilium-gateway-cilium-gateway.kube-system.svc.cluster.local:80

resources:
  limits:
    cpu: 100m
    memory: 160Mi
  requests:
    cpu: 15m
    memory: 64Mi

nodeSelector:
  node-role.kubernetes.io/control-plane: ""
