# homelab-common only (second source of the AppSet). Kept apart from values.yaml: the upstream chart has a strict values schema.
homelab-common:
  # Default-deny ingress. No VMServiceScrape reads its metrics, so victoria-metrics gets no allow.
  networkPolicy:
    enabled: true

  externalSecrets:
    - name: cloudflared-secrets
      vaultPath: cloudflared/cloudflared
      data:
        - secretKey: credentialsjson
          property: credentials.json
      templateData:
        "credentials.json": "{{ .credentialsjson }}"

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 128Mi
    defaultRequests:
      cpu: 10m
      memory: 32Mi
