# tuppr-webhook-service shares these labels but has no `metrics` port
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tuppr
  namespace: victoria-metrics
spec:
  namespaceSelector:
    matchNames:
      - system-upgrade
  selector:
    matchLabels:
      app.kubernetes.io/name: tuppr
      app.kubernetes.io/instance: tuppr
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
