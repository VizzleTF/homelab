# TalosUpgrade — declarative rolling upgrade of Talos OS on all CP nodes.
#
# КРИТИЧНО: tuppr НЕ имеет встроенного интервала между нодами.
# "Пауза" реализуется через healthChecks (CEL): следующая нода не апгрейдится
# пока ВСЕ чеки не PASS для текущего snapshot'а кластера. Главный gate —
# Longhorn Volume robustness=healthy: реплики должны полностью восстановиться
# на оставшихся нодах прежде чем мы тронем следующую.
#
# parallelism: 1 обязателен (3 CP — параллельный reboot убьёт etcd quorum).
# rebootMode: powercycle — workaround Talos v1.13+ unmountPodMounts hang
# на Longhorn RWX-NFS (см. memory: reference_talos_113_upgrade_gotchas).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
  namespace: system-upgrade
spec:
  talos:
    # Unfrozen 2026-08-18 (was pinned to v1.13.7 since the 2026-08-06 incident).
    #
    # ROOT CAUSE of that incident — NOT Talos and NOT Longhorn: v1.13.8 bumped the
    # iscsi-tools extension from open-iscsi 2.1.11 to 2.1.12, which renamed
    # `node.session.conn_reopen_log_freq` to `node.session.sess_reopen_log_freq`
    # in a patch release (open-iscsi/open-iscsi#540). The persistent node DB under
    # /var/lib/iscsi (EPHEMERAL, survives reboot AND `talosctl upgrade`) still held
    # the old key, and libopeniscsiusr treats an unknown parameter as a hard error
    # — so every record failed to parse, discovery/login died, and Longhorn reported
    # `iscsidev StartInitator: Failed to discover`.
    #
    # All four nodes were rolled to v1.13.8 by hand on 2026-08-18, wiping
    # /var/lib/iscsi/{nodes,send_targets} on each while it was still cordoned;
    # Longhorn recreated the records through 2.1.12 with the new key. Nothing is
    # left to clean up, so tuppr can drive plain rolling upgrades again.
    #
    # BEFORE any future upgrade that changes the open-iscsi version, check whether
    # the node DB has to be wiped again — see the runbook in
    # `obsidian/112 ArgoCD/Infrastructure/all/tuppr.md`. Checked for v1.14.0
    # (2026-09-05): iscsi-tools stays at v0.2.0 — the same version the nodes
    # already run — and the extensions v1.14.0 release even carries
    # `fix: preserve open-iscsi node record compatibility`. No wipe needed.
    #
    # Datasource fixed 2026-09-05: was `ghcr.io/siderolabs/installer`, whose tag
    # stream ends at 1.13 — Talos v1.14 renamed the image to `metal-installer`,
    # so Renovate silently offered patches only and the minor never arrived while
    # kubernetes-upgrade.yaml had already moved to v1.37.0 (which ships with
    # Talos v1.14). Tracking github-releases, same as
    # `terraform_talos/configs/nodes.yaml`. tuppr itself pre-pulls
    # `factory.talos.dev/metal-installer/<schematic>:<version>` off the node
    # schematic annotation, so it never used the ghcr image anyway.
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.0

  parallelism: 1

  policy:
    rebootMode: powercycle
    # Wait for Longhorn to detach this node's attached (iSCSI) volumes after the
    # drain BEFORE rebooting. Without this the Talos v1.13 upgrade sequencer hangs
    # in unmountPodMounts on the still-attached iSCSI devices (EXT4 I/O errors,
    # "failed to convert unwritten extents"), the reboot never fires, and the node
    # stays on the old version despite "upgrade completed successfully" (incident
    # 2026-08-06: cp-01 ran 3 installs, 0 reboots, 10d uptime). This only waits for
    # the ATTACHMENT to release (workload pods reschedule elsewhere) — it does NOT
    # migrate replicas: node-drain-policy=always-allow keeps replica data on disk,
    # reused after reboot within replica-replenishment-wait-interval (1800s).
    waitForVolumeDetach: true
    placement: soft
    timeout: 45m

  drain:
    # chart 0.2.x: spec.drain переработан — допустимы только enabled +
    # disableEviction. Поля deleteLocalData/ignoreDaemonSets/force убраны из
    # CRD (force теперь в spec.policy.force, DS игнорируются хардкодом).
    enabled: true
    # Longhorn 1.7+ создаёт per-node PDB на instance-manager pods с
    # minAvailable=1, allowedDisruptions=0. Eviction API всегда отказывает с
    # "violates pod's disruption budget". Longhorn `nodeDrainPolicy=always-allow`
    # PDB не lifts (PDB остаётся, allowedDisruptions считается k8s controller'ом).
    # disableEviction=true заставляет tuppr использовать прямой DELETE — PDB
    # применяется только к eviction API, не к DELETE. Replicas data сохраняется
    # на disk (/var/lib/longhorn/), после reboot Longhorn reuse'ит её (grace
    # period replicaReplenishmentWaitInterval=1800s покрывает Talos powercycle).
    disableEviction: true

  maintenance:
    windows:
      # Permanent: ежедневно 09:00 MSK на 6h. Окно открывается каждый день,
      # но реальный rolling upgrade запускается только если spec.talos.version
      # отличается от текущего (то есть после Renovate-PR merge). Сдвинут с
      # ночи (02:00) потому что ночные часы заняты Velero+CNPG daily-backup'ами
      # (см. `kubectl -n velero get schedules.velero.io`). 09:00 — после всех
      # morning backups (cnpg-cluster в 08:15 — последний).
      - start: "0 9 * * *"
        duration: "6h"
        timezone: "Europe/Moscow"
      # ONE-SHOT — окно открывается 2026-05-26 в 22:50 MSK для немедленного
      # rolling upgrade на v1.13.3. Date-specific cron: `50 22 26 5 *` =
      # 22:50 26 мая (любого года). После 03:50 27 мая окно закрывается само —
      # удалять этот entry следующим PR не обязательно (просто dead config).
      - start: "50 22 26 5 *"
        duration: "5h"
        timezone: "Europe/Moscow"
      # ONE-SHOT — 2026-09-05 21:00 MSK + 9h, чтобы v1.14.0 уехал этой же ночью,
      # ДО того как k8s-окно в 10:00 попробует раскатать 1.37 (он ships с 1.14,
      # не с 1.13 — ради этого весь PR). Открыто задним числом на 40 минут:
      # окно должно быть активно в момент, когда ArgoCD донесёт CR, иначе tuppr
      # уйдёт ждать 09:00. Закроется само в 06:00 — dead config после этого.
      - start: "0 21 5 9 *"
        duration: "9h"
        timezone: "Europe/Moscow"

  # ===== INTERVAL GATE между нодами =====
  # tuppr re-enters HealthChecking фазу после каждой ноды. Все expr'ы должны
  # пройти прежде чем взять следующую. Это и есть "interval" — не sleep,
  # а точный gate на реальное состояние storage/db.
  healthChecks:
    # 1. Все ноды Ready.
    - apiVersion: v1
      kind: Node
      description: "All nodes Ready"
      expr: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      timeout: 15m

    # 2. ГЛАВНЫЙ GATE: все Longhorn-volumes healthy после rebuild'а реплик.
    # Short-circuit на detached: detached volumes репортят robustness=unknown
    # и без || заблокировали бы апгрейд навсегда.
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      description: "All attached Longhorn volumes healthy (replica rebuild complete)"
      expr: "status.state != 'attached' || status.robustness == 'healthy'"
      timeout: 45m

    # 3. Longhorn ноды ready (storage controller alive).
    #
    # НЕ проверяем condition Schedulable: Longhorn ставит его в False на любой
    # cordoned ноде, а cordon'ит ноды сам tuppr перед апгрейдом. Если контроллер
    # теряет in-flight состояние (2026-09-04: Renovate-бамп чарта tuppr приехал
    # через ArgoCD ровно в maintenance-окно и перекатил Deployment посреди
    # апгрейда worker-01), нода остаётся cordoned, чек Schedulable не проходит
    # НИКОГДА, tuppr вечно висит в HealthChecking и не доходит до uncordon.
    # Дедлок держался 4h, immich-machine-learning (nodeSelector ml=true, нода
    # одна) всё это время был Pending. Целостность данных гейтит чек #2
    # (attached volumes healthy) — Schedulable там ничего не добавлял.
    - apiVersion: longhorn.io/v1beta2
      kind: Node
      namespace: longhorn-system
      description: "Longhorn nodes ready"
      expr: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      timeout: 15m

    # 4. CNPG shared cluster (nextcloud + authentik + forgejo) — 3 instance up.
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      namespace: cnpg
      description: "CNPG shared cluster healthy"
      expr: "status.readyInstances == object.spec.instances && status.phase == 'Cluster in healthy state'"
      timeout: 20m

    # 5. CNPG immich-cluster (1 instance, отдельный ns).
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      namespace: immich
      description: "Immich CNPG cluster healthy"
      expr: "status.readyInstances == object.spec.instances"
      timeout: 15m

  talosctl:
    image:
      repository: ghcr.io/siderolabs/talosctl
      # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
      tag: v1.14.0
