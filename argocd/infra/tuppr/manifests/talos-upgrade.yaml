# tuppr has no delay between nodes: healthChecks are the only gate.
# parallelism: 1 is mandatory (3 CP: a parallel reboot kills etcd quorum).
# powercycle avoids the Talos v1.13+ unmountPodMounts hang on Longhorn RWX-NFS.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # A bump that changes open-iscsi may need a /var/lib/iscsi wipe first, or Longhorn
    # fails with `iscsidev StartInitator: Failed to discover` (2026-08-06). Runbook:
    # `obsidian/112 ArgoCD/Infrastructure/all/tuppr.md`.
    # github-releases: the ghcr installer image stops at 1.13 (renamed metal-installer).
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.4

  parallelism: 1

  policy:
    rebootMode: powercycle
    # Without it the upgrade hangs in unmountPodMounts on attached iSCSI volumes:
    # no reboot, old version, yet "upgrade completed successfully" (2026-08-06).
    # Waits for detach only; replica data stays on disk.
    waitForVolumeDetach: true
    placement: soft
    timeout: 45m

  drain:
    # Only enabled + disableEviction exist (force moved to spec.policy.force)
    enabled: true
    # Longhorn instance-manager PDBs (allowedDisruptions=0, even with always-allow)
    # make eviction fail with "violates pod's disruption budget"; DELETE ignores PDBs.
    # Replicas are reused after reboot within replicaReplenishmentWaitInterval (1800s).
    disableEviction: true

  maintenance:
    windows:
      # Not at night: VolSync backups (00:10-03:30) and ops-node dumps run then.
      # A dated one-off cron (`M H D Mon *`) repeats yearly: remove it in the next PR.
      # Health checks do not gate on etcd (a roll stalled on fsync p99 2-7s, 2026-09-16).
      - start: "0 9 * * *"
        duration: "6h"
        timezone: "Europe/Moscow"

  # All must pass before tuppr takes the next node
  healthChecks:
    - apiVersion: v1
      kind: Node
      description: "All nodes Ready"
      expr: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      timeout: 15m

    # Main gate. Detached volumes report robustness=unknown: without the || they
    # block the upgrade forever.
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      description: "All attached Longhorn volumes healthy (replica rebuild complete)"
      expr: "status.state != 'attached' || status.robustness == 'healthy'"
      timeout: 45m

    # Do not check Schedulable: it is False on a cordoned node, so a controller that
    # loses state mid-upgrade never uncordons and hangs in HealthChecking (2026-09-04).
    - apiVersion: longhorn.io/v1beta2
      kind: Node
      namespace: longhorn-system
      description: "Longhorn nodes ready"
      expr: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      timeout: 15m

    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      namespace: cnpg
      description: "CNPG shared cluster healthy"
      expr: "status.readyInstances == object.spec.instances && status.phase == 'Cluster in healthy state'"
      timeout: 20m

    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      namespace: immich
      description: "Immich CNPG cluster healthy"
      expr: "status.readyInstances == object.spec.instances"
      timeout: 15m

    # Readiness probe is `bao status`, which fails while sealed: all ready = all unsealed.
    # has(): readyReplicas is omitted from status when it is 0.
    - apiVersion: apps/v1
      kind: StatefulSet
      namespace: openbao
      name: openbao
      description: "All OpenBao pods unsealed and ready"
      expr: "has(status.readyReplicas) && status.readyReplicas == object.spec.replicas"
      timeout: 15m

  talosctl:
    image:
      repository: ghcr.io/siderolabs/talosctl
      # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
      tag: v1.14.4
