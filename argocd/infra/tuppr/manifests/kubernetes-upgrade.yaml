# tuppr does not enforce a safe path: Renovate separateMinorPatch must keep
# minor and patch apart, or N -> N+2 slips through. Before a minor bump, Talos
# must already ship this kubelet (siderolabs/kubelet lags upstream).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2

  maintenance:
    windows:
      # An hour after the Talos window; not at night (see talos-upgrade.yaml)
      - start: "0 10 * * *"
        duration: "4h"
        timezone: "Europe/Moscow"

  healthChecks:
    - apiVersion: v1
      kind: Node
      description: "All nodes Ready"
      expr: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      timeout: 15m

    # No Longhorn volume gate: upgrade-k8s neither drains nor reboots, and the gate
    # held upgrades for hours behind replica rebuilds (2026-09-06).

  talosctl:
    image:
      repository: ghcr.io/siderolabs/talosctl
      # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
      tag: v1.14.4
