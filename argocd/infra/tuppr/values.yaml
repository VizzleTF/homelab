# Needs Talos kubernetesTalosAPIAccess for ns system-upgrade, role os:admin
# (terraform_talos/modules/talos/patches/controlplane.yaml.tftpl).
# Break-glass: scripts/talos-upgrade.sh.

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

controller:
  metrics:
    port: 8080

# No node.kubernetes.io/unschedulable toleration (chart default): the controller
# kept landing on the node it was draining, and the drain hung forever (2026-09-05).
# Safe with parallelism=1: three nodes stay schedulable.
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

homelab-common:
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [victoria-metrics]
