apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: PruneLast=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.2
    path: config/crd/experimental
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=false
      - Replace=true
      - RespectIgnoreDifferences=true
  # Narrowed from /metadata/annotations (2026-07-29). Combined with
  # RespectIgnoreDifferences=true, the broad pointer stripped every annotation
  # from the manifest ArgoCD applies, including
  # gateway.networking.k8s.io/bundle-version. The safe-upgrades
  # ValidatingAdmissionPolicy that gateway-api v1.6.1 installs requires that
  # annotation, so every httproutes CRD apply was denied.
  # The original intent was only to keep the oversized
  # kubectl.kubernetes.io/last-applied-configuration out of the diff.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: httproutes.gateway.networking.k8s.io
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
