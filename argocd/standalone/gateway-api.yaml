apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    # The CRDs were applied with Replace=true (client-side apply could not
    # store the ~300 KB httproutes CRD in last-applied-configuration). Hand
    # the fields that manager still co-owns over to ServerSideApply.
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-application-controller
    argocd-diff-preview/watch-pattern: "argocd/standalone/gateway-api.yaml"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: infrastructure
  sources:
    - repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: v1.6.3
      path: config/crd/experimental
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # CRDs: never prune, a removed CRD deletes every route with it.
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # Server-side apply keeps no last-applied-configuration, so the large
      # httproutes CRD fits without Replace=true. The safe-upgrades
      # ValidatingAdmissionPolicy (gateway-api >= v1.6.1) needs the
      # gateway.networking.k8s.io/bundle-version annotation, which the
      # manifests carry.
      - ServerSideApply=true
