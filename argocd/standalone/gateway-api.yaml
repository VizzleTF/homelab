apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    # CRDs were applied with Replace=true (the ~300 KB httproutes CRD overflows
    # last-applied-configuration); hand that manager's fields to SSA.
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-application-controller
    argocd-diff-preview/watch-pattern: "argocd/standalone/gateway-api.yaml"
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: infrastructure
  sources:
    - repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: v1.6.3
      path: config/crd/experimental
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # CRDs: never prune, a removed CRD deletes every route with it.
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      # SSA keeps no last-applied-configuration, so the httproutes CRD fits without
      # Replace=true. The safe-upgrades VAP (>= v1.6.1) needs the manifests'
      # gateway.networking.k8s.io/bundle-version annotation.
      - ServerSideApply=true
