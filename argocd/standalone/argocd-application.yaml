apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    # argocd-diff renders this app only when its own inputs change.
    argocd-diff-preview/watch-pattern: "argocd/standalone/argocd-application.yaml, argocd/values/.*"
    argocd.argoproj.io/manifest-generate-paths: "/argocd/standalone/argocd-application.yaml;/argocd/values"
    # Same as the AppSet template: hand fields still co-owned by the pre-SSA
    # manager (RBAC annotations, TLSRoute labels/annotations) to argocd-controller on sync.
    argocd.argoproj.io/client-side-apply-migration-manager: argocd-application-controller
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: infrastructure
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "10.11.6"
      helm:
        valueFiles:
          - $values/argocd/values/argocd.yaml
    - repoURL: https://git.example.com/api/packages/vizzle/helm
      chart: homelab-common
      targetRevision: "2.3.0"
      helm:
        valueFiles:
          - $values/argocd/values/global.yaml
          - $values/argocd/values/argocd.yaml
    - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
