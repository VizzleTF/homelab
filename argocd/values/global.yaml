# Loaded first in homelab-common valueFiles; each app's own files override it.
global:
  vault:
    # Per-release SecretStore (homelab-common templates/eso-store.yaml).
    secretStoreKind: SecretStore
    refreshInterval: 1h
    pathPrefix: homelab/k8s

  # homelab-common >= 1.18.0. Kept outside `vault`: 1.17.0 rejects unknown keys there.
  openbao:
    server: http://openbao.openbao.svc.cluster.local:8200
    kvMount: home
    # Each namespace reads <pathPrefix>/<namespace>/* by default; cross-namespace
    # reads need grants (group -> paths) and namespaces (namespace -> groups).
    # Apply with scripts/openbao-eso-access.sh; listed namespaces get role
    # eso-ns-<namespace>, the rest eso-own. See obsidian/111 Memory/Vault Paths Reference.md.
    access:
      grants:
        backup: [shared/restic-garage, shared/restic-ovh, shared/s3-restic-apps, shared/s3-ovh]
        # VPS fleet restic (vps/node-configs/bin: vps-backup.sh, netbird-backup.sh): own Garage key and passwords
        vps-backup: [shared/s3-restic-vps, shared/restic-vps-garage, shared/restic-vps-ovh]
        s3-ovh: [shared/s3-ovh]
        cnpg-backup: [shared/s3-cnpg-backup]
        db-roles: [authentik/authentik, atuin/atuin]
        valkey: [valkey/valkey]
        telegram: [shared/telegram]
        # Heartbeat tokens of the outside Gatus on vps-fi (docs/monitoring-architecture.md)
        gatus-heartbeat: [shared/gatus-heartbeat]
        openbao-ops: [shared/s3-snapshots, shared/dr-pack]
        # Snapshots without the DR pack.
        snapshots: [shared/s3-snapshots]
        # rclone crypt key of the OVH copies (snapshots, terraform state, pg_dump,
        # router config).
        ovh-crypt: [shared/ovh-crypt]
        # Authentik reads these for its blueprints' !Env.
        oidc-clients: [argocd/oidc, victoria-metrics/oidc, immich/oidc, wazuh/oidc, trek/oidc, forgejo/oidc]
        # cert-manager DNS-01 reads it; path name left from the retired Cloudflare external-dns.
        cloudflare: [external-dns/cloudflare]
      namespaces:
        argocd: [valkey, telegram]
        authentik: [oidc-clients]
        backup-drill: [backup, cnpg-backup, snapshots, ovh-crypt, vps-backup]
        cert-manager: [cloudflare]
        cleanbot: [backup]
        cnpg: [s3-ovh, cnpg-backup, db-roles, ovh-crypt]
        crowdsec-scraper: [backup]
        immich: [backup, cnpg-backup, valkey, ovh-crypt]
        may: [backup]
        netbird: [backup]
        obsidian-livesync: [backup]
        openbao: [backup, openbao-ops, ovh-crypt, vps-backup]
        opencloud: [backup]
        openwrt-backup: [s3-ovh, ovh-crypt]
        renovate: [telegram]
        robusta: [telegram]
        rsstt: [backup]
        tfstate-mirror: [s3-ovh, ovh-crypt]
        trek: [backup]
        vaultwarden: [backup]
        victoria-metrics: [telegram, gatus-heartbeat]
        wazuh: [backup]

  dns:
    domain: example.com

  gateway:
    internal:
      name: cilium-gateway
      namespace: kube-system
    tls:
      name: cilium-gateway-tls
      namespace: kube-system

  # Restic targets: garage = on-prem Synology, ovh = off-site. Separate passwords:
  # corruption of one repo never reaches the other. Keep the passwords in the
  # offline DR pack too: OpenBao is restored from a backup encrypted with them.
  volsync:
    snapshotClass: longhorn-volsync
    # Ephemeral single-replica clone: see argocd/infra/volsync/manifests/storageclass-clone.yaml.
    storageClass: longhorn-volsync-clone
    # Node-local; need not survive a node loss.
    cacheStorageClass: local-path
    cacheCapacity: 2Gi
    repos:
      garage:
        endpoint: https://s3.example.com
        bucket: restic-apps
        keyVaultPath: shared/s3-restic-apps
        passwordVaultPath: shared/restic-garage
      ovh:
        endpoint: https://s3.de.io.cloud.ovh.net
        bucket: offsite-homelab
        prefix: restic-apps
        keyVaultPath: shared/s3-ovh
        passwordVaultPath: shared/restic-ovh
        # Off-site keeps longer history; targets may still override `retain`.
        retain:
          weekly: 12
          monthly: 6
