# Shared top-level Helm defaults (homelab-common and cluster conventions).
# Loaded first in the valueFiles of the homelab-common source; the app's own files follow.
global:
  vault:
    # Every release reads OpenBao through its own SecretStore
    # (homelab-common templates/eso-store.yaml, access map in global.openbao).
    secretStoreKind: SecretStore
    refreshInterval: 1h
    pathPrefix: homelab/k8s

  # OpenBao access for ESO in SecretStore mode (homelab-common >= 1.18.0,
  # templates/eso-store.yaml). Kept outside `vault`: homelab-common 1.17.0
  # rejects unknown keys there.
  openbao:
    server: http://openbao.openbao.svc.cluster.local:8200
    kvMount: home
    # Who may read what in OpenBao (docs: obsidian/111 Memory/Vault Paths Reference.md).
    # Every namespace reads its own <pathPrefix>/<namespace>/* without an entry here.
    # Cross-namespace reads must be listed: `grants` = group -> exact paths under
    # pathPrefix, `namespaces` = namespace -> groups. scripts/openbao-eso-access.sh
    # turns this into OpenBao policies and roles; homelab-common picks the role
    # `eso-ns-<namespace>` for listed namespaces and `eso-own` for the rest.
    access:
      grants:
        backup: [shared/restic-garage, shared/restic-ovh, shared/s3-restic-apps, shared/s3-ovh]
        s3-ovh: [shared/s3-ovh]
        cnpg-backup: [shared/s3-cnpg-backup]
        db-roles: [forgejo/forgejo, authentik/authentik, atuin/atuin]
        valkey: [valkey/valkey]
        telegram: [shared/telegram]
        openbao-ops: [shared/s3-snapshots, shared/dr-pack]
        # Each app's OIDC client secret, read by Authentik for its blueprints' !Env.
        oidc-clients: [argocd/oidc, victoria-metrics/oidc, immich/oidc, wazuh/oidc, trek/oidc, forgejo/oidc]
        # Cloudflare DNS token: external-dns owns it, cert-manager DNS-01 reads it.
        cloudflare: [external-dns/cloudflare]
      namespaces:
        argocd: [valkey, telegram]
        authentik: [oidc-clients]
        backup-drill: [backup]
        cert-manager: [cloudflare]
        cleanbot: [backup]
        cnpg: [s3-ovh, cnpg-backup, db-roles]
        crowdsec-scraper: [backup]
        immich: [backup, cnpg-backup, valkey]
        may: [backup]
        netbird: [backup]
        obsidian-livesync: [backup]
        openbao: [backup, openbao-ops]
        opencloud: [backup]
        openwrt-backup: [s3-ovh]
        renovate: [telegram]
        robusta: [telegram]
        rsstt: [backup]
        tfstate-mirror: [s3-ovh]
        trek: [backup]
        vaultwarden: [backup]
        victoria-metrics: [telegram]
        wazuh: [backup]

  dns:
    domain: example.com

  gateway:
    external:
      name: cilium-gateway
      namespace: kube-system
    internal:
      name: cilium-gateway-internal
      namespace: kube-system
      ip: 10.11.10.138
    tls:
      name: cilium-gateway-tls
      namespace: kube-system
      ip: 10.11.10.139

  # VolSync (backup v2, see obsidian/113 Backups/Backup Overview.md). Two independent
  # restic targets: garage = on-prem (Synology), ovh = off-site. DIFFERENT repository
  # passwords: the repos are not mirrors, so corruption of one never reaches the other.
  # The passwords must also be in the offline DR-pack, not only in OpenBao: OpenBao
  # itself is restored from a backup encrypted with them.
  volsync:
    snapshotClass: longhorn-volsync
    # The mover's clone is ephemeral and single-replica: see the comment in
    # argocd/infra/volsync/manifests/storageclass-clone.yaml.
    storageClass: longhorn-volsync-clone
    # The restic index cache is node-local; it need not survive a node loss.
    cacheStorageClass: local-path
    cacheCapacity: 2Gi
    repos:
      garage:
        endpoint: https://s3.example.com
        bucket: restic-apps
        keyVaultPath: shared/s3-restic-apps
        passwordVaultPath: shared/restic-garage
      ovh:
        endpoint: https://s3.de.io.cloud.ovh.net
        bucket: vaka-homelab
        prefix: restic-apps
        keyVaultPath: shared/s3-ovh
        passwordVaultPath: shared/restic-ovh
        # Off-site keeps longer history; targets may still override `retain`.
        retain:
          weekly: 12
          monthly: 6
