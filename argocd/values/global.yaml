# Общие top-level defaults для Helm (homelab-common и соглашения по кластеру).
# Подключается первым в valueFiles ArgoCD у source homelab-common — дальше идут файлы приложения.
global:
  vault:
    # Every release reads OpenBao through its own SecretStore
    # (homelab-common templates/eso-store.yaml, access map in global.openbao).
    secretStoreKind: SecretStore
    refreshInterval: 1h
    pathPrefix: homelab/k8s

  # OpenBao access for ESO in SecretStore mode (homelab-common >= 1.18.0,
  # templates/eso-store.yaml). Kept outside `vault`: homelab-common 1.17.0
  # rejects unknown keys there.
  openbao:
    server: http://openbao.openbao.svc.cluster.local:8200
    kvMount: home
    # Who may read what in OpenBao (docs: obsidian/111 Memory/Vault Paths Reference.md).
    # Every namespace reads its own <pathPrefix>/<namespace>/* without an entry here.
    # Cross-namespace reads must be listed: `grants` = group -> exact paths under
    # pathPrefix, `namespaces` = namespace -> groups. scripts/openbao-eso-access.sh
    # turns this into OpenBao policies and roles; homelab-common picks the role
    # `eso-ns-<namespace>` for listed namespaces and `eso-own` for the rest.
    access:
      grants:
        backup: [shared/restic-garage, shared/restic-ovh, shared/s3-restic-apps, velero/s3-ovh]
        s3-ovh: [velero/s3-ovh]
        cnpg-backup: [shared/s3-cnpg-backup]
        db-roles: [forgejo/forgejo, authentik/authentik, atuin/atuin, sparkyfitness/sparkyfitness]
        valkey: [valkey/valkey]
        telegram: [robusta/telegram]
        argocd-notify: [argocd/notifications]
        tfstate: [terraform/s3-terraform-state]
        openbao-ops: [vault/approle, shared/s3-snapshots, shared/dr-pack]
        externaldns: [externaldns]
        openwrt: [openwrt]
      namespaces:
        argocd: [valkey]
        authentik: [cnpg-backup]
        backup-drill: [backup]
        cleanbot: [backup]
        cnpg: [s3-ovh, cnpg-backup, db-roles]
        crowdsec-scraper: [backup]
        external-dns: [externaldns]
        external-dns-openwrt: [openwrt]
        immich: [backup, cnpg-backup, valkey]
        may: [backup]
        netbird: [backup]
        obsidian-livesync: [backup]
        openbao: [backup, openbao-ops]
        opencloud: [backup]
        openwrt-backup: [s3-ovh]
        renovate: [telegram]
        rsstt: [backup]
        sparkyfitness: [backup]
        tfstate-mirror: [s3-ovh, tfstate]
        trek: [backup]
        vaultwarden: [backup]
        victoria-metrics: [telegram]
        wazuh: [backup]

  dns:
    domain: example.com

  gateway:
    external:
      name: cilium-gateway
      namespace: kube-system
    internal:
      name: cilium-gateway-internal
      namespace: kube-system
      ip: 10.11.10.138
    tls:
      name: cilium-gateway-tls
      namespace: kube-system
      ip: 10.11.10.139

  # VolSync (backup v2, см. obsidian/113 Backups/Backup Overview.md). Две независимые restic-цели:
  # garage — on-prem (Synology), ovh — off-site. РАЗНЫЕ пароли репозиториев:
  # зеркалом они не являются, порча одной не приезжает во вторую.
  # Пароли обязаны лежать не только в OpenBao, но и в офлайн DR-pack — OpenBao
  # восстанавливается из бэкапа, зашифрованного этими паролями.
  volsync:
    snapshotClass: longhorn-volsync
    # Клон под mover'а — эфемерный и в одну реплику: см. комментарий в
    # argocd/infra/volsync/manifests/storageclass-clone.yaml.
    storageClass: longhorn-volsync-clone
    # Кэш индексов restic — node-local, переживать смерть ноды не должен.
    cacheStorageClass: local-path
    cacheCapacity: 2Gi
    repos:
      garage:
        endpoint: https://s3.example.com
        bucket: restic-apps
        keyVaultPath: shared/s3-restic-apps
        passwordVaultPath: shared/restic-garage
      ovh:
        endpoint: https://s3.de.io.cloud.ovh.net
        bucket: vaka-homelab
        prefix: restic-apps
        keyVaultPath: velero/s3-ovh
        passwordVaultPath: shared/restic-ovh
        # Off-site keeps longer history; targets may still override `retain`.
        retain:
          weekly: 12
          monthly: 6
