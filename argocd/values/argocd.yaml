applicationSet:
  resources:
    # 116Mi max of 128Mi, CPU throttled 15% (2026-09).
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 15m
      memory: 128Mi

controller:
  env:
    - name: GOMEMLIMIT
      value: "1700MiB"
  resources:
    limits:
      # p95 257m, throttled 13% at 500m.
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 256m
      memory: 896Mi

configs:
  ssh:
    extraHosts: |
      # git.example.com is the ops node; one key set per host, or ssh accepts
      # whichever instance answers.
      git.example.com ssh-rsa 
      git.example.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBeIktqiiqI/CPq562yq7ikPn7pXJ20yO9S3N7iyooCP
  params:
    # Default unlimited, 100-500 MiB per generation. Raise to 4 if
    # argocd_repo_pending_request_total stays high.
    reposerver.parallelism.limit: "2"
    # A burst (pin bump, mass refresh) tripped ops-node sshd MaxStartups:
    # apps sat at ComparisonError "handshake failed".
    reposerver.git.lsremote.parallelism.limit: "4"
    # Otherwise defaulted fields (CNPG plugins[].enabled, atomic lists) stay
    # OutOfSync with an empty `argocd app diff`.
    controller.diff.server.side: "true"
  cm:
    server.sessionMaxTokenAge: "720h"
    # Not 2 min: each refresh PATCHes Application status in etcd (~22/min,
    # 2026-10). Pushes arrive via the Forgejo webhook; selfHeal ignores this timer.
    timeout.reconciliation: 600s
    accounts.mcp: apiKey
    # resource.exclusions: keep the chart default; add entries via
    # resourceExclusionsAdditional, never override it.
    oidc.config: |
      name: Authentik
      issuer: https://authentik.example.com/application/o/argocd/
      clientID: argocd
      clientSecret: $oidc.argocd.clientSecret
      enablePKCEAuthentication: true
    # No defaulting ignores for HTTPRoute/TLSRoute/Gateway: server-side diff
    # defaults both sides, and with RespectIgnoreDifferences an ignore keeps the
    # LIVE array element on sync, swallowing real edits (homelab-common 1.16.0
    # sectionName never landed). Ignore only fields a controller writes at runtime.
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    # Kept: CNPG lists are atomic; webhook defaulting doesn't survive the
    # server-side dry-run.
    resource.customizations.ignoreDifferences.postgresql.cnpg.io_Cluster: |
      jqPathExpressions:
        - '.spec.managed.roles[]?.connectionLimit'
        - '.spec.managed.roles[]?.inherit'
    resource.customizations.ignoreDifferences._PersistentVolumeClaim: |
      jqPathExpressions:
        - '.spec.volumeName'
    resource.customizations.health.gateway.networking.k8s.io_HTTPRoute: |
      hs = {}
      if obj.status ~= nil and obj.status.parents ~= nil then
        for _, parent in ipairs(obj.status.parents) do
          for _, cond in ipairs(parent.conditions or {}) do
            if cond.type == "Accepted" and cond.status == "False" then
              hs.status = "Degraded"
              hs.message = cond.message
              return hs
            end
          end
        end
      end
      hs.status = "Healthy"
      hs.message = "Route accepted"
      return hs
    resource.customizations.health.gateway.networking.k8s.io_Gateway: |
      hs = {}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, cond in ipairs(obj.status.conditions) do
          if cond.type == "Ready" and cond.status == "False" then
            hs.status = "Degraded"
            hs.message = cond.message
            return hs
          end
          if cond.type == "Programmed" and cond.status == "False" then
            hs.status = "Progressing"
            hs.message = cond.message
            return hs
          end
        end
      end
      hs.status = "Healthy"
      hs.message = "Gateway ready"
      return hs

  rbac:
    # Any Authentik user can log in via OIDC; only the groups below get a role.
    # Local admin stays as break-glass: ArgoCD deploys Authentik itself.
    policy.default: ""
    policy.csv: |
      g, ArgoCD Admins, role:admin
      g, mcp, role:admin

dex:
  enabled: false

global:
  domain: argocd.example.com
  # info logged ~180 MB/day into VictoriaLogs on the SSDs etcd shares (2026-10).
  logging:
    level: warn

notifications:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 15m
      memory: 64Mi
  notifiers:
    service.telegram: |
      token: $telegram-token
  triggers:
    trigger.on-sync-failed: |
      - send: [app-sync-failed]
        when: app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'
  templates:
    template.app-sync-failed: |
      message: |
        ❌ *{{.app.metadata.name}}* — sync failed
        Phase: {{.app.status.operationState.phase}}
        {{if .app.status.operationState.syncResult.resources}}
        {{range .app.status.operationState.syncResult.resources -}}
        - {{.name}}: {{.message}}
        {{end}}{{end}}
    template.app-health-degraded: |
      message: |
        ⚠️ *{{.app.metadata.name}}* — health degraded
        Status: {{.app.status.health.status}}
  subscriptions:
    - recipients:
        - telegram:$telegram-chatID
      triggers:
        - on-sync-failed
        - on-health-degraded

redis:
  enabled: false

externalRedis:
  host: valkey-primary.valkey.svc.cluster.local
  # ACL user app (homelab-common ESO argocd-valkey below).
  existingSecret: argocd-valkey

redisSecretInit:
  enabled: false

repoServer:
  env:
    - name: GOMEMLIMIT
      value: "1700MiB"
  # A pin bump re-renders every app; the default 1s /healthz?full=true timeout
  # tripped and kubelet restarted the pod.
  livenessProbe:
    timeoutSeconds: 5
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 50m
      memory: 512Mi

server:
  env:
    - name: GOMEMLIMIT
      value: "220MiB"
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 15m
      memory: 64Mi

homelab-common:
  # Default-deny ingress: UI, API and webhooks come via the gateway. repo-server
  # :8081 has no auth; keep it unreachable from other namespaces.
  networkPolicy:
    enabled: true

  certificates:
    - name: argocd-server-tls
      secretName: argocd-server-tls
      issuerRef:
        kind: ClusterIssuer
        name: cloudflare-issuer
      dnsNames:
        - "*.example.com"

  tlsRoutes:
    - name: argocd
      hostname: argocd
      service:
        name: argocd-server
        port: 443

  secrets:
    - name: redis                  # -> argocd-redis
      stringData:
        auth: ""

  externalSecrets:
    # The chart reads keys redis-username / redis-password.
    - name: argocd-valkey
      vaultPath: valkey/valkey
      templateData:
        redis-username: "app"
        redis-password: "{{ .password }}"
      data:
        - secretKey: password
          property: password
    - name: argocd-oidc-secret
      vaultPath: argocd/oidc
      targetName: argocd-secret
      creationPolicy: Merge
      data:
        - secretKey: oidc.argocd.clientSecret
          property: client_secret
    # Forgejo push webhook -> /api/webhook; Forgejo signs X-Gogs-Signature,
    # hence the gogs key. Lets timeout.reconciliation stay at 10 min.
    - name: argocd-webhook-secret
      vaultPath: argocd/webhook
      targetName: argocd-secret
      creationPolicy: Merge
      data:
        - secretKey: webhook.gogs.secret
          property: secret

    # The homelab's one Telegram bot (grant `telegram`).
    - name: argocd-notifications-secret
      vaultPath: shared/telegram
      data:
        - secretKey: telegram-token
          property: bot_token
        - secretKey: telegram-chatID
          property: chat_id

    # repo-creds template for every repo under vizzle/ in every AppProject
    # (per-project repo Secrets each needed a copy). git.example.com is the ops
    # node (obsidian/111 Memory/Ops Node.md). Public OCI chart repos need none.
    - name: argocd-repo-creds-forgejo
      vaultPath: argocd/repo-ssh-forgejo
      templateMetadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      templateData:
        url: "ssh://git@git.example.com:22/vizzle"
        type: git
        sshPrivateKey: "{{ .sshPrivateKey }}"
      data:
        - secretKey: sshPrivateKey
          property: sshPrivateKey

  limitRange:
    enabled: true
