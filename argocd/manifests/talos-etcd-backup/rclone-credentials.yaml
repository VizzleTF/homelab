# rclone-креды для выгрузки etcd-снапшотов в обе S3-цели.
# garage — бакет `snapshots` (ключ shared/s3-snapshots), ovh — существующий
# `vaka-homelab` с префиксом snapshots/ (ключ velero/s3-ovh, он переживёт
# вывод Velero: путь в OpenBao остаётся, меняется только потребитель).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapshots-rclone
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend-cluster
    kind: ClusterSecretStore
  target:
    name: snapshots-rclone
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        RCLONE_CONFIG_GARAGE_TYPE: "s3"
        RCLONE_CONFIG_GARAGE_PROVIDER: "Other"
        RCLONE_CONFIG_GARAGE_ENDPOINT: "https://s3.example.com"
        RCLONE_CONFIG_GARAGE_REGION: "garage"
        RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .garage_ak }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .garage_sk }}"
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"
  data:
    - secretKey: garage_ak
      remoteRef: {key: homelab/k8s/shared/s3-snapshots, property: ACCESS_KEY_ID}
    - secretKey: garage_sk
      remoteRef: {key: homelab/k8s/shared/s3-snapshots, property: ACCESS_SECRET_KEY}
    - secretKey: ovh_ak
      remoteRef: {key: homelab/k8s/velero/s3-ovh, property: ACCESS_KEY_ID}
    - secretKey: ovh_sk
      remoteRef: {key: homelab/k8s/velero/s3-ovh, property: ACCESS_SECRET_KEY}
