apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
  annotations:
    # Cascade guard: even if root gets a finalizer or prune again, ArgoCD
    # does not delete this AppSet. Deleting it would take every child
    # Application via ownerReferences, and they would take their namespaces
    # and PVCs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
        revision: HEAD
        files:
          - path: argocd/apps/*/config.yaml
  template:
    metadata:
      name: "{{ .path.basename }}"
      namespace: argocd
      annotations:
        # Resources created before ServerSideApply=true still list
        # argocd-application-controller (operation Update) as a co-owner.
        # SSA then keeps any field that owner shares with argocd-controller
        # after it disappears from values: a removed blueprint volume stayed
        # in authentik-worker on 2026-09-13. On sync, ArgoCD hands those
        # fields over to argocd-controller.
        argocd.argoproj.io/client-side-apply-migration-manager: argocd-application-controller
    spec:
      project: applications
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ dig \"namespace\" .path.basename . }}"
  # No argocd.argoproj.io/sync-wave on generated Applications: they are
  # created by the ApplicationSet controller, not synced by a parent, so a
  # wave would order nothing (progressive syncs stay off: RollingSync turns
  # off autosync). config.yaml `wave` documents the dependency layer only;
  # cold-start order lives in scripts/dr/phases/.
  templatePatch: |
    metadata:
      annotations:
        # argocd-diff CI job (argocd-diff-preview) renders an app only when one of
        # these paths changes in the PR; without it every PR renders every app.
        argocd-diff-preview/watch-pattern: "{{ .path.path }}/.*, argocd/appsets/.*, argocd/values/global.yaml"
      labels:
        app.kubernetes.io/managed-by: argocd-applicationset
        app.kubernetes.io/part-of: applications
      finalizers:
        - resources-finalizer.argocd.argoproj.io/background
    spec:
      sources:
        {{- if not (index . "homelabOnly") }}
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .targetRevision }}"
          helm:
            valueFiles:
              - "$values/{{ .path.path }}/values.yaml"
        {{- end }}
        {{- if index . "cnpgValuesFile" }}
        - repoURL: https://cloudnative-pg.github.io/charts
          chart: cluster
          targetRevision: "0.9.0"
          helm:
            valueFiles:
              - "$values/{{ .path.path }}/{{ .cnpgValuesFile }}"
        {{- end }}
        - repoURL: https://git.example.com/api/packages/vizzle/helm
          chart: homelab-common
          targetRevision: "1.18.1"
          helm:
            valueFiles:
              - "$values/argocd/values/global.yaml"
              - "$values/{{ .path.path }}/{{ dig "homelabValuesFile" "values.yaml" . }}"
        - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
          targetRevision: HEAD
          ref: values
        {{- if index . "extraManifests" }}
        - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
          targetRevision: HEAD
          path: "{{ .path.path }}/manifests"
        {{- end }}
      {{- if index . "ignoreDiff" }}
      ignoreDifferences:
      {{- .ignoreDiff | nindent 4 }}
      {{- end }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          # Resources whose CRD arrives with another Application (VMRule in
          # cilium/longhorn/volsync, BGP CRs) wait for it via retry instead of
          # failing the dry-run of the whole sync.
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
