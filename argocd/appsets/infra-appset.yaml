apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
  annotations:
    # Cascade guard: deleting this AppSet would delete every child Application
    # and with them their namespaces and PVCs.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    # Skips the default foreground finalizer; the template sets the background one.
    preserveResourcesOnDeletion: true
  # Lets one app be paused (automated.enabled=false) without the AppSet reverting
  # it; commands in obsidian/112 ArgoCD/ArgoCD Architecture.md.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy/automated/enabled
  generators:
    - git:
        repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
        revision: HEAD
        files:
          - path: argocd/infra/*/config.yaml
  template:
    metadata:
      name: "{{ .path.basename }}"
      namespace: argocd
      annotations:
        # Pre-SSA resources keep argocd-application-controller as co-owner, so SSA
        # kept fields removed from values (authentik-worker volume, 2026-09-13).
        # On sync ArgoCD hands them to argocd-controller.
        argocd.argoproj.io/client-side-apply-migration-manager: argocd-application-controller
    spec:
      project: infrastructure
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ dig \"namespace\" .path.basename . }}"
  # No sync-wave on generated Applications: the AppSet controller creates them,
  # so a wave orders nothing (RollingSync would turn off autosync). config.yaml
  # `wave` is documentation; cold-start order lives in scripts/dr/phases/.
  templatePatch: |
    metadata:
      annotations:
        # CI argocd-diff renders an app only when these paths change.
        argocd-diff-preview/watch-pattern: "{{ .path.path }}/.*, argocd/appsets/.*, argocd/values/global.yaml"
        # Regenerate only on the app's folder or global.yaml, not every monorepo commit.
        argocd.argoproj.io/manifest-generate-paths: "/{{ .path.path }};/argocd/values/global.yaml"
      labels:
        app.kubernetes.io/managed-by: argocd-applicationset
        app.kubernetes.io/part-of: infrastructure
      finalizers:
        - resources-finalizer.argocd.argoproj.io/background
    spec:
      sources:
        {{- if not (index . "homelabOnly") }}
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .targetRevision }}"
          helm:
            valueFiles:
              - "$values/{{ .path.path }}/values.yaml"
        {{- end }}
        - repoURL: https://git.example.com/api/packages/vizzle/helm
          chart: homelab-common
          targetRevision: "2.2.4"
          helm:
            valueFiles:
              - "$values/argocd/values/global.yaml"
              - "$values/{{ .path.path }}/{{ dig "homelabValuesFile" "values.yaml" . }}"
        - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
          targetRevision: HEAD
          ref: values
        {{- if index . "extraManifests" }}
        - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
          targetRevision: HEAD
          path: "{{ .path.path }}/manifests"
        {{- end }}
      {{- if index . "ignoreDiff" }}
      ignoreDifferences:
      {{- .ignoreDiff | nindent 4 }}
      {{- end }}
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          # CRDs from another Application (VMRule, BGP CRs) arrive via retry
          # instead of failing the whole sync's dry-run.
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
