homelab-common:
  networkPolicy:
    enabled: true

  volsync:
    - name: opencloud-config
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "30 1 * * *"
        - repo: ovh
          schedule: "30 6 * * 0"
    - name: opencloud-data
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "35 1 * * *"
        - repo: ovh
          schedule: "35 6 * * 0"

  externalSecrets:
    - name: opencloud-app-secrets
      vaultPath: opencloud/opencloud
      data:
        - secretKey: idm_admin_password
          property: idm_admin_password
      templateData:
        IDM_ADMIN_PASSWORD: "{{ .idm_admin_password }}"

  httpRoutes:
    - name: opencloud
      hostname: opencloud
      gateway: internal
      service:
        name: opencloud
        port: 9200

  persistentVolumeClaims:
    # Holds generated service secrets: losing it invalidates every issued token.
    - name: opencloud-config
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 1Gi
    - name: opencloud-data
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 50Gi

  configMaps:
    - name: opencloud
      data:
        # Upstream csp.yaml with the IdP host set to Authentik.
        csp.yaml: |
          directives:
            child-src:
              - "'self'"
            connect-src:
              - "'self'"
              - 'blob:'
              - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
              - 'https://authentik.example.com/'
              - 'https://tile.openstreetmap.org/'
            default-src:
              - "'none'"
            font-src:
              - "'self'"
            frame-ancestors:
              - "'self'"
            frame-src:
              - "'self'"
              - 'blob:'
              - 'https://embed.diagrams.net/'
              - 'https://docs.opencloud.eu'
              - 'https://authentik.example.com/'
            img-src:
              - "'self'"
              - 'data:'
              - 'blob:'
              - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
              - 'https://tile.openstreetmap.org/'
            manifest-src:
              - "'self'"
            media-src:
              - "'self'"
            object-src:
              - "'self'"
              - 'blob:'
            script-src:
              - "'self'"
              - "'unsafe-inline'"
              - 'https://authentik.example.com/'
            style-src:
              - "'self'"
              - "'unsafe-inline'"
              - 'blob:'
            worker-src:
              - "'self'"
              - 'blob:'

  workloads:
    - name: opencloud
      legacySelector:
        app: opencloud              # immutable selector of the existing Deployment
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: opencloud
          image:
            repository: opencloudeu/opencloud
            tag: "7.2.4"
          # `opencloud init` fails once the config exists; ignore it.
          command: ["/bin/sh"]
          args:
            - -c
            - opencloud init || true; opencloud server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 9200
          envFrom:
            - secretRef:
                name: opencloud-app-secrets
          env:
            - name: OC_URL
              value: https://opencloud.example.com
            - name: PROXY_HTTP_ADDR
              value: 0.0.0.0:9200
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "false"
            - name: OC_LOG_LEVEL
              value: info
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            - name: FRONTEND_CHECK_FOR_UPDATES
              value: "false"
            - name: FRONTEND_ARCHIVER_MAX_SIZE
              value: "10000000000"
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/opencloud-csp/csp.yaml
            # idm stays: it is the user store autoprovisioning writes to.
            - name: OC_EXCLUDE_RUN_SERVICES
              value: idp
            - name: OC_OIDC_ISSUER
              value: https://authentik.example.com/application/o/opencloud/
            - name: IDP_DOMAIN
              value: authentik.example.com
            - name: OC_OIDC_CLIENT_ID
              value: opencloud-web
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: jwt
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            # `sub` survives renames, preferred_username does not.
            - name: PROXY_USER_OIDC_CLAIM
              value: sub
            - name: PROXY_AUTOPROVISION_CLAIM_USERNAME
              value: sub
            - name: PROXY_USER_CS3_CLAIM
              value: username
            - name: OC_LDAP_SERVER_WRITE_ENABLED
              value: "true"
            # A user in neither opencloudAdmin nor opencloudUser cannot log in.
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: oidc
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: roles
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "false"
            - name: GRAPH_USERNAME_MATCH
              value: none
            - name: SETTINGS_SETUP_DEFAULT_ASSIGNMENTS
              value: "false"
            - name: OC_ADMIN_USER_ID
              value: ""
            # All clients share the `opencloud-web` provider (one issuer per app).
            # Without `roles` here the web UI never gets the claim and every login is refused.
            - name: WEB_OIDC_SCOPE
              value: openid profile email roles
            - name: WEBFINGER_WEB_OIDC_CLIENT_ID
              value: opencloud-web
            - name: WEBFINGER_WEB_OIDC_CLIENT_SCOPES
              value: openid profile email roles
            - name: WEBFINGER_DESKTOP_OIDC_CLIENT_ID
              value: opencloud-web
            - name: WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES
              value: openid profile email roles offline_access
            - name: WEB_OPTION_ACCOUNT_EDIT_LINK_HREF
              value: https://authentik.example.com/if/user/
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      persistence:
        config:
          claim: opencloud-config
          mountPath: /etc/opencloud
        data:
          claim: opencloud-data
          mountPath: /var/lib/opencloud
        csp:
          configMap:
            name: opencloud
          mountPath: /etc/opencloud-csp
          readOnly: true
