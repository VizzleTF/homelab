# Only images that kauri-sync's release workflow built and signed from a tag
# run here (keyless cosign, Sigstore). A pinned digest stops a moved tag; this
# also stops an image pushed with stolen registry credentials.
# obsidian 116 Plans/kauri-sync.md
apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: kauri-sync-signed-image
  namespace: kauri-sync
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/vizzletf/kauri-sync*"
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/VizzleTF/kauri-sync/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.filter(i, i.startsWith('ghcr.io/vizzletf/kauri-sync'))
        .all(i, verifyImageSignatures(i, [attestors.release]) > 0)
      message: kauri-sync runs only images signed by its release workflow from a tag.
