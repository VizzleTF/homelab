apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kauri-sync-db-daily-backup
  namespace: kauri-sync
spec:
  schedule: "0 55 5 * * *"
  backupOwnerReference: self
  cluster:
    name: kauri-sync-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
