# Used by authentik; atuin and pg_dump go to cnpg-cluster-rw directly.
# max_prepared_statements: clients that prepare statements need it; changing it restarts pgbouncer.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: cnpg-cluster-pooler-rw
  namespace: cnpg
spec:
  cluster:
    name: cnpg-cluster
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "10"
      max_prepared_statements: "200"
  template:
    spec:
      # Hard spread: tuppr's PreferNoSchedule taint beats a soft one, both land on one
      # node and descheduler evicts every 5 min, resetting authentik connections.
      # matchLabelKeys keeps old ReplicaSet pods out of the skew so rollouts proceed.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              cnpg.io/poolerName: cnpg-cluster-pooler-rw
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
