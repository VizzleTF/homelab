# Cluster default is privileged. Prune/Delete=false: deleting the app must never
# take the namespace and cnpg-cluster's local-path PVCs with it.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg
  labels:
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
