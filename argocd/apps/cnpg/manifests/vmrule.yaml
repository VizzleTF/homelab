# Не `cnpg_collector_last_available_backup_timestamp`: метрика in-tree barman застыла.
# Свежесть backup — из barman_cloud_cloudnative_pg_io_* (плагин).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cnpg-backup
  namespace: victoria-metrics
spec:
  groups:
    - name: cnpg-backup
      rules:
        - alert: CnpgWalArchiveBacklog
          expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 10
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "CNPG {{ $labels.namespace }}/{{ $labels.pod }}: WAL не уезжают в S3"
            description: |
              Больше 10 сегментов ждут архивации дольше 30 минут — barman отстаёт
              или не пишет в Garage. PITR-окно перестаёт наполняться, а pg_wal
              на диске растёт до заполнения тома.
              kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c postgres --tail=100
              kubectl -n {{ $labels.namespace }} exec {{ $labels.pod }} -- psql -c 'select * from pg_stat_archiver'

        - alert: CnpgWalArchiveFailing
          expr: increase(cnpg_collector_pg_wal_archive_status{value="ready"}[2h]) > 50
          labels:
            severity: warning
          annotations:
            summary: "CNPG {{ $labels.namespace }}/{{ $labels.pod }}: очередь WAL растёт"
            description: |
              Очередь на архивацию выросла больше чем на 50 сегментов за два часа —
              архивация не успевает за нагрузкой.

        - alert: CnpgMetricsDown
          expr: absent(cnpg_collector_pg_wal_archive_status) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Метрики CNPG пропали"
            description: |
              cnpg_* не скрейпятся >30 минут — состояние архивации WAL снова
              вслепую. Проверить VMPodScrape cnpg и поды инстансов.

        # Daily schedule + slack = 30h.
        - alert: CnpgBaseBackupStale
          expr: (time() - max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)) > 30 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "CNPG {{ $labels.namespace }}: base backup старше 30 часов"
            description: |
              Ежедневный base backup не появился — PITR опирается на всё более
              старую точку, а restore растягивается на весь хвост WAL.
              kubectl -n {{ $labels.namespace }} get backups.postgresql.cnpg.io --sort-by=.metadata.creationTimestamp | tail -3
