# Operator-defaulted fields are omitted on purpose.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
  namespace: cnpg
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: 3
  # Majors automerge too: a major bump runs an offline in-place pg_upgrade.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm"
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  primaryUpdateMethod: switchover
  # Keeps the cnpg-cluster-superuser secret; the default is false.
  enableSuperuserAccess: true

  # local-path: replication already keeps three copies. Node lost → destroy that
  # instance, CNPG rebuilds it from the primary.
  storage:
    size: "5Gi"
    storageClass: local-path

  env:
    - name: AWS_DEFAULT_REGION
      value: garage

  postgresql:
    parameters:
      max_connections: "150"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      # Cut disk writes: default 5min archive_timeout + wal_init_zero wrote ~4.6 GB/day
      # vs ~0.4 GB real WAL (2026-10). 30min RPO is fine here.
      archive_timeout: "30min"
      wal_init_zero: "off"
      wal_compression: "lz4"
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"

  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: authentik-db-credentials
      - name: atuin
        ensure: present
        login: true
        passwordSecret:
          name: atuin-db-credentials

  # Init-only; mirrors live to avoid SSA churn.
  bootstrap:
    initdb:
      database: app
      owner: app
      encoding: UTF8
      localeCollate: C
      localeCType: C

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # Atomic list: without `enabled` the defaulted field drops -> perpetual OutOfSync.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-cluster-store
        # Must match the existing catalog: s3://cnpg-backups/cnpg-cluster/cnpg-cluster.
        serverName: cnpg-cluster
