# Shared cnpg-cluster (authentik / forgejo / atuin / sparkyfitness).
# Managed as a raw manifest (not the cloudnative-pg/cluster chart) because that
# chart (≤0.6.1 at the PG18 migration) could not emit .spec.plugins, required for
# the Barman Cloud Plugin after PG18 GA images dropped in-tree barman. Spec mirrors the prior
# chart-rendered values so ArgoCD adopts the live Cluster in place (SSA, no
# recreate). Operator-defaulted fields (probes, monitoring, extra postgresql
# params, etc.) are intentionally omitted — the operator manages them.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
  namespace: cnpg
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: 3
  # Full `standard` image — Renovate-managed, majors gated manual (renovate.json).
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm"
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  primaryUpdateMethod: switchover
  # match prior chart state — keeps the generated superuser secret
  # (postgres-credentials consumer); omitting it defaults to false.
  enableSuperuserAccess: true

  # local-path since 2026-10: streaming replication already keeps three
  # copies; Longhorn's two replicas under each made it six on the SATA SSDs
  # etcd shares. Applies to new PVCs only — existing instances are recreated
  # one by one (docs/reduce-disk-writes.md). A lost node = destroy that
  # instance, CNPG rebuilds it from the primary.
  storage:
    size: "5Gi"
    storageClass: local-path

  # Garage region for any barman tooling that runs in the postgres container path.
  env:
    - name: AWS_DEFAULT_REGION
      value: garage

  postgresql:
    parameters:
      max_connections: "150"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      # Disk writes (2026-10): CNPG's archive_timeout=5min closed a 16 MB WAL
      # segment every 5 min and wal_init_zero zero-filled each new one — ~4.6
      # GB/day per instance against ~0.4 GB/day of real WAL. 30min keeps the
      # barman RPO acceptable for a homelab. lz4 shrinks full-page images, and
      # rarer checkpoints mean fewer of them.
      archive_timeout: "30min"
      wal_init_zero: "off"
      wal_compression: "lz4"
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"

  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        passwordSecret:
          name: authentik-db-credentials
      - name: forgejo
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: forgejo-db-credentials
      - name: atuin
        ensure: present
        login: true
        passwordSecret:
          name: atuin-db-credentials
      # SparkyFitness: both roles pre-created so the app skips CREATE ROLE and the
      # owner needs no CREATEROLE (upstream "Option B").
      - name: sparkyfitness
        ensure: present
        login: true
        passwordSecret:
          name: sparkyfitness-db-credentials
      - name: sparkyfitness_app
        ensure: present
        login: true
        passwordSecret:
          name: sparkyfitness-app-db-credentials

  # init-only; ignored on the existing cluster. Mirrors live to avoid SSA churn.
  bootstrap:
    initdb:
      database: app
      owner: app
      encoding: UTF8
      localeCollate: C
      localeCType: C

  # Barman Cloud Plugin: WAL archiving + backups via the ObjectStore CR.
  # Replaces .spec.backup.barmanObjectStore (removed).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # mirrors the webhook default: .spec.plugins is an atomic list, so an
      # apply without `enabled` would drop the defaulted field -> perpetual OutOfSync
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-cluster-store
        # serverName must match the prior in-tree layout for backup continuity:
        # objects live at <destinationPath>/<serverName> = s3://cnpg-backups/cnpg-cluster/cnpg-cluster
        serverName: cnpg-cluster
