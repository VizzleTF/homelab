# Не `enablePodMonitor`: CRD PodMonitor в кластере нет. Без этого скрейпа
# отказ архивации WAL и base backup невидимы.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg
  namespace: victoria-metrics
spec:
  namespaceSelector:
    matchNames:
      - cnpg
      - immich
  selector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
