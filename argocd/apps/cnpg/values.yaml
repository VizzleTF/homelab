# CloudNativePG CNPG Configuration
# For HomeLab environment with minimal resources

homelab-common:
  # Default-deny ingress to the shared Postgres (instances + pooler). Own
  # namespace covers replication, pooler -> instances and the pglogical job.
  # A new app that needs Postgres: add its namespace to the 5432 entry.
  networkPolicy:
    enabled: true
    allow:
      # CNPG operator and the barman-cloud plugin -> instance manager
      - namespaces: [cnpg-system]
      # postgres exporter :9187, pgbouncer exporter :9127
      - namespaces: [victoria-metrics]
        ports: [9187, 9127]
      # database clients
      - namespaces: [authentik, forgejo, atuin]
        ports: [5432]

  externalSecrets:
    - name: postgres-credentials
      vaultPath: cnpg/postgres
      data:
        - secretKey: username
          property: username
        - secretKey: password
          property: password
      templateData:
        username: "{{ .username }}"
        password: "{{ .password }}"
        postgres-password: "{{ .password }}"

    # CNPG-side credentials for shared cluster roles. Apps continue to read their
    # own secrets from their namespaces; these copies live in ns cnpg so the
    # Cluster CR can reference them via roles[].passwordSecret. CNPG expects a
    # `kubernetes.io/basic-auth` secret with `username` and `password` keys
    # matching the role name.
    - name: authentik-db-credentials
      templateType: kubernetes.io/basic-auth
      data:
        - secretKey: password
          vaultPath: authentik/authentik
          property: db_password
      templateData:
        username: authentik
        password: "{{ .password }}"

    - name: forgejo-db-credentials
      templateType: kubernetes.io/basic-auth
      data:
        - secretKey: password
          vaultPath: forgejo/forgejo
          property: password
      templateData:
        username: forgejo
        password: "{{ .password }}"

    - name: atuin-db-credentials
      templateType: kubernetes.io/basic-auth
      data:
        - secretKey: password
          vaultPath: atuin/atuin
          property: password
      templateData:
        username: atuin
        password: "{{ .password }}"

    - name: cnpg-s3-backup
      vaultPath: shared/s3-cnpg-backup
      data:
        - secretKey: ACCESS_KEY_ID
          property: ACCESS_KEY_ID
        - secretKey: ACCESS_SECRET_KEY
          property: ACCESS_SECRET_KEY

    # rclone OVH creds for the pg_dump -> pg-logical CronJob (an independent off-site
    # logical dump, not a barman mirror). Vault: home/homelab/k8s/shared/s3-ovh.
    - name: ovh-pglogical-rclone
      vaultPath: shared/s3-ovh
      data:
        - secretKey: ovh_ak
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          property: ACCESS_SECRET_KEY
      templateData:
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"

  # Every application database is declared here (adoption of an existing DB is
  # a no-op; reclaim policy retain). `app` is the initdb placeholder, unused.
  cnpgDatabases:
    - name: authentik
      owner: authentik
      clusterName: cnpg-cluster
    - name: forgejo
      owner: forgejo
      clusterName: cnpg-cluster
    - name: atuin
      owner: atuin
      clusterName: cnpg-cluster

  limitRange:
    enabled: true

  # Independent logical backup (pg_dump -Fc) -> OVH pg-logical/cnpg-cluster/.
  # Runs alongside barman -> Garage (on-site PITR). pg_dump is self-contained,
  # restorable into any PG and independent of Garage (survives a wipe). Per DB as
  # its owner (no superuser dependency). The initContainer dumps into an emptyDir,
  # the main container runs rclone copy (append, not sync) + prunes >90d.
  # Tier: secrets, daily 03:50, 90d retention.
  workloads:
    - name: pglogical-offsite       # -> CronJob cnpg-pglogical-offsite
      type: cronjob
      schedule: "50 3 * * *"
      job:
        activeDeadlineSeconds: 3600
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 26
          runAsGroup: 26
          fsGroup: 26
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: dump
            image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -euo pipefail
                ts=$(date -u +%Y%m%dT%H%M%SZ)
                dump() {
                  echo "[$(date -u)] pg_dump $1"
                  PGPASSWORD="$3" pg_dump -h cnpg-cluster-rw -U "$2" -Fc -d "$1" \
                    -f "/dump/$1-$ts.dump"
                }
                dump authentik "$AK_USER" "$AK_PASS"
                dump forgejo   "$FJ_USER" "$FJ_PASS"
                dump atuin     "$AT_USER" "$AT_PASS"
                ls -lh /dump
            env:
              - name: AK_USER
                valueFrom: {secretKeyRef: {name: authentik-db-credentials, key: username}}
              - name: AK_PASS
                valueFrom: {secretKeyRef: {name: authentik-db-credentials, key: password}}
              - name: FJ_USER
                valueFrom: {secretKeyRef: {name: forgejo-db-credentials, key: username}}
              - name: FJ_PASS
                valueFrom: {secretKeyRef: {name: forgejo-db-credentials, key: password}}
              - name: AT_USER
                valueFrom: {secretKeyRef: {name: atuin-db-credentials, key: username}}
              - name: AT_PASS
                valueFrom: {secretKeyRef: {name: atuin-db-credentials, key: password}}
            volumeMounts:           # persistence mounts only into containers, not initContainers
              - name: dump
                mountPath: /dump
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: upload
          image:
            repository: rclone/rclone
            tag: "1.75.2"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[$(date -u)] rclone copy /dump -> ovh:offsite-homelab/pg-logical/cnpg-cluster/"
              rclone copy /dump ovh:offsite-homelab/pg-logical/cnpg-cluster/ \
                --s3-acl=private --stats-one-line --stats=2m
              echo "[$(date -u)] prune >90d"
              rclone delete ovh:offsite-homelab/pg-logical/cnpg-cluster/ \
                --min-age 2160h --rmdirs || true
          envFrom:
            - secretRef:
                name: ovh-pglogical-rclone
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      persistence:
        dump:
          emptyDir: {}
          mountPath: /dump
