homelab-common:
  # A new app that needs Postgres: add its namespace to the 5432 entry.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [cnpg-system]
      - namespaces: [victoria-metrics]
        ports: [9187, 9127]
      - namespaces: [authentik, atuin]
        ports: [5432]

  externalSecrets:
    # Copies for roles[].passwordSecret: basic-auth, `username` must equal the role name.
    - name: authentik-db-credentials
      templateType: kubernetes.io/basic-auth
      data:
        - secretKey: password
          vaultPath: authentik/authentik
          property: db_password
      templateData:
        username: authentik
        password: "{{ .password }}"

    - name: atuin-db-credentials
      templateType: kubernetes.io/basic-auth
      data:
        - secretKey: password
          vaultPath: atuin/atuin
          property: password
      templateData:
        username: atuin
        password: "{{ .password }}"

    - name: cnpg-s3-backup
      vaultPath: shared/s3-cnpg-backup
      data:
        - secretKey: ACCESS_KEY_ID
          property: ACCESS_KEY_ID
        - secretKey: ACCESS_SECRET_KEY
          property: ACCESS_SECRET_KEY

    - name: ovh-pglogical-rclone
      vaultPath: shared/s3-ovh
      data:
        - secretKey: ovh_ak
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_crypt_pw
          vaultPath: shared/ovh-crypt
          property: password
        - secretKey: ovh_crypt_pw2
          vaultPath: shared/ovh-crypt
          property: password2
      templateData:
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"
        # Dumps on OVH go through crypt; same remote as openbao, tfstate-mirror
        # and the ops node. Passwords stored rclone-obscured. Names stay plain.
        RCLONE_CONFIG_OVHCRYPT_TYPE: "crypt"
        RCLONE_CONFIG_OVHCRYPT_REMOTE: "ovh:offsite-homelab/crypt"
        RCLONE_CONFIG_OVHCRYPT_FILENAME_ENCRYPTION: "off"
        RCLONE_CONFIG_OVHCRYPT_DIRECTORY_NAME_ENCRYPTION: "false"
        RCLONE_CONFIG_OVHCRYPT_PASSWORD: "{{ .ovh_crypt_pw }}"
        RCLONE_CONFIG_OVHCRYPT_PASSWORD2: "{{ .ovh_crypt_pw2 }}"

  # `app` is the unused initdb placeholder.
  cnpgDatabases:
    - name: authentik
      owner: authentik
      clusterName: cnpg-cluster
    - name: atuin
      owner: atuin
      clusterName: cnpg-cluster

  limitRange:
    enabled: true

  # Off-site pg_dump to OVH, independent of barman/Garage. Per DB as its owner.
  # Direct to cnpg-cluster-rw: dumps must not go through the transaction pooler.
  workloads:
    - name: pglogical-offsite
      type: cronjob
      schedule: "50 3 * * *"
      job:
        activeDeadlineSeconds: 3600
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 26
          runAsGroup: 26
          fsGroup: 26
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: dump
            image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -euo pipefail
                ts=$(date -u +%Y%m%dT%H%M%SZ)
                dump() {
                  echo "[$(date -u)] pg_dump $1"
                  PGPASSWORD="$3" pg_dump -h cnpg-cluster-rw -U "$2" -Fc -d "$1" \
                    -f "/dump/$1-$ts.dump"
                }
                dump authentik "$AK_USER" "$AK_PASS"
                dump atuin     "$AT_USER" "$AT_PASS"
                ls -lh /dump
            env:
              - name: AK_USER
                valueFrom: {secretKeyRef: {name: authentik-db-credentials, key: username}}
              - name: AK_PASS
                valueFrom: {secretKeyRef: {name: authentik-db-credentials, key: password}}
              - name: AT_USER
                valueFrom: {secretKeyRef: {name: atuin-db-credentials, key: username}}
              - name: AT_PASS
                valueFrom: {secretKeyRef: {name: atuin-db-credentials, key: password}}
            volumeMounts:           # persistence mounts only into containers, not initContainers
              - name: dump
                mountPath: /dump
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: upload
          image:
            repository: rclone/rclone
            tag: "1.75.2"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[$(date -u)] rclone copy /dump -> ovhcrypt:pg-logical/cnpg-cluster/"
              rclone copy /dump ovhcrypt:pg-logical/cnpg-cluster/ \
                --s3-acl=private --stats-one-line --stats=2m
              echo "[$(date -u)] prune >90d"
              rclone delete ovhcrypt:pg-logical/cnpg-cluster/ \
                --min-age 2160h --rmdirs || true
          envFrom:
            - secretRef:
                name: ovh-pglogical-rclone
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      persistence:
        dump:
          emptyDir: {}
          mountPath: /dump
