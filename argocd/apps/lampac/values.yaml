homelab-common:
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [keda]
        ports: [9118]

  httpRoutes:
    # `service:` is ignored while kedaColdStartLoadingPage is set. The backendRef
    # needs the ReferenceGrant in argocd/infra/keda-add-ons-http/manifests/referencegrant.yaml.
    - name: lampac
      hostname: lampac
      gateway: internal
      kedaColdStartLoadingPage: true
      service:
        name: keda-add-ons-http-interceptor-proxy
        namespace: keda
        port: 8080

  configMaps:
    - name: init-conf
      data:
        init.conf: |
          {
            "listen": {
              "ip": "0.0.0.0",
              "port": 9118,
              "scheme": "https"
            },
            "chromium": {
              "enable": false
            },
            "BaseModule": {
              "SkipModules": [
                "OnlineUKR",
                "OnlineENG",
                "OnlineGEO",
                "OnlinePaid",
                "WatchTogether",
                "MsxNative",
                "ForkPlayerXML",
                "Community",
                "Catalog",
                "DLNA",
                "Tracks",
                "Transcoding",
                "WebLog",
                "NextHUB"
              ]
            }
          }

  workloads:
    - name: lampac                  # no replicas: KEDA scales 0..1
      pod:
        # Keep: the live template still has the unowned alias serviceAccount: lampac;
        # without this the apiserver restores it and cold starts fail on the pruned SA.
        serviceAccountName: default
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        # Off control-plane: it downloads and runs the TorrServer binary at runtime.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      containers:
        - name: lampac
          # Tags exist as `X.Y.Z` and `vX.Y.Z`; renovate.json locks the non-v scheme.
          image:
            repository: ghcr.io/lampac-nextgen/lampac
            tag: "1.86.0"
          ports:
            - name: http
              containerPort: 9118
          env:
            - name: LAMPAC_PORT
              value: "9118"
          # Cold start takes ~130-150s.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 700Mi           # observed peak 645Mi
            limits:
              cpu: 500m
              memory: 2400Mi
      persistence:
        init-conf:
          configMap:
            name: lampac-init-conf
          mountPath: /lampac/init.conf   # image WORKDIR
          subPath: init.conf
          readOnly: true
        dshm:
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
          mountPath: /dev/shm
