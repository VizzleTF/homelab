# Lampac - Media server with online sources, torrents and DLNA support
# Source: https://github.com/lampac-nextgen/lampac
homelab-common:
  networkPolicy:
    enabled: true
    allow:
      # KEDA HTTP interceptor / loading proxy
      - namespaces: [keda]
        ports: [9118]

  httpRoutes:
    # KEDA-fronted scale-to-zero (see manifests/httpscaledobject.yaml).
    # kedaColdStartLoadingPage points the backend at keda-loading-proxy, so a
    # cold start shows a "service is starting" page; `service:` is ignored
    # while it is set. The cross-namespace backendRef needs the ReferenceGrant
    # in ns keda (argocd/infra/keda-add-ons-http/manifests/referencegrant.yaml).
    - name: lampac
      hostname: lampac
      gateway: internal
      kedaColdStartLoadingPage: true
      service:
        name: keda-add-ons-http-interceptor-proxy
        namespace: keda
        port: 8080

  configMaps:
    - name: init-conf               # -> lampac-init-conf
      data:
        init.conf: |
          {
            "listen": {
              "ip": "0.0.0.0",
              "port": 9118,
              "scheme": "https"
            },
            "chromium": {
              "enable": false
            },
            "BaseModule": {
              "SkipModules": [
                "OnlineUKR",
                "OnlineENG",
                "OnlineGEO",
                "OnlinePaid",
                "WatchTogether",
                "MsxNative",
                "ForkPlayerXML",
                "Community",
                "Catalog",
                "DLNA",
                "Tracks",
                "Transcoding",
                "WebLog",
                "NextHUB"
              ]
            }
          }

  workloads:
    - name: lampac                  # -> Deployment + Service "lampac"; no replicas: KEDA scales 0..1
      pod:
        # Explicit: the live pod template still carries the deprecated alias
        # serviceAccount: lampac, which no field manager owns. Dropping only
        # serviceAccountName would let the apiserver restore it from the alias,
        # and the next cold start would fail once the old SA is pruned.
        serviceAccountName: default
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        # Keep it off the control-plane nodes: lampac downloads and runs the
        # TorrServer binary at runtime (Falco "drop and execute new binary"),
        # which should not happen next to etcd. Stateless, so any
        # non-control-plane node is fine.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      containers:
        - name: lampac
          # Upstream tags every release as both `X.Y.Z` and `vX.Y.Z`. Stay on the
          # non-v scheme: a renovate.json rule (allowedVersions "!/^v/") locks
          # tracking to it so the prefix never flips.
          image:
            repository: ghcr.io/lampac-nextgen/lampac
            tag: "1.84.3"
          ports:
            - name: http
              containerPort: 9118
          env:
            - name: LAMPAC_PORT
              value: "9118"
          # Cold start compiles modules and binds Kestrel in ~130-150s: the
          # startupProbe allows 24*10=240s, after it liveness restarts a hung
          # pod within 5*15=75s.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 700Mi           # observed peak 645Mi
            limits:
              cpu: 500m
              memory: 2400Mi
      persistence:
        init-conf:
          configMap:
            name: lampac-init-conf
          mountPath: /lampac/init.conf   # WORKDIR of the image
          subPath: init.conf
          readOnly: true
        dshm:
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
          mountPath: /dev/shm
