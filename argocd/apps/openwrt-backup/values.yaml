# `sysupgrade -b` already includes /etc/bird.conf (Cilium LB BGP peer): no
# /etc/sysupgrade.conf edit needed.
homelab-common:
  networkPolicy:
    enabled: true

  externalSecrets:
    # Admin id_rsa; its pubkey is in the router's /etc/dropbear/authorized_keys.
    - name: openwrt-ssh-key
      vaultPath: openwrt-backup/ssh
      data:
        - secretKey: id_rsa
          property: id_rsa

    # Garage bucket config-backups, NOT velero-backups: Velero fails the BSL
    # with "invalid top-level dir".
    - name: openwrt-backup-rclone
      data:
        - secretKey: garage_ak
          vaultPath: openwrt-backup/s3-config-backups
          property: ACCESS_KEY_ID
        - secretKey: garage_sk
          vaultPath: openwrt-backup/s3-config-backups
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_ak
          vaultPath: shared/s3-ovh
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          vaultPath: shared/s3-ovh
          property: ACCESS_SECRET_KEY
      templateData:
        RCLONE_CONFIG_GARAGE_TYPE: "s3"
        RCLONE_CONFIG_GARAGE_PROVIDER: "Other"
        RCLONE_CONFIG_GARAGE_ENDPOINT: "https://s3.example.com"
        RCLONE_CONFIG_GARAGE_REGION: "garage"
        RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .garage_ak }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .garage_sk }}"
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"

  workloads:
    - name: config-backup
      type: cronjob
      schedule: "30 5 * * 0"
      job:
        activeDeadlineSeconds: 600
      pod:
        securityContext:
          runAsUser: 0              # root for apk add
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: backup
          image:
            repository: alpine
            tag: "3.24.3"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache openssh-client rclone >/dev/null
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              mkdir -p /tmp/b
              echo "[$(date -u)] ssh sysupgrade -b root@10.11.12.1"
              ssh -i /ssh/id_rsa -T \
                -o StrictHostKeyChecking=accept-new \
                -o UserKnownHostsFile=/tmp/known_hosts \
                -o ConnectTimeout=15 \
                root@10.11.12.1 "sysupgrade -b -" > "/tmp/b/owrt-router-$ts.tar.gz"
              ls -lh /tmp/b/
              gzip -t /tmp/b/*.tar.gz
              for r in garage:config-backups/openwrt ovh:offsite-homelab/openwrt; do
                echo "[$(date -u)] rclone copy -> $r/"
                rclone copy /tmp/b "$r/" --s3-acl=private --stats-one-line
                rclone delete "$r/" --min-age 2160h --rmdirs || true
              done
              echo "[$(date -u)] done"
          envFrom:
            - secretRef:
                name: openwrt-backup-rclone
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      persistence:
        ssh:
          secret:
            secretName: openwrt-ssh-key
            defaultMode: 0400
            items:
              - key: id_rsa
                path: id_rsa
          mountPath: /ssh
          readOnly: true
