# OpenWrt config backup — cluster-side CronJob.
# SSH root@10.11.12.1 (main router) → `sysupgrade -b -` streams the config tarball
# to stdout → upload to Garage (on-site) + OVH (off-site, independent, versioned).
# The backup logic lives in the cluster, NOT on the router (never keep a backup
# on the thing being backed up).
#
# `sysupgrade -b` includes /etc/config/* + /etc/bird.conf (the BGP peer for the
# Cilium LB!) + dnsmasq + usteer (BTM) + crontabs + dropbear/authorized_keys by
# default — the bird2 package registers its conffile, no need to edit
# /etc/sysupgrade.conf.
homelab-common:
  # Default-deny ingress (homelab-common >= 1.17): own namespace, gateway,
  # probes and API server only; extra sources from Hubble flows 2026-09-24.
  networkPolicy:
    enabled: true

  externalSecrets:
    # SSH private key (reuses the existing admin id_rsa). The pubkey is already in
    # /etc/dropbear/authorized_keys on the router. Vault: home/homelab/k8s/openwrt-backup/ssh.
    - name: openwrt-ssh-key
      vaultPath: openwrt-backup/ssh
      data:
        - secretKey: id_rsa
          property: id_rsa

    # rclone creds: Garage (dedicated bucket config-backups — NOT velero-backups,
    # otherwise Velero fails the garage-default BSL with "invalid top-level dir") + OVH (off-site).
    - name: openwrt-backup-rclone
      data:
        - secretKey: garage_ak
          vaultPath: openwrt-backup/s3-config-backups
          property: ACCESS_KEY_ID
        - secretKey: garage_sk
          vaultPath: openwrt-backup/s3-config-backups
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_ak
          vaultPath: velero/s3-ovh
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          vaultPath: velero/s3-ovh
          property: ACCESS_SECRET_KEY
      templateData:
        RCLONE_CONFIG_GARAGE_TYPE: "s3"
        RCLONE_CONFIG_GARAGE_PROVIDER: "Other"
        RCLONE_CONFIG_GARAGE_ENDPOINT: "https://s3.example.com"
        RCLONE_CONFIG_GARAGE_REGION: "garage"
        RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .garage_ak }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .garage_sk }}"
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"

  workloads:
    - name: config-backup           # -> CronJob openwrt-backup-config-backup
      type: cronjob
      schedule: "30 5 * * 0"        # Sundays 05:30 UTC (weekly, configs change rarely)
      # Chart defaults: concurrencyPolicy Forbid, startingDeadlineSeconds 600,
      # history 1/3, backoffLimit 2, restartPolicy OnFailure.
      job:
        activeDeadlineSeconds: 600
      pod:
        securityContext:
          runAsUser: 0              # root for apk add; the pod is short-lived
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: backup
          image:
            repository: alpine
            tag: "3.24.2"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache openssh-client rclone >/dev/null
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              mkdir -p /tmp/b
              echo "[$(date -u)] ssh sysupgrade -b root@10.11.12.1"
              ssh -i /ssh/id_rsa -T \
                -o StrictHostKeyChecking=accept-new \
                -o UserKnownHostsFile=/tmp/known_hosts \
                -o ConnectTimeout=15 \
                root@10.11.12.1 "sysupgrade -b -" > "/tmp/b/owrt-router-$ts.tar.gz"
              ls -lh /tmp/b/
              gzip -t /tmp/b/*.tar.gz   # sanity: valid gzip
              for r in garage:config-backups/openwrt ovh:vaka-homelab/openwrt; do
                echo "[$(date -u)] rclone copy -> $r/"
                rclone copy /tmp/b "$r/" --s3-acl=private --stats-one-line
                rclone delete "$r/" --min-age 2160h --rmdirs || true
              done
              echo "[$(date -u)] done"
          envFrom:
            - secretRef:
                name: openwrt-backup-rclone
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      persistence:
        ssh:
          secret:
            secretName: openwrt-ssh-key
            defaultMode: 0400
            items:
              - key: id_rsa
                path: id_rsa
          mountPath: /ssh
          readOnly: true
