chart: trek
repoURL: https://chart.liketrek.com
targetRevision: "4.3.4"
wave: "2"
# Travel-only app: kept at replicas 0 and scaled up on demand
# (`kubectl -n trek scale deploy/trek --replicas=1` before a trip, back to 0
# after). The chart hardcodes replicas: 1, so ArgoCD ignores the field.
# Data and VolSync backups keep running while it is at 0.
ignoreDiff: |
  - group: apps
    kind: Deployment
    jsonPointers:
      - /spec/replicas
