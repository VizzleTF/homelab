# Replicas 0 by design: see config.yaml.

existingSecret: trek-secret

env:
  DEFAULT_LANGUAGE: "ru"
  APP_URL: "https://trek.example.com"
  ALLOWED_ORIGINS: "https://trek.example.com"
  FORCE_HTTPS: "true"
  TRUST_PROXY: "1"
  OIDC_ISSUER: "https://authentik.example.com/application/o/trek/"
  OIDC_DISCOVERY_URL: "https://authentik.example.com/application/o/trek/.well-known/openid-configuration"
  OIDC_CLIENT_ID: "trek"
  OIDC_DISPLAY_NAME: "Authentik"
  OIDC_SCOPE: "openid email profile"

# PVCs are declared in homelab-common below; the chart only mounts them.
persistence:
  data:
    existingClaim: trek-data
  uploads:
    existingClaim: trek-uploads

homelab-common:
  persistentVolumeClaims:
    - name: trek-data
      accessModes: [ReadWriteOnce]
      storageClassName: longhorn
      size: 1Gi
    - name: trek-uploads
      accessModes: [ReadWriteOnce]
      storageClassName: longhorn
      size: 10Gi

  networkPolicy:
    enabled: true

  volsync:
    - name: trek-data
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "40 0 * * *"
        - repo: ovh
          schedule: "40 5 * * 0"
    - name: trek-uploads
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "45 0 * * *"
        - repo: ovh
          schedule: "45 5 * * 0"

  httpRoutes:
    - name: trek
      hostname: trek
      gateway: internal
      # With FORCE_HTTPS trek redirects forever (ERR_TOO_MANY_REDIRECTS) when a hop
      # sends X-Forwarded-Proto: http, as the Cloudflare tunnel on :80 did.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      service:
        name: trek
        port: 3000

  externalSecrets:
    - name: trek-secret
      vaultPath: trek/trek
      data:
        - secretKey: ENCRYPTION_KEY
          property: encryption_key
        - secretKey: OIDC_CLIENT_SECRET
          vaultPath: trek/oidc
          property: client_secret

  limitRange:
    enabled: true
    defaultRequests:
      cpu: 100m
      memory: 256Mi
