homelab-common:
  networkPolicy:
    enabled: true

  # State lives in Postgres (cnpg-cluster, database greekbot); its backups are CNPG's Barman and the nightly pg_dump.
  externalSecrets:
    # DB via cnpg-cluster-rw, not the pooler (asyncpg prepared statements). Not URL-encoded: the password is hex.
    - name: greekbot-db
      vaultPath: greekbot/db
      data:
        - secretKey: password
          property: password
      templateData:
        DATABASE_URL: "postgres://greekbot:{{ .password }}@cnpg-cluster-rw.cnpg.svc.cluster.local:5432/greekbot"
    - name: greekbot-secrets
      vaultPath: greekbot/app-secrets
      data:
        - secretKey: BOT_TOKEN
          property: bot_token
        - secretKey: WEBHOOK_SECRET
          property: webhook_secret
        - secretKey: ADMIN_TOKEN
          property: admin_token
        - secretKey: OWNER_ID
          property: owner_id

  httpRoutes:
    - name: greekbot
      hostname: greek
      # Public side: NetBird Reverse Proxy on vps-fi (manual CNAME greek → proxy.example.com) with path
      # rules for /tg, /app and /api only; /admin stays reachable from LAN and the mesh. obsidian 116 Plans/greekbot.md
      gateway: internal
      service:
        name: greekbot
        port: 8080

  configMaps:
    - name: greekbot
      data:
        PUBLIC_URL: "https://greek.example.com"
        TZ: "Asia/Nicosia"

  workloads:
    - name: greekbot
      pod:
        serviceAccountName: default
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          fsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: greekbot
          image:
            repository: git.example.com/vizzle/greekbot
            tag: "0.8.9"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: greekbot-secrets
            - secretRef:
                name: greekbot-db
            - configMapRef:
                name: greekbot
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      persistence:
        tmp:
          emptyDir: {}
          mountPath: /tmp
