# May — homelab-common.apps + persistentVolumeClaims (pvc.yaml)
homelab-common:
  # Backup v2 (см. docs/backup-v2.md): VolSync снимает Longhorn CSI-снапшот и
  # льёт restic в две независимые цели — garage (on-prem) и ovh (off-site).
  # Velero-расписания выше пока работают параллельно, уйдут на фазе 8.
  volsync:
    - name: may
      claim: may
      capacity: 5Gi
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "20 0 * * *"
          retain:
            daily: 7
            weekly: 4
        - repo: ovh
          schedule: "20 5 * * 0"
          retain:
            weekly: 12
            monthly: 6

  externalSecrets:
    - name: may-app-secrets
      vaultPath: may/app-secrets
      data:
        - secretKey: admin_password
          property: admin_password
        - secretKey: secret_key
          property: secret_key
      templateData:
        ADMIN_PASSWORD: "{{ .admin_password }}"
        SECRET_KEY: "{{ .secret_key }}"

  httpRoutes:
    - name: may
      hostname: may
      # external-only, see immich/values.yaml for the split-horizon / QUIC story
      gateway: external
      service:
        name: may
        port: 5050

  persistentVolumeClaims:
    - name: may
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 5Gi
      labels:
        app: may

  apps:
    - name: may
      deployment:
        metadata:
          labels:
            app: may
        spec:
          replicas: 1
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app: may
          template:
            metadata:
              labels:
                app: may
            spec:
              # ndots:2 — pod resolv.conf defaults to ndots:5, so external names
              # with <5 dots burn 3-4 NXDOMAIN search-suffix lookups before the
              # real one. Cuts that tax for outbound calls.
              dnsConfig:
                options:
                  - name: ndots
                    value: "2"
              securityContext:
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: may
                  # renovate: image=ghcr.io/dannymcc/may
                  image: ghcr.io/dannymcc/may:0.44.2
                  imagePullPolicy: IfNotPresent
                  ports:
                    - name: http
                      containerPort: 5050
                      protocol: TCP
                  envFrom:
                    - secretRef:
                        name: may-app-secrets
                  resources:
                    limits:
                      cpu: 200m
                      memory: 350Mi
                    requests:
                      cpu: 15m
                      memory: 200Mi
                  volumeMounts:
                    - name: data
                      mountPath: /app/data
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: may
      service:
        metadata:
          labels:
            app: may
        spec:
          type: ClusterIP
          ports:
            - port: 5050
              targetPort: http
              protocol: TCP
              name: http
          selector:
            app: may
