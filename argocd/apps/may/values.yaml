homelab-common:
  networkPolicy:
    enabled: true

  persistentVolumeClaims:
    - name: may
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 5Gi

  volsync:
    - name: may                     # restic repo path, must be unique cluster-wide
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "20 0 * * *"
        - repo: ovh
          schedule: "20 5 * * 0"

  externalSecrets:
    - name: may-app-secrets
      vaultPath: may/app-secrets
      data:
        - secretKey: admin_password
          property: admin_password
        - secretKey: secret_key
          property: secret_key
      templateData:
        ADMIN_PASSWORD: "{{ .admin_password }}"
        SECRET_KEY: "{{ .secret_key }}"

  httpRoutes:
    - name: may
      hostname: may
      gateway: internal
      service:
        name: may
        port: 5050

  workloads:
    - name: may
      legacySelector:
        app: may                    # immutable selector of the existing Deployment
      pod:
        # Default ndots:5 burns 3-4 NXDOMAIN lookups per external name.
        dnsConfig:
          options:
            - name: ndots
              value: "2"
        securityContext:
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: may
          image:
            repository: ghcr.io/dannymcc/may
            tag: "0.44.2"
          ports:
            - name: http
              containerPort: 5050
          envFrom:
            - secretRef:
                name: may-app-secrets
          # Entrypoint runs `flask db upgrade` first: allow up to 5 min.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 15m
              memory: 200Mi
            limits:
              cpu: 200m
              memory: 350Mi
      persistence:
        data:
          claim: may                # must be listed in persistentVolumeClaims
          mountPath: /app/data
