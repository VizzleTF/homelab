# May: self-hosted vehicle management (fuel, expenses, maintenance).
# Source: https://github.com/dannymcc/may
# Vault: homelab/k8s/may/app-secrets
homelab-common:
  # Default-deny ingress (homelab-common >= 1.17): own namespace, gateway,
  # probes and API server only; extra sources from Hubble flows 2026-09-24.
  networkPolicy:
    enabled: true

  persistentVolumeClaims:
    - name: may
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 5Gi

  # Backup v2 (see obsidian/113 Backups/Backup Overview.md): VolSync takes a Longhorn
  # CSI snapshot and pushes it with restic to two independent targets: garage
  # (on-prem) and ovh (off-site).
  volsync:
    - name: may                     # restic repo path, cluster-wide unique; claim defaults to name
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "20 0 * * *"
        - repo: ovh
          schedule: "20 5 * * 0"

  externalSecrets:
    - name: may-app-secrets
      vaultPath: may/app-secrets
      data:
        - secretKey: admin_password
          property: admin_password
        - secretKey: secret_key
          property: secret_key
      templateData:
        ADMIN_PASSWORD: "{{ .admin_password }}"
        SECRET_KEY: "{{ .secret_key }}"

  httpRoutes:
    - name: may
      hostname: may
      # external-only, see immich/values.yaml for the split-horizon / QUIC story
      gateway: external
      service:
        name: may
        port: 5050

  workloads:
    - name: may                     # -> Deployment + Service "may"
      legacySelector:
        app: may                    # immutable selector of the Deployment created before 1.19
      pod:
        # ndots:2: the default ndots:5 burns 3-4 NXDOMAIN lookups per external name.
        dnsConfig:
          options:
            - name: ndots
              value: "2"
        securityContext:
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: may
          image:
            repository: ghcr.io/dannymcc/may
            tag: "0.44.2"
          ports:
            - name: http
              containerPort: 5050
          envFrom:
            - secretRef:
                name: may-app-secrets   # -> secret.reloader.stakater.com/reload: may-app-secrets
          # The entrypoint runs `flask db upgrade` before gunicorn: a cold start
          # takes ~20s at 200m CPU, longer with a migration. Up to 5 min here.
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
          readinessProbe:
            httpGet:                # / answers 302 -> /auth/login
              path: /
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 15m
              memory: 200Mi
            limits:
              cpu: 200m
              memory: 350Mi
      persistence:
        data:
          claim: may                # must be listed in persistentVolumeClaims; RWO -> strategy Recreate
          mountPath: /app/data
