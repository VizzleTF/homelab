# The chart's pre-install job registers the runner; the .runner JWT is kept in
# Secret forgejo-runner-config (resource-policy: keep).

# Chart 0.7.x is the last release: without the ack helm template hits `fail`.
knownLastVersion: true

# EOL chart: images are bumped here by Renovate.
image:
  registry: code.forgejo.org  # pinned: Renovate needs registry+repository next to tag
  repository: forgejo/runner  # pinned: Renovate needs registry+repository next to tag
  tag: "13.2.0"

runner:
  config:
    existingInitSecret: forgejo-runner-init
    file:
      runner:
        # JS actions run on the image's node: checkout v7 needs node24.
        # A label no runner has leaves the run "waiting" forever and, via `concurrency`,
        # blocks the ref (mirror-to-github stops); keep ubuntu-26.04.
        # diff-preview is only here (ops runner is podman): argocd-diff needs dind for kind.
        labels:
          - ubuntu-latest:docker://node:24-bookworm
          - diff-preview:docker://node:24-bookworm
          - ubuntu-26.04:docker://node:24-bookworm
          - ubuntu-24.04:docker://node:24-bookworm
          - ubuntu-22.04:docker://node:22-bookworm
          - ubuntu-20.04:docker://node:20-bookworm
        envs:  # pinned: null drops the chart's dummy A_TEST_ENV_NAME_* entries
      container:
        privileged: true
        options:  # pinned: null default, renders only when set here
        workdir_parent:  # pinned: null default, renders only when set here
        valid_volumes:
          - "**"
      host:
        workdir_parent:  # pinned: null default, renders only when set here

# Privileged DinD stays off control-plane: root CI code near etcd/Talos secrets,
# and its I/O bursts hit etcd.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

dind:
  image:
    registry: docker.io  # pinned: Renovate needs registry+repository next to tag
    repository: library/docker  # pinned: Renovate needs registry+repository next to tag
    tag: "29.9.2-dind"  # pinned: chart is EOL, its default never moves; Renovate bumps it here
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      # argocd-diff's kind + ArgoCD take 2-3Gi on top of the job.
      memory: 4Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Default ndots:5 burns 3-4 NXDOMAIN lookups per registry host.
dnsConfig:
  options:
    - name: ndots
      value: "2"

homelab-common:
  networkPolicy:
    enabled: true

  externalSecrets:
    # PreSync wave -10: must exist before the chart's pre-install register Job.
    - name: forgejo-runner-init
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-10"
      vaultPath: forgejo-runner/runner
      data:
        - secretKey: token
          property: token
        - secretKey: instance
          property: instance
        - secretKey: name
          property: name
      templateData:
        CONFIG_TOKEN: "{{ .token }}"
        CONFIG_INSTANCE: "{{ .instance }}"
        CONFIG_NAME: "{{ .name }}"

  limitRange:
    enabled: true
