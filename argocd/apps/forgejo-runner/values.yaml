# Forgejo Runner (act_runner) — chart values + homelab-common section at the bottom.
# Регистрация: ESO secret forgejo-runner-init {CONFIG_TOKEN, CONFIG_INSTANCE, CONFIG_NAME}
# из Vault home/homelab/k8s/forgejo/runner — pre-install hook job регистрирует runner и
# сохраняет .runner JWT в Secret forgejo-runner-config (resource-policy: keep).

# wrenix's chart 0.7.x is the last release on codeberg — guard requires explicit ack.
knownLastVersion: true

replicaCount: 1

runner:
  config:
    create: true
    existingInitSecret: forgejo-runner-init
    file:
      log:
        level: info
        job_level: info
      runner:
        file: ".runner"
        capacity: 1
        timeout: 3h
        insecure: false
        fetch_timeout: 5s
        fetch_interval: 2s
        # Dummy envs из чарт-defaults — не убираем, чтобы соответствовать схеме.
        envs:
          A_TEST_ENV_NAME_1: a_test_env_value_1
          A_TEST_ENV_NAME_2: a_test_env_value_2
        env_file: .env
        # act_runner runs JS actions with the node binary from these images, so the
        # newest label must carry a node runtime at least as new as the actions we
        # use. actions/checkout v7 declares `using: node24`, which cannot start on
        # node:22. ubuntu-latest and ubuntu-24.04 therefore run node:24-bookworm;
        # the older labels stay put so a workflow can pin an older runtime.
        # ubuntu-26.04 exists because Renovate once bumped runs-on to it: a job
        # whose label no runner has is never picked up, its run stays "waiting"
        # forever and, through `concurrency`, blocks every later run of that ref
        # (main included — mirror-to-github stops). Workflows use ubuntu-latest.
        labels:
          - ubuntu-latest:docker://node:24-bookworm
          - ubuntu-26.04:docker://node:24-bookworm
          - ubuntu-24.04:docker://node:24-bookworm
          - ubuntu-22.04:docker://node:22-bookworm
          - ubuntu-20.04:docker://node:20-bookworm
      cache:
        enabled: true
        dir: ""
        host: ""
        port: 0
        external_server: ""
      container:
        network: ""
        enable_ipv6: false
        privileged: true
        options:
        workdir_parent:
        valid_volumes:
          - "**"
        docker_host: "-"
        force_pull: false
      host:
        workdir_parent:

# DinD — sidecar для исполнения jobs.
dind:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ndots:2 — pod resolv.conf defaults to ndots:5, so CI image/registry hosts
# (git.example.com, ghcr.io, docker.io — all <5 dots) burn 3-4 NXDOMAIN
# search-suffix lookups each before resolving. Highest-volume external-caller
# of these, so the clearest win. Chart renders this as pod dnsConfig.
dnsConfig:
  options:
    - name: ndots
      value: "2"

securityContext:
  privileged: true

serviceAccount:
  create: true
  automount: true

homelab-common:
  externalSecrets:
    # Init-secret для register job: env-vars CONFIG_TOKEN, CONFIG_INSTANCE, CONFIG_NAME.
    # Vault path: home/homelab/k8s/forgejo/runner с ключами token, instance, name.
    # PreSync hook + sync-wave -10 — синкается ДО chart-овского pre-install Job (wave 0).
    # deletionPolicy: Retain — k8s Secret переживает delete-recreate цикл ES при rerun хуков.
    - name: forgejo-runner-init
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-10"
      deletionPolicy: Retain
      vaultPath: forgejo/runner
      data:
        - secretKey: token
          property: token
        - secretKey: instance
          property: instance
        - secretKey: name
          property: name
      templateData:
        CONFIG_TOKEN: "{{ .token }}"
        CONFIG_INSTANCE: "{{ .instance }}"
        CONFIG_NAME: "{{ .name }}"
