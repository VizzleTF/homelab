# Forgejo Runner (act_runner) — chart values + homelab-common section at the bottom.
# Registration: ESO secret forgejo-runner-init {CONFIG_TOKEN, CONFIG_INSTANCE, CONFIG_NAME}
# from OpenBao homelab/k8s/forgejo/runner; the chart's pre-install hook job registers
# the runner and stores the .runner JWT in Secret forgejo-runner-config (resource-policy: keep).

# wrenix's chart 0.7.x is the last release on codeberg — guard requires explicit ack.
knownLastVersion: true

# The chart is EOL, so its appVersion and dind default never move again. Explicit
# {registry, repository, tag} lets Renovate's helm-values manager bump both images;
# the runner major does not automerge (renovate.json rule).
image:
  registry: code.forgejo.org  # pinned: Renovate needs registry+repository next to tag
  repository: forgejo/runner  # pinned: Renovate needs registry+repository next to tag
  tag: "12.13.2"

runner:
  config:
    existingInitSecret: forgejo-runner-init
    file:
      runner:
        # act_runner runs JS actions with the node binary from these images, so the
        # newest label must carry a node runtime at least as new as the actions we
        # use. actions/checkout v7 declares `using: node24`, which cannot start on
        # node:22. ubuntu-latest and ubuntu-24.04 therefore run node:24-bookworm;
        # the older labels stay put so a workflow can pin an older runtime.
        # ubuntu-26.04 exists because Renovate once bumped runs-on to it: a job
        # whose label no runner has is never picked up, its run stays "waiting"
        # forever and, through `concurrency`, blocks every later run of that ref
        # (main included — mirror-to-github stops). Workflows use ubuntu-latest.
        # diff-preview exists only here, not on the ops runner (nodes/ops/runner.nix):
        # the argocd-diff job starts a kind cluster through this pod's dind, and the
        # ops runner runs jobs on podman.
        labels:
          - ubuntu-latest:docker://node:24-bookworm
          - diff-preview:docker://node:24-bookworm
          - ubuntu-26.04:docker://node:24-bookworm
          - ubuntu-24.04:docker://node:24-bookworm
          - ubuntu-22.04:docker://node:22-bookworm
          - ubuntu-20.04:docker://node:20-bookworm
        envs:  # pinned: null drops the chart's dummy A_TEST_ENV_NAME_* entries
      container:
        privileged: true
        options:  # pinned: null default, renders only when set here
        workdir_parent:  # pinned: null default, renders only when set here
        valid_volumes:
          - "**"
      host:
        workdir_parent:  # pinned: null default, renders only when set here

# Privileged DinD must not share a node with etcd and the Talos secrets: CI jobs
# (gitleaks, helm, kaniko) run untrusted-ish code as root there, and their disk
# and CPU bursts hit etcd on the control-plane nodes (same reason renovate is
# pinned to the worker). Any non-control-plane node.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

# DinD sidecar that runs the jobs.
dind:
  image:
    registry: docker.io  # pinned: Renovate needs registry+repository next to tag
    repository: library/docker  # pinned: Renovate needs registry+repository next to tag
    tag: "29.9.0-dind"  # pinned: chart is EOL, its default never moves; Renovate bumps it here
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      # kind + a full ArgoCD for the argocd-diff job take 2-3Gi on top of the job itself.
      memory: 4Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ndots:2 — pod resolv.conf defaults to ndots:5, so CI image/registry hosts
# (git.example.com, ghcr.io, docker.io — all <5 dots) burn 3-4 NXDOMAIN
# search-suffix lookups each before resolving. Highest-volume external-caller
# of these, so the clearest win. Chart renders this as pod dnsConfig.
dnsConfig:
  options:
    - name: ndots
      value: "2"

homelab-common:
  externalSecrets:
    # Init secret for the register job: env CONFIG_TOKEN, CONFIG_INSTANCE, CONFIG_NAME
    # from homelab/k8s/forgejo/runner (keys token, instance, name).
    # PreSync hook + sync-wave -10: synced BEFORE the chart's pre-install Job (wave 0).
    # deletionPolicy: Retain: the Secret survives the ES delete-recreate cycle on hook reruns.
    - name: forgejo-runner-init
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-10"
      deletionPolicy: Retain
      vaultPath: forgejo/runner
      data:
        - secretKey: token
          property: token
        - secretKey: instance
          property: instance
        - secretKey: name
          property: name
      templateData:
        CONFIG_TOKEN: "{{ .token }}"
        CONFIG_INSTANCE: "{{ .instance }}"
        CONFIG_NAME: "{{ .name }}"
