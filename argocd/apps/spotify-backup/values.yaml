# Spotify "Liked Songs" backup — homelab-common workloads.
#
# One CronJob `spotify-backup-saved-tracks` dumps /me/tracks (Liked Songs)
# in full to /backup/saved_tracks.json once a day. The script is inline on
# spotipy, no upstream tool is used.
#
# Vault layout (create by hand before the first sync):
#   home/data/homelab/k8s/spotify-backup/spotify-backup
#     client_id     = <Spotify Developer App Client ID>
#     client_secret = <Spotify Developer App Client Secret>
#     token_cache   = <contents of $XDG_CONFIG_HOME/spotify-backup, obtained
#                      once with a local OAuth flow>
#
# Spotify Developer App:
#   Redirect URI = http://127.0.0.1:8080/callback
#   (plain http://localhost is rejected since 2025-04-09, a loopback IP is required)
#
# Local bootstrap (get token_cache; scope = user-library-read):
#   docker run --rm -it -v "$PWD/cache:/config" \
#     -e SPOTIPY_CLIENT_ID=... -e SPOTIPY_CLIENT_SECRET=... \
#     -e SPOTIPY_REDIRECT_URI=http://127.0.0.1:8080/callback \
#     -e XDG_CONFIG_HOME=/config \
#     python:3.12-alpine sh -c '
#       pip install --quiet spotipy
#       python -c "
#       import os
#       from spotipy.oauth2 import SpotifyOAuth
#       SpotifyOAuth(scope=\"user-library-read\",
#                    cache_path=\"/config/spotify-backup\",
#                    open_browser=False).get_access_token(as_dict=False)
#       "
#     '
#   # Spotipy prints a URL -> open it in a browser -> log in -> copy the URL from
#   # the address bar (it does not load, connection refused is expected) -> paste
#   # it into the container's stdin. Then:
#   cat cache/spotify-backup  # -> this JSON goes to Vault as the token_cache field

homelab-common:
  # Default-deny ingress (homelab-common >= 1.17): own namespace, gateway,
  # probes and API server only; extra sources from Hubble flows 2026-09-24.
  networkPolicy:
    enabled: true

  externalSecrets:
    - name: spotify-backup-creds
      vaultPath: spotify-backup/spotify-backup
      data:
        - secretKey: SPOTIPY_CLIENT_ID
          property: client_id
        - secretKey: SPOTIPY_CLIENT_SECRET
          property: client_secret

    - name: spotify-backup-token
      vaultPath: spotify-backup/spotify-backup
      data:
        # Spotipy CacheFileHandler reads the file at
        # Path(XDG_CONFIG_HOME, "spotify-backup"). The key must be named
        # "spotify-backup" so the initContainer copy lands under that name.
        - secretKey: spotify-backup
          property: token_cache

  workloads:
    - name: saved-tracks            # -> CronJob spotify-backup-saved-tracks
      type: cronjob
      schedule: "0 4 * * *"
      spec:
        timeZone: UTC
      job:
        activeDeadlineSeconds: 600
      pod:
        # The NFS export 10.11.12.237:/volume5/k8s_svc does not allow writes
        # for non-root uids, so the pod runs as root (squashing is the NFS
        # server's job). Caps are dropped; a writable root FS is needed for
        # pip install and for writing the script to /work.
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: prep-cache
            # renovate: image=busybox
            image: busybox:1.38.0
            command: [sh, -c]
            args:
              - |
                set -eu
                cp /token/spotify-backup /cache/spotify-backup
                chmod 0600 /cache/spotify-backup
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
              - {name: token, mountPath: /token, readOnly: true}
              - {name: cache, mountPath: /cache}
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 32Mi}
        volumes:
          - name: token             # initContainer only
            secret:
              secretName: spotify-backup-token
              items:
                - {key: spotify-backup, path: spotify-backup, mode: 0400}
      containers:
        - name: backup
          image:
            repository: python
            tag: "3.15.0-alpine"
          command: [sh, -c]
          args:
            - |
              set -eu
              pip install --quiet --no-cache-dir --disable-pip-version-check --root-user-action=ignore spotipy
              cat <<'PY' > /work/backup.py
              import json
              import os
              from pathlib import Path
              import spotipy
              from spotipy.oauth2 import SpotifyOAuth

              auth = SpotifyOAuth(
                  client_id=os.environ["SPOTIPY_CLIENT_ID"],
                  client_secret=os.environ["SPOTIPY_CLIENT_SECRET"],
                  redirect_uri=os.environ["SPOTIPY_REDIRECT_URI"],
                  scope="user-library-read",
                  cache_path=os.path.join(os.environ["XDG_CONFIG_HOME"], "spotify-backup"),
                  open_browser=False,
              )
              sp = spotipy.Spotify(auth_manager=auth, requests_timeout=30, retries=5)

              out = Path("/backup/saved_tracks.json")
              out.parent.mkdir(parents=True, exist_ok=True)

              items = []
              offset = 0
              while True:
                  page = sp.current_user_saved_tracks(limit=50, offset=offset)
                  chunk = page.get("items", [])
                  if not chunk:
                      break
                  items.extend(chunk)
                  if not page.get("next"):
                      break
                  offset += 50

              tmp = out.with_name(out.name + ".tmp")
              with tmp.open("w", encoding="utf-8") as f:
                  json.dump(items, f, ensure_ascii=False, indent=2)
              tmp.replace(out)
              print(f"Saved {len(items)} liked tracks to {out}")
              PY
              python /work/backup.py
          env:
            - {name: HOME, value: /work}
            - {name: XDG_CONFIG_HOME, value: /config}
            - {name: SPOTIPY_REDIRECT_URI, value: "http://127.0.0.1:8080/callback"}
          envFrom:
            - secretRef:
                name: spotify-backup-creds
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      persistence:
        cache:
          emptyDir: {}              # token cache, seeded by prep-cache at /cache
          mountPath: /config
        work:
          emptyDir: {}
          mountPath: /work
        backup:
          nfs:
            server: 10.11.12.237
            path: /volume5/k8s_svc/spotify-backup
          mountPath: /backup
