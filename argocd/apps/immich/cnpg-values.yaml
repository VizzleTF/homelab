# CloudNativePG Immich Cluster Configuration
# Dedicated cluster for Immich application with vector support

mode: standalone

cluster:
  annotations:
    helm.sh/resource-policy: keep
  instances: 1
  # PG17 → 18 via CNPG declarative offline pg_upgrade (vchord pinned at 1.1.0 both
  # sides — upgraded separately on PG17 first, so this is a clean major upgrade).
  # Backups go through the Barman Cloud Plugin sidecar (plugins below +
  # manifests/objectstore.yaml); in-tree barmanObjectStore is deprecated.
  # Compound <pgmajor>.<pgminor>-<vchord> tag — Renovate-managing it is a known-hard case.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.3-1.1.0

  env:
    - name: AWS_DEFAULT_REGION
      value: garage

  storage:
    size: "10Gi"
    storageClass: "longhorn"

  resources:
    requests:
      memory: "1Gi"
      cpu: "100m"
    limits:
      memory: "4Gi"
      cpu: "2"

  # Role name MUST equal the `username` key in immich-db-credentials (Vault
  # immich/main-database → "immich"), else CNPG refuses to reconcile the managed
  # role: "wrong username 'immich' in secret, expected '<role>'" every ~16 min.
  # The cluster was barman-restored (2026-05); restored data + all 66 tables +
  # the immich DB are owned by role `immich`, and the app connects as `immich`
  # (non-superuser, and the pg-logical dump runs fine as owner) — so `immich`,
  # superuser:false, is the source of truth. The old `immich_user` superuser was
  # a phantom (owned nothing); drop it manually after this reconciles.
  roles:
    - name: immich
      ensure: present
      comment: "Immich application user for database access"
      login: true
      superuser: false
      inherit: true
      connectionLimit: -1
      passwordSecret:
        name: immich-db-credentials

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "2GB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
      # Disk writes (2026-10): CNPG's archive_timeout=5min closed a 16 MB WAL
      # segment every 5 min and wal_init_zero zero-filled each new one — ~4.6
      # GB/day per instance against ~0.4 GB/day of real WAL. 30min keeps the
      # barman RPO acceptable for a homelab. lz4 shrinks full-page images, and
      # rarer checkpoints mean fewer of them.
      archive_timeout: "30min"
      wal_init_zero: "off"
      wal_compression: "lz4"
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
    shared_preload_libraries:
      - "vchord.so"

  # WAL archiving + base backups via the Barman Cloud Plugin. serverName keeps
  # the in-tree layout (<destinationPath>/immich-cluster) so the plugin
  # continues the existing catalog. enabled/isWALArchiver set explicitly:
  # with backups.enabled=false the chart would default them to false.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-cluster-store
        serverName: immich-cluster

  initdb:
    database: immich
    owner: immich
    # CNPG reconciles the owner's password from THIS secret (ongoing, not just at
    # init). Must be a kubernetes.io/basic-auth secret whose `username` == owner.
    # Default `<cluster>-app` (username=app) mismatches → "while updating database
    # owner password: wrong username 'app', expected 'immich'". immich-main-user-
    # credentials is the purpose-built basic-auth secret (username=immich, same
    # Vault immich/main-database password as immich-db-credentials).
    secret:
      name: immich-main-user-credentials
    postInitSQL:
      - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;

# Chart-managed backups off: the object store and the ScheduledBackup live in
# manifests/ (the chart would render the ObjectStore as a Helm hook).
backups:
  enabled: false
