_shared_config:
  url: &url https://immich.example.com
  # github-releases, not docker: ghcr immich-app has too many PR tags ("no-result").
  # One PR bumps server and ML together; -openvino suffix via customManager in renovate.json.
  # renovate: datasource=github-releases depName=immich-app/immich
  version: &version "v3.3.5"
  # renovate: immich-ml
  ml_tag: &ml_tag "v3.3.5-openvino"

# Server-only: top-level controllers/defaultPodOptions/persistence leak into the ML pod.
server:
  # Prefer the ML node (next to the ML pod), any node as fallback.
  defaultPodOptions:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: homelab.example.com/ml
                  operator: In
                  values: ["true"]
  controllers:
    main:
      # Not immich-valkey: it rotates together with valkey (valkey cheatsheet).
      annotations:
        secret.reloader.stakater.com/reload: immich-main-user-credentials,immich-oidc-secret
      containers:
        main:
          image:
            tag: *version
          resources:
            requests:
              cpu: 500m
              memory: 2400Mi
            limits:
              # 1000m throttled 93% of periods during bulk re-encode; worker-01 has 16 cores.
              cpu: 6000m
              memory: 5Gi
          env:
            DB_HOSTNAME: "immich-cluster-rw"
            DB_PORT: "5432"
            DB_DATABASE_NAME: "immich"
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-main-user-credentials
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-main-user-credentials
                  key: password
            # Shared Valkey: Immich DB 1, argocd DB 0.
            REDIS_HOSTNAME: "valkey-primary.valkey.svc.cluster.local"
            REDIS_DBINDEX: "1"
            REDIS_USERNAME: "app"
            REDIS_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-valkey
                  key: password
            IMMICH_SERVER_URL: *url
            PUBLIC_IMMICH_SERVER_URL: *url
            # OAuth is read from the config file only, not env vars.
            IMMICH_CONFIG_FILE: "/config/immich-config.json"
  persistence:
    immich-config:
      type: secret
      name: immich-oidc-secret
      advancedMounts:
        main:
          main:
            - path: /config
              readOnly: true

immich:
  persistence:
    library:
      existingClaim: "immich-library-pvc"

machine-learning:
  defaultPodOptions:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    # Label from terraform_talos/configs/nodes.yaml; a GPU selector would match the control planes.
    nodeSelector:
      homelab.example.com/ml: "true"
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          image:
            tag: *ml_tag
          env:
            MACHINE_LEARNING_DEVICE: GPU
            # PRELOAD only warms the cache; the active model is in immich-config.json below.
            # Flat PRELOAD__CLIP crashes ML on boot (SettingsError parsing "preload").
            # Textual only: preloading visual too pins ~2.7Gi idle after every TTL restart.
            MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: nllb-clip-large-siglip__mrl
            MACHINE_LEARNING_WORKERS: "1"
            MACHINE_LEARNING_WORKER_TIMEOUT: "0"
          # First boot compiles the OpenVINO graph for 10-25 min: 40 min startup window.
          # Timeout 5s: the single worker misses 1s /ping while loading weights.
          probes:
            startup:
              spec:
                failureThreshold: 240
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              # 2000m throttled ~80% of the time; pre/post-processing stays on CPU.
              cpu: 8000m
              # JIT compile peaks ~13-14GB; 8Gi was OOMKilled.
              memory: 16Gi
              gpu.intel.com/i915: "1"
  persistence:
    cache:
      # Models + compile caches filled 20Gi.
      size: 30Gi
      type: persistentVolumeClaim
      # Regenerable cache: node-local, saves 60Gi of Longhorn replicas.
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      retain: true

homelab-common:
  networkPolicy:
    enabled: true
    # NAS (s3.example.com): Barman WAL archive and pg_dump uploads.
    lanEgress: [10.11.12.237/32]
    allow:
      - namespaces: [cnpg-system]
      - namespaces: [victoria-metrics]
        ports: [9187]

  # RWO is enough: VolSync runs the Direct mover on the app pod's node.
  # Cache 10Gi: 2Gi is too small for this many files.
  volsync:
    - name: immich-library
      claim: immich-library-pvc
      accessMode: ReadWriteOnce
      cacheCapacity: 10Gi
      # Direct: Snapshot clones (1 TiB) could not be placed and volumes faulted.
      # Read is not atomic. Server moving mid-run leaves a stale restic lock (volsync cheatsheet).
      copyMethod: Direct
      drill: false  # 250Gi (~190Gi used) does not fit the drill's 20Gi DRILL_SIZE
      targets:
        - repo: garage
          schedule: "30 3 * * *"
        # Offset from garage: movers share the disk and 1 GbE link.
        - repo: ovh
          schedule: "0 8 * * 0"
          retain:
            weekly: 8
      # No bootstrap: it would materialise another 250Gi; restore by hand.

  persistentVolumeClaims:
    - name: immich-library-pvc
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 250Gi
      # No volumeName pin: a stale one breaks the SSA dry-run (SYNC=Unknown); global
      # ignoreDifferences masks it.

  externalSecrets:
    # Valkey ACL user `app`.
    - name: immich-valkey
      vaultPath: valkey/valkey
      data:
        - secretKey: password
          property: password

    - name: immich-main-user-credentials
      vaultPath: immich/main-database
      templateType: kubernetes.io/basic-auth
      data:
        - secretKey: username
          property: username
        - secretKey: password
          property: password
      templateData:
        username: "{{ .username }}"
        password: "{{ .password }}"

    - name: cnpg-s3-backup
      vaultPath: shared/s3-cnpg-backup
      data:
        - secretKey: ACCESS_KEY_ID
          property: ACCESS_KEY_ID
        - secretKey: ACCESS_SECRET_KEY
          property: ACCESS_SECRET_KEY

    - name: ovh-pglogical-rclone
      vaultPath: shared/s3-ovh
      data:
        - secretKey: ovh_ak
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          property: ACCESS_SECRET_KEY
        - secretKey: ovh_crypt_pw
          vaultPath: shared/ovh-crypt
          property: password
        - secretKey: ovh_crypt_pw2
          vaultPath: shared/ovh-crypt
          property: password2
      templateData:
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"
        # Dumps on OVH go through crypt; same remote as openbao, tfstate-mirror
        # and the ops node. Passwords stored rclone-obscured. Names stay plain.
        RCLONE_CONFIG_OVHCRYPT_TYPE: "crypt"
        RCLONE_CONFIG_OVHCRYPT_REMOTE: "ovh:offsite-homelab/crypt"
        RCLONE_CONFIG_OVHCRYPT_FILENAME_ENCRYPTION: "off"
        RCLONE_CONFIG_OVHCRYPT_DIRECTORY_NAME_ENCRYPTION: "false"
        RCLONE_CONFIG_OVHCRYPT_PASSWORD: "{{ .ovh_crypt_pw }}"
        RCLONE_CONFIG_OVHCRYPT_PASSWORD2: "{{ .ovh_crypt_pw2 }}"

    - name: immich-oidc-secret
      vaultPath: immich/oidc
      data:
        - secretKey: client_secret
          property: client_secret
      templateData:
        immich-config.json: |
          {
            "oauth": {
              "enabled": true,
              "issuerUrl": "https://authentik.example.com/application/o/immich/",
              "clientId": "immich",
              "clientSecret": "{{ .client_secret }}",
              "scope": "openid email profile",
              "autoRegister": true,
              "autoLaunch": false,
              "buttonText": "Login with Authentik"
            },
            "machineLearning": {
              "clip": {
                "modelName": "nllb-clip-large-siglip__mrl"
              }
            }
          }

  httpRoutes:
    - name: immich
      hostname: immich
      gateway: internal
      service:
        name: immich-server
        port: 2283
    - name: immich-lan
      hostname: immich-lan
      # Separate host: Alt-Svc is per host, so no QUIC; no upload cap.
      gateway: internal
      service:
        name: immich-server
        port: 2283

  cnpgDatabases:
    - name: immich
      owner: immich
      clusterName: immich-cluster
      extensions:
        - name: vector
        - name: cube
        - name: earthdistance

  # Off-site pg_dump to OVH, independent of barman. Restore needs the vchord image.
  workloads:
    - name: pglogical-offsite
      type: cronjob
      schedule: "55 3 * * *"
      job:
        activeDeadlineSeconds: 3600
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 26
          runAsGroup: 26
          fsGroup: 26
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: dump
            # pg_dump must not be older than the server (imageName in manifests/cluster.yaml).
            image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -euo pipefail
                ts=$(date -u +%Y%m%dT%H%M%SZ)
                echo "[$(date -u)] pg_dump immich"
                PGPASSWORD="$IM_PASS" pg_dump -h immich-cluster-rw -U "$IM_USER" -Fc \
                  -d immich -f "/dump/immich-$ts.dump"
                ls -lh /dump
            env:
              - name: IM_USER
                valueFrom: {secretKeyRef: {name: immich-main-user-credentials, key: username}}
              - name: IM_PASS
                valueFrom: {secretKeyRef: {name: immich-main-user-credentials, key: password}}
            volumeMounts:
              - name: dump
                mountPath: /dump
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: upload
          image:
            repository: rclone/rclone
            tag: "1.75.2"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[$(date -u)] rclone copy /dump -> ovhcrypt:pg-logical/immich-cluster/"
              rclone copy /dump ovhcrypt:pg-logical/immich-cluster/ \
                --s3-acl=private --stats-one-line --stats=2m
              echo "[$(date -u)] prune >90d"
              rclone delete ovhcrypt:pg-logical/immich-cluster/ \
                --min-age 2160h --rmdirs || true
          envFrom:
            - secretRef:
                name: ovh-pglogical-rclone
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      persistence:
        dump:
          emptyDir: {}
          mountPath: /dump
