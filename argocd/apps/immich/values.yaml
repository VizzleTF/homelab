# Immich Self-hosted Photo and Video Backup Solution
# Configuration for HomeLab deployment with CNPG PostgreSQL

# Platform resources via the homelab-common chart
homelab-common:
  # Default-deny ingress (homelab-common >= 1.17): own namespace, gateway,
  # probes and API server only; extra sources from Hubble flows 2026-09-24.
  networkPolicy:
    enabled: true
    allow:
      # CNPG operator -> instance manager
      - namespaces: [cnpg-system]
      # postgres exporter
      - namespaces: [victoria-metrics]
        ports: [9187]

  # Backup v2 (obsidian/113 Backups/Backup Overview.md). The library is 250Gi
  # (~184Gi used), RWX through the Longhorn share-manager, so the mover's
  # accessMode must be ReadWriteMany or it cannot mount. The restic index cache
  # is 10Gi: the default 2Gi is too small for this many files. Off-site runs
  # weekly: a full upload takes hours. CNPG pgdata is a separate PVC covered by
  # barman/pg_dump.
  volsync:
    - name: immich-library
      claim: immich-library-pvc
      accessMode: ReadWriteMany
      cacheCapacity: 10Gi
      # Direct, not Snapshot: a 250Gi snapshot materialises as a clone PVC, and
      # two targets meant two clones of 250Gi x 2 replicas = 1 TiB that Longhorn
      # could not place (cp-02/cp-03 have ~160Gi free); the volumes went faulted.
      # The RWX volume mounts in parallel, so the mover reads the live PVC in
      # place. Cost: the read is not atomic; files uploaded during a run go into
      # the next snapshot. Acceptable for a photo archive.
      copyMethod: Direct
      targets:
        - repo: garage
          schedule: "30 3 * * *"
        # Five hours after on-prem: two movers on one volume break nothing,
        # but they share the disk and the 1 GbE link.
        - repo: ovh
          schedule: "0 8 * * 0"
          retain:
            weekly: 8
      # No bootstrap on purpose: a ReplicationDestination would materialise
      # another 250Gi volume. Restoring the library is a deliberate operation;
      # the destination is created by hand.

  persistentVolumeClaims:
    - name: immich-library-pvc
      accessModes:
        - ReadWriteMany
      storageClassName: longhorn
      size: 250Gi
      # volumeName intentionally unpinned — the PV changes on every Velero restore,
      # and a stale pin makes the SSA dry-run reject the immutable field, breaking
      # diff (SYNC=Unknown). The global ignoreDifferences._PersistentVolumeClaim
      # masks the live volumeName instead. See reference_argocd_pvc_volumename_drift.

  externalSecrets:
    # Valkey ACL user `app` (see argocd/apps/valkey).
    - name: immich-valkey
      vaultPath: valkey/valkey
      data:
        - secretKey: password
          property: password

    - name: immich-db-credentials
      vaultPath: immich/main-database
      data:
        - secretKey: username
          property: username
        - secretKey: password
          property: password
      templateData:
        username: "{{ .username }}"
        password: "{{ .password }}"

    - name: immich-main-user-credentials
      vaultPath: immich/main-database
      templateType: kubernetes.io/basic-auth
      data:
        - secretKey: username
          property: username
        - secretKey: password
          property: password
      templateData:
        username: "{{ .username }}"
        password: "{{ .password }}"

    - name: cnpg-s3-backup
      vaultPath: shared/s3-cnpg-backup
      data:
        - secretKey: ACCESS_KEY_ID
          property: ACCESS_KEY_ID
        - secretKey: ACCESS_SECRET_KEY
          property: ACCESS_SECRET_KEY

    # rclone OVH creds for the pg-logical CronJob (an independent off-site
    # logical dump of the immich DB, not a barman mirror). OpenBao: velero/s3-ovh.
    - name: ovh-pglogical-rclone
      vaultPath: velero/s3-ovh
      data:
        - secretKey: ovh_ak
          property: ACCESS_KEY_ID
        - secretKey: ovh_sk
          property: ACCESS_SECRET_KEY
      templateData:
        RCLONE_CONFIG_OVH_TYPE: "s3"
        RCLONE_CONFIG_OVH_PROVIDER: "Other"
        RCLONE_CONFIG_OVH_ENDPOINT: "https://s3.de.io.cloud.ovh.net"
        RCLONE_CONFIG_OVH_REGION: "de"
        RCLONE_CONFIG_OVH_FORCE_PATH_STYLE: "true"
        RCLONE_CONFIG_OVH_ACCESS_KEY_ID: "{{ .ovh_ak }}"
        RCLONE_CONFIG_OVH_SECRET_ACCESS_KEY: "{{ .ovh_sk }}"

    - name: immich-oidc-secret
      vaultPath: immich/oidc
      data:
        - secretKey: client_id
          property: client_id
        - secretKey: client_secret
          property: client_secret
      templateData:
        immich-config.json: |
          {
            "oauth": {
              "enabled": true,
              "issuerUrl": "https://authentik.example.com/application/o/immich/",
              "clientId": "{{ .client_id }}",
              "clientSecret": "{{ .client_secret }}",
              "scope": "openid email profile",
              "autoRegister": true,
              "autoLaunch": false,
              "buttonText": "Login with Authentik"
            },
            "machineLearning": {
              "clip": {
                "modelName": "nllb-clip-large-siglip__mrl"
              }
            }
          }

  httpRoutes:
    - name: immich
      hostname: immich
      # external-only: split-horizon DNS (internal route + LAN A-record) made
      # browsers reuse the Cloudflare-advertised HTTP/3 Alt-Svc against the
      # TCP-only internal gateway -> ERR_QUIC_PROTOCOL_ERROR at home.
      # Note: LAN traffic now hairpins through Cloudflare, so the free-plan
      # 100 MB request cap applies to uploads.
      gateway: external
      service:
        name: immich-server
        port: 2283
    - name: immich-lan
      hostname: immich-lan
      # LAN-only twin with its own hostname: Alt-Svc is cached per host, so
      # browsers never try QUIC here; uploads skip the Cloudflare 100 MB cap.
      gateway: internal
      service:
        name: immich-server
        port: 2283

  cnpgDatabases:
    - name: immich
      owner: immich
      clusterName: immich-cluster
      extensions:
        - name: vector
        - name: cube
        - name: earthdistance

  # Independent logical backup (pg_dump -Fc) immich DB → OVH pg-logical/immich-cluster/.
  # Runs alongside barman->Garage. immich owns the whole DB, so the dump covers it all.
  # Restore needs the vchord image (CREATE EXTENSION vchord). Daily 03:55, 90d retention.
  workloads:
    - name: pglogical-offsite
      type: cronjob
      schedule: "55 3 * * *"
      job:
        activeDeadlineSeconds: 3600
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 26
          runAsGroup: 26
          fsGroup: 26
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: dump
            # pg_dump must not be older than the server (imageName in manifests/cluster.yaml).
            image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -euo pipefail
                ts=$(date -u +%Y%m%dT%H%M%SZ)
                echo "[$(date -u)] pg_dump immich"
                PGPASSWORD="$IM_PASS" pg_dump -h immich-cluster-rw -U "$IM_USER" -Fc \
                  -d immich -f "/dump/immich-$ts.dump"
                ls -lh /dump
            env:
              - name: IM_USER
                valueFrom: {secretKeyRef: {name: immich-main-user-credentials, key: username}}
              - name: IM_PASS
                valueFrom: {secretKeyRef: {name: immich-main-user-credentials, key: password}}
            volumeMounts:
              - name: dump
                mountPath: /dump
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: upload
          image:
            repository: rclone/rclone
            tag: "1.75"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[$(date -u)] rclone copy /dump -> ovh:offsite-homelab/pg-logical/immich-cluster/"
              rclone copy /dump ovh:offsite-homelab/pg-logical/immich-cluster/ \
                --s3-acl=private --stats-one-line --stats=2m
              echo "[$(date -u)] prune >90d"
              rclone delete ovh:offsite-homelab/pg-logical/immich-cluster/ \
                --min-age 2160h --rmdirs || true
          envFrom:
            - secretRef:
                name: ovh-pglogical-rclone
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      persistence:
        dump:
          emptyDir: {}
          mountPath: /dump

_shared_config:
  url: &url https://immich.example.com
  # Server and ML ship in one immich-app/immich release. The docker datasource
  # fails on ghcr.io/immich-app/* (hundreds of thousands of PR-build tags =
  # hundreds of tags/list pages per lookup, "no-result" in the Dependency
  # Dashboard), so both versions come from github-releases immich-app/immich;
  # the ML -openvino suffix stays outside currentValue (customManager in
  # renovate.json). One PR bumps both, so server and ML never drift.
  # renovate: datasource=github-releases depName=immich-app/immich
  version: &version "v3.3.1"
  # renovate: immich-ml
  ml_tag: &ml_tag "v3.3.1-openvino"

# Server-only settings. Top-level controllers/defaultPodOptions/persistence in
# the immich chart are shared by every component, so they also landed in the
# ML pod (DB/Redis credentials, the OIDC config mount, the server affinity).
server:
  # Prefer the bare-metal ML worker so the server lands next to the ML pod
  # (low-latency calls during re-encode, thumbnail and transcode jobs), but fall
  # back to any node if worker-01 is full or down: the server is not GPU-bound.
  defaultPodOptions:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/ml
                  operator: In
                  values: ["true"]
  controllers:
    main:
      containers:
        main:
          image:
            tag: *version
          resources:
            requests:
              cpu: 500m
              memory: 2400Mi
            limits:
              # Server consolidates the v2.x microservices (job dispatcher, thumbnail
              # generator, metadata extractor, transcode launcher). During bulk re-encode
              # it was pinned at 1000m and the kernel throttled 93 % of periods, stealing
              # 5.4 x more CPU time than the pod was allowed to run. Bump to 6 cores;
              # worker-01 has 16 allocatable and runs at ~20 % otherwise.
              cpu: 6000m
              memory: 5Gi
          env:
            # PostgreSQL via CNPG
            DB_HOSTNAME: "immich-cluster-rw"
            DB_PORT: "5432"
            DB_DATABASE_NAME: "immich"
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-main-user-credentials
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-main-user-credentials
                  key: password
            # Shared Valkey (ns valkey); Immich on DB index 1, argocd on DB 0
            REDIS_HOSTNAME: "valkey-primary.valkey.svc.cluster.local"
            REDIS_DBINDEX: "1"
            REDIS_USERNAME: "app"
            REDIS_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-valkey
                  key: password
            IMMICH_SERVER_URL: *url
            PUBLIC_IMMICH_SERVER_URL: *url
            # OAuth / Authentik: v2+ reads it from a config file, not env vars
            IMMICH_CONFIG_FILE: "/config/immich-config.json"
  persistence:
    immich-config:
      type: secret
      name: immich-oidc-secret
      advancedMounts:
        main:
          main:
            - path: /config
              readOnly: true

# Immich configuration
immich:
  persistence:
    # Main library storage for photos and videos
    library:
      existingClaim: "immich-library-pvc"

# Machine Learning component — OpenVINO image with Intel Iris Xe GPU (N100)
# i915 Talos extension installed; Intel GPU Device Plugin advertises gpu.intel.com/i915.
machine-learning:
  defaultPodOptions:
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    # Pin to dedicated bare-metal ML worker — CP VMs also carry intel.feature.node.kubernetes.io/gpu
    # via VFIO iGPU passthrough, so a GPU-label affinity would not actually exclude them.
    # Add the label with: kubectl label node <name> node-role.kubernetes.io/ml=true
    nodeSelector:
      node-role.kubernetes.io/ml: "true"
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          image:
            tag: *ml_tag
          env:
            MACHINE_LEARNING_DEVICE: GPU
            # PRELOAD env warms the model cache on pod start — it does NOT pick the active
            # model. The active CLIP model is read from Immich's system-config (DB or the
            # IMMICH_CONFIG_FILE JSON via $IMMICH_CONFIG_FILE on the server). See
            # immich-config.json templateData above for the authoritative setting.
            # immich v3 split the flat PRELOAD__CLIP into __TEXTUAL/__VISUAL — the old
            # flat form crashes ML on boot (pydantic SettingsError parsing "preload").
            MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: nllb-clip-large-siglip__mrl
            MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: nllb-clip-large-siglip__mrl
            MACHINE_LEARNING_WORKERS: "1"
            MACHINE_LEARNING_WORKER_TIMEOUT: "0"
          # First boot with NLLB-Large on OpenVINO compiles the visual encoder ONNX graph
          # for ~10-25 min on an Intel iGPU (cached afterwards). Default startup probe of
          # 60×10s = 10 min is too tight; raise to 240×10s = 40 min. timeoutSeconds bumped
          # to 5 because gunicorn's single worker can't always reply to /ping in 1 s while
          # loading model weights. Liveness/readiness defaults are kept — once Ready, the
          # /ping endpoint is fast.
          probes:
            startup:
              spec:
                failureThreshold: 240
                periodSeconds: 10
                timeoutSeconds: 5
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              # NLLB-Large encoding pins to 2 cores at the previous 2000m limit and was
              # throttled ~80 % of the time (cgroup nr_throttled 1258/3293, throttled_usec
              # 295s/370s). Bump to 8 cores; worker-01 is 16-core, runs at ~20 % otherwise.
              # OpenVINO offloads tensor ops to iGPU but pre/post-processing stays on CPU.
              cpu: 8000m
              # NLLB-Large peak ~13-14 GB during OpenVINO JIT compile (model file 14.9 GB
              # on disk maps into memory plus working set). 8Gi was OOMKilled twice.
              memory: 16Gi
              gpu.intel.com/i915: "1"
  persistence:
    cache:
      enabled: true
      # NLLB-Large (~14.9 GB) + buffalo_l face detection + recognition + OpenVINO compile
      # caches + HF download temp files filled 20Gi to 100 %. Bump to 30Gi.
      size: 30Gi
      type: persistentVolumeClaim
      # ML model cache (NLLB/buffalo_l/OpenVINO) is fully regenerable — re-downloaded
      # on demand — so node-local local-path instead of Longhorn (30Gi × 2 replicas
      # = 60Gi saved). Single ML pod (replicas:1, Recreate, GPU-node-pinned) → RWO is
      # fine; local-path is RWO-only and node-pins the PV to the GPU node anyway.
      storageClass: "local-path"
      accessMode: ReadWriteOnce
      retain: true
