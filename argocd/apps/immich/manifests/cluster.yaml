# Never `argocd app sync --replace` a Cluster: it wipes the CR and PVCs.
# Mutate with `kubectl patch --type=json` when SSA cannot.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-cluster
  namespace: immich
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: 1
  # Compound <pg>-<vchord> tag: Renovate can't parse it, bump by hand.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.3-1.1.0
  imagePullPolicy: IfNotPresent
  postgresUID: 26
  postgresGID: 26
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 1Gi
  affinity:
    topologyKey: topology.kubernetes.io/zone
  env:
    # Barman Cloud Plugin against Garage needs a region.
    - name: AWS_DEFAULT_REGION
      value: garage
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  stopDelay: 1800
  logLevel: info
  enableSuperuserAccess: true
  enablePDB: true
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      # Cut disk writes: default 5min archive_timeout + wal_init_zero wrote ~4.6 GB/day
      # vs ~0.4 GB real WAL (2026-10). 30min RPO is fine here.
      archive_timeout: 30min
      checkpoint_timeout: 15min
      effective_cache_size: 2GB
      maintenance_work_mem: 256MB
      max_connections: "200"
      max_wal_size: 2GB
      shared_buffers: 512MB
      wal_compression: lz4
      wal_init_zero: "off"
      work_mem: 16MB
  managed:
    # Name MUST equal the secret's `username` key, else "wrong username".
    # SSA does not add roles[] entries: use kubectl patch --type=json.
    roles:
      - comment: Immich application user for database access
        connectionLimit: -1
        ensure: present
        inherit: true
        login: true
        name: immich
        passwordSecret:
          name: immich-main-user-credentials
        superuser: false
  monitoring:
    disableDefaultQueries: false
    tls:
      enabled: false
  bootstrap:
    initdb:
      database: immich
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
      # Reconciled continuously; its `username` must equal the owner.
      secret:
        name: immich-main-user-credentials
      owner: immich
  # serverName keeps the existing barman catalog layout.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        serverName: immich-cluster
        barmanObjectName: "immich-cluster-store"
