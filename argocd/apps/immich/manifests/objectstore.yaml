# destinationPath + serverName (cluster.yaml) must match the existing catalog.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-cluster-store
  namespace: immich
spec:
  retentionPolicy: "7d"
  instanceSidecarConfiguration:
    # Garage rejects HeadBucket without a region.
    env:
      - name: AWS_DEFAULT_REGION
        value: garage
  configuration:
    destinationPath: "s3://cnpg-backups/immich-cluster-restored"
    endpointURL: "https://s3.example.com"
    s3Credentials:
      accessKeyId:
        name: cnpg-s3-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3-backup
        key: ACCESS_SECRET_KEY
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
    wal:
      compression: gzip
      encryption: AES256
