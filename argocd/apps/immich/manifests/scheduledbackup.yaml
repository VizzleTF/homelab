apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-cluster-daily-backup
  namespace: immich
spec:
  schedule: "0 30 4 * * *"
  backupOwnerReference: self
  cluster:
    name: immich-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
