# Только homelab-common (второй источник ApplicationSet). Не смешивать с values.yaml —
# couchdb chart имеет строгую values schema (config.yaml → homelabValuesFile: homelab-values.yaml).
homelab-common:
  # Backup v2 (см. docs/backup-v2.md): VolSync снимает Longhorn CSI-снапшот
  # и льёт restic в две независимые цели — garage (on-prem) и ovh (off-site).
  # Velero-расписания пока работают параллельно, уйдут на фазе 8.
  # CouchDB пишет .couch-файлы под root; moverSecurityContext не задаём —
  # mover бежит от root и читает снапшот целиком (ns без PSA-ограничений).
  # Второй уровень защиты у этих данных — живые реплики на устройствах.
  volsync:
    - name: obsidian-livesync
      claim: database-storage-obsidian-livesync-couchdb-0
      capacity: 5Gi
      targets:
        - repo: garage
          schedule: "10 2 * * *"
          retain:
            daily: 7
            weekly: 4
        - repo: ovh
          schedule: "10 7 * * 0"
          retain:
            weekly: 12
            monthly: 6
      bootstrap:
        repo: garage

  # CouchDB admin creds из OpenBao. Target-секрет с key-именами под couchdb chart
  # (values.yaml: extraSecretName + *Key). Vault: homelab/k8s/obsidian-livesync/couchdb.
  externalSecrets:
    - name: obsidian-livesync-couchdb-creds
      vaultPath: obsidian-livesync/couchdb
      data:
        - secretKey: adminUsername
          property: username
        - secretKey: adminPassword
          property: password
        - secretKey: cookieAuthSecret
          property: cookieAuthSecret
        - secretKey: erlangCookie
          property: erlangCookie

  # external-only: internal route + LAN A-record on the same hostname made browsers
  # reuse the Cloudflare-advertised HTTP/3 Alt-Svc against the TCP-only internal
  # gateway -> ERR_QUIC_PROTOCOL_ERROR at home. LAN sync now hairpins through
  # Cloudflare, so the free-plan 100 MB request cap applies to attachments again.
  # E2E-шифрование в плагине → CouchDB/трафик не палят заметки.
  httpRoutes:
    - name: obsidian-livesync
      hostname: livesync
      gateway: external
      service:
        name: obsidian-livesync-svc-couchdb
        port: 5984

  limitRange:
    enabled: true
    name: default-limits
    defaults:
      cpu: 500m
      memory: 512Mi
    defaultRequests:
      cpu: 25m
      memory: 64Mi

  # Crash-consistent snapshot CouchDB PVC. Данные = sync-хаб (не единственная копия),
  # recovery = re-init + Fetch с любого устройства. Daily, Garage BSL.
  veleroSchedules:
    - name: obsidian-livesync-daily
      schedule: "40 2 * * *"
