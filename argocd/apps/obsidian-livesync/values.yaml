# Chart default is busybox:latest, invisible to Renovate.
initImage:
  repository: busybox  # pinned: Renovate needs repository next to tag
  tag: "1.38.0"
  pullPolicy: IfNotPresent

# LiveSync needs single_node=true.
clusterSize: 1

# Admin creds come from the ExternalSecret below, with the chart's default key names.
createAdminSecret: false
extraSecretName: obsidian-livesync-couchdb-creds

image:
  repository: couchdb  # pinned: Renovate needs repository next to tag
  tag: "3.5.3"

persistentVolume:
  enabled: true
  storageClass: longhorn
  size: 5Gi

persistentVolumeClaimRetentionPolicy:
  enabled: true
  whenScaled: Retain  # pinned: keep the PVC if the default flips
  whenDeleted: Retain  # pinned: keep the PVC if the default flips

networkPolicy:
  enabled: false

couchdbConfig:
  couchdb:
    # Not a secret. Never change after init.
    uuid: 158082af61034052db27da49056dddc0
    single_node: true
    max_document_size: 50000000
  chttpd:
    require_valid_user: true
    max_http_request_size: 4294967296
    enable_cors: true
  chttpd_auth:
    require_valid_user: true
  httpd:
    WWW-Authenticate: 'Basic realm="couchdb"'
    enable_cors: true
  cors:
    origins: app://obsidian.md,capacitor://localhost,http://localhost
    credentials: "true"
    headers: accept, authorization, content-type, origin, referer
    methods: GET, PUT, POST, HEAD, DELETE
  # LiveSync creates many revisions; without compaction .couch files grow.
  smoosh:
    db_channels: upgrade_dbs,ratio_dbs,slack_dbs
    view_channels: upgrade_views,ratio_views,slack_views

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

homelab-common:
  networkPolicy:
    enabled: true

  # No moverSecurityContext: CouchDB files are root-owned, the mover must run as root.
  volsync:
    - name: obsidian-livesync
      claim: database-storage-obsidian-livesync-couchdb-0
      targets:
        - repo: garage
          schedule: "10 2 * * *"
        - repo: ovh
          schedule: "10 7 * * 0"

  externalSecrets:
    - name: obsidian-livesync-couchdb-creds
      vaultPath: obsidian-livesync/couchdb
      data:
        - secretKey: adminUsername
          property: username
        - secretKey: adminPassword
          property: password
        - secretKey: cookieAuthSecret
          property: cookieAuthSecret
        - secretKey: erlangCookie
          property: erlangCookie

  # No split-horizon: cached HTTP/3 Alt-Svc hits the TCP-only internal gateway
  # (ERR_QUIC_PROTOCOL_ERROR). Cloudflare's 100 MB cap applies to attachments.
  httpRoutes:
    - name: obsidian-livesync
      hostname: livesync
      gateway: external
      service:
        name: obsidian-livesync-svc-couchdb
        port: 5984

  limitRange:
    enabled: true
    defaultRequests:
      cpu: 25m
      memory: 64Mi
