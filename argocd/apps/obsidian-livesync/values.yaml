# CouchDB chart values (apache/couchdb). Backend для Obsidian Self-hosted LiveSync.

# Chart default is busybox:latest with pullPolicy Always: a mutable tag pulled
# on every restart, invisible to Renovate. Same pin as the other init containers.
initImage:
  repository: busybox
  tag: "1.38.0"
  pullPolicy: IfNotPresent

# Single-node: LiveSync требует single_node=true, кластер не нужен.
clusterSize: 1

# Admin creds из ESO-секрета (homelab-common → ExternalSecret), не из git.
# Chart ждёт секрет с кастомными key-именами.
createAdminSecret: false
adminUsername: admin
extraSecretName: obsidian-livesync-couchdb-creds
adminUsernameKey: adminUsername
adminPasswordKey: adminPassword
cookieAuthSecretKey: cookieAuthSecret
erlangCookieKey: erlangCookie

image:
  repository: couchdb
  tag: "3.5.2"

persistentVolume:
  enabled: true
  storageClass: longhorn
  accessModes:
    - ReadWriteOnce
  size: 5Gi

# Данные = sync-хаб, но PVC не пересоздавать при удалении StatefulSet.
persistentVolumeClaimRetentionPolicy:
  enabled: true
  whenScaled: Retain
  whenDeleted: Retain

# Single node → anti-affinity не нужен, networkpolicy для кластерного трафика не нужен.
networkPolicy:
  enabled: false

# LiveSync-обязательная конфигурация CouchDB.
couchdbConfig:
  couchdb:
    # Стабильный server UUID (chart требует явно; не секрет). Не менять после init.
    uuid: 158082af61034052db27da49056dddc0
    single_node: true
    max_document_size: 50000000
  chttpd:
    bind_address: any
    require_valid_user: true
    max_http_request_size: 4294967296
    enable_cors: true
  chttpd_auth:
    require_valid_user: true
  httpd:
    WWW-Authenticate: 'Basic realm="couchdb"'
    enable_cors: true
  cors:
    origins: app://obsidian.md,capacitor://localhost,http://localhost
    credentials: "true"
    headers: accept, authorization, content-type, origin, referer
    methods: GET, PUT, POST, HEAD, DELETE
  # Авто-compaction: LiveSync плодит ревизии, без compaction .couch пухнут.
  smoosh:
    db_channels: upgrade_dbs,ratio_dbs,slack_dbs
    view_channels: upgrade_views,ratio_views,slack_views

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

homelab-common:
  # Backup v2 (см. docs/backup-v2.md): VolSync снимает Longhorn CSI-снапшот
  # и льёт restic в две независимые цели — garage (on-prem) и ovh (off-site).
  # CouchDB пишет .couch-файлы под root; moverSecurityContext не задаём —
  # mover бежит от root и читает снапшот целиком (ns без PSA-ограничений).
  # Второй уровень защиты у этих данных — живые реплики на устройствах.
  volsync:
    - name: obsidian-livesync
      claim: database-storage-obsidian-livesync-couchdb-0
      targets:
        - repo: garage
          schedule: "10 2 * * *"
        - repo: ovh
          schedule: "10 7 * * 0"

  # CouchDB admin creds из OpenBao. Target-секрет с key-именами под couchdb chart
  # (values.yaml: extraSecretName + *Key). Vault: homelab/k8s/obsidian-livesync/couchdb.
  externalSecrets:
    - name: obsidian-livesync-couchdb-creds
      vaultPath: obsidian-livesync/couchdb
      data:
        - secretKey: adminUsername
          property: username
        - secretKey: adminPassword
          property: password
        - secretKey: cookieAuthSecret
          property: cookieAuthSecret
        - secretKey: erlangCookie
          property: erlangCookie

  # external-only: internal route + LAN A-record on the same hostname made browsers
  # reuse the Cloudflare-advertised HTTP/3 Alt-Svc against the TCP-only internal
  # gateway -> ERR_QUIC_PROTOCOL_ERROR at home. LAN sync now hairpins through
  # Cloudflare, so the free-plan 100 MB request cap applies to attachments again.
  # E2E-шифрование в плагине → CouchDB/трафик не палят заметки.
  httpRoutes:
    - name: obsidian-livesync
      hostname: livesync
      gateway: external
      service:
        name: obsidian-livesync-svc-couchdb
        port: 5984

  limitRange:
    enabled: true
    defaultRequests:
      cpu: 25m
      memory: 64Mi
