# CouchDB chart values (apache/couchdb): backend for Obsidian Self-hosted LiveSync.

# Chart default is busybox:latest with pullPolicy Always: a mutable tag pulled
# on every restart, invisible to Renovate. Same pin as the other init containers.
initImage:
  repository: busybox  # pinned: Renovate needs repository next to tag
  tag: "1.38.0"
  pullPolicy: IfNotPresent

# Single node: LiveSync needs single_node=true, no CouchDB cluster.
clusterSize: 1

# Admin creds come from the ESO secret below (homelab-common externalSecrets),
# not from git. The chart reads its default key names (adminUsername,
# adminPassword, cookieAuthSecret, erlangCookie) from extraSecretName.
createAdminSecret: false
extraSecretName: obsidian-livesync-couchdb-creds

image:
  repository: couchdb  # pinned: Renovate needs repository next to tag
  tag: "3.5.2"

persistentVolume:
  enabled: true
  storageClass: longhorn
  size: 5Gi

# The data is the sync hub: keep the PVC when the StatefulSet is deleted or scaled.
persistentVolumeClaimRetentionPolicy:
  enabled: true
  whenScaled: Retain  # pinned: keep the PVC if the default flips
  whenDeleted: Retain  # pinned: keep the PVC if the default flips

# Single node: no anti-affinity and no chart NetworkPolicy for cluster traffic.
networkPolicy:
  enabled: false

# CouchDB settings LiveSync requires.
couchdbConfig:
  couchdb:
    # Stable server UUID (the chart requires it; not a secret). Never change after init.
    uuid: 158082af61034052db27da49056dddc0
    single_node: true
    max_document_size: 50000000
  chttpd:
    require_valid_user: true
    max_http_request_size: 4294967296
    enable_cors: true
  chttpd_auth:
    require_valid_user: true
  httpd:
    WWW-Authenticate: 'Basic realm="couchdb"'
    enable_cors: true
  cors:
    origins: app://obsidian.md,capacitor://localhost,http://localhost
    credentials: "true"
    headers: accept, authorization, content-type, origin, referer
    methods: GET, PUT, POST, HEAD, DELETE
  # Auto-compaction: LiveSync creates many revisions; without it .couch files grow.
  smoosh:
    db_channels: upgrade_dbs,ratio_dbs,slack_dbs
    view_channels: upgrade_views,ratio_views,slack_views

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

homelab-common:
  # Default-deny ingress (homelab-common >= 1.17): own namespace, gateway,
  # probes and API server only; extra sources from Hubble flows 2026-09-24.
  networkPolicy:
    enabled: true

  # Backup v2 (obsidian/113 Backups/Backup Overview.md). CouchDB writes its
  # .couch files as root, so no moverSecurityContext: the mover runs as root
  # and reads the whole snapshot. Live replicas on the devices are the second
  # copy of this data.
  volsync:
    - name: obsidian-livesync
      claim: database-storage-obsidian-livesync-couchdb-0
      targets:
        - repo: garage
          schedule: "10 2 * * *"
        - repo: ovh
          schedule: "10 7 * * 0"

  # CouchDB admin creds from OpenBao (homelab/k8s/obsidian-livesync/couchdb),
  # with the key names the couchdb chart reads from extraSecretName.
  externalSecrets:
    - name: obsidian-livesync-couchdb-creds
      vaultPath: obsidian-livesync/couchdb
      data:
        - secretKey: adminUsername
          property: username
        - secretKey: adminPassword
          property: password
        - secretKey: cookieAuthSecret
          property: cookieAuthSecret
        - secretKey: erlangCookie
          property: erlangCookie

  # external-only: internal route + LAN A-record on the same hostname made browsers
  # reuse the Cloudflare-advertised HTTP/3 Alt-Svc against the TCP-only internal
  # gateway -> ERR_QUIC_PROTOCOL_ERROR at home. LAN sync now hairpins through
  # Cloudflare, so the free-plan 100 MB request cap applies to attachments again.
  # The plugin encrypts end to end, so CouchDB and the traffic never see notes.
  httpRoutes:
    - name: obsidian-livesync
      hostname: livesync
      gateway: external
      service:
        name: obsidian-livesync-svc-couchdb
        port: 5984

  limitRange:
    enabled: true
    defaultRequests:
      cpu: 25m
      memory: 64Mi
