# Forgejo (forgejo-helm chart) + homelab-common section at the bottom.
# External CNPG postgres (shared cnpg-cluster), Authentik OIDC, Cilium Gateway via homelab-common.

replicaCount: 1

strategy:
  type: Recreate

image:
  rootless: true

persistence:
  enabled: true
  create: true
  mount: true
  claimName: forgejo-data
  size: 20Gi
  accessModes:
    - ReadWriteMany
  storageClass: longhorn
  annotations:
    helm.sh/resource-policy: keep

# No ssh service: clones and pushes go to the instance on the ops node, and a
# mirror accepts neither. This also frees port 22 on the shared LB address.
service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

deployment:
  env:
    - name: FORGEJO__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: password

gitea:
  admin:
    existingSecret: forgejo-admin-credentials

  config:
    APP_NAME: "Forgejo — example.com"
    # Цепочка снаружи: клиент -> Cloudflare -> cloudflared (под в 10.244/16)
    # -> Envoy Gateway -> forgejo. Без доверия к прокси forgejo пишет в журнал
    # аудита и в rate-limit адрес пода, а не человека.
    security:
      REVERSE_PROXY_TRUSTED_PROXIES: 10.244.0.0/16
      REVERSE_PROXY_LIMIT: 1
    server:
      DOMAIN: git-mirror.example.com
      ROOT_URL: https://git-mirror.example.com/
      SSH_DOMAIN: git-mirror.example.com
      START_SSH_SERVER: false
      LANDING_PAGE: login
      OFFLINE_MODE: true
    database:
      DB_TYPE: postgres
      # Via PgBouncer (transaction pooling) — argocd/apps/cnpg/manifests/pooler.yaml
      HOST: cnpg-cluster-pooler-rw.cnpg.svc.cluster.local:5432
      NAME: forgejo
      USER: forgejo
      SSL_MODE: require
    service:
      DISABLE_REGISTRATION: true
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
      ENABLE_NOTIFY_MAIL: false
    openid:
      ENABLE_OPENID_SIGNIN: false
      ENABLE_OPENID_SIGNUP: true
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      ACCOUNT_LINKING: auto
      USERNAME: preferred_username
      UPDATE_AVATAR: true
    repository:
      DEFAULT_PRIVATE: private
      DISABLE_HTTP_GIT: false
    # Read-only mirror: CI belongs to the instance on the ops node, and a second
    # runner pool here would race it for the same jobs.
    actions:
      ENABLED: false
    indexer:
      REPO_INDEXER_ENABLED: true
      ISSUE_INDEXER_TYPE: bleve
    metrics:
      ENABLED: true
    log:
      LEVEL: Info
    # Allow push mirrors to RFC1918 targets (e.g. NAS Gitea at 10.11.12.237
    # used as DR-bootstrap mirror — see scripts/dr/phases).
    migrations:
      ALLOW_LOCALNETWORKS: true
    # Packages disabled on the mirror: the blobs live in one Garage bucket and
    # the instance on the ops node owns it. Two writers to the same bucket is a
    # corruption waiting to happen, and a mirror serves no registry anyway.
    packages:
      ENABLED: false

  # OAuth deliberately absent. The chart's init container revalidates the OIDC
  # provider on every start and dies when Authentik is unreachable — that is how
  # an external-dns outage blinded GitOps on 2026-09-12. A mirror has no logins
  # to serve, so the dependency simply goes away.

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

homelab-common:
  # VolSync removed with the move: this instance is a read-only mirror of the
  # Forgejo on the ops node, and that one is backed up there — daily dump into
  # restic, Garage plus OVH. See obsidian/113 Backups/Forgejo Recovery.md.

  externalSecrets:
    # DB-пароль для самого Forgejo (берём из того же Vault path, что и в cnpg.yaml).
    - name: forgejo-db-credentials
      vaultPath: forgejo/forgejo
      data:
        - secretKey: password
          property: password
      templateData:
        username: forgejo
        password: "{{ .password }}"

    # Admin user первого входа — chart требует ключи username/password/email.
    - name: forgejo-admin-credentials
      vaultPath: forgejo/admin
      data:
        - secretKey: username
          property: username
        - secretKey: password
          property: password
        - secretKey: email
          property: email
      templateData:
        username: "{{ .username }}"
        password: "{{ .password }}"
        email: "{{ .email }}"

  # git.example.com now belongs to the ops node as a static record in OpenWrt, so
  # the mirror gets its own name. external-dns manages this one as usual.
  httpRoutes:
    - name: forgejo
      hostname: git-mirror
      gateway: internal
      service:
        name: forgejo-http
        port: 3000

  # Декларативный provisioning OIDC application/provider в Authentik.
  # FORGEJO_OIDC_CLIENT_SECRET резолвится через !Env из authentik-config secret
  # (см. authentik.yaml: добавлен в externalSecrets и templateData).
  authentikBlueprints:
    - name: authentik-blueprint-forgejo
      blueprints:
        forgejo-oidc.yaml: |
          version: 1
          metadata:
            name: Forgejo OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: Forgejo OIDC
              attrs:
                name: Forgejo OIDC
                client_type: confidential
                client_id: forgejo
                client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://git.example.com/user/oauth2/Authentik/callback
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

            - model: authentik_core.application
              identifiers:
                slug: forgejo
              attrs:
                name: Forgejo
                slug: forgejo
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Forgejo OIDC]]
                meta_launch_url: https://git.example.com/
                policy_engine_mode: any
                group: Homelab

  limitRange:
    enabled: true
