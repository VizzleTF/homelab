# Forgejo (forgejo-helm chart) + homelab-common section at the bottom.
# Read-only in-cluster mirror of the Forgejo on the ops node: external CNPG
# postgres (shared cnpg-cluster), internal route via homelab-common, no OAuth.

replicaCount: 1

strategy:
  type: Recreate

image:
  rootless: true

persistence:
  enabled: true
  # RWO volume from homelab-common (persistentVolumeClaims below).
  create: false
  mount: true
  claimName: forgejo-data-rwo

# ssh stays a ClusterIP Service, never on the shared LB address: clones and
# pushes go to the instance on the ops node, and a mirror accepts neither.
service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

deployment:
  # Roll the pod when ESO rotates a secret it reads (env is read once at start).
  annotations:
    secret.reloader.stakater.com/reload: forgejo-db-credentials,forgejo-admin-credentials
  env:
    - name: FORGEJO__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-credentials
          key: password

gitea:
  admin:
    existingSecret: forgejo-admin-credentials

  config:
    APP_NAME: "Forgejo — example.com"
    # Path from outside: client -> Cloudflare -> cloudflared (pod in 10.244/16)
    # -> Cilium Gateway -> forgejo. Without trusting the proxy, forgejo logs
    # and rate-limits the pod address instead of the client.
    security:
      REVERSE_PROXY_TRUSTED_PROXIES: 10.244.0.0/16
      REVERSE_PROXY_LIMIT: 1
    server:
      DOMAIN: git-mirror.example.com
      ROOT_URL: https://git-mirror.example.com/
      SSH_DOMAIN: git-mirror.example.com
      START_SSH_SERVER: false
      LANDING_PAGE: login
      OFFLINE_MODE: true
    database:
      DB_TYPE: postgres
      # Via PgBouncer (transaction pooling) — argocd/apps/cnpg/manifests/pooler.yaml
      HOST: cnpg-cluster-pooler-rw.cnpg.svc.cluster.local:5432
      NAME: forgejo
      USER: forgejo
      SSL_MODE: require
    service:
      DISABLE_REGISTRATION: true
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
      ENABLE_NOTIFY_MAIL: false
    openid:
      ENABLE_OPENID_SIGNIN: false
      ENABLE_OPENID_SIGNUP: true
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      ACCOUNT_LINKING: auto
      USERNAME: preferred_username
      UPDATE_AVATAR: true
    repository:
      DEFAULT_PRIVATE: private
      DISABLE_HTTP_GIT: false
    # Read-only mirror: CI belongs to the instance on the ops node, and a second
    # runner pool here would race it for the same jobs.
    actions:
      ENABLED: false
    # Disk writes (2026-10): a read-only mirror needs no code search, and the
    # repo indexer re-indexed on every sync. Pull mirrors run hourly (was 10m:
    # 864 fetches/day, each a git write on Longhorn plus a row update in
    # cnpg-cluster). Freshness is not the point here — the NAS Gitea gets a
    # push on every commit. Existing repos were switched via the API
    # (mirror_interval 1h); DEFAULT_INTERVAL covers newly added mirrors.
    indexer:
      REPO_INDEXER_ENABLED: false
      ISSUE_INDEXER_TYPE: bleve
    mirror:
      DEFAULT_INTERVAL: 1h
    metrics:
      ENABLED: true
    log:
      LEVEL: Info
    # Allow mirrors to RFC1918 targets. This instance is itself a mirror of
    # the Forgejo on the ops node (nodes/ops/forgejo.nix sets the same flag
    # for the NAS Gitea push mirror).
    migrations:
      ALLOW_LOCALNETWORKS: true
    # Packages disabled on the mirror: the blobs live in one Garage bucket and
    # the instance on the ops node owns it. Two writers to the same bucket is a
    # corruption waiting to happen, and a mirror serves no registry anyway.
    packages:
      ENABLED: false

  # OAuth deliberately absent. The chart's init container revalidates the OIDC
  # provider on every start and dies when Authentik is unreachable — that is how
  # an external-dns outage blinded GitOps on 2026-09-12. A mirror has no logins
  # to serve, so the dependency simply goes away.

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

homelab-common:
  # Default-deny ingress (homelab-common >= 1.17): own namespace, gateway,
  # probes and API server only; extra sources from Hubble flows 2026-09-24.
  networkPolicy:
    enabled: true

  # Forgejo data. Was a chart-made RWX volume served over NFS (share-manager)
  # for a single pod; moved here as RWO 2026-09-24.
  persistentVolumeClaims:
    - name: forgejo-data-rwo
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 10Gi
      labels:
        app.kubernetes.io/name: forgejo

  # VolSync removed with the move: this instance is a read-only mirror of the
  # Forgejo on the ops node, and that one is backed up there — daily dump into
  # restic, Garage plus OVH. See obsidian/113 Backups/Forgejo Recovery.md.

  externalSecrets:
    # DB password for Forgejo itself (same OpenBao path as the cnpg managed role).
    - name: forgejo-db-credentials
      vaultPath: forgejo/forgejo
      data:
        - secretKey: password
          property: password
      templateData:
        username: forgejo
        password: "{{ .password }}"

    # First-login admin user; the chart requires keys username/password/email.
    - name: forgejo-admin-credentials
      vaultPath: forgejo/admin
      data:
        - secretKey: username
          property: username
        - secretKey: password
          property: password
        - secretKey: email
          property: email
      templateData:
        username: "{{ .username }}"
        password: "{{ .password }}"
        email: "{{ .email }}"

  # git.example.com now belongs to the ops node as a static record in OpenWrt, so
  # the mirror gets its own name. external-dns manages this one as usual.
  httpRoutes:
    - name: forgejo
      hostname: git-mirror
      gateway: internal
      service:
        name: forgejo-http
        port: 3000

  # Declarative OIDC application/provider in Authentik for the Forgejo on the
  # ops node (git.example.com). FORGEJO_OIDC_CLIENT_SECRET resolves via !Env from
  # the authentik-config secret (argocd/apps/authentik/values.yaml).
  authentikBlueprints:
    - name: authentik-blueprint-forgejo
      blueprints:
        forgejo-oidc.yaml: |
          version: 1
          metadata:
            name: Forgejo OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: Forgejo OIDC
              attrs:
                name: Forgejo OIDC
                client_type: confidential
                client_id: forgejo
                client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://git.example.com/user/oauth2/Authentik/callback
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

            - model: authentik_core.application
              identifiers:
                slug: forgejo
              attrs:
                name: Forgejo
                slug: forgejo
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Forgejo OIDC]]
                meta_launch_url: https://git.example.com/
                policy_engine_mode: any
                group: Homelab

  limitRange:
    enabled: true
