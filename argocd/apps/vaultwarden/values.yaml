# RWO Deployment: SQLite over RWX (NFS) locking is unreliable.
resourceType: Deployment
strategy:
  type: Recreate
storage:
  existingVolumeClaim:
    claimName: vaultwarden-data-rwo
    dataPath: /data

domain: "https://pass.example.com"

# Public host: join only by organization invitation.
signupsAllowed: false

# Chart default X-Real-IP is never sent by the Cilium gateway.
ipHeader: "X-Forwarded-For"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# 128Mi was OOMKilled (2026-09-05; cause unproven, likely icon cache + WebSockets).
resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 256Mi
    cpu: 100m

initContainers:
  - name: fix-permissions
    image: busybox:1.38.0
    command: ["chown", "-R", "1001:1001", "/data"]
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
    volumeMounts:
      - name: vaultwarden-data
        mountPath: /data

homelab-common:
  networkPolicy:
    enabled: true

  persistentVolumeClaims:
    - name: vaultwarden-data-rwo
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 2Gi

  volsync:
    - name: vaultwarden
      claim: vaultwarden-data-rwo
      moverSecurityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      targets:
        - repo: garage
          schedule: "50 0 * * *"
        - repo: ovh
          schedule: "50 3 * * *"

  httpRoutes:
    - name: vaultwarden
      hostname: pass
      gateway: internal
      service:
        name: vaultwarden
        port: 80

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 256Mi
    defaultRequests:
      cpu: 25m
      memory: 32Mi
