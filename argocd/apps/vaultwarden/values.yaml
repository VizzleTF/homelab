# Vaultwarden (guerzon chart) — только ключи чарта; homelab-common в vaultwarden.homelab.yaml

storage:
  data:
    name: "vaultwarden-data"
    size: "2Gi"
    class: "longhorn"
    accessMode: "ReadWriteMany"
    keepPvc: true

domain: "https://pass.example.com"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# 2026-09-05: limit raised 128Mi -> 256Mi after the first OOMKill. The process
# sat at a flat 51-59Mi for the six days before it, then the pod recreated during
# the Talos v1.13.10 rollout (04.09 10:16 UTC) came back running at 72-126Mi on
# the same node and the same image (chart untouched since 23.08), and touched the
# ceiling 31h later. Mechanism unproven — icon cache plus accumulating WebSocket
# sessions is the likeliest; vaultwarden exports no metrics of its own to tell.
# Request bumped to 64Mi to match the real steady state (was 32Mi).
resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 256Mi
    cpu: 100m

ingress:
  enabled: false

initContainers:
  - name: fix-permissions
    image: busybox:1.38.0
    command: ["chown", "-R", "1001:1001", "/data"]
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
    volumeMounts:
      - name: vaultwarden-data
        mountPath: /data

# Sidecar mounts /data вместе с vaultwarden и даёт sqlite3 CLI
# для app-consistent backup (Velero pre-hook → sqlite3 .backup).
# Upstream vaultwarden/server:1.36.0-alpine не содержит sqlite3 CLI.
# Берём pre-built образ — apk add at runtime требует root, а
# podSecurityContext.runAsNonRoot:true это блокирует.
sidecars:
  - name: sqlite-helper
    image: keinos/sqlite3:3.53.4
    command: ["/bin/sh", "-c", "exec sleep infinity"]
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 1m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
    volumeMounts:
      - name: vaultwarden-data
        mountPath: /data
