# Vaultwarden (guerzon chart) — ключи чарта + секция homelab-common в конце файла

storage:
  data:
    name: "vaultwarden-data"
    size: "2Gi"
    class: "longhorn"
    accessMode: "ReadWriteMany"
    keepPvc: true

domain: "https://pass.example.com"

# pass.example.com is public: no open registration. New people join through an
# organization invitation (invitationsAllowed stays at the chart default).
signupsAllowed: false

# Cloudflared проксирует HTTP и ставит CF-Connecting-IP; X-Real-IP (дефолт
# чарта) не шлёт никто, поэтому vaultwarden логировал IP пода cloudflared —
# и «неудачный вход с 10.244.2.121» не говорил ни о чём. Envoy заголовок не
# трогает: gatewayAPI.useRemoteAddress=false у cilium.
ipHeader: "CF-Connecting-IP"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# 2026-09-05: limit raised 128Mi -> 256Mi after the first OOMKill. The process
# sat at a flat 51-59Mi for the six days before it, then the pod recreated during
# the Talos v1.13.10 rollout (04.09 10:16 UTC) came back running at 72-126Mi on
# the same node and the same image (chart untouched since 23.08), and touched the
# ceiling 31h later. Mechanism unproven — icon cache plus accumulating WebSocket
# sessions is the likeliest; vaultwarden exports no metrics of its own to tell.
# Request bumped to 64Mi to match the real steady state (was 32Mi).
resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 256Mi
    cpu: 100m

initContainers:
  - name: fix-permissions
    image: busybox:1.38.0
    command: ["chown", "-R", "1001:1001", "/data"]
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
    volumeMounts:
      - name: vaultwarden-data
        mountPath: /data

homelab-common:
  # Backup v2 (см. docs/backup-v2.md): VolSync снимает Longhorn CSI-снапшот и
  # льёт restic в две независимые цели — garage (on-prem) и ovh (off-site).
  volsync:
    - name: vaultwarden
      claim: vaultwarden-data-vaultwarden-0
      moverSecurityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      targets:
        - repo: garage
          schedule: "50 0 * * *"
        - repo: ovh
          schedule: "50 3 * * *"

  httpRoutes:
    - name: vaultwarden
      hostname: pass
      gateway: external
      service:
        name: vaultwarden
        port: 80

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 256Mi
    defaultRequests:
      cpu: 25m
      memory: 32Mi
