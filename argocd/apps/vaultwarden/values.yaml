# Vaultwarden (guerzon chart): chart keys, then the homelab-common section.

# Deployment on an RWO volume. It was a StatefulSet on an RWX volume, i.e.
# SQLite over NFS (Longhorn share-manager). volumeClaimTemplates cannot be
# changed in place, so the switch goes through a new Deployment; the data was
# copied once by a PreSync job (sqlite3 .backup, removed after use).
resourceType: Deployment
strategy:
  type: Recreate
storage:
  existingVolumeClaim:
    claimName: vaultwarden-data-rwo
    dataPath: /data

domain: "https://pass.example.com"

# pass.example.com is public: no open registration. New people join through an
# organization invitation (invitationsAllowed stays at the chart default).
signupsAllowed: false

# cloudflared sets CF-Connecting-IP; nobody sends X-Real-IP (the chart default),
# so vaultwarden logged the cloudflared pod IP and "failed login from
# 10.244.2.121" said nothing. Cilium's Envoy leaves the header alone
# (gatewayAPI.useRemoteAddress=false).
ipHeader: "CF-Connecting-IP"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# 2026-09-05: limit raised 128Mi -> 256Mi after the first OOMKill. The process
# sat at a flat 51-59Mi for the six days before it, then the pod recreated during
# the Talos v1.13.10 rollout (04.09 10:16 UTC) came back running at 72-126Mi on
# the same node and the same image (chart untouched since 23.08), and touched the
# ceiling 31h later. Mechanism unproven — icon cache plus accumulating WebSocket
# sessions is the likeliest; vaultwarden exports no metrics of its own to tell.
# Request bumped to 64Mi to match the real steady state (was 32Mi).
resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 256Mi
    cpu: 100m

initContainers:
  - name: fix-permissions
    image: busybox:1.38.0
    command: ["chown", "-R", "1001:1001", "/data"]
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
    volumeMounts:
      - name: vaultwarden-data
        mountPath: /data

homelab-common:
  # Default-deny ingress: only the gateway (pass.example.com), kubelet probes and
  # the VolSync movers in this namespace reach vaultwarden.
  networkPolicy:
    enabled: true

  # Backup v2: VolSync restic to garage (on-prem) and ovh (off-site),
  # obsidian/113 Backups/Backup Overview.md.
  # Data volume (RWO). Replaces the StatefulSet's RWX
  # vaultwarden-data-vaultwarden-0: SQLite locking over NFS is unreliable.
  persistentVolumeClaims:
    - name: vaultwarden-data-rwo
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 2Gi
      labels:
        app.kubernetes.io/name: vaultwarden

  volsync:
    - name: vaultwarden
      claim: vaultwarden-data-rwo
      moverSecurityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      targets:
        - repo: garage
          schedule: "50 0 * * *"
        - repo: ovh
          schedule: "50 3 * * *"

  httpRoutes:
    - name: vaultwarden
      hostname: pass
      gateway: external
      service:
        name: vaultwarden
        port: 80

  limitRange:
    enabled: true
    defaults:
      cpu: 200m
      memory: 256Mi
    defaultRequests:
      cpu: 25m
      memory: 32Mi
