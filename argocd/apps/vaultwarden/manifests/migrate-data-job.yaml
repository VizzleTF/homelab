# One-off copy RWX -> RWO, run as a PreSync hook so it happens right before
# the app switches volumes (only writes of that last minute are at risk).
# sqlite3 .backup takes a consistent copy while vaultwarden is still running.
# Idempotent: the marker file makes every later sync a no-op. Remove this file
# once the old volume (vaultwarden-data-vaultwarden-0, PV Retain) is gone.
apiVersion: batch/v1
kind: Job
metadata:
  name: vaultwarden-migrate-rwx-to-rwo
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: copy
          image: alpine:3.22
          command:
            - sh
            - -euc
            - |
              if [ -f /new/.migrated-from-rwx ]; then echo "already migrated"; exit 0; fi
              apk add --no-cache sqlite >/dev/null
              sqlite3 /old/db.sqlite3 ".backup '/new/db.sqlite3'"
              [ "$(sqlite3 /new/db.sqlite3 'PRAGMA integrity_check;')" = ok ]
              for f in /old/* ; do
                case "$(basename "$f")" in db.sqlite3*|lost+found) ;; *) cp -a "$f" /new/ ;; esac
              done
              chown -R 1001:1001 /new
              echo "users: $(sqlite3 /new/db.sqlite3 'select count(*) from users;') ciphers: $(sqlite3 /new/db.sqlite3 'select count(*) from ciphers;')"
              touch /new/.migrated-from-rwx
          volumeMounts:
            - name: old
              mountPath: /old
              readOnly: true
            - name: new
              mountPath: /new
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: vaultwarden-data-vaultwarden-0
            readOnly: true
        - name: new
          persistentVolumeClaim:
            claimName: vaultwarden-data-rwo
