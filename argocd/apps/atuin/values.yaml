# DB via cnpg-cluster-rw, NOT the pooler: sqlx prepared statements break in transaction mode.
homelab-common:
  networkPolicy:
    enabled: true

  externalSecrets:
    # Not URL-encoded: the password must stay alphanumeric.
    - name: atuin-db
      vaultPath: atuin/atuin
      data:
        - secretKey: password
          property: password
      templateData:
        ATUIN_DB_URI: "postgres://atuin:{{ .password }}@cnpg-cluster-rw.cnpg.svc.cluster.local:5432/atuin"

  httpRoutes:
    - name: atuin
      hostname: atuin
      gateway: internal
      service:
        name: atuin
        port: 8888

  limitRange:
    enabled: true

  workloads:
    - name: atuin
      legacySelector:
        app: atuin                  # immutable selector of the existing Deployment
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: atuin
          image:
            repository: ghcr.io/atuinsh/atuin
            tag: "18.24.4"
          args: ["start"]
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: ATUIN_HOST
              value: "0.0.0.0"
            - name: ATUIN_PORT
              value: "8888"
            # Gates new accounts only; `atuin login` works regardless. Flip to "true"
            # temporarily to register (obsidian/112 ArgoCD/Apps/all/atuin.md).
            - name: ATUIN_OPEN_REGISTRATION
              value: "false"
          envFrom:
            - secretRef:
                name: atuin-db
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 15m
              memory: 64Mi
