# Valkey — общий in-cluster кэш (homelab-common.apps workload).
#
# Раньше это был чарт bitnami/valkey. Bitnami убрал версионные теги из
# публичного каталога (остался плавающий `latest`), поэтому образ приходилось
# пинить дайджестом руками, а Renovate его не видел. Valkey — однопроцессный
# сервис без обвязки, так что вместо смены одного чужого каталога на другой
# описываем его своим homelab-common: официальный образ `valkey/valkey` с
# версионным тегом + Renovate по маркеру `# renovate: image=`.
#
# Клиенты ходят на `valkey-primary.valkey.svc.cluster.local:6379`:
#   DB 0 — ArgoCD cache, authentik
#   DB 1 — immich
# Имя Service намеренно сохранено от bitnami-чарта (fullnameOverride), чтобы
# миграция не тянула правки в четырёх чужих values и рестарт ArgoCD.
#
# Persistence: RDB по дефолтным правилам valkey (save 3600/300/60) в /data на
# local-path — кэш переживает рестарт пода, но не смерть ноды. Это осознанно:
# данные восстановимы (ArgoCD re-cache + повторный логин в authentik).
homelab-common:
  # Password of the ACL user `app` (OpenBao homelab/k8s/valkey/valkey).
  externalSecrets:
    - name: valkey-auth
      vaultPath: valkey/valkey
      data:
        - secretKey: password
          property: password

  persistentVolumeClaims:
    - name: valkey-data
      size: 1Gi
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce

  apps:
    - name: valkey
      # Service/Deployment остаются `valkey-primary` — см. шапку.
      fullnameOverride: valkey-primary
      deployment:
        metadata:
          labels:
            app: valkey
        spec:
          replicas: 1
          # RWO PVC на local-path: второй под не примонтирует том, поэтому
          # Recreate вместо RollingUpdate (иначе новый висит в Pending).
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app: valkey
          template:
            metadata:
              labels:
                app: valkey
            spec:
              securityContext:
                runAsNonRoot: true
                # Образ valkey/valkey заводит пользователя valkey как uid 999 /
                # gid 1000 (не 999 — специфика valkey-container Dockerfile).
                runAsUser: 999
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: valkey
                  # renovate: image=valkey/valkey
                  image: valkey/valkey:9.1.2-alpine
                  imagePullPolicy: IfNotPresent
                  # ACL: clients (ArgoCD, immich) log in as `app`. The ACL file
                  # is rendered at start from env into an emptyDir (rootfs is
                  # read-only). VALKEY_DEFAULT_USER is the rule for the
                  # passwordless `default` user: open during the client switch,
                  # then `off`. maxmemory не задаём; dir=/data (RDB).
                  command:
                    - sh
                    - -ec
                    - |
                      printf 'user default %s\nuser app on >%s ~* &* +@all\n' \
                        "$VALKEY_DEFAULT_USER" "$VALKEY_APP_PASSWORD" > /acl/users.acl
                      exec valkey-server --aclfile /acl/users.acl
                  env:
                    - name: VALKEY_DEFAULT_USER
                      value: "on nopass ~* &* +@all"
                    - name: VALKEY_APP_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: valkey-auth
                          key: password
                  ports:
                    - name: valkey
                      containerPort: 6379
                      protocol: TCP
                  securityContext:
                    readOnlyRootFilesystem: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                  volumeMounts:
                    - name: data
                      mountPath: /data
                    - name: acl
                      mountPath: /acl
                  startupProbe:
                    exec:
                      command: &valkey-ping ["sh", "-c", "valkey-cli --no-auth-warning --user app --pass \"$VALKEY_APP_PASSWORD\" ping | grep -q PONG"]
                    initialDelaySeconds: 5
                    periodSeconds: 5
                    failureThreshold: 12
                  livenessProbe:
                    tcpSocket:
                      port: valkey
                    periodSeconds: 30
                  readinessProbe:
                    exec:
                      command: *valkey-ping
                    periodSeconds: 15
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: valkey-data
                - name: acl
                  emptyDir:
                    medium: Memory
                    sizeLimit: 1Mi
      service:
        metadata:
          labels:
            app: valkey
        spec:
          type: ClusterIP
          ports:
            - name: valkey
              port: 6379
              targetPort: valkey
              protocol: TCP
          selector:
            app: valkey
