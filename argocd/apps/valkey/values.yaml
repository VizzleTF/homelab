architecture: standalone

# Bitnami оставил на Docker Hub только плавающий `latest` (дефолт чарта 6.2.7),
# версионных тегов больше нет. От этого кэша зависят authentik, forgejo, immich
# и nextcloud, а `latest` мог приехать другой мажоркой на любом рестарте пода.
# Пинимся дайджестом уже проверенного образа — Valkey 9.1.0, тот же, что крутится
# сейчас (подтянут 2026-08-09). Апгрейд = осознанная смена дайджеста.
# Долгосрочно: съезжать с bitnami-каталога.
image:
  digest: sha256:a3c580c005e12c3e0f97a3d6d703ca2d361c917457a35b080880de18b0fcd8d3

auth:
  enabled: false

primary:
  # Explicit resources instead of resourcesPreset (Bitnami marks presets as not
  # production-ready). Live usage ~31m/26Mi; serves ArgoCD cache + authentik redis.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    # Valkey is a pure cache (ArgoCD cache + authentik redis, DB-index split) —
    # rebuildable, so node-local local-path instead of Longhorn. Loss on node
    # death = ArgoCD re-caches + authentik sessions drop (re-login). RWO, single
    # standalone replica.
    storageClass: local-path
    size: 1Gi
    annotations:
      helm.sh/resource-policy: keep
