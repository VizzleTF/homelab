# Clients: valkey-primary.valkey.svc.cluster.local:6379, DB 0 ArgoCD, DB 1 immich.
# No PVC: a node-pinned volume left ArgoCD cacheless on drain, all apps `Unknown` (2026-09-30).
homelab-common:
  # ACL user `app`.
  externalSecrets:
    - name: valkey-auth
      vaultPath: valkey/valkey
      data:
        - secretKey: password
          property: password

  networkPolicy:
    enabled: true
    allow:
      - namespaces: [argocd, immich]
        ports: [6379]

  workloads:
    - name: valkey
      # Clients use this Service name.
      fullnameOverride: valkey-primary
      # Immutable selector of the existing Deployment.
      legacySelector:
        app: valkey
      # Clients read the password only at start: rolling valkey alone locks them out.
      # Rotation order: valkey cheatsheet.
      reload: false
      pod:
        securityContext:
          runAsNonRoot: true
          # The image's valkey user is 999:1000, not 999:999.
          runAsUser: 999
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: valkey
          image:
            repository: valkey/valkey
            tag: 9.1.3-alpine
          # No maxmemory on purpose. Persistence off: RDB wrote ~4 GB/day into an emptyDir.
          # After a restart rerun "missing" jobs in the immich admin UI (BullMQ loses them).
          command:
            - sh
            - -ec
            - |
              printf 'user default %s\nuser app on >%s ~* &* +@all\n' \
                "$VALKEY_DEFAULT_USER" "$VALKEY_APP_PASSWORD" > /acl/users.acl
              exec valkey-server --aclfile /acl/users.acl --save "" --appendonly no
          env:
            - name: VALKEY_DEFAULT_USER
              value: "off"
            - name: VALKEY_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-auth
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command: &valkey-ping ["sh", "-c", "valkey-cli --no-auth-warning --user app --pass \"$VALKEY_APP_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 30
          readinessProbe:
            exec:
              command: *valkey-ping
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      persistence:
        data:
          emptyDir:
            sizeLimit: 1Gi
          mountPath: /data
        acl:
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
          mountPath: /acl
