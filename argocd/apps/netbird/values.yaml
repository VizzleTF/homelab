# NetBird routing peers — join self-hosted mesh at netbird.example.com,
# advertise home LAN subnets (10.11.11.0/24, 10.11.12.0/24) into NetBird.
# Routes themselves are configured in NetBird dashboard → Network Routes (bound
# to the `router` group; the reusable `k8s` setup key auto-joins both peers to it).
#
# Two INDEPENDENT peers (peer / peer-2), each its own identity PVC — a single
# routing peer is a SPOF: draining its node severs the mesh route into the LAN
# (see incident 2026-08-05). Hard pod anti-affinity keeps them on different nodes,
# so no single node drain/failure can take out both. HA is two separate peers,
# NOT replicas=2 — the RWO identity PVC + one-identity-per-peer model forbids it.
homelab-common:
  # Backup v2 (see obsidian/113 Backups/Backup Overview.md): VolSync takes a Longhorn
  # CSI snapshot and pushes restic to two independent targets, garage (on-prem) and ovh (off-site).
  # Each identity PVC holds /var/lib/netbird of one peer; losing it means re-enrolling
  # the peer (routes come back via the `router` group auto-join). No exec hook: the
  # identity files are static, a crash-consistent CSI snapshot is enough.
  volsync:
    - name: netbird-peer
      targets:
        - repo: garage
          schedule: "20 2 * * *"
        - repo: ovh
          schedule: "20 7 * * 0"
    - name: netbird-peer-2
      targets:
        - repo: garage
          schedule: "25 2 * * *"
        - repo: ovh
          schedule: "25 7 * * 0"

  externalSecrets:
    # Single reusable setup key (Vault netbird/peer) — both peers enroll with it;
    # the key's auto_groups puts each new peer into the `router` group automatically.
    - name: netbird-peer
      vaultPath: netbird/peer
      data:
        - secretKey: setup-key
          property: setup-key
      templateData:
        NB_SETUP_KEY: '{{ index . "setup-key" }}'

  persistentVolumeClaims:
    - name: netbird-peer
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 100Mi
      labels:
        app: netbird-peer
    - name: netbird-peer-2
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 100Mi
      labels:
        app: netbird-peer-2

  # No probes: the peer serves no port, and a liveness probe on `netbird status`
  # would restart it on a lost management connection, which the client retries
  # by itself while the established tunnels stay up.
  workloads:
    # ── peer 1 ──────────────────────────────────────────────────────────────
    # sync-wave 1: re-applied AFTER peer-2 (wave 0) is healthy, so the brief
    # Recreate gap here is covered by the already-running peer-2 — no self-lockout.
    - name: peer                    # -> Deployment netbird-peer
      legacySelector:
        app: netbird-peer           # immutable selector of the Deployment created before 1.19
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      pod:
        # Never co-locate with peer-2.
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: netbird-peer-2
                topologyKey: kubernetes.io/hostname
      containers:
        # peer-2 reuses this container (YAML merge) and only swaps NB_HOSTNAME.
        - &netbird-container
          name: netbird
          image:
            repository: netbirdio/netbird
            tag: "0.80.0"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
                - SYS_RESOURCE
          env:
            - &nb-management-url
              name: NB_MANAGEMENT_URL
              value: "https://netbird.example.com"
            - &nb-admin-url
              name: NB_ADMIN_URL
              value: "https://netbird.example.com"
            - name: NB_HOSTNAME
              value: "k8s-homelab-peer"
            - &nb-log-level
              name: NB_LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: netbird-peer
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 30m
              memory: 64Mi
      persistence:
        tun: &tun-volume
          hostPath:
            path: /dev/net/tun
            type: CharDevice
          mountPath: /dev/net/tun
        # /var/lib/netbird, not /etc/netbird: the client keeps active_profile.json,
        # default.json and state.json (peer identity and keys) there.
        state:
          claim: netbird-peer
          mountPath: /var/lib/netbird
    # ── peer 2 ──────────────────────────────────────────────────────────────
    # sync-wave 0: comes up first, provides route redundancy before peer-1 is
    # recreated. Separate identity PVC, distinct NB_HOSTNAME.
    - name: peer-2                  # -> Deployment netbird-peer-2
      legacySelector:
        app: netbird-peer-2         # immutable selector of the Deployment created before 1.19
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      pod:
        # Never co-locate with peer-1.
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: netbird-peer
                topologyKey: kubernetes.io/hostname
      containers:
        - <<: *netbird-container
          env:
            - *nb-management-url
            - *nb-admin-url
            - name: NB_HOSTNAME
              value: "k8s-homelab-peer-2"
            - *nb-log-level
      persistence:
        tun: *tun-volume
        state:
          claim: netbird-peer-2
          mountPath: /var/lib/netbird
