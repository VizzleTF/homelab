# LAN routes live in the NetBird dashboard, bound to the `router` group.
# HA = two separate peers on different nodes, NOT replicas=2 (one identity per
# RWO PVC); one peer is a SPOF on drain (2026-08-05).
homelab-common:
  # Losing an identity PVC means re-enrolling the peer.
  volsync:
    - name: netbird-peer
      targets:
        - repo: garage
          schedule: "20 2 * * *"
        - repo: ovh
          schedule: "20 7 * * 0"
    - name: netbird-peer-2
      targets:
        - repo: garage
          schedule: "25 2 * * *"
        - repo: ovh
          schedule: "25 7 * * 0"

  externalSecrets:
    # Reusable key; its auto_groups puts peers into `router`.
    - name: netbird-peer
      vaultPath: netbird/peer
      data:
        - secretKey: setup-key
          property: setup-key
      templateData:
        NB_SETUP_KEY: '{{ index . "setup-key" }}'

  persistentVolumeClaims:
    - name: netbird-peer
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 100Mi
    - name: netbird-peer-2
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 100Mi

  # No probes: a `netbird status` liveness would restart on a lost management
  # connection while tunnels stay up.
  workloads:
    # Wave 1, after peer-2: its Recreate gap is covered, no self-lockout.
    - name: peer
      legacySelector:
        app: netbird-peer           # immutable selector of the existing Deployment
      # A reload would restart both peers at once and drop the LAN route.
      reload: false
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: netbird-peer-2
                topologyKey: kubernetes.io/hostname
      containers:
        - &netbird-container
          name: netbird
          image:
            repository: netbirdio/netbird
            tag: "0.81.5"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
                - SYS_RESOURCE
          env:
            - &nb-management-url
              name: NB_MANAGEMENT_URL
              value: "https://netbird.example.com"
            - &nb-admin-url
              name: NB_ADMIN_URL
              value: "https://netbird.example.com"
            - name: NB_HOSTNAME
              value: "k8s-homelab-peer"
            - &nb-log-level
              name: NB_LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: netbird-peer
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 30m
              memory: 64Mi
      persistence:
        tun: &tun-volume
          hostPath:
            path: /dev/net/tun
            type: CharDevice
          mountPath: /dev/net/tun
        # Not /etc/netbird: the identity lives here.
        state:
          claim: netbird-peer
          mountPath: /var/lib/netbird
    - name: peer-2
      legacySelector:
        app: netbird-peer-2         # immutable selector of the existing Deployment
      reload: false
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: netbird-peer
                topologyKey: kubernetes.io/hostname
      containers:
        - <<: *netbird-container
          env:
            - *nb-management-url
            - *nb-admin-url
            - name: NB_HOSTNAME
              value: "k8s-homelab-peer-2"
            - *nb-log-level
      persistence:
        tun: *tun-volume
        state:
          claim: netbird-peer-2
          mountPath: /var/lib/netbird
