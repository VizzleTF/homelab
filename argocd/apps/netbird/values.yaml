# LAN routes live in the NetBird dashboard, bound to the `router` group.
# HA = two separate peers on different nodes, NOT replicas=2 (one identity per
# RWO PVC); one peer is a SPOF on drain (2026-08-05).
homelab-common:
  # Losing an identity PVC means re-enrolling the peer.
  volsync:
    - name: netbird-peer
      targets:
        - repo: garage
          schedule: "20 2 * * *"
        - repo: ovh
          schedule: "20 7 * * 0"
    - name: netbird-peer-2
      targets:
        - repo: garage
          schedule: "25 2 * * *"
        - repo: ovh
          schedule: "25 7 * * 0"

  externalSecrets:
    # Reusable key; its auto_groups puts peers into `router`.
    - name: netbird-peer
      vaultPath: netbird/peer
      data:
        - secretKey: setup-key
          property: setup-key
      templateData:
        NB_SETUP_KEY: '{{ index . "setup-key" }}'
    # Owner PAT: only the owner sees every user's PATs (admin gets 403 on them).
    - name: netbird-api
      vaultPath: netbird/api
      data:
        - secretKey: NETBIRD_API_TOKEN
          property: token

  persistentVolumeClaims:
    - name: netbird-peer
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 100Mi
    - name: netbird-peer-2
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 100Mi

  # No probes: a `netbird status` liveness would restart on a lost management
  # connection while tunnels stay up.
  workloads:
    # Wave 1, after peer-2: its Recreate gap is covered, no self-lockout.
    - name: peer
      legacySelector:
        app: netbird-peer           # immutable selector of the existing Deployment
      # A reload would restart both peers at once and drop the LAN route.
      reload: false
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: netbird-peer-2
                topologyKey: kubernetes.io/hostname
      containers:
        - &netbird-container
          name: netbird
          image:
            repository: netbirdio/netbird
            tag: "0.82.0"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
                - SYS_RESOURCE
          env:
            - &nb-management-url
              name: NB_MANAGEMENT_URL
              value: "https://netbird.example.com"
            - &nb-admin-url
              name: NB_ADMIN_URL
              value: "https://netbird.example.com"
            - name: NB_HOSTNAME
              value: "k8s-homelab-peer"
            - &nb-log-level
              name: NB_LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: netbird-peer
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 30m
              memory: 64Mi
      persistence:
        tun: &tun-volume
          hostPath:
            path: /dev/net/tun
            type: CharDevice
          mountPath: /dev/net/tun
        # Not /etc/netbird: the identity lives here.
        state:
          claim: netbird-peer
          mountPath: /var/lib/netbird
    - name: peer-2
      legacySelector:
        app: netbird-peer-2         # immutable selector of the existing Deployment
      reload: false
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: netbird-peer
                topologyKey: kubernetes.io/hostname
      containers:
        - <<: *netbird-container
          env:
            - *nb-management-url
            - *nb-admin-url
            - name: NB_HOSTNAME
              value: "k8s-homelab-peer-2"
            - *nb-log-level
      persistence:
        tun: *tun-volume
        state:
          claim: netbird-peer-2
          mountPath: /var/lib/netbird

    # PATs and setup keys expire (PAT max 365 days); VMRule CredentialExpiring alerts.
    - name: credential-expiry
      type: cronjob
      schedule: "40 3 * * *"
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: export
          image:
            repository: python
            tag: "3.15.2-alpine"
          command: [python3, -c]
          args:
            - |
              import json, os, time, urllib.request
              from datetime import datetime, timezone

              api = "https://netbird.example.com/api"
              hdr = {"Authorization": "Token " + os.environ["NETBIRD_API_TOKEN"]}

              def get(path):
                  req = urllib.request.Request(api + path, headers=hdr)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)

              def ts(iso):  # API gives nanoseconds; seconds are enough
                  return int(datetime.strptime(iso[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc).timestamp())

              lines = []
              users = get("/users") + get("/users?service_user=true")
              for u in {u["id"]: u for u in users}.values():
                  for t in get(f"/users/{u['id']}/tokens"):
                      lines.append(f'homelab_credential_expiry_timestamp{{system="netbird",kind="pat",owner="{u["name"]}",name="{t["name"]}"}} {ts(t["expiration_date"])}')
              # Expired and revoked keys are already unusable; the audit lists them for cleanup.
              for k in get("/setup-keys"):
                  if k["state"] == "valid":
                      lines.append(f'homelab_credential_expiry_timestamp{{system="netbird",kind="setup_key",owner="",name="{k["name"]}"}} {ts(k["expires"])}')
              lines.append(f'homelab_credential_expiry_last_run_timestamp{{system="netbird"}} {int(time.time())}')
              body = ("\n".join(lines) + "\n").encode()
              urllib.request.urlopen(urllib.request.Request(os.environ["VM_URL"] + "/api/v1/import/prometheus", data=body, method="POST"), timeout=30)
              print(body.decode())
          env:
            - name: VM_URL
              value: http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc:8428
          envFrom:
            - secretRef:
                name: netbird-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
