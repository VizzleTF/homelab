# netbird sidecar + vmagent in one netns: scrapes VPS mesh IPs (wt0), writes to in-cluster VMSingle.
homelab-common:
  # No VMServiceScrape reads it, so no victoria-metrics allow.
  networkPolicy:
    enabled: true

  # Peer key: without it the scraper loses mesh access. `name` is the restic repo
  # path and must be unique cluster-wide (the netbird ns has a PVC of the same name).
  volsync:
    - name: crowdsec-netbird-peer
      claim: netbird-peer
      targets:
        - repo: garage
          schedule: "30 2 * * *"
        - repo: ovh
          schedule: "30 7 * * 0"

  externalSecrets:
    - name: netbird-peer
      vaultPath: crowdsec-scraper/netbird
      data:
        - secretKey: setup-key
          property: setup-key
      templateData:
        NB_SETUP_KEY: '{{ index . "setup-key" }}'

    # METRICS_USER/METRICS_PASS from /opt/remnawave/.env on vps-panel. Mounted as files:
    # never inline them in scrape.yaml (public mirror).
    - name: remnawave-metrics
      vaultPath: crowdsec-scraper/remnawave-metrics
      data:
        - secretKey: username
          property: username
        - secretKey: password
          property: password

  # A separate peer: do NOT reuse the netbird app's PVC.
  persistentVolumeClaims:
    - name: netbird-peer
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 100Mi

  configMaps:
    - name: crowdsec-scraper
      data:
        scrape.yaml: |
          global:
            scrape_interval: 30s
            external_labels:
              cluster: vps
          scrape_configs:
            # CrowdSec runs only on vps-panel (off on dp/ape/vps-fi since 2026-09-12).
            - job_name: crowdsec
              metrics_path: /metrics
              static_configs:
                - targets: ["100.64.0.0:6060"]
                  labels: {host: vps-panel}
            - job_name: node
              metrics_path: /metrics
              static_configs:
                - targets: ["100.64.0.0:9100"]
                  labels: {host: dp}
                - targets: ["100.64.0.0:9100"]
                  labels: {host: ape}
                - targets: ["100.64.0.0:9100"]
                  labels: {host: vps-panel}
                - targets: ["100.64.0.0:9100"]
                  labels: {host: vps-fi}
            # Backend :3001 stays on loopback (docker ports bypass ufw); nginx :9101
            # exposes it to the mesh only (/opt/remnawave/nginx.conf).
            - job_name: remnawave-panel
              metrics_path: /metrics
              basic_auth:
                username_file: /etc/vmagent-secrets/username
                password_file: /etc/vmagent-secrets/password
              static_configs:
                - targets: ["100.64.0.0:9101"]
                  labels: {host: vps-panel}

  workloads:
    - name: scraper
      legacySelector:
        app: crowdsec-scraper       # immutable selector of the Deployment created before 1.19
      containers:
        - name: netbird
          image:
            repository: netbirdio/netbird
            tag: "0.82.0"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
                - SYS_RESOURCE
          env:
            - name: NB_MANAGEMENT_URL
              value: "https://netbird.example.com"
            - name: NB_ADMIN_URL
              value: "https://netbird.example.com"
            - name: NB_HOSTNAME
              value: "k8s-crowdsec-scraper"
            - name: NB_LOG_LEVEL
              value: "info"
            # Peers advertise 10.0.0.0/8, which swallows pod/service CIDRs: vmagent
            # loses vmsingle and CoreDNS. Narrowing the route upstream is not an option.
            - name: NB_DISABLE_CLIENT_ROUTES
              value: "true"
          envFrom:
            - secretRef:
                name: netbird-peer
          resources:
            limits:
              cpu: 300m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 48Mi
        - name: vmagent
          image:
            repository: victoriametrics/vmagent
            tag: v1.155.0
          args:
            - -promscrape.config=/etc/vmagent/scrape.yaml
            # No config-reloader sidecar.
            - -promscrape.configCheckInterval=30s
            - -remoteWrite.url=http://vmsingle-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/write
            - -remoteWrite.tmpDataPath=/tmp/vmagent-rw
            - -remoteWrite.maxDiskUsagePerURL=512MB
            - -remoteWrite.queues=1
            - -memory.allowedPercent=60
          # Numeric port: a declared containerPort would make the chart render a Service.
          readinessProbe:
            httpGet:
              path: /health
              port: 8429
          livenessProbe:
            httpGet:
              path: /health
              port: 8429
          resources:
            limits:
              cpu: 200m
              memory: 192Mi
            requests:
              cpu: 20m
              memory: 64Mi
      persistence:
        tun:
          hostPath:
            path: /dev/net/tun
            type: CharDevice
          mountPath: /dev/net/tun
          containers: [netbird]
        # Not /etc/netbird: identity lives here, else backups are empty
        # ("Directory is empty skipping backup").
        state:
          claim: netbird-peer
          mountPath: /var/lib/netbird
          containers: [netbird]
        scrape-config:
          configMap:
            name: crowdsec-scraper
          mountPath: /etc/vmagent
          readOnly: true
          containers: [vmagent]
        remnawave-metrics:
          secret:
            secretName: remnawave-metrics
            defaultMode: 0444
          mountPath: /etc/vmagent-secrets
          readOnly: true
          containers: [vmagent]
        rw-queue:
          emptyDir: {}
          mountPath: /tmp/vmagent-rw
          containers: [vmagent]
