# PodSecurity default is baseline; pods here need more (netbird peer: NET_ADMIN/SYS_ADMIN, /dev/net/tun hostPath).
# Prune/Delete=false: deleting the app must never delete the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec-scraper
  labels:
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
