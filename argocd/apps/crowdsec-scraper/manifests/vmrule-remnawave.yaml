# remnawave_node_status несёт только node_uuid: правила по нодам джойнят
# group_left(node_name) из remnawave_node_basic_info, иначе в Telegram голый UUID.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: remnawave-panel
  namespace: victoria-metrics
spec:
  groups:
    - name: remnawave-panel
      rules:
        # Самый ранний и громкий алерт группы: тишина неотличима от здоровья.
        - alert: RemnawavePanelMetricsAbsent
          expr: absent(up{job="remnawave-panel"}) == 1 or up{job="remnawave-panel"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Метрики панели Remnawave не приходят >5m"
            description: |
              Скрейп vps-panel:9101 не отвечает. Варианты: лёг backend, лёг nginx на
              vps-panel, отвалился netbird-peer скрейпера, ротировали METRICS_PASS
              мимо OpenBao (тогда будет 401).
              kubectl -n crowdsec-scraper exec deploy/crowdsec-scraper -c vmagent -- wget -qO- 127.0.0.1:8429/api/v1/targets
              ssh vps-panel 'sudo docker ps --filter name=remnawave'
              ssh vps-panel 'curl -s -o /dev/null -w "%{http_code}\n" http://100.64.0.0:9101/metrics'   # ждём 401

        - alert: RemnawaveNodeDown
          expr: |
            (remnawave_node_status == 0)
              * on(node_uuid) group_left(node_name) remnawave_node_basic_info
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Нода {{ $labels.node_name }} отвалилась от панели"
            description: |
              remnawave_node_status=0 больше 10 минут для node_name={{ $labels.node_name }}
              (uuid={{ $labels.node_uuid }}).
              Прежде чем подозревать саму ноду — проверить DNS/регистратора и баны
              CrowdSec: оба сценария уже случались и выглядели как «нода сломалась».
              ssh vps-panel 'rwapi GET /api/nodes | jq -r ".response[] | \"\(.name) \(.isConnected)\""'
              dig +short {{ $labels.node_name }}.vpn.example.org

        # 2h: ночной провал до нуля у 13 пользователей штатен.
        - alert: RemnawaveNoOnlineUsers
          expr: |
            sum(remnawave_users_online_stats{metricType="onlineNow"}) == 0
              and on() sum(remnawave_node_status) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Ни одного онлайн-пользователя >2h при живых нодах"
            description: |
              Все ноды на связи с панелью, но онлайн нулевой. Проверить сквозную
              выдачу подписки (поломка бывает избирательной по User-Agent):
              ssh vps-panel 'rwsub Ivan'
              ssh vps-panel 'rwsub Ivan Happ/1.0'

        # Единичный рестарт (деплой) не шумит.
        - alert: RemnawaveBackendFlapping
          expr: resets(remnawave_process_uptime_seconds[1h]) > 2
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Backend панели рестартовал {{ $value }} раз за час"
            description: |
              ssh vps-panel 'cd /opt/remnawave && sudo docker compose logs --tail 200 remnawave'
              Проверить OOM: ssh vps-panel 'sudo dmesg -T | grep -i oom | tail'

        - alert: RemnawaveEventLoopLag
          expr: remnawave_process_event_loop_p99_ms > 200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Event loop p99 {{ $value | humanize }}ms >15m"
            description: |
              Backend панели throttled. Смотреть remnawave_process_rss_bytes и
              remnawave_process_heap_used_bytes рядом — обычно это утечка heap.

    # Textfile-метрики (job=node): vpn-healthcheck на vps-panel раз в сутки, xhttp-health.sh */5.
    # Исходники: vps/node-configs/bin/{vpn-healthcheck,xhttp-health.sh}.
    - name: remnawave-host-scripts
      rules:
        # Подробности только в логе на хосте.
        - alert: VpnHealthcheckFailed
          expr: vpn_health_check{job="node"} == 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "vpn-healthcheck: секция {{ $labels.check }} не прошла"
            description: |
              ssh vps-panel 'sudo cat /var/log/vpn-health.last'
              Ручной перезапуск: ssh vps-panel 'sudo vpn-healthcheck'

        # 26h; без правила вчерашняя единица выглядит как здоровье.
        # Cron */30 (since 2026-10-30): two missed runs.
        - alert: VpnHealthcheckStale
          expr: |
            time() - vpn_health_last_run_timestamp_seconds{job="node"} > 3600
              or absent(vpn_health_last_run_timestamp_seconds{job="node"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "vpn-healthcheck не запускался >1h"
            description: |
              ssh vps-panel 'cat /etc/cron.d/vpn-health; sudo tail /var/log/vpn-health.log'

        # unless-ветка: .prom пропал целиком — серия исчезает, а не стареет.
        - alert: XhttpHealthStale
          expr: |
            time() - xhttp_health_last_run_timestamp_seconds{job="node"} > 1200
              or (up{job="node",host=~"vps-fi|ape|dp"} == 1
                    unless on(host) xhttp_health_last_run_timestamp_seconds{job="node"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.host }}: xhttp-health.sh не отрабатывал >20m"
            description: |
              ssh {{ $labels.host }} 'cat /etc/cron.d/xhttp-health; tail /var/log/xhttp-health.log'

        # Дублирует RemnawaveNodeDown со стороны хоста: работает и при лежащей панели.
        - alert: XhttpNodeProcessDown
          expr: xhttp_remnanode_up{job="node"} == 0 or xhttp_rwcore_up{job="node"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.host }}: remnanode/rw-core не запущен"
            description: |
              ssh {{ $labels.host }} 'docker ps -a --filter name=remnanode; pgrep -c rw-core'
              Поднимать только compose: cd /opt/remnanode && docker compose up -d

        # Любое значение > 0 = 5xx всем.
        - alert: XhttpNginxEmfile
          expr: xhttp_emfile_window{job="node"} > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.host }}: nginx 'Too many open files' ({{ $value }} за 5m)"
            description: |
              Проверить worker_rlimit_nofile 65535 и worker_connections 16384 в nginx.conf.
              ssh {{ $labels.host }} 'grep -E "rlimit|worker_conn" /etc/nginx/nginx.conf'

        # Фон ~0.5 за окно плюс всплески при reload xray; 30 за 15m — уже нет.
        - alert: XhttpErrorsHigh
          expr: xhttp_5xx_window{job="node"} > 30
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.host }}: {{ $value }} XHTTP 5xx за 5m"
            description: |
              ssh {{ $labels.host }} "awk '\$5 ~ /^\/xhttppath\// && \$7 ~ /^5/' /var/log/nginx/access.log | tail"
              ssh {{ $labels.host }} 'tail -50 /var/log/nginx/error.log'

        # tun2 = родители, tun3 = дом, tun4 = сестра; пишут tun*-reaper.sh на vps-panel каждые 3m.
        - alert: ReverseTunnelDown
          expr: vpn_reverse_tunnel_up{job="node"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Обратный туннель {{ $labels.tunnel }} (:{{ $labels.port }}) не отвечает >15m"
            description: |
              Роутер без удалённого доступа; VPN у людей при этом может работать.
              ssh vps-panel 'ss -tlnp | grep {{ $labels.port }}; sudo journalctl -t {{ $labels.tunnel }}-reaper --since -1h'

        - alert: ReverseTunnelMetricStale
          expr: time() - node_textfile_mtime_seconds{job="node",file=~".*/reverse_tunnel_tun.*"} > 900
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.host }}: reaper не обновлял {{ $labels.file }} >15m"
            description: |
              ssh vps-panel 'sudo crontab -l | grep reaper; sudo bash -n /usr/local/bin/tun2-reaper.sh'
