homelab-common:

  externalSecrets:
    - name: rss-to-telegram-bot
      vaultPath: rsstt/rss-to-telegram-bot
      data:
        - secretKey: token
          property: token
        - secretKey: manager
          property: manager
      templateData:
        TOKEN: "{{ .token }}"
        MANAGER: "{{ .manager }}"

  persistentVolumeClaims:
    - name: rss-to-telegram-bot
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      # volumeName intentionally unpinned — the PV changes on every Velero restore;
      # a stale pin makes the SSA dry-run reject the immutable field, breaking diff
      # (SYNC=Unknown). The global ignoreDifferences._PersistentVolumeClaim masks the
      # live volumeName instead. See reference_argocd_pvc_volumename_drift.
      labels:
        app.kubernetes.io/name: rss-to-telegram-bot
        app.kubernetes.io/instance: rss-to-telegram-bot

  # Backup v2 (пилот миграции, см. docs/backup-v2.md). VolSync снимает Longhorn
  # CSI-снапшот тома и льёт restic в две независимые цели: garage (on-prem) и
  # ovh (off-site). Velero-расписания выше пока работают параллельно — они
  # уйдут на фазе 8, после зелёного restore-drill.
  #
  # Слоты 01:1x/01:4x выбраны так, чтобы не пересекаться с velero-окном 02:55.
  # Бот пишет SQLite в /app/config; снапшот тома — crash-consistent, для
  # SQLite в WAL-режиме этого достаточно (восстановление проигрывает WAL).
  volsync:
    - name: rss-to-telegram-bot
      claim: rss-to-telegram-bot
      capacity: 1Gi
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "10 1 * * *"
          retain:
            daily: 7
            weekly: 4
        - repo: ovh
          schedule: "40 1 * * 0"
          retain:
            weekly: 12
            monthly: 6

  apps:
    - name: rss-to-telegram-bot
      deployment:
        metadata:
          labels:
            app.kubernetes.io/name: rss-to-telegram-bot
            app.kubernetes.io/instance: rss-to-telegram-bot
          annotations:
            argocd.argoproj.io/sync-options: Replace=true
        spec:
          replicas: 1
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app.kubernetes.io/name: rss-to-telegram-bot
              app.kubernetes.io/instance: rss-to-telegram-bot
          template:
            metadata:
              labels:
                app.kubernetes.io/name: rss-to-telegram-bot
                app.kubernetes.io/instance: rss-to-telegram-bot
            spec:
              # ndots:2 — pod resolv.conf defaults to ndots:5, so external names
              # with <5 dots (RSS feed hosts, api.telegram.org) burn 3-4 NXDOMAIN
              # search-suffix lookups before the real one. Cuts that tax.
              dnsConfig:
                options:
                  - name: ndots
                    value: "2"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: rss-to-telegram-bot
                  # renovate: image=ghcr.io/vizzletf/rss-to-telegram-bot-2
                  image: ghcr.io/vizzletf/rss-to-telegram-bot-2:dev@sha256:2679ff61d7ac444009c02e12c3e37169763e1c0875bbecb3d22ad8c411b97931
                  imagePullPolicy: Always
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                  env:
                    - name: PORT
                      value: "8848"
                  envFrom:
                    - secretRef:
                        name: rss-to-telegram-bot
                  livenessProbe:
                    tcpSocket:
                      port: 8848
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 3
                  readinessProbe:
                    tcpSocket:
                      port: 8848
                    initialDelaySeconds: 60
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 3
                  volumeMounts:
                    - name: data
                      mountPath: /app/config
                  resources:
                    requests:
                      cpu: 25m
                      memory: 160Mi
                    limits:
                      cpu: 100m
                      memory: 256Mi
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: rss-to-telegram-bot
