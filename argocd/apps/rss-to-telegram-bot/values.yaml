homelab-common:
  networkPolicy:
    enabled: true

  externalSecrets:
    - name: rss-to-telegram-bot
      vaultPath: rsstt/rss-to-telegram-bot
      data:
        - secretKey: token
          property: token
        - secretKey: manager
          property: manager
      templateData:
        TOKEN: "{{ .token }}"
        MANAGER: "{{ .manager }}"

  persistentVolumeClaims:
    - name: rss-to-telegram-bot
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 1Gi
      # No volumeName pin: a stale one breaks the SSA dry-run (SYNC=Unknown); global
      # ignoreDifferences masks it.

  # Crash-consistent is enough: SQLite WAL mode replays on recovery.
  volsync:
    - name: rss-to-telegram-bot
      moverSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      targets:
        - repo: garage
          schedule: "10 1 * * *"
        - repo: ovh
          schedule: "40 1 * * 0"

  workloads:
    - name: rss-to-telegram-bot
      service: false                # the port is for probes only
      pod:
        # Default ndots:5 burns 3-4 NXDOMAIN lookups per external name.
        dnsConfig:
          options:
            - name: ndots
              value: "2"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: rss-to-telegram-bot
          image:
            repository: ghcr.io/vizzletf/rss-to-telegram-bot
            tag: 3.0.0@sha256:588d242bb4a8bcdd14a38764878bdf68af940cffd21ce0ac8b774ceb306b70d0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8848
          env:
            - name: PORT
              value: "8848"
          envFrom:
            - secretRef:
                name: rss-to-telegram-bot
          # /healthz: feed scheduler stalled; /readyz: Telegram or DB unreachable.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 160Mi
            limits:
              # Throttled 55% of periods at 100m.
              cpu: 250m
              memory: 256Mi
      persistence:
        data:
          claim: rss-to-telegram-bot
          mountPath: /app/config
