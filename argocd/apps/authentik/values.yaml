    # Self-service enrollment via single-use invitation links.
    # Built as a blueprint because the admin "create enrollment flow" wizard is
    # broken on authentik 2026.5.3 (dramatiq get_result() times out — task runs
    # and result lands in the Task table, but the synchronous get_result the
    # wizard uses never resolves). The blueprint discovery+apply path is fine.
    - name: authentik-blueprint-enrollment-invitation
      namespace: authentik
      enabled: true
      blueprints:
        enrollment-invitation.yaml: |
          version: 1
          metadata:
            name: Enrollment via Invitation
          entries:
            # --- Prompt fields ---
            - model: authentik_stages_prompt.prompt
              id: prompt-username
              identifiers:
                field_key: username
                name: invitation-field-username
              attrs:
                label: Username
                type: username
                required: true
                placeholder: Username
                order: 100
            - model: authentik_stages_prompt.prompt
              id: prompt-name
              identifiers:
                field_key: name
                name: invitation-field-name
              attrs:
                label: Display name
                type: text
                required: true
                placeholder: Name
                order: 150
            - model: authentik_stages_prompt.prompt
              id: prompt-email
              identifiers:
                field_key: email
                name: invitation-field-email
              attrs:
                label: Email
                type: email
                required: true
                placeholder: Email
                order: 200
            - model: authentik_stages_prompt.prompt
              id: prompt-password
              identifiers:
                field_key: password
                name: invitation-field-password
              attrs:
                label: Password
                type: password
                required: true
                placeholder: Password
                order: 300
            - model: authentik_stages_prompt.prompt
              id: prompt-password-repeat
              identifiers:
                field_key: password_repeat
                name: invitation-field-password-repeat
              attrs:
                label: Password (repeat)
                type: password
                required: true
                placeholder: Password (repeat)
                order: 400

            # --- Password-equality validation policy ---
            - model: authentik_policies_expression.expressionpolicy
              id: policy-password-equal
              identifiers:
                name: invitation-password-equals
              attrs:
                expression: |
                  if request.context.get("prompt_data", {}).get("password") != request.context.get("prompt_data", {}).get("password_repeat"):
                      ak_message("Passwords don't match.")
                      return False
                  return True

            # --- Stages ---
            - model: authentik_stages_invitation.invitationstage
              id: stage-invitation
              identifiers:
                name: invitation-enrollment-invitation
              attrs:
                continue_flow_without_invitation: false
            - model: authentik_stages_prompt.promptstage
              id: stage-prompt
              identifiers:
                name: invitation-enrollment-prompt
              attrs:
                fields:
                  - !KeyOf prompt-username
                  - !KeyOf prompt-name
                  - !KeyOf prompt-email
                  - !KeyOf prompt-password
                  - !KeyOf prompt-password-repeat
                validation_policies:
                  - !KeyOf policy-password-equal
            - model: authentik_stages_user_write.userwritestage
              id: stage-write
              identifiers:
                name: invitation-enrollment-write
              attrs:
                user_creation_mode: always_create
                create_users_as_inactive: false
            - model: authentik_stages_user_login.userloginstage
              id: stage-login
              identifiers:
                name: invitation-enrollment-login
              attrs:
                session_duration: seconds=0

            # --- Flow ---
            - model: authentik_flows.flow
              id: flow
              identifiers:
                slug: enrollment-invitation
              attrs:
                name: Enrollment via Invitation
                title: Create your account
                designation: enrollment
                authentication: require_unauthenticated

            # --- Stage bindings (order = sequence) ---
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf flow
                stage: !KeyOf stage-invitation
                order: 10
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf flow
                stage: !KeyOf stage-prompt
                order: 20
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf flow
                stage: !KeyOf stage-write
                order: 30
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf flow
                stage: !KeyOf stage-login
                order: 40

    - name: authentik-blueprint-opencloud
      namespace: authentik
      enabled: true
      blueprints:
        # Blueprint 0: role groups. OpenCloud runs with
        # PROXY_ROLE_ASSIGNMENT_DRIVER=oidc, so a user whose `roles` claim matches
        # none of the default role mappings is refused at login — everyone who
        # should reach OpenCloud must sit in one of these groups.
        00-opencloud-groups.yaml: |
          version: 1
          metadata:
            name: OpenCloud Groups
          entries:
            - model: authentik_core.group
              identifiers:
                name: opencloudAdmin
              attrs:
                name: opencloudAdmin
                users:
                  - !Find [authentik_core.user, [username, vizzle]]
            - model: authentik_core.group
              identifiers:
                name: opencloudUser
              attrs:
                name: opencloudUser

        # Blueprint 1: roles scope mapping (no dependencies).
        # Must return a dict — authentik drops non-dict scope mapping results
        # ("Scope returned a non-dict value, ignoring").
        01-opencloud-scope.yaml: |
          version: 1
          metadata:
            name: OpenCloud OIDC - Roles Scope
          entries:
            - model: authentik_providers_oauth2.scopemapping
              identifiers:
                name: "OAuth Mapping: OpenCloud 'roles'"
              attrs:
                name: "OAuth Mapping: OpenCloud 'roles'"
                scope_name: roles
                description: "OpenCloud role assignment (PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM=roles)"
                expression: |
                  return {"roles": [group.name for group in request.user.ak_groups.all()]}

            # The mobile apps (iOS/Android) hardcode their scope list to
            # `openid profile email offline_access` — they ignore config.json's
            # `scope` and never ask for `roles`. Emitting the same claim from a
            # second mapping bound to `profile` makes the claim unconditional for
            # this provider without touching the shared authentik default mapping.
            - model: authentik_providers_oauth2.scopemapping
              identifiers:
                name: "OAuth Mapping: OpenCloud 'roles' (profile)"
              attrs:
                name: "OAuth Mapping: OpenCloud 'roles' (profile)"
                scope_name: profile
                description: "OpenCloud role assignment for clients that only request `profile`"
                expression: |
                  return {"roles": [group.name for group in request.user.ak_groups.all()]}

        # Blueprint 2: provider + app (references the scope via !Find, runs after 01-).
        # Public client, no secret: every OpenCloud client (web, desktop, mobile) is a
        # public PKCE client per upstream docs. One provider only — authentik scopes the
        # issuer to a single application, and OpenCloud takes a single OC_OIDC_ISSUER,
        # so the desktop loopback URIs live on this same provider.
        02-opencloud-oidc.yaml: |
          version: 1
          metadata:
            name: OpenCloud OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: OpenCloud OIDC
              attrs:
                name: OpenCloud OIDC
                client_type: public
                client_id: opencloud-web
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://opencloud.example.com/
                  - matching_mode: strict
                    url: https://opencloud.example.com/oidc-callback.html
                  - matching_mode: strict
                    url: https://opencloud.example.com/oidc-silent-redirect.html
                  # OpenCloud Desktop uses a loopback redirect.
                  - matching_mode: strict
                    url: http://127.0.0.1
                  - matching_mode: strict
                    url: http://localhost
                  # OpenCloud iOS/Android use a hardcoded custom-scheme redirect.
                  # These strings live in the app binaries; the server never
                  # advertises them (webfinger only returns the issuer relation).
                  - matching_mode: strict
                    url: oc://ios.opencloud.eu
                  - matching_mode: strict
                    url: oc://android.opencloud.eu
                # Required: OpenCloud verifies the access token as a JWT
                # (PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD=jwt).
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
                  # Desktop and mobile request offline_access; without the mapping
                  # authentik issues no refresh token and the clients re-login daily.
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "OAuth Mapping: OpenCloud 'roles'"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "OAuth Mapping: OpenCloud 'roles' (profile)"]]

            - model: authentik_core.application
              identifiers:
                slug: opencloud
              attrs:
                name: OpenCloud
                slug: opencloud
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, OpenCloud OIDC]]
                launch_url: https://opencloud.example.com
                open_in_new_tab: true
                meta_description: File sync, share and collaboration
                policy_engine_mode: any

  externalSecrets:
    # Config secret for authentik (referenced via existingSecret.secretName)
    - name: authentik-config
      vaultPath: authentik/authentik
      data:
        - secretKey: secret_key
          property: secret_key
        - secretKey: db_password
          property: db_password
        - secretKey: grafana_oidc_client_secret
          property: grafana_oidc_client_secret
        - secretKey: argocd_oidc_client_secret
          property: argocd_oidc_client_secret
        - secretKey: immich_oidc_client_secret
          property: immich_oidc_client_secret
        - secretKey: nextcloud_oidc_client_secret
          property: nextcloud_oidc_client_secret
        - secretKey: forgejo_oidc_client_secret
          property: forgejo_oidc_client_secret
        - secretKey: velero_ui_oidc_client_secret
          property: velero_ui_oidc_client_secret
        - secretKey: trek_oidc_client_secret
          property: trek_oidc_client_secret
      templateData:
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        # Via PgBouncer (transaction pooling) — see argocd/apps/cnpg/manifests/pooler.yaml.
        # USE_PGBOUNCER disables server-side cursors (incompatible with transaction mode).
        AUTHENTIK_POSTGRESQL__HOST: "cnpg-cluster-pooler-rw.cnpg.svc.cluster.local"
        AUTHENTIK_POSTGRESQL__USE_PGBOUNCER: "true"
        AUTHENTIK_POSTGRESQL__USER: "authentik"
        AUTHENTIK_POSTGRESQL__NAME: "authentik"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .db_password }}"
        AUTHENTIK_REDIS__HOST: "valkey-primary.valkey.svc.cluster.local"
        AUTHENTIK_COOKIE_DOMAIN: "example.com"
        AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "0.0.0.0/0"
        AUTHENTIK_SERVER__FROM_HEADER: "true"
        GRAFANA_OIDC_CLIENT_SECRET: "{{ .grafana_oidc_client_secret }}"
        ARGOCD_OIDC_CLIENT_SECRET: "{{ .argocd_oidc_client_secret }}"
        IMMICH_OIDC_CLIENT_SECRET: "{{ .immich_oidc_client_secret }}"
        NEXTCLOUD_OIDC_CLIENT_SECRET: "{{ .nextcloud_oidc_client_secret }}"
        FORGEJO_OIDC_CLIENT_SECRET: "{{ .forgejo_oidc_client_secret }}"
        VELERO_UI_OIDC_CLIENT_SECRET: "{{ .velero_ui_oidc_client_secret }}"
        TREK_OIDC_CLIENT_SECRET: "{{ .trek_oidc_client_secret }}"


    # DB credentials secret for CNPG cluster bootstrap
    - name: authentik-db-credentials
      vaultPath: authentik/authentik
      data:
        - secretKey: db_password
          property: db_password
      templateData:
        username: "authentik"
        password: "{{ .db_password }}"

    - name: cnpg-s3-backup
      vaultPath: shared/s3-cnpg-backup
      data:
        - secretKey: ACCESS_KEY_ID
          property: ACCESS_KEY_ID
        - secretKey: ACCESS_SECRET_KEY
          property: ACCESS_SECRET_KEY


  httpRoutes:
    - name: authentik
      hostname: authentik
      gateway: external
      service:
        name: authentik-server
        port: 80
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https

# Use our ExternalSecret instead of chart-generated config secret
authentik:
  existingSecret:
    secretName: "authentik-config"

server:
  # Live usage ~32m/442Mi; memory sits close to the chart's suggested 512Mi.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Chart defaults (timeout 3s, threshold 3) kill the pod after 30s of GC/load
  # stalls — source of the recurring restarts + gateway 502s.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5

worker:
  # Live usage ~97m/370Mi.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Mount blueprints ConfigMaps (top-level chart setting, not under authentik:)
blueprints:
  configMaps:
    - authentik-blueprint-grafana
    - authentik-blueprint-argocd
    - authentik-blueprint-immich
    - authentik-blueprint-nextcloud
    - authentik-blueprint-forgejo
    - authentik-blueprint-velero-ui
    - authentik-blueprint-trek
    - authentik-blueprint-opencloud
    - authentik-blueprint-enrollment-invitation

global:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  # Rollout server+worker when ESO patches `authentik-config` (new
  # *_OIDC_CLIENT_SECRET entry added by scaffolding-authentik-oidc skill).
  # Without this, freshly-added blueprints fail !Env resolution silently.
  # Watched by stakater/reloader (argocd/infra/reloader).
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "authentik-config"
