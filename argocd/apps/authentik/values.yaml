authentik:
  existingSecret:
    secretName: "authentik-config"

server:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Chart defaults kill the pod after 30s of GC stalls: restarts + gateway 502s.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5

worker:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # `ak healthcheck` needs >3s under load; liveness killed the worker every ~20min.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  startupProbe:
    timeoutSeconds: 5

# Top-level key, not under authentik:
blueprints:
  configMaps:
    - authentik-blueprint-grafana
    - authentik-blueprint-argocd
    - authentik-blueprint-immich
    - authentik-blueprint-forgejo
    - authentik-blueprint-trek
    - authentik-blueprint-opencloud
    - authentik-blueprint-enrollment-invitation
    - authentik-blueprint-wazuh

global:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  # Without the rollout, new blueprints fail !Env resolution silently.
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "authentik-config"

homelab-common:
  networkPolicy:
    enabled: true

  authentikBlueprints:
    - name: authentik-blueprint-grafana
      blueprints:
        # Matched by role_attribute_path in argocd/infra/victoria-metrics-k8s-stack/values.yaml.
        00-grafana-groups.yaml: |
          version: 1
          metadata:
            name: Grafana Groups
          entries:
            - model: authentik_core.group
              identifiers:
                name: grafana-admins
              attrs:
                name: grafana-admins
                users:
                  - !Find [authentik_core.user, [username, vizzle]]

        # The `groups` claim comes from the default profile mapping.
        02-grafana-oidc.yaml: |
          version: 1
          metadata:
            name: Grafana OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: Grafana OIDC
              attrs:
                name: Grafana OIDC
                client_type: confidential
                client_id: grafana
                client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://grafana.example.com/login/generic_oauth
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]

            - model: authentik_core.application
              identifiers:
                slug: grafana
              attrs:
                name: Grafana
                slug: grafana
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Grafana OIDC]]
                open_in_new_tab: true
                meta_icon: https://grafana.com/static/assets/img/fav32.png
                meta_description: Monitoring and observability platform
                policy_engine_mode: any

    - name: authentik-blueprint-immich
      blueprints:
        02-immich-oidc.yaml: |
          version: 1
          metadata:
            name: Immich OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: Immich OIDC
              attrs:
                name: Immich OIDC
                client_type: confidential
                client_id: immich
                client_secret: !Env IMMICH_OIDC_CLIENT_SECRET
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://immich.example.com/auth/login
                  # LAN-only twin route; the web client sends its own origin.
                  - matching_mode: strict
                    url: https://immich-lan.example.com/auth/login
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]

            - model: authentik_core.application
              identifiers:
                slug: immich
              attrs:
                name: Immich
                slug: immich
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Immich OIDC]]
                open_in_new_tab: true
                meta_description: Self-hosted photo and video backup
                policy_engine_mode: any

    - name: authentik-blueprint-argocd
      blueprints:
        00-argocd-groups.yaml: |
          version: 1
          metadata:
            name: ArgoCD Groups
          entries:
            - model: authentik_core.group
              identifiers:
                name: "ArgoCD Admins"
              attrs:
                name: "ArgoCD Admins"
                users:
                  - !Find [authentik_core.user, [username, vizzle]]

        02-argocd-oidc.yaml: |
          version: 1
          metadata:
            name: ArgoCD OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: ArgoCD OIDC
              attrs:
                name: ArgoCD OIDC
                # public + PKCE for `argocd login --sso`; a second client would get another issuer.
                client_type: public
                client_id: argocd
                client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://argocd.example.com/auth/callback
                  - matching_mode: strict
                    url: http://localhost:8085/auth/callback
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]

            - model: authentik_core.application
              identifiers:
                slug: argocd
              attrs:
                name: ArgoCD
                slug: argocd
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, ArgoCD OIDC]]
                open_in_new_tab: true
                meta_description: GitOps continuous delivery
                policy_engine_mode: any

    - name: authentik-blueprint-trek
      blueprints:
        02-trek-oidc.yaml: |
          version: 1
          metadata:
            name: TREK OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: TREK OIDC
              attrs:
                name: TREK OIDC
                client_type: confidential
                client_id: trek
                client_secret: !Env TREK_OIDC_CLIENT_SECRET
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://trek.example.com/api/auth/oidc/callback
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]

            - model: authentik_core.application
              identifiers:
                slug: trek
              attrs:
                name: TREK
                slug: trek
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, TREK OIDC]]
                open_in_new_tab: true
                meta_description: Collaborative travel planner
                policy_engine_mode: any

    # Blueprint: the admin enrollment-flow wizard hangs on 2026.5.3.
    - name: authentik-blueprint-enrollment-invitation
      blueprints:
        enrollment-invitation.yaml: |
          version: 1
          metadata:
            name: Enrollment via Invitation
          entries:
            - model: authentik_stages_prompt.prompt
              id: prompt-username
              identifiers:
                field_key: username
                name: invitation-field-username
              attrs:
                label: Username
                type: username
                required: true
                placeholder: Username
                order: 100
            - model: authentik_stages_prompt.prompt
              id: prompt-name
              identifiers:
                field_key: name
                name: invitation-field-name
              attrs:
                label: Display name
                type: text
                required: true
                placeholder: Name
                order: 150
            - model: authentik_stages_prompt.prompt
              id: prompt-email
              identifiers:
                field_key: email
                name: invitation-field-email
              attrs:
                label: Email
                type: email
                required: true
                placeholder: Email
                order: 200
            - model: authentik_stages_prompt.prompt
              id: prompt-password
              identifiers:
                field_key: password
                name: invitation-field-password
              attrs:
                label: Password
                type: password
                required: true
                placeholder: Password
                order: 300
            - model: authentik_stages_prompt.prompt
              id: prompt-password-repeat
              identifiers:
                field_key: password_repeat
                name: invitation-field-password-repeat
              attrs:
                label: Password (repeat)
                type: password
                required: true
                placeholder: Password (repeat)
                order: 400

            - model: authentik_policies_expression.expressionpolicy
              id: policy-password-equal
              identifiers:
                name: invitation-password-equals
              attrs:
                expression: |
                  if request.context.get("prompt_data", {}).get("password") != request.context.get("prompt_data", {}).get("password_repeat"):
                      ak_message("Passwords don't match.")
                      return False
                  return True
            - model: authentik_policies_password.passwordpolicy
              id: policy-password-strength
              identifiers:
                name: invitation-password-strength
              attrs:
                password_field: password
                check_static_rules: true
                length_min: 12
                # zxcvbn runs offline; HIBP would send hash prefixes to an external API
                check_zxcvbn: true
                zxcvbn_score_threshold: 3
                error_message: Password needs at least 12 characters.

            - model: authentik_stages_invitation.invitationstage
              id: stage-invitation
              identifiers:
                name: invitation-enrollment-invitation
              attrs:
                continue_flow_without_invitation: false
            - model: authentik_stages_prompt.promptstage
              id: stage-prompt
              identifiers:
                name: invitation-enrollment-prompt
              attrs:
                fields:
                  - !KeyOf prompt-username
                  - !KeyOf prompt-name
                  - !KeyOf prompt-email
                  - !KeyOf prompt-password
                  - !KeyOf prompt-password-repeat
                validation_policies:
                  - !KeyOf policy-password-equal
                  - !KeyOf policy-password-strength
            - model: authentik_stages_user_write.userwritestage
              id: stage-write
              identifiers:
                name: invitation-enrollment-write
              attrs:
                user_creation_mode: always_create
                create_users_as_inactive: false
            - model: authentik_stages_user_login.userloginstage
              id: stage-login
              identifiers:
                name: invitation-enrollment-login
              attrs:
                session_duration: seconds=0

            - model: authentik_flows.flow
              id: flow
              identifiers:
                slug: enrollment-invitation
              attrs:
                name: Enrollment via Invitation
                title: Create your account
                designation: enrollment
                authentication: require_unauthenticated

            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf flow
                stage: !KeyOf stage-invitation
                order: 10
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf flow
                stage: !KeyOf stage-prompt
                order: 20
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf flow
                stage: !KeyOf stage-write
                order: 30
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf flow
                stage: !KeyOf stage-login
                order: 40
    - name: authentik-blueprint-wazuh
      blueprints:
        # Name must match backendRoles in argocd/apps/wazuh opensearchRoleMappings.
        # No viewer group: see the role-mapping comment there.
        00-wazuh-groups.yaml: |
          version: 1
          metadata:
            name: Wazuh Groups
          entries:
            - model: authentik_core.group
              identifiers:
                name: wazuh-admins
              attrs:
                name: wazuh-admins
                users:
                  - !Find [authentik_core.user, [username, vizzle]]

        02-wazuh-oidc.yaml: |
          version: 1
          metadata:
            name: Wazuh OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: Wazuh OIDC
              attrs:
                name: Wazuh OIDC
                client_type: confidential
                client_id: wazuh
                client_secret: !Env WAZUH_OIDC_CLIENT_SECRET
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://wazuh.example.com/auth/openid/login
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]

            - model: authentik_core.application
              identifiers:
                slug: wazuh
              attrs:
                name: Wazuh
                slug: wazuh
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Wazuh OIDC]]
                open_in_new_tab: true
                meta_description: SIEM/XDR — alerts, FIM, SCA and agent management
                policy_engine_mode: any


    - name: authentik-blueprint-opencloud
      blueprints:
        # Users outside these groups are refused at OpenCloud login (role driver oidc).
        00-opencloud-groups.yaml: |
          version: 1
          metadata:
            name: OpenCloud Groups
          entries:
            - model: authentik_core.group
              identifiers:
                name: opencloudAdmin
              attrs:
                name: opencloudAdmin
                users:
                  - !Find [authentik_core.user, [username, vizzle]]
            - model: authentik_core.group
              identifiers:
                name: opencloudUser
              attrs:
                name: opencloudUser

        # Must return a dict, else "Scope returned a non-dict value, ignoring".
        01-opencloud-scope.yaml: |
          version: 1
          metadata:
            name: OpenCloud OIDC - Roles Scope
          entries:
            - model: authentik_providers_oauth2.scopemapping
              identifiers:
                name: "OAuth Mapping: OpenCloud 'roles'"
              attrs:
                name: "OAuth Mapping: OpenCloud 'roles'"
                scope_name: roles
                description: "OpenCloud role assignment (PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM=roles)"
                expression: |
                  return {"roles": [group.name for group in request.user.groups.all()]}

            # Mobile apps never request `roles`; bound to `profile` they still get it.
            - model: authentik_providers_oauth2.scopemapping
              identifiers:
                name: "OAuth Mapping: OpenCloud 'roles' (profile)"
              attrs:
                name: "OAuth Mapping: OpenCloud 'roles' (profile)"
                scope_name: profile
                description: "OpenCloud role assignment for clients that only request `profile`"
                expression: |
                  return {"roles": [group.name for group in request.user.groups.all()]}

        # One public provider for all clients: OpenCloud takes a single OC_OIDC_ISSUER.
        02-opencloud-oidc.yaml: |
          version: 1
          metadata:
            name: OpenCloud OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: OpenCloud OIDC
              attrs:
                name: OpenCloud OIDC
                client_type: public
                client_id: opencloud-web
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://opencloud.example.com/
                  - matching_mode: strict
                    url: https://opencloud.example.com/oidc-callback.html
                  - matching_mode: strict
                    url: https://opencloud.example.com/oidc-silent-redirect.html
                  - matching_mode: strict
                    url: http://127.0.0.1
                  - matching_mode: strict
                    url: http://localhost
                  # Hardcoded in the mobile apps; not discoverable from the server.
                  - matching_mode: strict
                    url: oc://ios.opencloud.eu
                  - matching_mode: strict
                    url: oc://android.opencloud.eu
                # Required: OpenCloud verifies the access token as a JWT.
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
                  # Without it, no refresh token: clients re-login daily.
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "OAuth Mapping: OpenCloud 'roles'"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "OAuth Mapping: OpenCloud 'roles' (profile)"]]

            - model: authentik_core.application
              identifiers:
                slug: opencloud
              attrs:
                name: OpenCloud
                slug: opencloud
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, OpenCloud OIDC]]
                open_in_new_tab: true
                meta_description: File sync, share and collaboration
                policy_engine_mode: any

    - name: authentik-blueprint-forgejo
      blueprints:
        # Legacy filename kept: renaming creates a new BlueprintInstance (duplicate key).
        forgejo-oidc.yaml: |
          version: 1
          metadata:
            name: Forgejo OIDC Integration
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              identifiers:
                name: Forgejo OIDC
              attrs:
                name: Forgejo OIDC
                client_type: confidential
                client_id: forgejo
                client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                redirect_uris:
                  - matching_mode: strict
                    url: https://git.example.com/user/oauth2/Authentik/callback
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]

            - model: authentik_core.application
              identifiers:
                slug: forgejo
              attrs:
                name: Forgejo
                slug: forgejo
                provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Forgejo OIDC]]
                meta_launch_url: https://git.example.com/
                policy_engine_mode: any
                group: Homelab

  externalSecrets:
    # OIDC client secrets come from each app's <ns>/oidc, shared with the app.
    - name: authentik-config
      vaultPath: authentik/authentik
      data:
        - secretKey: secret_key
          property: secret_key
        - secretKey: db_password
          property: db_password
        - secretKey: grafana_oidc_client_secret
          vaultPath: victoria-metrics/oidc
          property: client_secret
        - secretKey: argocd_oidc_client_secret
          vaultPath: argocd/oidc
          property: client_secret
        - secretKey: immich_oidc_client_secret
          vaultPath: immich/oidc
          property: client_secret
        - secretKey: forgejo_oidc_client_secret
          vaultPath: forgejo/oidc
          property: client_secret
        - secretKey: trek_oidc_client_secret
          vaultPath: trek/oidc
          property: client_secret
        - secretKey: wazuh_oidc_client_secret
          vaultPath: wazuh/oidc
          property: client_secret
      templateData:
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        # Transaction-mode PgBouncer: USE_PGBOUNCER disables server-side cursors.
        AUTHENTIK_POSTGRESQL__HOST: "cnpg-cluster-pooler-rw.cnpg.svc.cluster.local"
        AUTHENTIK_POSTGRESQL__USE_PGBOUNCER: "true"
        AUTHENTIK_POSTGRESQL__USER: "authentik"
        AUTHENTIK_POSTGRESQL__NAME: "authentik"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .db_password }}"
        AUTHENTIK_COOKIE_DOMAIN: "example.com"
        AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "0.0.0.0/0"
        AUTHENTIK_SERVER__FROM_HEADER: "true"
        GRAFANA_OIDC_CLIENT_SECRET: "{{ .grafana_oidc_client_secret }}"
        ARGOCD_OIDC_CLIENT_SECRET: "{{ .argocd_oidc_client_secret }}"
        IMMICH_OIDC_CLIENT_SECRET: "{{ .immich_oidc_client_secret }}"
        FORGEJO_OIDC_CLIENT_SECRET: "{{ .forgejo_oidc_client_secret }}"
        TREK_OIDC_CLIENT_SECRET: "{{ .trek_oidc_client_secret }}"
        WAZUH_OIDC_CLIENT_SECRET: "{{ .wazuh_oidc_client_secret }}"

  httpRoutes:
    - name: authentik
      hostname: authentik
      gateway: external
      service:
        name: authentik-server
        port: 80
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
