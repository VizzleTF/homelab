apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: alerse-sync-db-daily-backup
  namespace: alerse-sync
spec:
  schedule: "0 45 5 * * *"
  backupOwnerReference: self
  cluster:
    name: alerse-sync-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
