# Full allowlists, ingress and egress, for a service open to the internet: a
# compromised server reaches its own Postgres and cluster DNS, nothing else;
# Postgres takes connections only from the server, its own instances and the
# CNPG operator. obsidian 116 Plans/alerse-sync.md
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alerse-sync-server
  namespace: alerse-sync
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alerse-sync
  ingress:
    # Kubelet probes. No `ingress`: through cilium-gateway any LAN host could
    # set X-Forwarded-For and name any client to the per-address limits.
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "8295"
              protocol: TCP
    # The NetBird routing peers that carry the Reverse Proxy straight to the
    # service (network alerse-sync in NetBird), bypassing the gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: netbird
          matchExpressions:
            - key: app
              operator: In
              values: [netbird-peer, netbird-peer-2]
      toPorts:
        - ports:
            - port: "8295"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: victoria-metrics
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9295"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alerse-sync
            cnpg.io/cluster: alerse-sync-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "**.cluster.local"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alerse-sync-db
  namespace: alerse-sync
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: alerse-sync-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alerse-sync
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Replication and the instance manager's status between instances.
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: alerse-sync-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # Operator and barman plugin (status, backups); probes from kubelet.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: victoria-metrics
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: alerse-sync-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
    # Barman WAL archive and base backups: Garage on the NAS (s3.example.com).
    - toCIDR: [10.11.12.237/32]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "**.cluster.local"
              - matchName: s3.example.com
