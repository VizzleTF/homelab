# Egress allowlist: the pod holds a May API key with write access, so it may
# reach only the May service and cluster DNS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-may-only
  namespace: may-mcp
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: may
      toPorts:
        - ports:
            - port: "5050"
              protocol: TCP
