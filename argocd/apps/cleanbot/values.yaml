# Cleanbot — Telegram-бот, удаляющий старые сообщения в форумных топиках.
# Chart:  https://git.example.com/api/packages/vizzle/helm  cleanbot 0.2.9
# Source: https://git.example.com/vizzle/cleanbot
# Vault:  homelab/k8s/cleanbot/app-secrets  (bot_token, webhook_header_secret, webhook_path_secret)

# --- Values для upstream-чарта cleanbot ---

# tag не задаём — чарт подставит .Chart.AppVersion (pinned через targetRevision в config.yaml),
# pullPolicy остаётся чартный IfNotPresent. Versioned образ ⇒ Renovate трекает chart-bumps.
image:
  repository: git.example.com/vizzle/cleanbot

bot:
  # ESO материализует Secret cleanbot-secrets из Vault (см. homelab-common.externalSecrets ниже).
  existingSecret: cleanbot-secrets
  webhookBaseUrl: "https://cleanbot.example.com"

# Чартный Ingress отключаем — фронт через Cilium HTTPRoute (homelab-common.httpRoutes ниже).
ingress:
  enabled: false

persistence:
  enabled: true
  storageClass: longhorn
  size: 1Gi

# --- Values для homelab-common ---

homelab-common:
  # Backup v2 (см. docs/backup-v2.md): VolSync снимает Longhorn CSI-снапшот и
  # льёт restic в две независимые цели — garage (on-prem) и ovh (off-site).
  # Velero-расписания выше пока работают параллельно, уйдут на фазе 8.
  volsync:
    - name: cleanbot
      claim: cleanbot
      capacity: 1Gi
      moverSecurityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      targets:
        - repo: garage
          schedule: "10 0 * * *"
          retain:
            daily: 7
            weekly: 4
        - repo: ovh
          schedule: "10 5 * * 0"
          retain:
            weekly: 12
            monthly: 6

  externalSecrets:
    - name: cleanbot-secrets
      vaultPath: cleanbot/app-secrets
      data:
        - secretKey: BOT_TOKEN
          property: bot_token
        - secretKey: WEBHOOK_HEADER_SECRET
          property: webhook_header_secret
        - secretKey: WEBHOOK_PATH_SECRET
          property: webhook_path_secret

  httpRoutes:
    - name: cleanbot
      hostname: cleanbot
      gateway: external
      service:
        name: cleanbot
        port: 8080
