homelab-common:
  networkPolicy:
    enabled: true

  persistentVolumeClaims:
    - name: cleanbot
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 1Gi

  volsync:
    - name: cleanbot
      moverSecurityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      targets:
        - repo: garage
          schedule: "10 0 * * *"
        - repo: ovh
          schedule: "10 5 * * 0"

  externalSecrets:
    - name: cleanbot-secrets
      vaultPath: cleanbot/app-secrets
      data:
        - secretKey: BOT_TOKEN
          property: bot_token
        - secretKey: WEBHOOK_HEADER_SECRET
          property: webhook_header_secret
        - secretKey: WEBHOOK_PATH_SECRET
          property: webhook_path_secret

  httpRoutes:
    - name: cleanbot
      hostname: cleanbot
      gateway: external
      service:
        name: cleanbot
        port: 8080

  # Non-defaults only, so an image bump brings its own defaults.
  configMaps:
    - name: cleanbot
      data:
        WEBHOOK_BASE_URL: "https://cleanbot.example.com"

  workloads:
    - name: cleanbot
      pod:
        # Keep: without it SSA keeps the deprecated serviceAccount field and pods ask
        # for the pruned SA "cleanbot".
        serviceAccountName: default
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          fsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: cleanbot
          image:
            repository: git.example.com/vizzle/cleanbot
            tag: "0.2.9"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: cleanbot-secrets
            - configMapRef:
                name: cleanbot
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      persistence:
        data:
          claim: cleanbot           # SQLite on RWO: one replica only
          mountPath: /data
        tmp:
          emptyDir: {}
          mountPath: /tmp
