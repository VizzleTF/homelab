# Cleanbot — Telegram bot that deletes old messages in forum topics.
# Source: https://git.example.com/vizzle/cleanbot
# Vault:  homelab/k8s/cleanbot/app-secrets  (bot_token, webhook_header_secret, webhook_path_secret)

homelab-common:
  # Default-deny ingress (homelab-common >= 1.17): own namespace, gateway,
  # probes and API server only; extra sources from Hubble flows 2026-09-24.
  networkPolicy:
    enabled: true

  persistentVolumeClaims:
    - name: cleanbot
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      size: 1Gi

  # Backup v2: VolSync restic to garage (on-prem) and ovh (off-site),
  # obsidian/113 Backups/Backup Overview.md.
  volsync:
    - name: cleanbot
      claim: cleanbot
      moverSecurityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      targets:
        - repo: garage
          schedule: "10 0 * * *"
        - repo: ovh
          schedule: "10 5 * * 0"

  externalSecrets:
    - name: cleanbot-secrets
      vaultPath: cleanbot/app-secrets
      data:
        - secretKey: BOT_TOKEN
          property: bot_token
        - secretKey: WEBHOOK_HEADER_SECRET
          property: webhook_header_secret
        - secretKey: WEBHOOK_PATH_SECRET
          property: webhook_path_secret

  httpRoutes:
    - name: cleanbot
      hostname: cleanbot
      gateway: external
      service:
        name: cleanbot
        port: 8080

  # Only non-defaults: every other setting keeps its default from
  # src/cleanjob/config.py, so an image bump brings its own defaults.
  configMaps:
    - name: cleanbot
      data:
        WEBHOOK_BASE_URL: "https://cleanbot.example.com"

  workloads:
    - name: cleanbot                # -> Deployment + Service "cleanbot"
      pod:
        # Explicit on purpose: only dropping serviceAccountName (SSA) keeps the
        # deprecated serviceAccount field, so pods would still ask for the pruned
        # SA "cleanbot" from the old chart (checked by a server-side dry-run).
        serviceAccountName: default
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          fsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
      containers:
        - name: cleanbot
          image:
            repository: git.example.com/vizzle/cleanbot
            tag: "0.2.9"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: cleanbot-secrets
            - configMapRef:
                name: cleanbot
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      persistence:
        data:
          claim: cleanbot           # SQLite on a RWO claim: one replica, strategy Recreate
          mountPath: /data
        tmp:
          emptyDir: {}              # writable /tmp under readOnlyRootFilesystem
          mountPath: /tmp
