# Cleanbot — Telegram bot that deletes old messages in forum topics.
# Chart:  https://git.example.com/api/packages/vizzle/helm  cleanbot (version in config.yaml)
# Source: https://git.example.com/vizzle/cleanbot
# Vault:  homelab/k8s/cleanbot/app-secrets  (bot_token, webhook_header_secret, webhook_path_secret)

# No image tag: the chart uses its appVersion, so a chart bump is the image bump.
image:
  repository: git.example.com/vizzle/cleanbot

bot:
  # ESO creates cleanbot-secrets from OpenBao (homelab-common.externalSecrets below).
  existingSecret: cleanbot-secrets
  webhookBaseUrl: "https://cleanbot.example.com"

# The chart's Ingress is on by default; routing comes from homelab-common.httpRoutes.
ingress:
  enabled: false

persistence:
  enabled: true
  storageClass: longhorn
  size: 1Gi

homelab-common:
  # Default-deny ingress (homelab-common >= 1.17): own namespace, gateway,
  # probes and API server only; extra sources from Hubble flows 2026-09-24.
  networkPolicy:
    enabled: true

  # Backup v2: VolSync restic to garage (on-prem) and ovh (off-site),
  # obsidian/113 Backups/Backup Overview.md.
  volsync:
    - name: cleanbot
      claim: cleanbot
      moverSecurityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      targets:
        - repo: garage
          schedule: "10 0 * * *"
        - repo: ovh
          schedule: "10 5 * * 0"

  externalSecrets:
    - name: cleanbot-secrets
      vaultPath: cleanbot/app-secrets
      data:
        - secretKey: BOT_TOKEN
          property: bot_token
        - secretKey: WEBHOOK_HEADER_SECRET
          property: webhook_header_secret
        - secretKey: WEBHOOK_PATH_SECRET
          property: webhook_path_secret

  httpRoutes:
    - name: cleanbot
      hostname: cleanbot
      gateway: external
      service:
        name: cleanbot
        port: 8080
