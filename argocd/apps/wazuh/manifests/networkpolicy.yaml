# Manager ports that callers outside the namespace need, on top of the
# homelab-common default-ingress policy (policies are additive):
#   world          agents via the LoadBalancer 10.11.10.140 (1514 events, 1515 enrollment)
#                  and syslog via the same LB (514/udp). Vector's kube-audit sink
#                  reaches the LB from the node, so its source can be a node IP or
#                  the API VIP 10.11.11.100 that Cilium sees as world. Wazuh itself
#                  filters syslog senders with <allowed-ips> in ossec.conf.
#   netbird        agents on remote hosts over NetBird (1514/1515)
#   victoria-logs  Vector ships the kube audit stream as syslog (514/udp)
# 55000 (API) and 1516 (cluster) stay in-namespace. The indexer is never
# reachable from outside the namespace.
#
# The LB uses externalTrafficPolicy: Cluster (Local was reverted, see
# values.yaml). A LAN connection that ECMP lands on a node without the manager
# pod is SNATed and arrives as remote-node, which default-ingress allows — so
# without the deny below 55000 and 1516 answered from the LAN about half the
# time (2026-10-17). In-namespace callers (the dashboard) are pod identities
# and are not affected.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-manager-agents
  namespace: wazuh
spec:
  # The operator renamed app.kubernetes.io/component wazuh-manager -> manager
  # (applied 2026-10-24); the stale selector matched nothing, so syslog 514/udp
  # was dropped and the remote-node deny on 55000/1516 was gone. The name
  # label covers master and workers.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh-manager
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "1514"
              protocol: TCP
            - port: "1515"
              protocol: TCP
            - port: "514"
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: netbird
      toPorts:
        - ports:
            - port: "1514"
              protocol: TCP
            - port: "1515"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [victoria-logs]
      toPorts:
        - ports:
            - port: "514"
              protocol: UDP
  ingressDeny:
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "55000"
              protocol: TCP
            - port: "1516"
              protocol: TCP
