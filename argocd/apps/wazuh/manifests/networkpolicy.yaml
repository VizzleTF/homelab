# Adds to the homelab-common policy. 55000 and 1516 stay in-namespace.
# Vector's audit syslog may arrive from a node IP or the API VIP (Cilium: world).
# LAN agents come through wazuh-manager-lb (eTP Local): no SNAT, identity world.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-manager-agents
  namespace: wazuh
spec:
  # A stale selector silently drops 514/udp and the deny (component rename, 2026-10-24).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh-manager
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "1514"
              protocol: TCP
            - port: "1515"
              protocol: TCP
            - port: "514"
              protocol: UDP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: netbird
      toPorts:
        - ports:
            - port: "1514"
              protocol: TCP
            - port: "1515"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [victoria-logs]
      toPorts:
        - ports:
            - port: "514"
              protocol: UDP
