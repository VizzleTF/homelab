# WazuhCluster (manager + indexer + dashboard) rendered by the wazuh-cluster
# chart into a single CR; the wazuh-operator (argocd/infra/wazuh-operator)
# reconciles it. See docs/security-stack.md for the whole stack design.
namespace: wazuh
# ArgoCD creates the namespace (CreateNamespace=true).
createNamespace: false

# No sizing profile: homelab sizing is set explicitly below (profile XS is close
# but pins indexer storage at 10Gi and master at 5Gi, too small for 30d of alerts).
sizing:
  profile: ""
  storageClassName: longhorn

# The chart's externalSecrets block is deliberately NOT used (operator 2026.9.1).
# It only puts an externalSecretRef into the CR, and that path is half-wired:
# ensureAPICredentialsSecret() returns early without creating anything, while the
# dashboard and manager pod builders hardcode the canonical secret names
# (constants.APICredentialsName / IndexerCredentialsName). The result is pods stuck
# in CreateContainerConfigError on a missing wazuh-api-credentials.
#
# Instead the OpenBao-backed ExternalSecret below targets the canonical name
# directly, with the canonical keys from docs/usage/features/credentials.md. The
# indexer admin password stays operator-generated: its secret already exists and
# the security index is initialised from it, so a second owner would only cause
# churn.
externalSecrets:
  enabled: false

cluster:
  enabled: true
  name: wazuh
  spec:
    version: "4.14.7"
    storageClassName: longhorn

    indexer:
      # Single node: green health is impossible with replicas, so indices stay
      # yellow — that is expected and not a degraded state here.
      replicas: 1
      storageSize: 30Gi
      javaOpts: "-Xms1500m -Xmx1500m -Dlog4j2.formatMsgNoLookups=true"
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 3Gi

    manager:
      master:
        storageSize: 20Gi
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        # Agent enrollment (1515) and agent events (1514) for hosts outside the
        # cluster: VPS over the NetBird mesh, ops, Synology, OpenWrt syslog.
        # BGP announces the pool from every node, so the IP is reachable on LAN.
        #
        # ports REPLACES the operator's default set rather than extending it
        # (applyManagerServiceSpec → WithPorts), so every port the manager needs
        # is listed here — dropping one would silently unpublish it.
        service:
          type: LoadBalancer
          annotations:
            io.cilium/lb-ipam-ips: "10.11.10.140"
          ports:
            - name: api
              port: 55000
            - name: agent-events
              port: 1514
            - name: agent-auth
              port: 1515
            - name: cluster
              port: 1516
            # Devices that cannot run an agent (OpenWrt, DSM) ship syslog here.
            - name: syslog
              port: 514
              protocol: UDP
        # The CRD models <remote> as a single object, so the syslog listener is
        # added as raw XML; the operator appends it inside <ossec_config>.
        # allowed-ips is mandatory: without it wazuh-remoted drops every message.
        extraConfig: |
          <remote>
            <connection>syslog</connection>
            <port>514</port>
            <protocol>udp</protocol>
            <allowed-ips>10.11.0.0/16</allowed-ips>
            <allowed-ips>100.104.0.0/16</allowed-ips>
          </remote>
      workers:
        # Workers only scale agent-event ingestion horizontally; the master
        # accepts events itself and ~10 agents do not need a second node.
        replicas: 0
      config:
        auth:
          # Agents must present a password to enroll. The chart only wires this
          # up for its own inline/ESO secrets, so it is set explicitly here and
          # points at the OpenBao-backed secret created below.
          usePassword: true
          passwordSecretRef:
            name: wazuh-authd-pass
            key: password

    dashboard:
      replicas: 1
      # TLS terminates at cilium-gateway-internal, so the dashboard serves plain
      # HTTP and no BackendTLSPolicy is needed. Operator bug #63 (bool fields
      # with omitempty snapping back to their default) is fixed in 2026.9.1.
      enableSSL: false
      # Keep the dashboard off the control-plane nodes. OpenSearch Dashboards is
      # CPU-bound while it optimises bundles on boot, and on a saturated N100
      # control-plane node it never opened :5601 inside the liveness window
      # (60s + 3x30s) — the pod crash-looped there while an identical pod on the
      # worker came up fine.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          # 500m was not enough to finish the boot-time optimise step promptly.
          cpu: "1"
          memory: 1Gi

# Sign-in through Authentik. The dashboard keeps its local login as well: the
# operator forces the basic auth domain on and it is what `kibanaserver` uses to
# talk to the indexer, so removing it takes the dashboard down with it (operator
# issue #57). Only one domain may issue the WWW-Authenticate challenge, hence
# basic keeps challenge=true and OIDC leaves it false.
opensearchAuthConfig:
  enabled: true
  name: wazuh-auth
  spec:
    clusterRefs:
      - name: wazuh
        namespace: wazuh
    # The basic domain has to be declared explicitly. Leaving this block out
    # does NOT preserve a default: the operator emits a config.yml holding only
    # the domains named here, so omitting it produced activeAuthDomains=["oidc"]
    # and removed local sign-in — including kibanaserver's, which is how the
    # dashboard reaches the indexer.
    #
    # challenge MUST be false once OIDC is in play, despite the CRD advising to
    # keep it on. With challenge=true this domain answers a request carrying no
    # Basic credentials by returning 401 WWW-Authenticate immediately, which
    # ends the auth-domain walk before the OIDC domain is ever reached: a valid
    # bearer token produced 336 checks against internal/0 and not one against
    # the OIDC domain, with no JWT parsing at TRACE level. Local accounts stay
    # usable — the dashboard's login form sends credentials explicitly, and
    # challenge only governs the browser's basic-auth prompt.
    basicAuth:
      enabled: true
      httpEnabled: true
      challenge: false
      order: 1
    oidc:
      enabled: true
      httpEnabled: true
      # Evaluated before basic so a bearer token is examined first.
      order: 0
      clientId: wazuh
      clientSecretRef:
        name: wazuh-oidc
        key: client_secret
      connectURL: https://authentik.example.com/application/o/wazuh/.well-known/openid-configuration
      logoutUrl: https://authentik.example.com/application/o/wazuh/end-session/
      scope: openid profile email groups
      subjectKey: preferred_username
      # Authentik emits group names in this claim via the "OpenID 'groups'
      # (Wazuh)" scope mapping; OpenSearch treats each entry as a backend role,
      # which is what opensearchRoleMappings below matches on.
      rolesKey: groups
      dashboard:
        rootUrl: https://wazuh.example.com
        cookiePasswordRef:
          name: wazuh-oidc
          key: cookie_password

# The operator REPLACES a role mapping with exactly what is listed here; it does
# not merge into the existing one. Leaving "admin" out of all_access is a
# lockout, not a tidy-up: the operator authenticates as admin, so the moment it
# drops that entry it can no longer read or write any mapping (403 "does not
# have any role privileged for admin access"), cannot undo its own change, and
# every dashboard query fails. Recovery takes the admin certificate. Keep admin
# and the admin cert DN listed for as long as this mapping is managed here.
#
# No viewer mapping on purpose: an OpenSearch role only governs index reads,
# while the Wazuh app reaches the manager API through one shared account with
# run_as disabled, so a read-only role would still leave agent restarts and
# active response reachable from the UI. Real separation needs runAs plus Wazuh
# API RBAC rules, and this operator exposes no CRD for those.
opensearchRoleMappings:
  - name: all-access-wazuh-admins
    spec:
      clusterRefs:
        - name: wazuh
          namespace: wazuh
      roleName: all_access
      description: "admin + Authentik group wazuh-admins -> all_access"
      backendRoles:
        - admin
        - wazuh-admins
      users:
        # Required by the certificate hot-reload API.
        - "CN=admin,OU=Security,O=Wazuh,L=San Francisco,ST=California,C=US"

homelab-common:
  externalSecrets:
    # NOTE: the API credentials are NOT managed here. The operator creates
    # wazuh-api-credentials itself (user "wazuh", 20-char generated password) as
    # soon as the CR exists, and it owns the Secret — an ExternalSecret aimed at
    # the same name just fails with "failed to take ownership of target secret".
    # Same story as the indexer admin password. Both generated values are copied
    # into OpenBao for reference only; the operator stays the source of truth.

    # Agent enrollment password, referenced from manager.config.auth above.
    # This one has no operator-side counterpart, so ESO owns it cleanly.
    - name: wazuh-authd-pass
      vaultPath: wazuh/authd
      data:
        - secretKey: password
          property: password

    # OIDC client secret and the dashboard's session-cookie signing password,
    # referenced from opensearchAuthConfig above. The same client_secret is
    # written to the authentik bootstrap path so the blueprint's !Env resolves
    # to the identical value.
    - name: wazuh-oidc
      vaultPath: wazuh/oidc
      data:
        - secretKey: client_secret
          property: client_secret
        - secretKey: cookie_password
          property: cookie_password

  httpRoutes:
    - name: wazuh
      hostname: wazuh  # -> wazuh.example.com
      gateway: internal  # SIEM stays off the public tunnel
      service:
        name: wazuh-dashboard
        port: 5601
