# WazuhCluster (manager + indexer + dashboard) rendered by the wazuh-cluster
# chart into a single CR; the wazuh-operator (argocd/infra/wazuh-operator)
# reconciles it. See docs/security-stack.md for the whole stack design.
namespace: wazuh
# ArgoCD creates the namespace (CreateNamespace=true).
createNamespace: false

# No sizing profile: homelab sizing is set explicitly below (profile XS is close
# but pins indexer storage at 10Gi and master at 5Gi, too small for 30d of alerts).
sizing:
  profile: ""
  storageClassName: longhorn

# The chart's externalSecrets block is deliberately NOT used (operator 2026.9.1).
# It only puts an externalSecretRef into the CR, and that path is half-wired:
# ensureAPICredentialsSecret() returns early without creating anything, while the
# dashboard and manager pod builders hardcode the canonical secret names
# (constants.APICredentialsName / IndexerCredentialsName). The result is pods stuck
# in CreateContainerConfigError on a missing wazuh-api-credentials.
#
# Instead the OpenBao-backed ExternalSecret below targets the canonical name
# directly, with the canonical keys from docs/usage/features/credentials.md. The
# indexer admin password stays operator-generated: its secret already exists and
# the security index is initialised from it, so a second owner would only cause
# churn.
externalSecrets:
  enabled: false

cluster:
  enabled: true
  name: wazuh
  spec:
    version: "4.14.7"
    storageClassName: longhorn

    indexer:
      # Single node: green health is impossible with replicas, so indices stay
      # yellow — that is expected and not a degraded state here.
      replicas: 1
      storageSize: 30Gi
      javaOpts: "-Xms1500m -Xmx1500m -Dlog4j2.formatMsgNoLookups=true"
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 3Gi

    manager:
      master:
        storageSize: 20Gi
        # 7d max 1.7Gi of 2Gi, CPU p95 369m (2026-09).
        resources:
          requests:
            cpu: 400m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 3Gi
        # The whole queue/ tree is node-local. On the shared Longhorn volume
        # (2 replicas, both on control-plane disks) its write load starved
        # etcd on 2026-09-18: WAL fsync p99 3s, ~150 leader changes in an
        # hour, control-plane static pods and every leader-elected controller
        # restarting, three volumes degraded.
        #
        # It is not only queue/vd (the ~8GB unpacked CVE database, rewritten
        # on every restart): queue/vd_updater stages the feed download at
        # ~2.7MB/s for as long as it runs, and queue/indexer spools alerts.
        # Carving out one path at a time just moved the problem, so the whole
        # directory goes local. Everything in it is rebuildable state -
        # agent keys live in /var/ossec/etc, which stays on Longhorn, as do
        # the logs.
        #
        # local-path is WaitForFirstConsumer and Delete, so the volume is
        # created on the node the pod lands on and goes away with the PVC. If
        # that node is ever lost, delete the PVC and let the scanner refetch.
        volumeClaims:
          - path: /var/ossec/queue
            size: 40Gi
            storageClass: local-path
        # Pin the manager off the control-plane nodes: required by the
        # node-local PVC above, and it keeps the manager's own I/O away from
        # the etcd disks. Only talos-worker-01 matches.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        # Agent enrollment (1515) and agent events (1514) for hosts outside the
        # cluster: VPS over the NetBird mesh, ops, Synology, OpenWrt syslog.
        # BGP announces the pool from every node, so the IP is reachable on LAN.
        #
        # ports REPLACES the operator's default set rather than extending it
        # (applyManagerServiceSpec → WithPorts), so every port the manager needs
        # is listed here — dropping one would silently unpublish it.
        service:
          type: LoadBalancer
          annotations:
            io.cilium/lb-ipam-ips: "10.11.10.140"
          ports:
            - name: api
              port: 55000
            - name: agent-events
              port: 1514
            - name: agent-auth
              port: 1515
            - name: cluster
              port: 1516
            # Devices that cannot run an agent (OpenWrt, DSM) ship syslog here.
            - name: syslog
              port: 514
              protocol: UDP
        #
        # Syslog arrives SNATed to whichever node took the datagram (ECMP over
        # all four), so `location` is a node IP, not the sender; the sender is
        # in predecoder.hostname. externalTrafficPolicy: Local would keep the
        # source but was tried and reverted: the LB IP vanished from the
        # router's BGP table and every agent disconnected.
        #
        # The CRD models <remote> as a single object, so the syslog listener is
        # added as raw XML; the operator appends it inside <ossec_config>.
        # allowed-ips is mandatory: without it wazuh-remoted drops every message.
        #
        # The operator renders no <vulnerability-detection>, no <command> and no
        # <active-response>, so all three live here too.
        #  - vulnerability-detection matches the syscollector package inventory
        #    against the Wazuh CTI feed and writes wazuh-states-vulnerabilities-*.
        #    Its ~8GB CVE database lives under queue/, which is a node-local
        #    PVC (see volumeClaims below) - on the shared Longhorn volume it
        #    took the control plane down on 2026-09-18.
        #  - firewall-drop is the agent's built-in script, so no
        #    WazuhActiveResponse (which only ships a script to the manager) is
        #    needed. SSH brute force only: 100204 (non-existent users; the
        #    homelab-noise rebuild of 5712), 100208 (repeated preauth failures,
        #    i.e. root guessing on key-only hosts) and 5763 (valid user,
        #    failed password). Web-scan rules are left out on purpose —
        #    the VPS terminate VPN traffic and a CGNAT neighbour would get
        #    banned with the scanner. CrowdSec runs on cloudru as well; a double
        #    ban there is harmless.
        #  - white_list is what the manager checks before sending a response:
        #    LAN, pod network and the NetBird mesh are never banned.
        extraConfig: |
          <remote>
            <connection>syslog</connection>
            <port>514</port>
            <protocol>udp</protocol>
            <allowed-ips>10.11.0.0/16</allowed-ips>
            <allowed-ips>100.104.0.0/16</allowed-ips>
            <!-- pod network: falcosidekick sends over the ClusterIP, no SNAT -->
            <allowed-ips>10.244.0.0/16</allowed-ips>
          </remote>
          <vulnerability-detection>
            <enabled>yes</enabled>
            <index-status>yes</index-status>
            <feed-update-interval>60m</feed-update-interval>
          </vulnerability-detection>
          <global>
            <white_list>127.0.0.1</white_list>
            <white_list>10.0.0.0/8</white_list>
            <white_list>100.64.0.0/10</white_list>
          </global>
          <command>
            <name>firewall-drop</name>
            <executable>firewall-drop</executable>
            <timeout_allowed>yes</timeout_allowed>
          </command>
          <!-- 0215-policy_rules.xml = "login during non-business hours" /
               "weekend". Meaningless for one user, and ~11k alerts a week from
               Forgejo git-over-ssh alone. A child rule cannot silence it: the
               rules are if_group children of every authentication_success rule,
               so a level-0 child would swallow every night-time login too.
               A second <ruleset> that only held rule_exclude dropped etc/rules
               in logtest, so the directories are repeated here (no duplicate
               loading: loader warnings are unchanged). -->
          <ruleset>
            <decoder_dir>ruleset/decoders</decoder_dir>
            <decoder_dir>etc/decoders</decoder_dir>
            <rule_dir>ruleset/rules</rule_dir>
            <rule_dir>etc/rules</rule_dir>
            <rule_exclude>0215-policy_rules.xml</rule_exclude>
          </ruleset>
          <active-response>
            <command>firewall-drop</command>
            <location>local</location>
            <rules_id>100204,100208,5763</rules_id>
            <timeout>3600</timeout>
          </active-response>
      workers:
        # Workers only scale agent-event ingestion horizontally; the master
        # accepts events itself and ~10 agents do not need a second node.
        replicas: 0
      config:
        auth:
          # Agents must present a password to enroll. The chart only wires this
          # up for its own inline/ESO secrets, so it is set explicitly here and
          # points at the OpenBao-backed secret created below.
          usePassword: true
          passwordSecretRef:
            name: wazuh-authd-pass
            key: password

    dashboard:
      replicas: 1
      # TLS terminates at cilium-gateway-internal, so the dashboard serves plain
      # HTTP and no BackendTLSPolicy is needed. Operator bug #63 (bool fields
      # with omitempty snapping back to their default) is fixed in 2026.9.1.
      enableSSL: false
      # Keep the dashboard off the control-plane nodes. OpenSearch Dashboards is
      # CPU-bound while it optimises bundles on boot, and on a saturated N100
      # control-plane node it never opened :5601 inside the liveness window
      # (60s + 3x30s) — the pod crash-looped there while an identical pod on the
      # worker came up fine.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          # 500m was not enough to finish the boot-time optimise step promptly.
          cpu: "1"
          memory: 1Gi

# Sign-in through Authentik. The dashboard keeps its local login as well: the
# operator forces the basic auth domain on and it is what `kibanaserver` uses to
# talk to the indexer, so removing it takes the dashboard down with it (operator
# issue #57). Only one domain may issue the WWW-Authenticate challenge, hence
# basic keeps challenge=true and OIDC leaves it false.
opensearchAuthConfig:
  enabled: true
  name: wazuh-auth
  spec:
    clusterRefs:
      - name: wazuh
        namespace: wazuh
    # The basic domain has to be declared explicitly. Leaving this block out
    # does NOT preserve a default: the operator emits a config.yml holding only
    # the domains named here, so omitting it produced activeAuthDomains=["oidc"]
    # and removed local sign-in — including kibanaserver's, which is how the
    # dashboard reaches the indexer.
    #
    # challenge MUST be false once OIDC is in play, despite the CRD advising to
    # keep it on. With challenge=true this domain answers a request carrying no
    # Basic credentials by returning 401 WWW-Authenticate immediately, which
    # ends the auth-domain walk before the OIDC domain is ever reached: a valid
    # bearer token produced 336 checks against internal/0 and not one against
    # the OIDC domain, with no JWT parsing at TRACE level. Local accounts stay
    # usable — the dashboard's login form sends credentials explicitly, and
    # challenge only governs the browser's basic-auth prompt.
    basicAuth:
      enabled: true
      httpEnabled: true
      challenge: false
      order: 1
    oidc:
      enabled: true
      httpEnabled: true
      # Evaluated before basic so a bearer token is examined first.
      order: 0
      clientId: wazuh
      clientSecretRef:
        name: wazuh-oidc
        key: client_secret
      connectURL: https://authentik.example.com/application/o/wazuh/.well-known/openid-configuration
      logoutUrl: https://authentik.example.com/application/o/wazuh/end-session/
      scope: openid profile email groups
      subjectKey: preferred_username
      # Authentik emits group names in this claim via the "OpenID 'groups'
      # (Wazuh)" scope mapping; OpenSearch treats each entry as a backend role,
      # which is what opensearchRoleMappings below matches on.
      rolesKey: groups
      dashboard:
        rootUrl: https://wazuh.example.com
        cookiePasswordRef:
          name: wazuh-oidc
          key: cookie_password

# The operator REPLACES a role mapping with exactly what is listed here; it does
# not merge into the existing one. Leaving "admin" out of all_access is a
# lockout, not a tidy-up: the operator authenticates as admin, so the moment it
# drops that entry it can no longer read or write any mapping (403 "does not
# have any role privileged for admin access"), cannot undo its own change, and
# every dashboard query fails. Recovery takes the admin certificate. Keep admin
# and the admin cert DN listed for as long as this mapping is managed here.
#
# No viewer mapping on purpose: an OpenSearch role only governs index reads,
# while the Wazuh app reaches the manager API through one shared account with
# run_as disabled, so a read-only role would still leave agent restarts and
# active response reachable from the UI. Real separation needs runAs plus Wazuh
# API RBAC rules, and this operator exposes no CRD for those.
opensearchRoleMappings:
  - name: all-access-wazuh-admins
    spec:
      clusterRefs:
        - name: wazuh
          namespace: wazuh
      roleName: all_access
      description: "admin + Authentik group wazuh-admins -> all_access"
      backendRoles:
        - admin
        - wazuh-admins
      users:
        # Required by the certificate hot-reload API.
        - "CN=admin,OU=Security,O=Wazuh,L=San Francisco,ST=California,C=US"

# Detection content. The chart fills in clusterRefs for every entry. Each
# change rolls the manager StatefulSet (content is subPath-mounted).
wazuhRules:
  # Noise control, checked with wazuh-logtest against real events. What is
  # left after it: sshd/sudo/su logins, FIM changes, SCA score summaries,
  # brute-force bans, Falco, k8s audit by people, and anything unusual.
  # Before it ~95% of indexed alerts were internet background on the public
  # VPS (web scanners, SSH guessing), the provider agent crash-looping on
  # cloudru, PAM/cron bookkeeping and Forgejo git-over-ssh on ops. That policy file is excluded outright in
  # extraConfig above; everything else is here.
  - name: homelab-noise
    spec:
      ruleName: homelab_noise
      description: "Silence known-benign high-volume events"
      rules: |
        <group name="homelab_noise,">
          <!-- The operator only accepts rule IDs >= 100000, so stock rules cannot be
               overwritten. Noise is silenced with children instead. A child becomes
               the event's final rule, which starves any stock if_matched_sid
               correlation on the parent, so the correlations that matter are
               rebuilt on top of the children. Silencing children are level 2, not 0:
               below log_alert_level (3) they are never indexed, but level-0 events
               do not feed if_matched_sid at all (checked in logtest). Stock children
               of a parent load before these, so they still win where they match. -->

          <!-- Public VPS web: every nginx there is a decoy that answers 200 to any
               path, so "attack returned 200" is as meaningless as the 4xx noise.
               Scanners hit all of it around the clock. -->
          <rule id="100201" level="2">
            <if_sid>31101</if_sid>
            <description>Web server 4xx (silenced)</description>
            <group>web,accesslog,</group>
          </rule>
          <rule id="100202" level="2">
            <if_sid>31103,31104,31105,31106,31110,31516</if_sid>
            <description>Web attack pattern against decoy nginx (silenced)</description>
            <group>web,accesslog,</group>
          </rule>
          <rule id="100205" level="2">
            <if_sid>31533</if_sid>
            <description>POST flood against decoy nginx (silenced)</description>
            <group>web,accesslog,</group>
          </rule>
          <rule id="100206" level="2">
            <if_sid>31301,31302</if_sid>
            <description>Nginx error/warning (silenced)</description>
            <group>nginx,</group>
          </rule>

          <!-- Internet-wide SSH noise on the VPS: user guessing, preauth resets and
               key-exhaustion disconnects. Two correlations replace what the
               silencing breaks, both drive firewall-drop (extraConfig): 100204 for
               non-existent users (was 5712) and 100208 for everything preauth,
               which is how root brute force looks on key-only servers. Level 6:
               the ban is the action, the alert is only a record. -->
          <rule id="100203" level="2">
            <if_sid>5710</if_sid>
            <description>sshd: non-existent user (silenced; see 100204)</description>
            <group>authentication_failed,invalid_login,</group>
          </rule>
          <rule id="100204" level="6" frequency="8" timeframe="120" ignore="60">
            <if_matched_sid>100203</if_matched_sid>
            <same_source_ip />
            <description>sshd: brute force trying to get access to the system. Non existent user.</description>
            <mitre>
              <id>T1110</id>
            </mitre>
            <group>authentication_failures,attack,</group>
          </rule>
          <rule id="100207" level="2">
            <if_sid>5758,5762,5740</if_sid>
            <description>sshd: preauth disconnect (silenced; see 100208)</description>
            <group>homelab_ssh_preauth,</group>
          </rule>
          <rule id="100209" level="2">
            <if_sid>2501</if_sid>
            <match>[preauth]</match>
            <description>sshd: too many authentication failures (silenced; see 100208)</description>
            <group>homelab_ssh_preauth,</group>
          </rule>
          <rule id="100208" level="6" frequency="8" timeframe="120" ignore="60">
            <if_matched_group>homelab_ssh_preauth</if_matched_group>
            <same_source_ip />
            <description>sshd: brute force, repeated preauth failures from same source ip.</description>
            <mitre>
              <id>T1110</id>
            </mitre>
            <group>authentication_failures,attack,</group>
          </rule>

          <!-- cloudru: the provider's Cloud VMManager Agent exits 1 every 10s. -->
          <rule id="100210" level="0">
            <if_sid>40704</if_sid>
            <match>osconfig.service</match>
            <description>cloudru: osconfig.service crash loop (known, provider agent)</description>
          </rule>

          <!-- PAM session bookkeeping. Logins are already recorded by sshd (5715),
               sudo (5402/5407) and su; the session open/close pair around them, plus
               every cron job and systemd user instance, only doubles the count. -->
          <rule id="100211" level="2">
            <if_sid>5502</if_sid>
            <description>PAM: session closed (silenced)</description>
          </rule>
          <rule id="100213" level="2">
            <if_sid>5501</if_sid>
            <match>(cron:session)|(systemd-user:session)|(sshd:session)|(sudo:session)</match>
            <description>PAM: cron/systemd-user/sshd/sudo session opened (silenced)</description>
          </rule>
          <!-- ops: Forgejo git-over-ssh from the LAN (ArgoCD, Renovate, runners). -->
          <rule id="100212" level="2">
            <if_sid>5715</if_sid>
            <user>^git$</user>
            <srcip>10.11.0.0/16</srcip>
            <description>sshd: Forgejo git-over-ssh from the LAN (silenced)</description>
          </rule>
          <!-- ops: the scheduled Forgejo backup restore test runs psql/pg_restore as
               postgres through sudo, dozens of times a day. -->
          <rule id="100214" level="2">
            <if_sid>5402,5407</if_sid>
            <field name="command" type="pcre2">^/run/current-system/sw/bin/(psql|pg_restore|pg_dump|pg_dumpall|createdb|dropdb) </field>
            <description>sudo: Forgejo backup restore test on ops (silenced)</description>
          </rule>

          <!-- Unattended upgrades on the VPS. Package state is covered by the
               syscollector inventory and vulnerability detection. -->
          <rule id="100215" level="2">
            <if_sid>2902,2904</if_sid>
            <description>dpkg: package installed / half configured (silenced)</description>
            <group>dpkg,</group>
          </rule>
          <rule id="100216" level="2">
            <if_sid>591</if_sid>
            <description>Log file rotated (silenced)</description>
          </rule>

          <!-- SCA re-reports every failed/passed/not-applicable check on each scan.
               The results live in the SCA tab (read from the manager API, not from
               alerts); the per-scan score summary (19003/19004) still alerts. -->
          <rule id="100217" level="2">
            <if_sid>19007,19008,19009</if_sid>
            <description>SCA check result (silenced; see SCA tab)</description>
            <group>sca,</group>
          </rule>
        </group>

  # falcosidekick ships Falco events here over syslog (argocd/infra/falco).
  # Levels stay at 11 or below on purpose: Falco already alerts through
  # Alertmanager, and the Alertmanager integration below starts at 12, so a
  # Falco event is searchable in Wazuh without a second Telegram message.
  - name: falco
    spec:
      ruleName: falco
      description: "Falco runtime events from falcosidekick"
      rules: |
        <group name="falco,">
          <rule id="100300" level="3">
            <decoded_as>falcosidekick</decoded_as>
            <description>Falco: $(rule)</description>
          </rule>
          <rule id="100301" level="5">
            <if_sid>100300</if_sid>
            <field name="priority">^Notice$</field>
            <description>Falco notice: $(rule)</description>
          </rule>
          <rule id="100302" level="7">
            <if_sid>100300</if_sid>
            <field name="priority">^Warning$</field>
            <description>Falco warning: $(rule)</description>
          </rule>
          <rule id="100303" level="10">
            <if_sid>100300</if_sid>
            <field name="priority">^Error$</field>
            <description>Falco error: $(rule)</description>
          </rule>
          <rule id="100304" level="11">
            <if_sid>100300</if_sid>
            <field name="priority">^Critical$|^Alert$|^Emergency$</field>
            <description>Falco critical: $(rule)</description>
          </rule>
        </group>

  # Kubernetes audit events that Vector forwards over syslog. Before this they
  # were decoded as JSON and then dropped: no stock rule matches them.
  - name: k8s-audit
    spec:
      ruleName: k8s_audit
      description: "Kubernetes audit: exec, RBAC and secret changes"
      rules: |
        <group name="kubernetes,k8s_audit,">
          <!-- Vector (argocd/infra/victoria-logs) already filters the audit stream to
               RBAC/secret mutations and exec/attach/port-forward. Base level 2 keeps
               the raw event out of the index; only the children below alert. -->
          <rule id="100400" level="2">
            <decoded_as>json</decoded_as>
            <field name="apiVersion">^audit.k8s.io/</field>
            <description>K8s audit: $(verb) $(objectRef.resource) by $(user.username)</description>
          </rule>

          <rule id="100401" level="5">
            <if_sid>100400</if_sid>
            <field name="objectRef.subresource">^exec$|^attach$|^portforward$</field>
            <description>K8s: $(objectRef.subresource) into $(objectRef.namespace)/$(objectRef.name) by $(user.username)</description>
            <group>k8s_exec,</group>
          </rule>
          <rule id="100402" level="8">
            <if_sid>100401</if_sid>
            <field name="user.username" negate="yes">^system:|^talos:</field>
            <description>K8s: $(user.username) ran $(objectRef.subresource) in $(objectRef.namespace)/$(objectRef.name)</description>
            <group>k8s_exec,</group>
          </rule>

          <rule id="100403" level="2">
            <if_sid>100400</if_sid>
            <field name="objectRef.resource">^roles$|^rolebindings$|^clusterroles$|^clusterrolebindings$|^serviceaccounts$</field>
            <description>K8s RBAC: $(verb) $(objectRef.resource) $(objectRef.namespace)/$(objectRef.name) by $(user.username)</description>
            <group>k8s_rbac,</group>
          </rule>
          <rule id="100404" level="10">
            <if_sid>100403</if_sid>
            <field name="user.username" negate="yes">^system:|^talos:</field>
            <description>K8s RBAC changed by a person: $(user.username) $(verb) $(objectRef.resource) $(objectRef.name)</description>
            <group>k8s_rbac,</group>
          </rule>

          <!-- Controllers (ESO, cert-manager, ArgoCD) rewrite secrets all day; only a
               person touching one is worth an alert. -->
          <rule id="100405" level="8">
            <if_sid>100400</if_sid>
            <field name="objectRef.resource">^secrets$</field>
            <field name="user.username" negate="yes">^system:|^talos:</field>
            <description>K8s secret changed by a person: $(user.username) $(verb) $(objectRef.namespace)/$(objectRef.name)</description>
            <group>k8s_secrets,</group>
          </rule>
        </group>

wazuhDecoders:
  # falcosidekick formats the timestamp as RFC 3339 with a "Z" suffix, which
  # Wazuh's pre-decoder does not recognise, so there is no program_name to key
  # on. The prematch anchors on the tag instead and the JSON body after it is
  # decoded as-is (priority, rule, output, output_fields.*).
  - name: falcosidekick
    spec:
      decoderName: falcosidekick
      description: "Falco JSON over syslog (falcosidekick)"
      decoders: |
        <decoder name="falcosidekick">
          <prematch type="pcre2">Falco\[\d+\]: </prematch>
          <plugin_decoder offset="after_prematch">JSON_Decoder</plugin_decoder>
        </decoder>

wazuhIntegrations:
  # Level 12+ goes to Alertmanager, which already routes to Robusta ->
  # Telegram with grouping, inhibition and silences. Nothing in the last week
  # reached 12, so this is a quiet channel by design.
  - name: alertmanager
    spec:
      name: alertmanager
      scriptExtension: py
      targetNodes: master
      level: 12
      alertFormat: json
      hookURL: http://vmalertmanager-victoria-metrics-k8s-stack.victoria-metrics.svc:9093/api/v2/alerts
      script: |
        #!/var/ossec/framework/python/bin/python3
        # wazuh-integratord calls: <script> <alert_file> [<api_key>] <hook_url> ...
        # No api_key is configured, so the hook URL is found by its scheme rather
        # than by position.
        import datetime
        import json
        import sys
        import urllib.request

        alert_file = sys.argv[1]
        hook_url = next(a for a in sys.argv[2:] if a.startswith("http"))

        with open(alert_file) as f:
            alert = json.load(f)

        rule = alert.get("rule", {})
        agent = alert.get("agent", {})
        level = int(rule.get("level", 0))
        now = datetime.datetime.now(datetime.timezone.utc)

        payload = [{
            "labels": {
                "alertname": "WazuhAlert",
                "service": "wazuh",
                "severity": "critical" if level >= 13 else "warning",
                "rule_id": str(rule.get("id", "")),
                # instance keeps the global critical>warning inhibit scoped per host.
                "instance": agent.get("name", ""),
            },
            "annotations": {
                "summary": rule.get("description", ""),
                "description": (alert.get("full_log") or json.dumps(alert.get("data", {})))[:1000],
                "level": str(level),
                "location": alert.get("location", ""),
            },
            "startsAt": now.isoformat(),
            # A Wazuh alert is a point event; let it resolve on its own.
            "endsAt": (now + datetime.timedelta(hours=1)).isoformat(),
            "generatorURL": "https://wazuh.example.com/app/threat-hunting",
        }]

        req = urllib.request.Request(
            hook_url,
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        urllib.request.urlopen(req, timeout=10)
        sys.exit(0)

wazuhAgentGroups:
  # Every agent sits in "default". Before this its agent.conf was empty and
  # each host ran on its local ossec.conf defaults.
  - name: default
    spec:
      groupName: default
      description: "Baseline for all agents"
      agentConf: |
        <agent_config os="Linux">
          <syscheck>
            <directories realtime="yes">/etc/ssh,/etc/sudoers,/etc/sudoers.d,/etc/pam.d,/etc/cron.d,/etc/systemd/system</directories>
            <directories realtime="yes">/root/.ssh</directories>
            <ignore>/etc/ssh/ssh_config.d/99-netbird.conf</ignore>
            <!-- rewritten by every ldconfig run, i.e. every package upgrade -->
            <ignore>/etc/ld.so.cache</ignore>
          </syscheck>
        </agent_config>

opensearchISMPolicies:
  # Nothing deleted indices before this. The template only attaches the policy
  # to indices created after it exists; older ones were attached by hand.
  - name: wazuh-alerts-retention
    spec:
      description: "Delete wazuh-alerts-* after 90 days"
      defaultState: hot
      states:
        - name: hot
          transitions:
            - stateName: delete
              conditions:
                minIndexAge: 90d
        - name: delete
          actions:
            - config:
                delete: {}
      ismTemplate:
        - indexPatterns: ["wazuh-alerts-*"]
          priority: 100
  - name: wazuh-internal-retention
    spec:
      description: "Delete wazuh-monitoring-* and wazuh-statistics-* after 30 days"
      defaultState: hot
      states:
        - name: hot
          transitions:
            - stateName: delete
              conditions:
                minIndexAge: 30d
        - name: delete
          actions:
            - config:
                delete: {}
      ismTemplate:
        - indexPatterns: ["wazuh-monitoring-*", "wazuh-statistics-*"]
          priority: 100

homelab-common:
  # Manager state: agent registrations (client.keys), sslmanager.key, API
  # config. Losing it means re-enrolling every agent. The indexer (events) and
  # the local-path queue are rebuildable and not backed up.
  volsync:
    - name: wazuh-manager
      claim: wazuh-data-wazuh-manager-master-0
      targets:
        - repo: garage
          schedule: "40 2 * * *"
        - repo: ovh
          schedule: "40 6 * * 0"
  externalSecrets:
    # NOTE: the API credentials are NOT managed here. The operator creates
    # wazuh-api-credentials itself (user "wazuh", 20-char generated password) as
    # soon as the CR exists, and it owns the Secret — an ExternalSecret aimed at
    # the same name just fails with "failed to take ownership of target secret".
    # Same story as the indexer admin password. Both generated values are copied
    # into OpenBao for reference only; the operator stays the source of truth.

    # Agent enrollment password, referenced from manager.config.auth above.
    # This one has no operator-side counterpart, so ESO owns it cleanly.
    - name: wazuh-authd-pass
      vaultPath: wazuh/authd
      data:
        - secretKey: password
          property: password

    # OIDC client secret and the dashboard's session-cookie signing password,
    # referenced from opensearchAuthConfig above. The same client_secret is
    # written to the authentik bootstrap path so the blueprint's !Env resolves
    # to the identical value.
    - name: wazuh-oidc
      vaultPath: wazuh/oidc
      data:
        - secretKey: client_secret
          property: client_secret
        - secretKey: cookie_password
          property: cookie_password

  httpRoutes:
    - name: wazuh
      hostname: wazuh  # -> wazuh.example.com
      gateway: internal  # SIEM stays off the public tunnel
      service:
        name: wazuh-dashboard
        port: 5601
