# One WazuhCluster CR, reconciled by argocd/infra/wazuh-operator.
namespace: wazuh  # pinned: the chart puts .Values.namespace, not the release namespace, on every CR
createNamespace: false

# Sizing is explicit below: profile XS pins indexer 10Gi / master 5Gi, too small.
sizing:
  profile: ""

# Chart ESO path is half-wired (operator 2026.9.1): the CR gets an externalSecretRef
# but pods still mount the canonical secret names, stuck in CreateContainerConfigError
# on a missing wazuh-api-credentials. Operator-generated credentials stay as they are.
externalSecrets:
  enabled: false  # pinned: the chart's ESO path is half-wired, see above

cluster:
  name: wazuh
  spec:
    # version: chart default, so Renovate's wazuh-cluster bumps move it
    storageClassName: longhorn

    indexer:
      # Single node: indices stay yellow by design, not degraded.
      replicas: 1
      storageSize: 30Gi
      # Prefer the NVMe worker (disk writes); dataLocality best-effort is set on the volume.
      # Write-cutting index settings live in legacy template `homelab-io-tuning` (order 10,
      # via API): a composable OpenSearchIndexTemplate would shadow the `wazuh` mappings.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # Heap use 670MB; container peak 2.1Gi, ~0.65Gi off-heap (2026-10).
      javaOpts: "-Xms1g -Xmx1g -Dlog4j2.formatMsgNoLookups=true"
      resources:
        requests:
          cpu: 500m
          memory: 1536Mi
        limits:
          cpu: "2"
          memory: 2560Mi

    manager:
      master:
        storageSize: 20Gi
        # 7d max 1.7Gi, CPU p95 369m (2026-09).
        resources:
          requests:
            cpu: 400m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 3Gi
        # Whole queue/ stays node-local: on Longhorn its writes (CVE db, feed staging,
        # alert spool) starved etcd (2026-09-18). Single subpaths just moved the load.
        # Rebuildable; agent keys stay on Longhorn in /var/ossec/etc.
        # Node lost → delete the PVC, the scanner refetches.
        volumeClaims:
          - path: /var/ossec/queue
            size: 40Gi
            storageClass: local-path
        # Off control-plane (node-local PVC, etcd disks); only talos-worker-01 matches.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        # In-cluster only; the LAN uses manifests/service-manager-lb.yaml (eTP Local,
        # which this CRD lacks). ports REPLACES the operator defaults: dropping one
        # silently unpublishes it. The operator cannot turn its LoadBalancer into
        # ClusterIP in place (it copies nodePorts): delete the Service once.
        service:
          type: ClusterIP
          # Non-empty on purpose: ArgoCD server-side diff sends an empty map as null,
          # which the CRD rejects (annotations must be an object).
          annotations:
            homelab.example.com/lan-service: wazuh-manager-lb
          ports:
            - name: api
              port: 55000
            - name: agent-events
              port: 1514
            - name: agent-auth
              port: 1515
            - name: cluster
              port: 1516
            - name: syslog
              port: 514
              protocol: UDP
        # eTP Local on the LB keeps the sender IP. A 2026-09-18 hand patch to Local
        # lost the BGP route (cause unknown, before the worker-01 affinity): check
        # `birdc show route for 10.11.10.140` after any change to the LB Service.
        # Raw XML: the operator renders no second <remote>, vulnerability-detection,
        # command or active-response. allowed-ips is mandatory, else remoted drops all.
        # Active response is SSH brute force only: web-scan bans would hit CGNAT VPN users.
        extraConfig: |
          <remote>
            <connection>syslog</connection>
            <port>514</port>
            <protocol>udp</protocol>
            <allowed-ips>10.11.0.0/16</allowed-ips>
            <allowed-ips>100.64.0.0/16</allowed-ips>
            <!-- pod network: senders inside the cluster that are not SNATed -->
            <allowed-ips>10.244.0.0/16</allowed-ips>
          </remote>
          <vulnerability-detection>
            <enabled>yes</enabled>
            <index-status>yes</index-status>
            <feed-update-interval>60m</feed-update-interval>
          </vulnerability-detection>
          <global>
            <white_list>127.0.0.1</white_list>
            <white_list>10.0.0.0/8</white_list>
            <white_list>100.64.0.0/10</white_list>
          </global>
          <command>
            <name>firewall-drop</name>
            <executable>firewall-drop</executable>
            <timeout_allowed>yes</timeout_allowed>
          </command>
          <!-- 0215 = off-hours/weekend logins: noise for one user, and a child rule
               would swallow every night login. The dirs are repeated because a
               <ruleset> with only rule_exclude drops etc/rules. -->
          <ruleset>
            <decoder_dir>ruleset/decoders</decoder_dir>
            <decoder_dir>etc/decoders</decoder_dir>
            <rule_dir>ruleset/rules</rule_dir>
            <rule_dir>etc/rules</rule_dir>
            <rule_exclude>0215-policy_rules.xml</rule_exclude>
          </ruleset>
          <active-response>
            <command>firewall-drop</command>
            <location>local</location>
            <rules_id>100204,100208,5763</rules_id>
            <timeout>3600</timeout>
          </active-response>
      workers:
        # ~10 agents: the master ingests events itself.
        replicas: 0
      config:
        auth:
          # Set explicitly: the chart wires this only for its own secrets.
          usePassword: true
          passwordSecretRef:
            name: wazuh-authd-pass
            key: password

    dashboard:
      replicas: 1
      # TLS terminates at the gateway.
      enableSSL: false
      # Off control-plane: on a busy N100 the boot-time bundle optimise misses the
      # liveness window and the pod crash-loops.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          # 500m is too slow for the boot-time optimise.
          cpu: "1"
          memory: 1Gi

# Basic auth must stay: `kibanaserver` uses it to reach the indexer (operator #57).
opensearchAuthConfig:
  enabled: true
  name: wazuh-auth
  spec:
    # Declare basic explicitly: omitted domains are dropped, which kills local and
    # kibanaserver sign-in. challenge MUST be false (despite the CRD advice): true
    # returns 401 before the OIDC domain is ever tried.
    basicAuth:
      enabled: true
      httpEnabled: true
      challenge: false
      order: 1
    oidc:
      enabled: true
      httpEnabled: true
      order: 0
      clientId: wazuh
      clientSecretRef:
        name: wazuh-oidc
        key: client_secret
      connectURL: https://authentik.example.com/application/o/wazuh/.well-known/openid-configuration
      logoutUrl: https://authentik.example.com/application/o/wazuh/end-session/
      subjectKey: preferred_username
      # Authentik groups become backend roles for opensearchRoleMappings.
      rolesKey: groups
      dashboard:
        rootUrl: https://wazuh.example.com
        cookiePasswordRef:
          name: wazuh-oidc
          key: cookie_password

# The operator REPLACES the mapping. Dropping "admin" or the cert DN locks the operator
# out (403 "does not have any role privileged for admin access"); recovery needs
# the admin certificate. No viewer mapping: the shared manager API account would
# still allow agent restarts and active response from the UI.
opensearchRoleMappings:
  - name: all-access-wazuh-admins
    spec:
      roleName: all_access
      description: "admin + Authentik group wazuh-admins -> all_access"
      backendRoles:
        - admin
        - wazuh-admins
      users:
        # Required by the certificate hot-reload API.
        - "CN=admin,OU=Security,O=Wazuh,L=San Francisco,ST=California,C=US"

# Each detection-content change rolls the manager StatefulSet (subPath mounts).
wazuhRules:
  # Noise control, checked with wazuh-logtest against real events.
  - name: homelab-noise
    spec:
      ruleName: homelab_noise
      description: "Silence known-benign high-volume events"
      rules: |
        <group name="homelab_noise,">
          <!-- IDs must be >= 100000, so noise is silenced by child rules. A child
               starves stock if_matched_sid correlations, so the needed ones are
               rebuilt below. Level 2, not 0: still unindexed (< 3), but level-0
               events do not feed if_matched_sid. -->

          <!-- VPS nginx is a decoy answering 200 to any path: all web alerts are noise. -->
          <rule id="100201" level="2">
            <if_sid>31101</if_sid>
            <description>Web server 4xx (silenced)</description>
            <group>web,accesslog,</group>
          </rule>
          <rule id="100202" level="2">
            <if_sid>31103,31104,31105,31106,31110,31516</if_sid>
            <description>Web attack pattern against decoy nginx (silenced)</description>
            <group>web,accesslog,</group>
          </rule>
          <rule id="100205" level="2">
            <if_sid>31533</if_sid>
            <description>POST flood against decoy nginx (silenced)</description>
            <group>web,accesslog,</group>
          </rule>
          <rule id="100206" level="2">
            <if_sid>31301,31302</if_sid>
            <description>Nginx error/warning (silenced)</description>
            <group>nginx,</group>
          </rule>

          <!-- VPS SSH noise. 100204 (replaces 5712) and 100208 (preauth) drive
               firewall-drop in extraConfig; level 6 since the ban is the action. -->
          <rule id="100203" level="2">
            <if_sid>5710</if_sid>
            <description>sshd: non-existent user (silenced; see 100204)</description>
            <group>authentication_failed,invalid_login,</group>
          </rule>
          <rule id="100204" level="6" frequency="8" timeframe="120" ignore="60">
            <if_matched_sid>100203</if_matched_sid>
            <same_source_ip />
            <description>sshd: brute force trying to get access to the system. Non existent user.</description>
            <mitre>
              <id>T1110</id>
            </mitre>
            <group>authentication_failures,attack,</group>
          </rule>
          <rule id="100207" level="2">
            <if_sid>5758,5762,5740</if_sid>
            <description>sshd: preauth disconnect (silenced; see 100208)</description>
            <group>homelab_ssh_preauth,</group>
          </rule>
          <rule id="100209" level="2">
            <if_sid>2501</if_sid>
            <match>[preauth]</match>
            <description>sshd: too many authentication failures (silenced; see 100208)</description>
            <group>homelab_ssh_preauth,</group>
          </rule>
          <rule id="100208" level="6" frequency="8" timeframe="120" ignore="60">
            <if_matched_group>homelab_ssh_preauth</if_matched_group>
            <same_source_ip />
            <description>sshd: brute force, repeated preauth failures from same source ip.</description>
            <mitre>
              <id>T1110</id>
            </mitre>
            <group>authentication_failures,attack,</group>
          </rule>

          <!-- vps-panel: the provider agent exits 1 every 10s. -->
          <rule id="100210" level="0">
            <if_sid>40704</if_sid>
            <match>osconfig.service</match>
            <description>vps-panel: osconfig.service crash loop (known, provider agent)</description>
          </rule>

          <!-- PAM sessions duplicate the sshd/sudo/su login alerts. -->
          <rule id="100211" level="2">
            <if_sid>5502</if_sid>
            <description>PAM: session closed (silenced)</description>
          </rule>
          <rule id="100213" level="2">
            <if_sid>5501</if_sid>
            <match>(cron:session)|(systemd-user:session)|(sshd:session)|(sudo:session)</match>
            <description>PAM: cron/systemd-user/sshd/sudo session opened (silenced)</description>
          </rule>
          <!-- ops: Forgejo git-over-ssh from the LAN (ArgoCD, Renovate, runners). -->
          <rule id="100212" level="2">
            <if_sid>5715</if_sid>
            <user>^git$</user>
            <srcip>10.11.0.0/16</srcip>
            <description>sshd: Forgejo git-over-ssh from the LAN (silenced)</description>
          </rule>
          <!-- ops: Forgejo backup restore test, dozens of sudo runs a day. -->
          <rule id="100214" level="2">
            <if_sid>5402,5407</if_sid>
            <field name="command" type="pcre2">^/run/current-system/sw/bin/(psql|pg_restore|pg_dump|pg_dumpall|createdb|dropdb) </field>
            <description>sudo: Forgejo backup restore test on ops (silenced)</description>
          </rule>

          <!-- Unattended upgrades; syscollector covers package state. -->
          <rule id="100215" level="2">
            <if_sid>2902,2904</if_sid>
            <description>dpkg: package installed / half configured (silenced)</description>
            <group>dpkg,</group>
          </rule>
          <rule id="100216" level="2">
            <if_sid>591</if_sid>
            <description>Log file rotated (silenced)</description>
          </rule>

          <!-- Per-check SCA results; the SCA tab and the 19003/19004 summary remain. -->
          <rule id="100217" level="2">
            <if_sid>19007,19008,19009</if_sid>
            <description>SCA check result (silenced; see SCA tab)</description>
            <group>sca,</group>
          </rule>
        </group>

  # K8s audit events forwarded by Vector over syslog; no stock rule matches them.
  - name: k8s-audit
    spec:
      ruleName: k8s_audit
      description: "Kubernetes audit: exec, RBAC and secret changes"
      rules: |
        <group name="kubernetes,k8s_audit,">
          <!-- Vector (argocd/infra/victoria-logs) pre-filters the stream. Level 2 keeps
               the raw event unindexed; only children alert. -->
          <rule id="100400" level="2">
            <decoded_as>json</decoded_as>
            <field name="apiVersion">^audit.k8s.io/</field>
            <description>K8s audit: $(verb) $(objectRef.resource) by $(user.username)</description>
          </rule>

          <rule id="100401" level="5">
            <if_sid>100400</if_sid>
            <field name="objectRef.subresource">^exec$|^attach$|^portforward$</field>
            <description>K8s: $(objectRef.subresource) into $(objectRef.namespace)/$(objectRef.name) by $(user.username)</description>
            <group>k8s_exec,</group>
          </rule>
          <rule id="100402" level="8">
            <if_sid>100401</if_sid>
            <field name="user.username" negate="yes">^system:|^talos:</field>
            <description>K8s: $(user.username) ran $(objectRef.subresource) in $(objectRef.namespace)/$(objectRef.name)</description>
            <group>k8s_exec,</group>
          </rule>

          <rule id="100403" level="2">
            <if_sid>100400</if_sid>
            <field name="objectRef.resource">^roles$|^rolebindings$|^clusterroles$|^clusterrolebindings$|^serviceaccounts$</field>
            <description>K8s RBAC: $(verb) $(objectRef.resource) $(objectRef.namespace)/$(objectRef.name) by $(user.username)</description>
            <group>k8s_rbac,</group>
          </rule>
          <rule id="100404" level="10">
            <if_sid>100403</if_sid>
            <field name="user.username" negate="yes">^system:|^talos:</field>
            <description>K8s RBAC changed by a person: $(user.username) $(verb) $(objectRef.resource) $(objectRef.name)</description>
            <group>k8s_rbac,</group>
          </rule>

          <!-- Controllers rewrite secrets all day; alert on people only. -->
          <rule id="100405" level="8">
            <if_sid>100400</if_sid>
            <field name="objectRef.resource">^secrets$</field>
            <field name="user.username" negate="yes">^system:|^talos:</field>
            <description>K8s secret changed by a person: $(user.username) $(verb) $(objectRef.namespace)/$(objectRef.name)</description>
            <group>k8s_secrets,</group>
          </rule>
        </group>

wazuhIntegrations:
  # Level 12+ only: a quiet channel by design.
  - name: alertmanager
    spec:
      name: alertmanager
      scriptExtension: py
      targetNodes: master
      level: 12
      alertFormat: json
      hookURL: http://vmalertmanager-victoria-metrics-k8s-stack.victoria-metrics.svc:9093/api/v2/alerts
      script: |
        #!/var/ossec/framework/python/bin/python3
        # argv: <alert_file> [<api_key>] <hook_url> ...; find the hook by scheme.
        import datetime
        import json
        import sys
        import urllib.request

        alert_file = sys.argv[1]
        hook_url = next(a for a in sys.argv[2:] if a.startswith("http"))

        with open(alert_file) as f:
            alert = json.load(f)

        rule = alert.get("rule", {})
        agent = alert.get("agent", {})
        level = int(rule.get("level", 0))
        now = datetime.datetime.now(datetime.timezone.utc)

        payload = [{
            "labels": {
                "alertname": "WazuhAlert",
                "service": "wazuh",
                "severity": "critical" if level >= 13 else "warning",
                "rule_id": str(rule.get("id", "")),
                # instance keeps the global critical>warning inhibit scoped per host.
                "instance": agent.get("name", ""),
            },
            "annotations": {
                "summary": rule.get("description", ""),
                "description": (alert.get("full_log") or json.dumps(alert.get("data", {})))[:1000],
                "level": str(level),
                "location": alert.get("location", ""),
            },
            "startsAt": now.isoformat(),
            # Point event: auto-resolve.
            "endsAt": (now + datetime.timedelta(hours=1)).isoformat(),
            "generatorURL": "https://wazuh.example.com/app/threat-hunting",
        }]

        req = urllib.request.Request(
            hook_url,
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        urllib.request.urlopen(req, timeout=10)
        sys.exit(0)

wazuhAgentGroups:
  # Every agent is in "default".
  - name: default
    spec:
      groupName: default
      description: "Baseline for all agents"
      agentConf: |
        <agent_config os="Linux">
          <syscheck>
            <directories realtime="yes">/etc/ssh,/etc/sudoers,/etc/sudoers.d,/etc/pam.d,/etc/cron.d,/etc/systemd/system</directories>
            <directories realtime="yes">/root/.ssh</directories>
            <ignore>/etc/ssh/ssh_config.d/99-netbird.conf</ignore>
            <!-- rewritten by every ldconfig run, i.e. every package upgrade -->
            <ignore>/etc/ld.so.cache</ignore>
          </syscheck>
        </agent_config>

opensearchISMPolicies:
  # ismTemplate attaches only to new indices; older ones need attaching by hand.
  - name: wazuh-alerts-retention
    spec:
      description: "Delete wazuh-alerts-* after 90 days"
      defaultState: hot
      states:
        - name: hot
          transitions:
            - stateName: delete
              conditions:
                minIndexAge: 90d
        - name: delete
          actions:
            - config:
                delete: {}
      ismTemplate:
        - indexPatterns: ["wazuh-alerts-*"]
          priority: 100
  - name: wazuh-internal-retention
    spec:
      description: "Delete wazuh-monitoring-* and wazuh-statistics-* after 30 days"
      defaultState: hot
      states:
        - name: hot
          transitions:
            - stateName: delete
              conditions:
                minIndexAge: 30d
        - name: delete
          actions:
            - config:
                delete: {}
      ismTemplate:
        - indexPatterns: ["wazuh-monitoring-*", "wazuh-statistics-*"]
          priority: 100

homelab-common:
  # Agent/syslog ports are opened in manifests/networkpolicy.yaml.
  networkPolicy:
    enabled: true
    allow:
      - namespaces: [wazuh-operator]
        ports: [9200, 55000]

  # Manager state (client.keys): losing it re-enrolls every agent. Indexer and
  # queue are rebuildable, not backed up.
  volsync:
    - name: wazuh-manager
      claim: wazuh-data-wazuh-manager-master-0
      targets:
        - repo: garage
          schedule: "40 2 * * *"
        - repo: ovh
          schedule: "40 6 * * 0"
  externalSecrets:
    # Not wazuh-api-credentials or the indexer admin: the operator owns them, an ES
    # fails "failed to take ownership of target secret". OpenBao copies are reference only.
    - name: wazuh-authd-pass
      vaultPath: wazuh/authd
      data:
        - secretKey: password
          property: password

    # Authentik's blueprint reads the same wazuh/oidc client_secret.
    - name: wazuh-oidc
      vaultPath: wazuh/oidc
      data:
        - secretKey: client_secret
          property: client_secret
        - secretKey: cookie_password
          property: cookie_password

  httpRoutes:
    - name: wazuh
      hostname: wazuh
      gateway: internal  # SIEM stays off the public tunnel
      service:
        name: wazuh-dashboard
        port: 5601
