apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    # argocd-diff renders root only when what it syncs changes.
    argocd-diff-preview/watch-pattern: "argocd/root-application.yaml, argocd/projects/.*, argocd/appsets/.*, argocd/standalone/.*"
    argocd.argoproj.io/manifest-generate-paths: "/argocd/projects;/argocd/appsets;/argocd/standalone"
  labels:
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/part-of: root
  # No resources-finalizer on purpose. With it, deleting root cascades: ArgoCD
  # deletes both ApplicationSets, the k8s GC removes the 54 child Applications
  # via ownerReferences, and each of their finalizers deletes the resources
  # themselves, namespaces and PVCs included. ArgoCD itself (the standalone
  # argocd Application) goes too, so the cleanup stops halfway.
  # preserveResourcesOnDeletion on the AppSets does not help: it only stops the
  # AppSet from adding the finalizer, and our template sets it explicitly.
  # Without the finalizer, deleting root leaves everything orphaned and
  # running, which is what you want while fixing git.
spec:
  project: root
  sources:
    - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/projects
    - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/appsets
    - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/standalone
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune: false: root does not delete what disappeared from git. Otherwise
      # a lost directory (or a CI mistake) would take AppProjects, AppSets and
      # standalone apps with their resources. Cost: objects of these three
      # kinds removed from git are deleted by hand, rarely and on purpose.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
