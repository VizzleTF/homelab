apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Без resources-finalizer намеренно. С ним удаление root запускает каскад:
  # ArgoCD сносит оба ApplicationSet, k8s GC по ownerReferences убирает 55
  # дочерних Application, и финалайзер каждого из них удаляет уже сами
  # ресурсы — namespace'ы и PVC. Попутно исчезает и сам ArgoCD (standalone
  # argocd-application), так что уборка обрывается на середине.
  # preserveResourcesOnDeletion в AppSet тут не спасает: он лишь не даёт AppSet
  # самому проставить финалайзер, а в нашем шаблоне Application тот задан явно.
  # Без финалайзера удаление root оставляет всё осиротевшим и работающим —
  # ровно то, что нужно, пока чинишь git.
spec:
  project: root
  sources:
    - repoURL: ssh://git@forgejo-ssh.forgejo.svc.cluster.local:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/projects
    - repoURL: ssh://git@forgejo-ssh.forgejo.svc.cluster.local:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/appsets
    - repoURL: ssh://git@forgejo-ssh.forgejo.svc.cluster.local:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/standalone
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      # prune: false — корень не удаляет то, что пропало из git. Иначе любая
      # потерянная директория (или ошибка в CI) уносит AppProject/AppSet/
      # standalone вместе с их ресурсами. Цена: удалённые из git объекты этих
      # трёх типов надо убирать руками — операция редкая и осознанная.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
