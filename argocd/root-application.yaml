apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    # argocd-diff renders root only when what it syncs changes.
    argocd-diff-preview/watch-pattern: "argocd/root-application.yaml, argocd/projects/.*, argocd/appsets/.*, argocd/standalone/.*"
    argocd.argoproj.io/manifest-generate-paths: "/argocd/projects;/argocd/appsets;/argocd/standalone"
  labels:
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/part-of: root
  # No resources-finalizer on purpose: deleting root would cascade through both
  # AppSets and every child Application to namespaces and PVCs, killing ArgoCD
  # itself mid-cleanup. AppSet preserveResourcesOnDeletion doesn't help (their
  # template sets the finalizer). Without it, deleting root just orphans everything.
spec:
  project: root
  sources:
    - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/projects
    - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/appsets
    - repoURL: ssh://git@git.example.com:22/vizzle/homelab.git
      targetRevision: HEAD
      path: argocd/standalone
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune: false: a lost directory or CI mistake would delete AppProjects,
      # AppSets and standalone apps with their resources. Remove those by hand.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
