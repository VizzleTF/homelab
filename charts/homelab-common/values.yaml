# Default values for homelab-common (shared Helm chart).
# global.* (vault, gateway, dns, volsync) comes from argocd/values/global.yaml, always the first valueFile.
# Every object gets app.kubernetes.io/{name,instance,managed-by}; no chart version label.

homelab-common:
  # ExternalSecrets to create
  externalSecrets: []
  # Example:
  # - name: app-secrets
  #   vaultPath: myapp/app-secrets  # Will be prefixed with global.vault.pathPrefix
  #   data:
  #     - secretKey: password
  #       property: password
  #   templateData:
  #     PASSWORD: "{{ .password }}"

  # HTTPRoutes to create
  httpRoutes: []
  # Example:
  # - name: myapp
  #   hostname: myapp  # Will be suffixed with global.dns.domain
  #   gateway: external  # or "internal" or "both"
  #   service:
  #     name: myapp
  #     port: 8080
  #
  # Shortcut for KEDA HTTP scale-to-zero apps — routes via keda-loading-proxy
  # in ns keda (renders a Russian "service is starting" page during cold-start).
  # Backend service.{name,namespace,port} are auto-filled, so you can omit the
  # service block entirely:
  # - name: myapp
  #   hostname: myapp
  #   gateway: internal
  #   kedaColdStartLoadingPage: true

  # RBAC resources (list)
  rbac: []
  # Example:
  # rbac:
  #   - serviceAccount:
  #       name: myapp
  #       create: true
  #     clusterRole:
  #       name: myapp-readonly
  #       rules:
  #         - apiGroups: [""]
  #           resources: ["pods"]
  #           verbs: ["get", "list"]

  # LimitRange
  limitRange: null
  # Example:
  # limitRange:
  #   enabled: true
  #   defaults:
  #     cpu: 500m
  #     memory: 512Mi
  #   defaultRequests:
  #     cpu: 50m
  #     memory: 64Mi

  # CNPG Databases
  cnpgDatabases: []
  # Example:
  # cnpgDatabases:
  #   - name: myapp
  #     owner: myapp
  #     clusterName: cnpg-cluster
  #     extensions: []

  # Workloads: Deployment (default) | CronJob, plus a Service when a
  # container declares ports. Name: <release>-<name>, or the release name when it
  # contains <name>. Values win over every default below.
  # Defaults: revisionHistoryLimit 2, automountServiceAccountToken false,
  # enableServiceLinks false, strategy Recreate when a ReadWriteOnce claim is
  # mounted; Reloader annotations for every Secret/ConfigMap the pod references
  # (reload: false turns them off). CronJob: Forbid, startingDeadlineSeconds 600,
  # history 1/3, backoffLimit 2, restartPolicy OnFailure.
  workloads: []
  # Example:
  # - name: myapp
  #   legacySelector: {app: myapp}  # only for a Deployment created before 1.19 (selector is immutable)
  #   annotations: {}               # labels: {} too
  #   pod:                          # native PodSpec fields except containers
  #     securityContext: {fsGroup: 1000}
  #   containers:                   # native Container fields; image is {repository, tag}
  #     - name: myapp
  #       image:
  #         repository: ghcr.io/org/myapp
  #         tag: "1.2.3"
  #       ports:
  #         - name: http
  #           containerPort: 8080
  #       envFrom:
  #         - secretRef: {name: myapp-app}
  #       readinessProbe:           # native probes
  #         httpGet: {path: /, port: http}
  #   persistence:                  # volume name -> source + mount (all containers unless `containers`)
  #     data: {claim: myapp-data, mountPath: /data}   # claim must be in persistentVolumeClaims
  #     tmp: {emptyDir: {}, mountPath: /tmp}
  #   service: {}                   # native ServiceSpec overrides; false = no Service
  #   spec: {}                      # native controller spec overrides (replicas, strategy, timeZone, ...)
  # - name: export
  #   type: cronjob
  #   schedule: "0 3 * * *"
  #   job: {activeDeadlineSeconds: 1800}   # native JobSpec overrides
  #   containers: [...]

  # Plain ConfigMaps / Secrets, named like workloads.
  configMaps: []
  # - name: config
  #   data: {app.conf: "..."}
  secrets: []
  # - name: repo
  #   fullnameOverride: helm-oci-forgejo
  #   labels: {argocd.argoproj.io/secret-type: repository}
  #   stringData: {type: helm}

  # Deprecated (removed in 2.0.0): raw pass-through, use workloads/configMaps/secrets.
  apps: []
  cronJobs: []


  # PVC definitions
  persistentVolumeClaims: []

  # Authentik Blueprints (ConfigMaps in ns authentik for declarative OIDC providers)
  authentikBlueprints: []
  # Example:
  # - name: authentik-blueprint-myapp
  #   blueprints:
  #     myapp-oidc.yaml: |
  #       version: 1
  #       metadata:
  #         name: MyApp OIDC Integration
  #       entries:
  #         - model: authentik_providers_oauth2.oauth2provider
  #           id: myapp-provider
  #           identifiers:
  #             name: MyApp OIDC
  #           attrs:
  #             name: MyApp OIDC
  #             client_type: confidential
  #             client_id: myapp
  #             authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
  #             redirect_uris: https://myapp.example.com/oauth/callback
  #             signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  #         - model: authentik_core.application
  #           id: myapp-app
  #           identifiers:
  #             slug: myapp
  #           attrs:
  #             name: MyApp
  #             slug: myapp
  #             provider: !KeyOf myapp-provider
  #             launch_url: https://myapp.example.com

  # Default-deny ingress (CiliumNetworkPolicy "default-ingress"). Always open:
  # the namespace itself, host/remote-node/kube-apiserver/ingress/health.
  networkPolicy: {}
  # Example:
  # networkPolicy:
  #   enabled: true
  #   allow:
  #     - namespaces: [victoria-metrics]
  #       ports: [9187]
