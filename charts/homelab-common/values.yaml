# Default values for homelab-common (shared Helm chart).
# global.* (vault, gateway, dns, volsync) приходит из argocd/values/global.yaml — он всегда первый в valueFiles.

homelab-common:
  # ExternalSecrets to create
  externalSecrets: []
  # Example:
  # - name: app-secrets
  #   vaultPath: myapp/app-secrets  # Will be prefixed with global.vault.pathPrefix
  #   data:
  #     - secretKey: password
  #       property: password
  #   templateData:
  #     PASSWORD: "{{ .password }}"

  # HTTPRoutes to create
  httpRoutes: []
  # Example:
  # - name: myapp
  #   hostname: myapp  # Will be suffixed with global.dns.domain
  #   gateway: external  # or "internal" or "both"
  #   service:
  #     name: myapp
  #     port: 8080
  #
  # Shortcut for KEDA HTTP scale-to-zero apps — routes via keda-loading-proxy
  # in ns keda (renders a Russian "service is starting" page during cold-start).
  # Backend service.{name,namespace,port} are auto-filled, so you can omit the
  # service block entirely:
  # - name: myapp
  #   hostname: myapp
  #   gateway: internal
  #   kedaColdStartLoadingPage: true

  # RBAC resources (list)
  rbac: []
  # Example:
  # rbac:
  #   - serviceAccount:
  #       name: myapp
  #       create: true
  #     clusterRole:
  #       name: myapp-readonly
  #       rules:
  #         - apiGroups: [""]
  #           resources: ["pods"]
  #           verbs: ["get", "list"]

  # LimitRange
  limitRange: null
  # Example:
  # limitRange:
  #   enabled: true
  #   defaults:
  #     cpu: 500m
  #     memory: 512Mi
  #   defaultRequests:
  #     cpu: 50m
  #     memory: 64Mi

  # CNPG Databases
  cnpgDatabases: []
  # Example:
  # cnpgDatabases:
  #   - name: myapp
  #     owner: myapp_user
  #     clusterName: cnpg-cluster
  #     extensions: []

  # apps: опционально secret / configMap / deployment / service
  apps: []

  # Generic CronJobs (pass-through spec).
  cronJobs: []
  # Example:
  # - name: spotify-backup
  #   spec:
  #     schedule: "0 4 * * *"
  #     concurrencyPolicy: Forbid
  #     successfulJobsHistoryLimit: 1
  #     failedJobsHistoryLimit: 3
  #     jobTemplate:
  #       spec:
  #         backoffLimit: 2
  #         template:
  #           spec:
  #             restartPolicy: OnFailure
  #             containers: [...]
  #             volumes: [...]


  # PVC definitions
  persistentVolumeClaims: []

  # Authentik Blueprints (ConfigMaps in ns authentik for declarative OIDC providers)
  authentikBlueprints: []
  # Example:
  # - name: authentik-blueprint-myapp
  #   blueprints:
  #     myapp-oidc.yaml: |
  #       version: 1
  #       metadata:
  #         name: MyApp OIDC Integration
  #       entries:
  #         - model: authentik_providers_oauth2.oauth2provider
  #           id: myapp-provider
  #           identifiers:
  #             name: MyApp OIDC
  #           attrs:
  #             name: MyApp OIDC
  #             client_type: confidential
  #             client_id: myapp
  #             authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
  #             redirect_uris: https://myapp.example.com/oauth/callback
  #             signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  #         - model: authentik_core.application
  #           id: myapp-app
  #           identifiers:
  #             slug: myapp
  #           attrs:
  #             name: MyApp
  #             slug: myapp
  #             provider: !KeyOf myapp-provider
  #             launch_url: https://myapp.example.com
