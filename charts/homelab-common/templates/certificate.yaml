{{- $hc := index .Values "homelab-common" | default dict }}
{{- range $hc.certificates | default list }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
spec:
  secretName: {{ .secretName | default .name }}
  issuerRef:
    kind: {{ .issuerRef.kind | default "ClusterIssuer" }}
    name: {{ .issuerRef.name }}
  dnsNames:
    {{- range .dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
