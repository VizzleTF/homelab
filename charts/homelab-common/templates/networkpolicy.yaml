{{- $np := (index .Values "homelab-common" | default dict).networkPolicy }}
{{- if and $np $np.enabled }}
{{- /* Default-deny ingress for the release namespace. Always allowed: the
     namespace itself, the local node (kubelet probes), the API server
     (webhooks), the Cilium gateway (ingress identity) and cilium-health.
     remote-node is not: LoadBalancer/NodePort traffic SNATed by another node
     carries it and would reach every port from the LAN; list it per port in
     networkPolicy.allow (entities). Egress: see lan-egress-deny below. */}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
    - fromEntities:
        - host
        - kube-apiserver
        - ingress
        - health
    {{- range $np.allow | default list }}
    {{- if .entities }}
    - fromEntities:
        {{- toYaml .entities | nindent 8 }}
    {{- else }}
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                {{- toYaml .namespaces | nindent 16 }}
    {{- end }}
      {{- with .ports }}
      toPorts:
        - ports:
            {{- range . }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
      {{- end }}
    {{- end }}
{{- if $np.lanEgressDeny }}
{{- /* Deny-only egress to private ranges: a compromised image reaches the
     internet and the cluster, not the NAS, router or ops node. Deny wins over
     allow in Cilium, so exceptions are whole IPs in `except`. Pods (10.244/16)
     and Services (10.96/12) stay open; node IPs carry host/remote-node/kube-apiserver identities that
     CIDR rules do not match. VolSync movers carry the exempt label. */}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lan-egress-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: homelab.lan-egress/exempt
        operator: DoesNotExist
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDRSet:
        - cidr: 10.0.0.0/8
          except:
            - 10.244.0.0/16
            # Service CIDR: ClusterIP traffic socket-LB did not translate
            # (non-TCP/UDP, nested netns like DinD) still carries the VIP.
            - 10.96.0.0/12
            {{- range $np.lanEgress | default list }}
            - {{ . }}
            {{- end }}
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
{{- end }}
{{- end }}
