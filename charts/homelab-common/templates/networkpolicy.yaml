{{- $np := (index .Values "homelab-common" | default dict).networkPolicy }}
{{- if and $np $np.enabled }}
{{- /* Default-deny ingress for the release namespace. Always allowed: the
     namespace itself, the local node (kubelet probes), the API server
     (webhooks), the Cilium gateway (ingress identity) and cilium-health.
     remote-node is not: LoadBalancer/NodePort traffic SNATed by another node
     carries it and would reach every port from the LAN; list it per port in
     networkPolicy.allow (entities). Egress is not touched. */}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
    - fromEntities:
        - host
        - kube-apiserver
        - ingress
        - health
    {{- range $np.allow | default list }}
    {{- if .entities }}
    - fromEntities:
        {{- toYaml .entities | nindent 8 }}
    {{- else }}
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                {{- toYaml .namespaces | nindent 16 }}
    {{- end }}
      {{- with .ports }}
      toPorts:
        - ports:
            {{- range . }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
