{{- $hc := index .Values "homelab-common" | default dict }}
{{- range $db := $hc.cnpgDatabases | default list }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $db.name }}
  namespace: {{ $db.namespace | default $.Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
spec:
  name: {{ $db.name }}
  owner: {{ $db.owner }}
  cluster:
    name: {{ $db.clusterName }}
  {{- if $db.extensions }}
  extensions:
    {{- range $db.extensions }}
    - name: {{ .name }}
      ensure: present
    {{- end }}
  {{- end }}
  ensure: present
{{- end }}
