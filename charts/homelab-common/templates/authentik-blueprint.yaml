{{- $hc := index .Values "homelab-common" | default dict }}
{{- range $hc.authentikBlueprints | default list }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}
  namespace: authentik
  labels:
    {{- include "homelab-common.labels" (dict "root" $ "extra" (dict "app.kubernetes.io/name" "authentik" "app.kubernetes.io/part-of" "authentik")) | nindent 4 }}
data:
  {{- range $filename, $content := .blueprints }}
  {{ $filename }}: |
{{ $content | indent 4 }}
  {{- end }}
{{- end }}
