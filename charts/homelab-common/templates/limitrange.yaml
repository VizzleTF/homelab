{{- $hc := index .Values "homelab-common" | default dict }}
{{- $lr := $hc.limitRange }}
{{- if $lr }}
{{- if $lr.enabled }}
{{- $defReq := $lr.defaultRequests | default dict }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ $lr.name | default "default-limits" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- /* defaults: null = requests-only (no default limits) */}}
      {{- with $lr.defaults }}
      default:
        cpu: {{ .cpu }}
        memory: {{ .memory }}
      {{- end }}
      defaultRequest:
        cpu: {{ $defReq.cpu }}
        memory: {{ $defReq.memory }}
{{- end }}
{{- end }}
