{{- $hc := index .Values "homelab-common" | default dict }}
{{- $g := .Values.global | default dict }}
{{- range $hc.tlsRoutes | default list }}
{{- $gw := $g.gateway.tls }}
{{- $hostname := .hostname }}
{{- if not (contains "." $hostname) }}
{{- $hostname = printf "%s.%s" $hostname $g.dns.domain }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    external-dns.kubernetes.io/hostname: {{ $hostname }}
    external-dns.kubernetes.io/target: {{ $gw.ip | quote }}
    external-dns.kubernetes.io/internal-dns: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
  hostnames:
    - {{ $hostname }}
  rules:
    - backendRefs:
        - name: {{ .service.name }}
          port: {{ .service.port | int }}
{{- end }}
