{{- $hc := index .Values "homelab-common" | default dict }}
{{- $g := .Values.global | default dict }}
{{- range $r := $hc.httpRoutes | default list }}
{{- $gateway := .gateway | default "external" }}
{{- $hostname := .hostname }}
{{- if not (contains "." $hostname) }}
{{- $hostname = printf "%s.%s" $hostname $g.dns.domain }}
{{- end }}

{{/* kedaColdStartLoadingPage: shortcut that routes via the keda-loading-proxy
     nginx front-door instead of the bare interceptor. Renders a Russian
     "service is starting" loading page during scale-from-zero.
     See argocd/infra/keda-add-ons-http/manifests/loading-proxy-*.yaml */}}
{{- $svc := .service | default dict }}
{{- if .kedaColdStartLoadingPage }}
{{- $svc = dict "name" "keda-loading-proxy" "namespace" "keda" "port" 8080 }}
{{- end }}

{{- range $kind := list "external" "internal" }}
{{- if or (eq $gateway $kind) (eq $gateway "both") }}
{{- $gw := index $g.gateway $kind }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $r.name }}{{ if eq $gateway "both" }}-{{ $kind }}{{ end }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    external-dns.kubernetes.io/hostname: {{ $hostname }}
    {{- if eq $kind "external" }}
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    {{- else }}
    external-dns.kubernetes.io/target: {{ $gw.ip | quote }}
    external-dns.kubernetes.io/internal-dns: "true"
    {{- end }}
    {{- with $r.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $r.pathPrefix | default "/" }}
      {{- /* Alt-Svc: clear (internal only) — the same hostname is served by
           Cloudflare externally (which advertises `alt-svc: h3=":443"`) and by
           this TCP-only internal gateway on the LAN. Browsers cache Alt-Svc per
           origin, not per IP, so at home they keep trying QUIC against the
           internal gateway and fail with ERR_QUIC_PROTOCOL_ERROR. `clear`
           invalidates that cache (RFC 7838). */}}
      {{- if or (eq $kind "internal") $r.filters }}
      filters:
        {{- if eq $kind "internal" }}
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Alt-Svc
                value: clear
        {{- end }}
        {{- with $r.filters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ $svc.name }}
          {{- with $svc.namespace }}
          namespace: {{ . }}
          {{- end }}
          port: {{ $svc.port }}
{{- end }}
{{- end }}

{{- end }}
