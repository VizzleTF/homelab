{{- $hc := index .Values "homelab-common" | default dict }}
{{- $g := .Values.global | default dict }}
{{- range $r := $hc.httpRoutes | default list }}
{{- $hostname := .hostname }}
{{- if not (contains "." $hostname) }}
{{- $hostname = printf "%s.%s" $hostname $g.dns.domain }}
{{- end }}

{{/* kedaColdStartLoadingPage: shortcut that routes via the keda-loading-proxy
     nginx front-door instead of the bare interceptor. Renders a Russian
     "service is starting" loading page during scale-from-zero.
     See workloads loading-proxy in argocd/infra/keda-add-ons-http/values.yaml */}}
{{- $svc := .service | default dict }}
{{- if .kedaColdStartLoadingPage }}
{{- $svc = dict "name" "keda-loading-proxy" "namespace" "keda" "port" 8080 }}
{{- end }}

{{- $gw := $g.gateway.internal }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $r.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
  annotations:
    external-dns.kubernetes.io/hostname: {{ $hostname }}
    external-dns.kubernetes.io/internal-dns: "true"
    {{- with $r.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      {{- /* HTTPS only; the http listener just redirects
           (argocd/infra/cilium/manifests/cilium-gateway-internal-redirect.yaml). */}}
      sectionName: https
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $r.pathPrefix | default "/" }}
      {{- /* Alt-Svc: clear — browsers still hold Cloudflare's `alt-svc: h3=":443"`
           for hosts it once proxied; this gateway is TCP-only, so a cached entry
           fails with ERR_QUIC_PROTOCOL_ERROR. `clear` invalidates it (RFC 7838). */}}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Alt-Svc
                value: clear
        {{- with $r.filters }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      backendRefs:
        - name: {{ $svc.name }}
          {{- with $svc.namespace }}
          namespace: {{ . }}
          {{- end }}
          port: {{ $svc.port }}

{{- end }}
