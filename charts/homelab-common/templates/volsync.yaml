{{- $hc := index .Values "homelab-common" | default dict }}
{{- $vault := (.Values.global | default dict).vault }}
{{- $vsg := (.Values.global | default dict).volsync }}
{{- $repos := ($vsg | default dict).repos }}
{{- $items := $hc.volsync | default list }}
{{- range $item := $items }}
{{- /* name задаёт путь репозитория restic-apps/<name> и обязан быть уникальным
       по всему кластеру: два одноимённых элемента в разных namespace писали бы
       в один репозиторий (наблюдалось на netbird-peer в ns netbird и
       crowdsec-scraper, 2026-09-10). */}}
{{- $name := $item.name }}
{{- $claim := $item.claim | default $item.name }}
{{- range $t := ($item.targets | default list) }}
{{- $repo := index $repos $t.repo }}
{{- if not $repo }}{{ fail (printf "volsync: unknown repo %q for %q — define global.volsync.repos.%s" $t.repo $name $t.repo) }}{{ end }}
{{- $secretName := printf "%s-restic-%s" $name $t.repo }}
{{- $path := printf "%s/%s%s" $repo.bucket (empty $repo.prefix | ternary "" (printf "%s/" $repo.prefix)) $name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $vault.refreshInterval }}
  secretStoreRef:
    name: {{ $vault.secretStore }}
    kind: {{ $vault.secretStoreKind }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        RESTIC_REPOSITORY: "s3:{{ $repo.endpoint }}/{{ $path }}"
        RESTIC_PASSWORD: "{{ `{{ .password }}` }}"
        AWS_ACCESS_KEY_ID: "{{ `{{ .access_key_id }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .secret_access_key }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $vault.pathPrefix }}/{{ $repo.passwordVaultPath }}
        property: password
    - secretKey: access_key_id
      remoteRef:
        key: {{ $vault.pathPrefix }}/{{ $repo.keyVaultPath }}
        property: ACCESS_KEY_ID
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $vault.pathPrefix }}/{{ $repo.keyVaultPath }}
        property: ACCESS_SECRET_KEY
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: {{ $name }}-{{ $t.repo }}
  namespace: {{ $.Release.Namespace }}
spec:
  sourcePVC: {{ $claim }}
  trigger:
    schedule: {{ $t.schedule | quote }}
  restic:
    repository: {{ $secretName }}
    copyMethod: {{ $item.copyMethod | default "Snapshot" }}
    volumeSnapshotClassName: {{ $vsg.snapshotClass }}
    storageClassName: {{ $vsg.storageClass }}
    accessModes:
      - {{ $item.accessMode | default "ReadWriteOnce" }}
    cacheStorageClassName: {{ $vsg.cacheStorageClass }}
    cacheCapacity: {{ $item.cacheCapacity | default $vsg.cacheCapacity }}
    cacheAccessModes:
      - ReadWriteOnce
    pruneIntervalDays: 14
    retain:
      {{- toYaml ($t.retain | default $repo.retain | default (dict "daily" 7 "weekly" 4)) | nindent 6 }}
    {{- with $item.moverSecurityContext }}
    moverSecurityContext:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
