{{- $hc := index .Values "homelab-common" | default dict }}
{{- $vault := (.Values.global | default dict).vault }}
{{- $vsg := (.Values.global | default dict).volsync }}
{{- $repos := ($vsg | default dict).repos }}
{{- $items := $hc.volsync | default list }}
{{- range $item := $items }}
{{- /* name is the restic repository path (restic-apps/<name>) and must be unique
       cluster-wide: two items with the same name in different namespaces would
       write into one repository. */}}
{{- $name := $item.name }}
{{- $claim := $item.claim | default $item.name }}
{{- range $t := ($item.targets | default list) }}
{{- $repo := index $repos $t.repo }}
{{- if not $repo }}{{ fail (printf "volsync: unknown repo %q for %q — define global.volsync.repos.%s" $t.repo $name $t.repo) }}{{ end }}
{{- $secretName := printf "%s-restic-%s" $name $t.repo }}
{{- $path := printf "%s/%s%s" $repo.bucket (empty $repo.prefix | ternary "" (printf "%s/" $repo.prefix)) $name }}
{{- range (list $repo.passwordVaultPath $repo.keyVaultPath) }}
{{- include "homelab-common.assertVaultPath" (dict "root" $ "path" . "where" (printf "volsync %s/%s" $name $t.repo)) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
spec:
  refreshInterval: {{ $vault.refreshInterval }}
  secretStoreRef:
    {{- include "homelab-common.secretStoreRef" $ | trim | nindent 4 }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        RESTIC_REPOSITORY: "s3:{{ $repo.endpoint }}/{{ $path }}"
        RESTIC_PASSWORD: "{{ `{{ .password }}` }}"
        AWS_ACCESS_KEY_ID: "{{ `{{ .access_key_id }}` }}"
        AWS_SECRET_ACCESS_KEY: "{{ `{{ .secret_access_key }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $vault.pathPrefix }}/{{ $repo.passwordVaultPath }}
        property: password
    - secretKey: access_key_id
      remoteRef:
        key: {{ $vault.pathPrefix }}/{{ $repo.keyVaultPath }}
        property: ACCESS_KEY_ID
    - secretKey: secret_access_key
      remoteRef:
        key: {{ $vault.pathPrefix }}/{{ $repo.keyVaultPath }}
        property: ACCESS_SECRET_KEY
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: {{ $name }}-{{ $t.repo }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- /* homelab.dr/drill: picked up by the weekly restore drill (argocd/infra/backup-drill) */}}
    {{- include "homelab-common.labels" (dict "root" $ "extra" (dig "drill" true $item | ternary (dict "homelab.dr/drill" $name) dict)) | nindent 4 }}
spec:
  sourcePVC: {{ $claim }}
  trigger:
    schedule: {{ $t.schedule | quote }}
  restic:
    repository: {{ $secretName }}
    copyMethod: {{ $item.copyMethod | default "Snapshot" }}
    volumeSnapshotClassName: {{ $vsg.snapshotClass }}
    storageClassName: {{ $vsg.storageClass }}
    accessModes:
      - {{ $item.accessMode | default "ReadWriteOnce" }}
    cacheStorageClassName: {{ $item.cacheStorageClass | default $vsg.cacheStorageClass }}
    cacheCapacity: {{ $item.cacheCapacity | default $vsg.cacheCapacity }}
    cacheAccessModes:
      - ReadWriteOnce
    pruneIntervalDays: 14
    retain:
      {{- toYaml ($t.retain | default $repo.retain | default (dict "daily" 7 "weekly" 4)) | nindent 6 }}
    # Exempt from lan-egress-deny: the mover writes to the NAS restic repo.
    moverPodLabels:
      homelab.lan-egress/exempt: volsync
    {{- with $item.moverSecurityContext }}
    moverSecurityContext:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $item.moverResources }}
    moverResources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
