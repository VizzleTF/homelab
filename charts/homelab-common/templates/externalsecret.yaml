{{- $hc := index .Values "homelab-common" | default dict }}
{{- $vault := (.Values.global | default dict).vault }}
{{- $secrets := $hc.externalSecrets | default list }}
{{- range $secrets }}
{{- $secret := . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $) | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $vault.refreshInterval }}
  secretStoreRef:
    {{- include "homelab-common.secretStoreRef" $ | trim | nindent 4 }}
  target:
    name: {{ .targetName | default .name }}
    creationPolicy: {{ .creationPolicy | default "Owner" }}
    {{- if .deletionPolicy }}
    deletionPolicy: {{ .deletionPolicy }}
    {{- end }}
    {{- if or .templateData .templateMetadata }}
    template:
      type: {{ .templateType | default "Opaque" }}
      {{- if .templateMetadata }}
      metadata:
        {{- toYaml .templateMetadata | nindent 8 }}
      {{- end }}
      {{- if .templateData }}
      data:
        {{- range $key, $value := .templateData }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
  data:
  {{- range .data }}
  {{- $p := .vaultPath | default $secret.vaultPath | required (printf "externalSecrets %s: vaultPath is required" $secret.name) }}
  {{- include "homelab-common.assertVaultPath" (dict "root" $ "path" $p "where" (printf "externalSecrets %s" $secret.name)) }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ printf "%s/%s" $vault.pathPrefix $p }}
        property: {{ .property }}
  {{- end }}
{{- end }}
