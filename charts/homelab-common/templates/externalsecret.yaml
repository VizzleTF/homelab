{{- $hc := index .Values "homelab-common" | default dict }}
{{- $vault := (.Values.global | default dict).vault }}
{{- $secrets := $hc.externalSecrets | default list }}
{{- range $secrets }}
{{- $secret := . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $vault.refreshInterval }}
  secretStoreRef:
    name: {{ $vault.secretStore }}
    kind: {{ $vault.secretStoreKind }}
  target:
    name: {{ .targetName | default .name }}
    creationPolicy: {{ .creationPolicy | default "Owner" }}
    {{- if .deletionPolicy }}
    deletionPolicy: {{ .deletionPolicy }}
    {{- end }}
    {{- if or .templateData .templateEngineVersion .templateMetadata }}
    template:
      type: {{ .templateType | default "Opaque" }}
      {{- if .templateEngineVersion }}
      engineVersion: {{ .templateEngineVersion }}
      {{- end }}
      {{- if .templateMetadata }}
      metadata:
        {{- toYaml .templateMetadata | nindent 8 }}
      {{- end }}
      {{- if .templateData }}
      data:
        {{- range $key, $value := .templateData }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
  data:
  {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ printf "%s/%s" $vault.pathPrefix (.vaultPath | default $secret.vaultPath | required (printf "externalSecrets %s: vaultPath is required" $secret.name)) }}
        property: {{ .property }}
  {{- end }}
{{- end }}
