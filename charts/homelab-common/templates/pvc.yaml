{{- $hc := index .Values "homelab-common" | default dict }}
{{- $pvcs := $hc.persistentVolumeClaims | default list }}
{{- range $pvcs }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $ "extra" .labels) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- range .accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ .size }}
  storageClassName: {{ .storageClassName }}
{{- end }}
