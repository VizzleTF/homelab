# Pinned CLI toolchain for the homelab repo.
# Single source of truth for "what tool versions does this repo expect".
# Renovate's native `mise` manager bumps these (datasource auto-resolved per tool).
# `scripts/kubeconform-validate.sh` (and CI) read the kubeconform pin from here.
[tools]
helm = "4.3.1"          # CI and chart publish install it via scripts/ci-install-helm.sh
kubectl = "1.37.1"       # match cluster k8s version
talosctl = "1.14.4"     # CI talos-validate job reads it from here
terraform = "1.16.6"    # terraform_talos/; CI talos-validate job reads it from here
kubeconform = "0.8.0"
task = "3.54.0"
jq = "1.8.2"
yamllint = "1.38.0"     # CI yamllint job installs this version
gitleaks = "8.30.1"      # CI gitleaks and mirror jobs install this version
pluto = "5.24.4"         # CI kubeconform job reads it from here
yq = "4.54.1"
shellcheck = "0.11.0"    # CI and pre-commit run shellcheck-py at the .pre-commit-config.yaml rev
"pipx:pre-commit" = "4.7.0"  # then `pre-commit install` once per clone
