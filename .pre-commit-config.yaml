repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0  # keep in sync with .mise.toml
    hooks:
      - id: yamllint  # reads .yamllint.yml like CI; every finding fails
        args: [--strict]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1  # keep in sync with .mise.toml
    hooks:
      - id: shellcheck
        args: [-x, -S, warning]
  - repo: local
    hooks:
      - id: filename-blocklist
        name: Filename blocklist (mirror of CI)
        entry: bash .git-hooks/blocklist.sh  # via bash: exec bit is lost on core.fileMode=false checkouts
        language: system
        pass_filenames: false
        always_run: true
      - id: lint-skills
        name: Claude skills vs Anthropic best practices
        entry: python scripts/lint-skills.py  # file is 0644 in git
        # pre-commit's own venv with PyYAML: survives Homebrew Python upgrades.
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        pass_filenames: false
        files: ^\.claude/skills/
      - id: audit-docs
        name: Docs drift, repo side (mirror of CI)
        entry: python scripts/audit-docs.py --vault .no-vault  # like CI: vault checks need a reviewer
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        pass_filenames: false
        files: ^(argocd/|charts/|\.claude/|README\.md$|scripts/audit-docs\.py$)
