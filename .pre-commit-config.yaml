repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: filename-blocklist
        name: Filename blocklist (mirror of CI)
        entry: .git-hooks/blocklist.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: lint-skills
        name: Claude skills vs Anthropic best practices
        entry: scripts/lint-skills.py
        language: script
        pass_filenames: false
        files: ^\.claude/skills/
