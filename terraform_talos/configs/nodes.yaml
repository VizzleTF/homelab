cluster:
  name: homelab
  vip: 10.11.11.100
  gateway: 10.11.11.1
  apiserver_cert_sans:
    - api.k8s.example.com
  # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
  kubernetes_version: v1.37.2
  # renovate: datasource=github-releases depName=siderolabs/talos
  talos_release: v1.14.5

# New node: boot the factory ISO, check `talosctl --insecure -e <ip> -n <ip> version`,
# add an entry, `terraform apply` (skill managing-talos-node).
nodes:
  talos-cp-01:
    enabled: true
    address: 10.11.11.101/24
    role: controlplane
    install_disk: /dev/sda
    # 4 NICs, only enp1s0 cabled: without the MAC pin .101 + VIP land on all four.
    mac: 00:f1:f7:a0:44:af
    # Intel iGPU on every box; the GPU device plugin DaemonSet selects on it.
    labels:
      homelab.example.com/gpu: "true"
  talos-cp-02:
    enabled: true
    address: 10.11.11.102/24
    role: controlplane
    install_disk: /dev/sda
    mac: 68:1d:ef:3f:00:1b  # enp1s0; enp3s0 is not cabled
    labels:
      homelab.example.com/gpu: "true"
  talos-cp-03:
    enabled: true
    address: 10.11.11.103/24
    role: controlplane
    install_disk: /dev/sda
    mac: 68:1d:ef:3f:0e:ab  # enp1s0; enp3s0 is not cabled
    labels:
      homelab.example.com/gpu: "true"
  talos-worker-01:
    enabled: true
    address: 10.11.11.111/24
    role: worker
    install_disk: /dev/nvme0n1
    mac: 78:55:36:07:31:d3
    # Own prefix: NodeRestriction stops a node from setting node-role.kubernetes.io/*.
    # immich-machine-learning selects on it (Iris Xe iGPU).
    labels:
      homelab.example.com/ml: "true"
      homelab.example.com/gpu: "true"
