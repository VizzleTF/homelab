# Local mirror of the .forgejo/workflows/ci.yaml pre-merge gate.
# Run `task ci:all` before pushing.
version: '3'

tasks:
  lint:
    desc: yamllint + shellcheck + repo-side doc/contract checks (matches CI yamllint job)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - yamllint --strict .
      - git ls-files -z '*.sh' '.git-hooks/*' | xargs -0 shellcheck -x -S warning
      - python3 scripts/lint-skills.py
      - python3 scripts/audit-docs.py

  helm-lint:
    desc: Lint homelab-common, run its self-check and the render diff (matches CI helm-lint job)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - helm lint --strict charts/homelab-common
      - scripts/homelab-common-selfcheck.sh
      - scripts/chart-diff.sh --stat

  kubeconform:
    desc: Validate raw + rendered manifests with kubeconform (matches CI kubeconform job)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - scripts/kubeconform-validate.sh

  values-drift:
    desc: Report values equal to chart defaults or unknown to the chart (not a gate)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - scripts/values-drift.py {{.CLI_ARGS}}

  all:
    desc: Run the full pre-merge gate locally (lint + helm-lint + kubeconform)
    cmds:
      - task: lint
      - task: helm-lint
      - task: kubeconform
