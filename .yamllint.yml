extends: default

ignore:
  - charts/*/templates/
  - charts/*/charts/
  - .git/
  # Agent worktrees: checkouts of their own, linted from their own root.
  - .claude/worktrees/
  - terraform_talos/.terraform/
  - .mise.toml
  # Image Factory hashes it into the schematic ID: reformatting means a new
  # installer image for every node.
  - terraform_talos/modules/talos/schematic.yaml

rules:
  truthy: disable
  line-length: disable
  document-start: disable
  comments-indentation: disable
  empty-lines:
    max: 2
  indentation:
    spaces: 2
    indent-sequences: consistent
