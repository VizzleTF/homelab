extends: default

ignore:
  - charts/*/templates/
  - charts/*/charts/
  - .git/
  - terraform_talos/.terraform/
  - .mise.toml
  # Hashed by the Talos Image Factory into the schematic ID (installer image):
  # reformatting it is not worth a possible new image for every node.
  - terraform_talos/modules/talos/schematic.yaml

rules:
  truthy: disable
  line-length: disable
  document-start: disable
  comments-indentation: disable
  empty-lines:
    max: 2
  indentation:
    spaces: 2
    indent-sequences: consistent
