# go-task entry point for the local pre-merge gate (`task ci:all`).
# Everything else is a plain script under scripts/ — call it directly.
# Tool versions are pinned in .mise.toml (`mise install` to provision them).
version: '3'

includes:
  ci: .taskfiles/ci/Taskfile.yaml

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true
