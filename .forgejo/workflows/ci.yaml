name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  yamllint:
    # Pre-merge only: main gets the same files after the squash merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install yamllint
        # Version from .mise.toml (Renovate-tracked).
        run: scripts/ci-install-yamllint.sh
      - name: Lint
        run: yamllint --strict .
      - name: shellcheck
        # Rev from the pre-commit hook: the PyPI build suffix varies (0.11.0.1),
        # so it cannot come from .mise.toml.
        run: |
          set -eu
          VERSION=$(sed -n '/shellcheck-py\/shellcheck-py/{n;s/.*rev: v\([^ ]*\).*/\1/p}' .pre-commit-config.yaml)
          [ -n "$VERSION" ] || { echo "::error::shellcheck-py rev not found in .pre-commit-config.yaml"; exit 1; }
          /tmp/yamllint/bin/pip install --quiet "shellcheck-py==${VERSION}"
          git ls-files -z '*.sh' '.git-hooks/*' | xargs -0 /tmp/yamllint/bin/shellcheck -x -S warning
      - name: Lint Claude skills
        run: python3 scripts/lint-skills.py
      - name: Audit docs (repo side)
        # Repo-side checks only: the Obsidian vault is not in git.
        run: python3 scripts/audit-docs.py

  helm-lint:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install helm
        # Version from .mise.toml (Renovate-tracked), same major as ArgoCD's helm.
        run: scripts/ci-install-helm.sh
      - name: Lint homelab-common
        run: helm lint --strict charts/homelab-common
      - name: Published chart version is immutable
        # A charts/homelab-common change needs a version not yet in the registry.
        # Chart.yaml is excluded: helm package re-serialises it.
        run: |
          set -eu
          v=$(sed -n 's/^version:[[:space:]]*//p' charts/homelab-common/Chart.yaml)
          tmp=$(mktemp -d)
          helm pull homelab-common --repo https://git.example.com/api/packages/vizzle/helm --version "$v" --untar -d "$tmp" 2>/dev/null || exit 0  # unpublished: new release
          diff -r --exclude=Chart.yaml "$tmp/homelab-common" charts/homelab-common >/dev/null || {
            echo "::error::charts/homelab-common differs from published $v; bump version in Chart.yaml"; exit 1; }
      - name: Self-check of the workloads engine
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-yaml >/dev/null
          scripts/homelab-common-selfcheck.sh
      - name: Render diff vs the published chart
        # argocd-diff sees a charts/ change only in the later pin-bump PR.
        # Informational: never fails on differences.
        run: scripts/chart-diff.sh

  kubeconform:
    # Pre-merge. Schema-validates local homelab-common renders against core + CRD
    # schemas (bad apiVersion, ESO v1 vs v1beta1) that helm lint cannot see.
    # Raw manifests get only pluto here; argocd-diff covers them.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install helm
        # Version from .mise.toml (Renovate-tracked), same major as ArgoCD's helm.
        run: scripts/ci-install-helm.sh
      - name: Install kubeconform
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^kubeconform[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .mise.toml)
          [ -n "$VERSION" ] || { echo "::error::kubeconform version not found in .mise.toml"; exit 1; }
          BASE="https://github.com/yannh/kubeconform/releases/download/v${VERSION}"
          # Keep the canonical asset filename — CHECKSUMS references it by name,
          # so `sha256sum -c` looks for exactly kubeconform-linux-amd64.tar.gz.
          curl -fsSL -o /tmp/kubeconform-linux-amd64.tar.gz "${BASE}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o /tmp/CHECKSUMS "${BASE}/CHECKSUMS"
          ( cd /tmp && grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum -c - )
          tar -xzf /tmp/kubeconform-linux-amd64.tar.gz -C /tmp kubeconform
          install -m 755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Install pluto
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^pluto[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .mise.toml)
          [ -n "$VERSION" ] || { echo "::error::pluto version not found in .mise.toml"; exit 1; }
          P="pluto_${VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/FairwindsOps/pluto/releases/download/v${VERSION}"
          curl -fsSL -o "/tmp/${P}" "${BASE}/${P}"
          curl -fsSL -o /tmp/pluto-checksums.txt "${BASE}/checksums.txt"
          ( cd /tmp && grep " ${P}\$" pluto-checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${P}" -C /tmp pluto
          install -m 755 /tmp/pluto /usr/local/bin/pluto
          pluto version
      - name: Validate manifests
        run: scripts/kubeconform-validate.sh
      - name: Self-check of the Claude Code hooks
        # validate-yaml calls yamllint and kubeconform; node:*-bookworm ships without jq.
        run: |
          set -eu
          scripts/ci-install-yamllint.sh >/dev/null
          apt-get install -y -qq --no-install-recommends jq >/dev/null
          scripts/hooks-selfcheck.sh

  talos-validate:
    # talosctl-validates the machine config terraform_talos/ would apply, so a
    # conflicting patch fails here, not on `terraform apply`.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install terraform, talosctl, jq
        run: |
          set -euo pipefail
          # node:*-bookworm ships without jq and unzip.
          apt-get update -qq && apt-get install -y -qq --no-install-recommends jq unzip >/dev/null
          pin() { sed -n "s/^$1[[:space:]]*=[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" .mise.toml; }
          TF=$(pin terraform); TC=$(pin talosctl)
          [ -n "$TF" ] && [ -n "$TC" ] || { echo "::error::terraform/talosctl version not found in .mise.toml"; exit 1; }
          cd /tmp
          Z="terraform_${TF}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF}/${Z}"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF}/terraform_${TF}_SHA256SUMS"
          grep " ${Z}\$" "terraform_${TF}_SHA256SUMS" | sha256sum -c -
          unzip -q "$Z" terraform && install -m 755 terraform /usr/local/bin/terraform
          curl -fsSLO "https://github.com/siderolabs/talos/releases/download/v${TC}/talosctl-linux-amd64"
          curl -fsSLO "https://github.com/siderolabs/talos/releases/download/v${TC}/sha256sum.txt"
          grep ' talosctl-linux-amd64$' sha256sum.txt | sha256sum -c -
          install -m 755 talosctl-linux-amd64 /usr/local/bin/talosctl
          terraform version && talosctl version --client --short
      - name: Validate machine config
        run: scripts/talos-validate.sh --strict

  gitleaks:
    # Pre-merge required check (branch protection). Second line: the
    # post-sanitize gitleaks in mirror-to-github.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filename blocklist
        run: .git-hooks/blocklist.sh

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # Version from .mise.toml (Renovate lint-tools group, bumped with the pre-commit hook).
          VERSION=$(sed -n 's/^gitleaks[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .mise.toml)
          [ -n "$VERSION" ] || { echo "::error::gitleaks version not found in .mise.toml"; exit 1; }
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSL -o "/tmp/${TARBALL}" "${BASE}/${TARBALL}"
          curl -fsSL -o /tmp/gitleaks-checksums.txt "${BASE}/gitleaks_${VERSION}_checksums.txt"
          ( cd /tmp && grep " ${TARBALL}\$" gitleaks-checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
          install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --no-banner \
            --platform=gitea \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32  # v3.1.3 — DO NOT BUMP. Forgejo runner supports only @actions/artifact v1.x. v3.2.x bumps @actions/artifact to v2 (v4 protocol) → GHESNotSupportedError. Renovate guard in renovate.json: allowedVersions <3.2.0.
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

  argocd-diff:
    # Renders touched Applications for main and PR head in kind (runner dind).
    # Fails on render errors and kubeconform/pluto; a pruned resource or changed
    # CRD fails unless the PR has the `diff-reviewed` label (add it, re-run). A run
    # whose gate list differs from the reviewed one removes the label.
    # Only the cluster runner has the `diff-preview` label: kind needs its dind.
    if: github.event_name == 'pull_request'
    runs-on: diff-preview
    timeout-minutes: 30
    # DIFF_PREVIEW_TOKEN (write:issue) only if the automatic token cannot read
    # labels or write the comment.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    container:
      image: node:24-bookworm
      # Runner pod's dind: docker starts sibling containers, not children.
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      # renovate: datasource=docker depName=dagandersen/argocd-diff-preview
      DIFF_PREVIEW_VERSION: v0.2.17
      # renovate: datasource=docker depName=docker
      DOCKER_CLI_VERSION: 29.9.2
      PR_NUMBER: ${{ github.event.pull_request.number }}
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: target-branch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base-branch

      - name: Install docker CLI, yq, pluto, kubeconform
        run: |
          set -euo pipefail
          # pluto/yq/kubeconform versions: target-branch/.mise.toml (Renovate-tracked).
          mise_pin() { sed -n "s/^$1[[:space:]]*=[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" target-branch/.mise.toml; }
          YQ_VERSION=v$(mise_pin yq)
          PLUTO_VERSION=v$(mise_pin pluto)
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar -xz -C /tmp docker/docker
          install -m 755 /tmp/docker/docker /usr/local/bin/docker

          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          want=$(curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/checksums-bsd" \
            | sed -n 's/^SHA256 (yq_linux_amd64) = //p')
          echo "${want}  /tmp/yq" | sha256sum -c -
          install -m 755 /tmp/yq /usr/local/bin/yq

          P="pluto_${PLUTO_VERSION#v}_linux_amd64.tar.gz"
          BASE="https://github.com/FairwindsOps/pluto/releases/download/${PLUTO_VERSION}"
          curl -fsSL -o "/tmp/${P}" "${BASE}/${P}"
          curl -fsSL -o /tmp/pluto-checksums.txt "${BASE}/checksums.txt"
          ( cd /tmp && grep " ${P}\$" pluto-checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${P}" -C /tmp pluto
          install -m 755 /tmp/pluto /usr/local/bin/pluto

          VERSION=$(sed -n 's/^kubeconform[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' target-branch/.mise.toml)
          BASE="https://github.com/yannh/kubeconform/releases/download/v${VERSION}"
          curl -fsSL -o /tmp/kubeconform-linux-amd64.tar.gz "${BASE}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o /tmp/CHECKSUMS "${BASE}/CHECKSUMS"
          ( cd /tmp && grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum -c - )
          tar -xzf /tmp/kubeconform-linux-amd64.tar.gz -C /tmp kubeconform
          install -m 755 /tmp/kubeconform /usr/local/bin/kubeconform

          docker version --format 'docker server {{.Server.Version}}'

      - name: Render main and PR head
        env:
          SSH_KEY: ${{ secrets.DIFF_PREVIEW_SSH_KEY }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Read-only deploy key for the throwaway ArgoCD in kind.
          mkdir -p secrets argocd-config
          SSH_KEY="$SSH_KEY" yq -n '
            .apiVersion = "v1" | .kind = "Secret"
            | .metadata.name = "homelab-repo" | .metadata.namespace = "argocd"
            | .metadata.labels."argocd.argoproj.io/secret-type" = "repo-creds"
            | .stringData.type = "git"
            | .stringData.url = "ssh://git@git.example.com:22/vizzle"
            | .stringData.sshPrivateKey = strenv(SSH_KEY)' > secrets/repo.yaml
          # Host keys and ArgoCD chart version come from main, so a PR cannot swap them.
          yq -n '.configs.ssh.extraHosts = load("base-branch/argocd/values/argocd.yaml").configs.ssh.extraHosts' \
            > argocd-config/values.yaml
          ARGOCD_CHART=$(yq '.spec.sources[] | select(.chart == "argo-cd") | .targetRevision' \
            base-branch/argocd/standalone/argocd-application.yaml)

          # Paths resolve on the dind host: use docker cp, not bind mounts.
          # One retry: a blipping chart repo (GHCR, codeberg) fails the render.
          for attempt in 1 2; do
            docker rm -f argocd-diff-preview argocd-diff-preview-control-plane >/dev/null 2>&1 || true
            docker create --name argocd-diff-preview --network host \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e REPO=vizzle/homelab \
              -e BASE_BRANCH="$BASE_REF" \
              -e TARGET_BRANCH="$HEAD_REF" \
              -e ARGOCD_CHART_VERSION="$ARGOCD_CHART" \
              -e ARGOCD_UI_URL=https://argocd.example.com \
              -e OUTPUT_BRANCH_MANIFESTS=true \
              -e MAX_DIFF_LENGTH=50000 \
              "dagandersen/argocd-diff-preview:${DIFF_PREVIEW_VERSION}" >/dev/null
            for d in base-branch target-branch secrets argocd-config; do
              docker cp "$d" argocd-diff-preview:/
            done
            if docker start -a argocd-diff-preview; then
              docker cp argocd-diff-preview:/output .
              docker rm -f argocd-diff-preview >/dev/null
              # No Application selected = exit 0 + diff.md with "Found no ...".
              # Missing manifests without that line is a broken run: fail.
              if [ ! -f output/target-branch.yaml ]; then
                grep -q '^Found no' output/diff.md 2>/dev/null \
                  || { echo "::error::argocd-diff-preview wrote no manifests"; exit 1; }
                touch output/base-branch.yaml output/target-branch.yaml
              fi
              exit 0
            fi
            echo "::warning::argocd-diff-preview failed (attempt ${attempt})"
          done
          docker rm -f argocd-diff-preview argocd-diff-preview-control-plane >/dev/null 2>&1 || true
          exit 1

      - name: Validate rendered PR head
        id: checks
        env:
          TOKEN: ${{ secrets.DIFF_PREVIEW_TOKEN || github.token }}
        run: |
          # Runner bash has -e; every check must run, Verdict fails from `fail`.
          set +e -uo pipefail
          fail=0
          : > checks.md

          echo "### kubeconform" >> checks.md
          if ! target-branch/scripts/kubeconform-validate.sh "$PWD/output/target-branch.yaml" > kc.log 2>&1; then
            fail=1
            { echo '```'; tail -n 40 kc.log; echo '```'; } >> checks.md
          else
            echo "clean" >> checks.md
          fi
          cat kc.log

          # Exit 3 = removed API (fail); deprecations do not fail.
          # Targets: cluster k8s (tuppr) and the cilium chart, from git.
          K8S=$(yq '.spec.kubernetes.version' target-branch/argocd/infra/tuppr/manifests/kubernetes-upgrade.yaml)
          CILIUM=$(yq '.targetRevision' target-branch/argocd/infra/cilium/config.yaml)
          echo "### pluto" >> checks.md
          pluto detect output/target-branch.yaml -o markdown --ignore-deprecations \
            -f target-branch/.pluto-versions.yaml -t "k8s=${K8S},cilium=v${CILIUM}" > pluto.md 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || fail=1
          if [ -s pluto.md ]; then cat pluto.md >> checks.md; else echo "clean" >> checks.md; fi
          cat pluto.md

          echo "### review gate" >> checks.md
          if target-branch/scripts/diff-review-gate.sh output/base-branch.yaml output/target-branch.yaml > gate.log 2>&1; then
            echo "nothing to review" >> checks.md
          else
            # The label covers the gate list shown in the comment it was added after. Not
            # cleared on synchronize: `forgejo-pr.sh rerun` pushes an empty commit and
            # Renovate force-pushes rebases, both with an unchanged list.
            gate_sha=$(sha256sum gate.log | cut -d' ' -f1)
            # A failed read must not cost a valid label: no comments, no removal.
            comments=$(curl -fsS -H "Authorization: token ${TOKEN}" "${API}/issues/${PR_NUMBER}/comments") || comments=""
            reviewed_sha=$(yq -p json '.[] | select(.body | contains("<!-- argocd-diff -->")) | .body' <<<"${comments:-[]}" \
              | sed -n 's/^<!-- gate-sha: \([0-9a-f]*\) -->$/\1/p' | tail -n 1)
            label_id=$(curl -fsS -H "Authorization: token ${TOKEN}" "${API}/issues/${PR_NUMBER}/labels" \
              | yq -p json '.[] | select(.name == "diff-reviewed") | .id')
            if [ -n "$label_id" ] && [ "$reviewed_sha" = "$gate_sha" ]; then
              echo "Passed by the \`diff-reviewed\` label:" >> checks.md
            elif [ -n "$label_id" ] && [ -n "$comments" ]; then
              fail=1
              curl -fsS -X DELETE -H "Authorization: token ${TOKEN}" "${API}/issues/${PR_NUMBER}/labels/${label_id}" >/dev/null
              echo "**Blocked** until the PR has the \`diff-reviewed\` label: the list changed since it was added, so it was removed (review again, re-label, re-run this job):" >> checks.md
            else
              fail=1
              echo "**Blocked** until the PR has the \`diff-reviewed\` label (then re-run this job):" >> checks.md
            fi
            echo "<!-- gate-sha: ${gate_sha} -->" >> checks.md
            cat gate.log >> checks.md
          fi
          cat gate.log

          echo "fail=${fail}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: always() && hashFiles('output/diff.md') != ''
        env:
          TOKEN: ${{ secrets.DIFF_PREVIEW_TOKEN || github.token }}
        run: |
          set -euo pipefail
          marker='<!-- argocd-diff -->'
          { echo "$marker"; cat checks.md 2>/dev/null || true; echo; cat output/diff.md; } > body.md
          id=$(curl -fsS -H "Authorization: token ${TOKEN}" "${API}/issues/${PR_NUMBER}/comments" \
            | yq -p json ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n 1)
          yq -n -o json '.body = load_str("body.md")' > body.json
          if [ -n "$id" ]; then
            curl -fsS -X PATCH -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
              --data @body.json "${API}/issues/comments/${id}" >/dev/null
          else
            curl -fsS -X POST -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
              --data @body.json "${API}/issues/${PR_NUMBER}/comments" >/dev/null
          fi

      - name: Verdict
        if: steps.checks.outputs.fail == '1'
        run: |
          echo "::error::kubeconform, pluto or the review gate failed — see the PR comment"
          exit 1

      - name: Clean up
        # Sibling containers on the dind host outlive a cancelled or timed-out job.
        if: always()
        run: |
          docker rm -f argocd-diff-preview argocd-diff-preview-control-plane >/dev/null 2>&1 || true
          rm -f secrets/repo.yaml

  mirror-to-github:
    # Post-merge only; workflow_dispatch re-runs the mirror without a re-merge.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3-pip
          # renovate: datasource=pypi depName=git-filter-repo
          pip install --quiet --break-system-packages git-filter-repo==2.47.0

      - name: Strip workspace-only paths for GitHub mirror
        run: |
          set -euo pipefail
          git filter-repo --force \
            --invert-paths \
            --path CLAUDE.md \
            --path .claude/

      - name: Sanitize history for GitHub mirror
        env:
          SANITIZE_RULES: ${{ secrets.MIRROR_SANITIZE_RULES }}
        run: |
          set -euo pipefail
          if [ -z "${SANITIZE_RULES:-}" ]; then
            echo "::error::MIRROR_SANITIZE_RULES secret is empty or unset"
            exit 1
          fi
          printf '%s\n' "$SANITIZE_RULES" > /tmp/replacements.txt
          git filter-repo --replace-text /tmp/replacements.txt --force
          rm -f /tmp/replacements.txt

      - name: Install gitleaks (for post-sanitize gate)
        run: |
          set -euo pipefail
          # Version from .mise.toml (Renovate lint-tools group, bumped with the pre-commit hook).
          VERSION=$(sed -n 's/^gitleaks[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .mise.toml)
          [ -n "$VERSION" ] || { echo "::error::gitleaks version not found in .mise.toml"; exit 1; }
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSL -o "/tmp/${TARBALL}" "${BASE}/${TARBALL}"
          curl -fsSL -o /tmp/gitleaks-checksums.txt "${BASE}/gitleaks_${VERSION}_checksums.txt"
          ( cd /tmp && grep " ${TARBALL}\$" gitleaks-checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
          install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Post-sanitize gitleaks gate
        # Re-scans the sanitized history; fails before push if a secret slipped
        # through MIRROR_SANITIZE_RULES.
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --platform=gitea \
            --exit-code 1 \
            --report-format json \
            --report-path post-sanitize-leaks.json

      - name: Upload post-sanitize gitleaks report
        if: failure()
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32  # v3.1.3 — DO NOT BUMP (see PR job artifact note)
        with:
          name: post-sanitize-leaks
          path: post-sanitize-leaks.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Push sanitized to GitHub mirror
        env:
          GH_PAT: ${{ secrets.GH_MIRROR_PAT }}
        run: |
          set -euo pipefail
          GH_REPO="VizzleTF/${{ github.event.repository.name }}"
          git push --force "https://VizzleTF:${GH_PAT}@github.com/${GH_REPO}.git" HEAD:main

  notify-failure:
    # Post-merge only: pre-merge failures show in the Forgejo PR UI.
    needs: mirror-to-github
    if: always() && needs.mirror-to-github.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download post-sanitize leaks report
        uses: actions/download-artifact@a9bc5e6ef2cb54c177f32aa5726adaa15e7e2d59  # v3.1.0 — DO NOT BUMP to v3.2.x or v4.x. Forgejo runner supports only @actions/artifact v1.x. Renovate guard in renovate.json: allowedVersions <3.2.0.
        with:
          name: post-sanitize-leaks
          path: .
        continue-on-error: true

      - name: Build leak summary
        id: summary
        run: |
          set -euo pipefail
          if [ -f post-sanitize-leaks.json ]; then
            # node:*-bookworm ships without jq.
            apt-get update -qq && apt-get install -y -qq jq >/dev/null
            SUMMARY=$(jq -r '
              if type=="array" and length>0 then
                [.[] | "• " + (.RuleID // "unknown") + " @ " + (.File // "?") + ":" + ((.StartLine // 0)|tostring)] | .[0:10] | join("%0A")
              else "(report empty)" end
            ' post-sanitize-leaks.json)
            COUNT=$(jq -r 'if type=="array" then length else 0 end' post-sanitize-leaks.json)
          else
            SUMMARY="(mirror failed without leak report — see workflow logs)"
            COUNT="?"
          fi
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        # A failed summary must not swallow the alert; an empty LEAK_COUNT is handled below.
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          MR_RES: ${{ needs.mirror-to-github.result }}
          LEAK_COUNT: ${{ steps.summary.outputs.count }}
          LEAK_SUMMARY: ${{ steps.summary.outputs.summary }}
        run: |
          set -euo pipefail
          BODY="<b>❌ ${GITHUB_REPOSITORY}</b>%0Amirror-to-github: <b>${MR_RES}</b>%0Acommit: <code>${GITHUB_SHA::8}</code> ref: <code>${GITHUB_REF_NAME}</code>"
          if [ "${LEAK_COUNT}" != "?" ] && [ "${LEAK_COUNT}" -gt 0 ] 2>/dev/null; then
            BODY="${BODY}%0A%0A<b>Post-sanitize leaks (${LEAK_COUNT}):</b>%0A<pre>${LEAK_SUMMARY}</pre>"
          fi
          BODY="${BODY}%0A<a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">Run #${GITHUB_RUN_NUMBER}</a>"
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${BODY}"
