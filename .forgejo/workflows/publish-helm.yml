name: Publish Helm chart

on:
  push:
    tags:
      - 'homelab-common-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install helm
        run: scripts/ci-install-helm.sh
      - name: Tag matches Chart.yaml
        run: |
          set -eu
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' charts/homelab-common/Chart.yaml)
          [ "${GITHUB_REF_NAME#homelab-common-v}" = "$VERSION" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${VERSION}"; exit 1; }
      - name: Lint
        run: helm lint --strict charts/homelab-common
      - name: Package
        run: helm package charts/homelab-common -d /tmp/
      # Chart Museum API, not OCI push: the package must list as type Helm.
      - name: Push to Forgejo Helm registry
        run: |
          set -eu
          PKG="/tmp/homelab-common-${GITHUB_REF_NAME#homelab-common-v}.tgz"
          echo "Pushing $PKG"
          curl -sS --fail-with-body \
            -u "${PUBLISHER_USER}:${PUBLISHER_TOKEN}" \
            -X POST \
            --data-binary "@${PKG}" \
            -H 'Content-Type: application/x-tar' \
            https://git.example.com/api/packages/vizzle/helm/api/charts
        env:
          PUBLISHER_USER: ${{ secrets.PUBLISHER_USER }}
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
