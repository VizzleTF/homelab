# Third-party deprecation rules for pluto (argocd-diff CI, scripts/kubeconform-validate.sh).
# Component versions come from the CLI (`-t cilium=<targetRevision>`); leave
# removed-in empty until upstream announces it.
deprecated-versions:
  # cilium.io/v2 BGP kinds arrived in 1.18; v2alpha1 is still served in 1.20.
  - version: cilium.io/v2alpha1
    kind: CiliumBGPClusterConfig
    deprecated-in: v1.18.0
    removed-in: ""
    replacement-api: cilium.io/v2
    replacement-available-in: v1.18.0
    component: cilium
  - version: cilium.io/v2alpha1
    kind: CiliumBGPPeerConfig
    deprecated-in: v1.18.0
    removed-in: ""
    replacement-api: cilium.io/v2
    replacement-available-in: v1.18.0
    component: cilium
  - version: cilium.io/v2alpha1
    kind: CiliumBGPAdvertisement
    deprecated-in: v1.18.0
    removed-in: ""
    replacement-api: cilium.io/v2
    replacement-available-in: v1.18.0
    component: cilium
